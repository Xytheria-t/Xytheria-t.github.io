<body>
<div id="ambient"><span class="b1"></span><span class="b2"></span></div>
<div id="progress"></div>
<nav id="spine" aria-label="目录"><div class="spine-rail"><div class="spine-fill"></div></div><div class="spine-nodes"></div></nav>
<div id="companion"><svg id="cpRing" viewBox="0 0 36 36" aria-hidden="true"><circle class="cr-track" cx="18" cy="18" r="15.5"/><circle class="cr-bar" cx="18" cy="18" r="15.5"/></svg><button id="cpPrev" title="上一节">‹</button><span id="cpTitle">—</span><button id="cpNext" title="下一节">›</button></div>
<div id="pop"></div>
<div id="navHint"></div>
<div id="halo"></div>
<div id="stage"></div>
<script>
const NOTES = /*__NOTES__*/;
const ROOT_ID = /*__ROOT__*/;
const stage = document.getElementById('stage');
const progress = document.getElementById('progress');
const spine = document.getElementById('spine');
const spineNodes = spine.querySelector('.spine-nodes');
const spineFill = spine.querySelector('.spine-fill');
const companion = document.getElementById('companion');
const cpTitle = document.getElementById('cpTitle');
const cpPrev = document.getElementById('cpPrev');
const cpNext = document.getElementById('cpNext');
const cpRing = document.getElementById('cpRing');
const cpRingBar = cpRing.querySelector('.cr-bar');
const CP_C = 2 * Math.PI * 15.5; // 周长，配合 strokeDashoffset 表示已读比例
cpRingBar.style.strokeDasharray = CP_C;
cpRingBar.style.strokeDashoffset = CP_C;
let tocLinks = [], tocMap = {};
const pop = document.getElementById('pop');
const navHint = document.getElementById('navHint');
const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const FINE_HOVER = window.matchMedia('(hover: hover) and (pointer: fine)').matches; // 触屏无 hover：预览气泡/halo/磁吸只属鼠标
let hist = [ROOT_ID], idx = 0;

function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function attr(s){return esc(s).replace(/"/g,'&quot;');}

/* ---- mastery: Shaky / Familiar / Fluent (面试反复重读场景;不做"已读进度") ---- */
const MASTERY = [
  {k:'raw',  label:'Shaky',   hint:"Can’t explain it clearly yet"},
  {k:'firm', label:'Familiar', hint:'Can roughly answer'},
  {k:'tell', label:'Fluent',  hint:'Can recount off-script'}
];
const MASTERY_COLOR = { raw:'#C0563B', firm:'#B68A2E', tell:'#3F7A5A' };
const MS_KEY = 'vinea:mastery';
// 读路径全走内存缓存，写路径一次性回写 — 反复翻页/渲染不再每次 JSON.parse
const msStore = (() => { try { return JSON.parse(localStorage.getItem(MS_KEY)) || {}; } catch(e){ return {}; } })();
function masteryAll(){ return msStore; }
function masteryGet(id){ return msStore[id] || null; }
function masterySet(id, k){
  if(k) msStore[id] = {k:k, t:Date.now()}; else delete msStore[id];
  try { localStorage.setItem(MS_KEY, JSON.stringify(msStore)); } catch(e){}
}
/* 墙上只读态：评级了才出徽标，未评级零干扰 */
function mastOf(id){
  const cur = masteryGet(id);
  if(!cur) return null;
  for(let i=0;i<MASTERY.length;i++){ if(MASTERY[i].k===cur.k) return { m:MASTERY[i], t:cur.t }; }
  return null;
}
function mastHTML(id){
  const o = mastOf(id); if(!o) return '';
  return '<span class="vm" style="--mc:'+MASTERY_COLOR[o.m.k]+'" title="'+esc(o.m.label)+' · '+esc(o.m.hint)+'（评级于 '+new Date(o.t).toLocaleDateString('zh-CN')+'）">'+esc(o.m.label)+'</span>';
}
function mastDotHTML(id){
  const o = mastOf(id); if(!o) return '';
  return '<span class="vmd" style="--mc:'+MASTERY_COLOR[o.m.k]+'" title="'+esc(o.m.label)+' · '+esc(o.m.hint)+'"></span>';
}
// 字数（含中文）：去标签后统计非空白字符数
function charCount(html){
  const txt = (html||'').replace(/<[^>]+>/g,'').replace(/\s+/g,'');
  return txt.length;
}

/* ---- 结构密度（替代旧「阅读分钟」）：节内结构化字符 / 该节总字符，保底 0.08 ---- */
function structCharsOf(html){
  const box = document.createElement('div'); box.innerHTML = html;
  let n = 0;
  box.querySelectorAll('table, figure.code, .chain, .qa-q, .qa-a, .mermaid')
    .forEach(function(el){ n += (el.textContent || '').replace(/\s+/g, '').length; });
  return n;
}
function densityOf(html){
  const total = charCount(html);
  if(!total) return 0.08;
  return Math.max(0.08, Math.min(1, structCharsOf(html) / total));
}

/* ---- 翻阅时间戳（localStorage['vinea.read'] = {slug: ts}）；未翻阅者以 mtime 当种子 ---- */
const READ_KEY = 'vinea.read';
function readStore(){ try { return JSON.parse(localStorage.getItem(READ_KEY)) || {}; } catch(e){ return {}; } }
function markRead(slug){
  if(!NOTES[slug]) return;
  const r = readStore(); r[slug] = Date.now();
  try { localStorage.setItem(READ_KEY, JSON.stringify(r)); } catch(e){}
}
function readInfo(slug){
  const r = readStore();
  if(r[slug]) return { read:true, ts:r[slug] };
  const n = NOTES[slug];
  const mt = n && n.mtime ? new Date(n.mtime).getTime() : 0;
  return { read:false, ts:mt };
}
// 待复习：能讲永不催；其余按「距上次读（未读则用 mtime 种子）≥ 7 天」判定
function isDue(slug){
  const m = masteryGet(slug);
  if(m && m.k === 'tell') return false;
  return (Date.now() - readInfo(slug).ts) >= 7 * 86400000;
}
function relTime(ts){
  const d = Math.floor((Date.now() - ts) / 86400000);
  if(d <= 0) return '今天';
  if(d === 1) return '昨天';
  if(d < 7) return d + ' 天前';
  if(d < 30) return Math.floor(d/7) + ' 周前';
  if(d < 365) return Math.floor(d/30) + ' 个月前';
  return Math.floor(d/365) + ' 年前';
}
function freshLabel(slug){
  const info = readInfo(slug);
  const due = isDue(slug);
  if(info.read) return { text: relTime(info.ts) + '读过', due:due, title:'上次翻开 · ' + new Date(info.ts).toLocaleString('zh-CN') };
  return { text:'未读', due:due, title: info.ts ? ('最后编辑 · ' + new Date(info.ts).toLocaleDateString('zh-CN')) : '尚未编辑' };
}

/* ---- recently-read (localStorage['vinea.recent']) ---- */
const RECENT_KEY = 'vinea.recent';
const RECENT_MAX = 12;
function recentList(){
  try { const a = JSON.parse(localStorage.getItem(RECENT_KEY)); return Array.isArray(a) ? a : []; } catch(e){ return []; }
}
function recentPush(slug){
  if(!NOTES[slug]) return;
  const a = recentList().filter(function(s){ return s !== slug; });
  a.unshift(slug);
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(a.slice(0, RECENT_MAX))); } catch(e){}
}

function wallHTML(n){
  const list = n.links.map(function(s){return NOTES[s];}).filter(Boolean);
  const isRoot = n.id === ROOT_ID;
  /* 子 MOC 分面注册表 —— 按 slug 声明「分组 + 特性 chip」。
     命中走语义化分组（微区头 + chip 角标），未命中退回默认「子地图 / 笔记」二段切。 */
  const MOC_FACETS = {
    'java-锁': {
      groups: [
        { name:'入门', ids:['java-锁对比'] },
        { name:'内置同步', ids:['synchronized','jmm','volatile'] },
        { name:'显式锁', ids:['reentrantlock','reentrantreadwritelock','stampedlock'] },
        { name:'底层与原子', ids:['cas-与原子类','aqs','locksupport'] },
        { name:'同步工具', ids:['semaphore','countdownlatch'] },
        { name:'故障排查', ids:['死锁'] },
      ],
      traits: {
        'java-锁对比':'总览·横评',
        'synchronized':'JVM 关键字 · 隐式重入',
        'jmm':'内存模型 · 可见性判据',
        'volatile':'内存可见性 · 无锁',
        'reentrantlock':'可重入 · 公平可选',
        'reentrantreadwritelock':'读写分离 · 可降级',
        'stampedlock':'乐观返回 · JDK 8+',
        'cas-与原子类':'无锁 · 原子操作',
        'aqs':'框架 · 同步器底座',
        'locksupport':'阻塞原语 · 许可机制',
        'semaphore':'共享模式 · 许可计数',
        'countdownlatch':'共享模式 · 一次性',
        '死锁':'四条件 · 定位与破环',
      },
    },
  };
  const facet = MOC_FACETS[n.id] || null;
  // flatten a MOC's tree to actual notes (mtime desc, top k)
  function flatten(t, k){
    k = k || 2;
    if(!t || t.type !== 'moc') return [];
    const out = [], seen = new Set();
    (function walk(it){
      if(!it || seen.has(it.id)) return;
      seen.add(it.id);
      if(it.type !== 'moc'){ out.push(it); return; }
      (it.links||[]).forEach(function(s){ walk(NOTES[s]); });
    })(t);
    return out.sort(function(a,b){return new Date(b.mtime||0)-new Date(a.mtime||0);}).slice(0,k);
  }
  // roman chapter numerals Ⅰ-Ⅶ for 1-7
  const ROMAN = ['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ','Ⅶ','Ⅷ','Ⅸ','Ⅹ','Ⅺ','Ⅻ'];
  /* 分卷（首页根墙）：卷序 = GROUP 数组序；卷内位次 = cats 数组序（build.mjs 注入 group/groupRank）。
     卡片尺寸不再由分卷决定（旧 b4/b2 主卡规则随杂志化废弃），卷内每条 .ventry 版式统一走 CSS */
  function groupBands(items){
    const by = {}, order = [];
    items.forEach(function(t){
      const gi = t.group;
      if(!by[gi]){ by[gi] = []; order.push(gi); }
      by[gi].push(t);
    });
    order.sort(function(a,b){ return (a<0?1e9:a) - (b<0?1e9:b); }); // 未归入任何卷的排最后
    return order.map(function(gi){
      const bItems = by[gi].slice().sort(function(a,b){ return a.groupRank - b.groupRank; });
      const notes = bItems.map(function(t){ return t.type==='moc' ? flatten(t,999).length : 1; });
      return { gi:gi, items:bItems, notes:notes, isFallow:notes.map(function(c){ return c === 0; }),
               num: bItems[0].groupNum || '·', name: bItems[0].groupName || '其他' };
    });
  }
  // order 决定墙上阅读位次（罗马数字），未声明的退到 1e9；布局排序时 pinned(featured) 永远最前
  function orderOf(t){ return t.order > 0 ? t.order : 1e9; }
  function layoutRank(t){ return t.pinned ? -1e12 : orderOf(t); }
  const plain = list.slice().sort(function(a,b){return layoutRank(a)-layoutRank(b);});
  const bandOn = isRoot && plain.some(function(t){return t.group >= 0;});
  const bandList = bandOn ? groupBands(plain) : [];
  /* 首页根墙 = 杂志：纯审美封面 + 各卷目录带（版式 = GROUP.layout，4 种词汇表） */
  function entryHTML(t, color, opts){
    const subs = t.type==='moc' ? flatten(t,999) : [];
    const fallow = t.type==='moc' && subs.length===0;
    const count = t.type==='moc' ? subs.length : 1;
    let lastM = new Date(t.mtime||0).getTime();
    subs.forEach(function(x){ const mt = new Date(x.mtime||0).getTime(); if(mt>lastM) lastM = mt; });
    const rel = lastM ? relTime(lastM) : '';
    const recent = subs.slice(0,3); // flatten 已按 mtime 降序
    const c = typeof color === 'string' ? color : t.accent;
    const chip = opts && opts.chip ? opts.chip : ''; // 语义 chip：注册了 MOC_FACETS 的卡走 chip 路线，不再叠「1 篇/更新于」噪音
    const mast = (t.type!=='moc') ? mastHTML(t.id) : ''; // 熟悉程度徽标：仅原子笔记且评级过才渲染，顶替无信息量的「1 篇」
    return '<article class="ventry'+(fallow?' fallow':'')+'" data-target="'+t.id+'" style="--c:'+c+'">'
      + '<div class="v-top"><span class="v-tag">'+esc(t.catLabel)+'</span>'
      + (mast ? mast : (fallow ? '<span class="stamp">待垦</span>' : (chip ? '' : (count>1 ? '<span class="v-count"><b>'+count+'</b> 篇</span>' : '')))) // count>1：原子笔记自身就是单篇，「1 篇」无信息量，直接省掉
      + '</div>'
      + '<h3 class="v-name">'+esc(t.title)+'</h3>'
      + (chip ? '<div class="v-chip">'+esc(chip)+'</div>' : (rel ? '<div class="v-data">更新于 '+esc(rel)+'</div>' : ''))
      + (recent.length ? '<div class="v-preview"><span class="v-plabel">最近</span>'
          + recent.map(function(r){ return '<a data-target="'+r.id+'">'+esc(r.title)+mastDotHTML(r.id)+'</a>'; }).join('')
          + '</div>' : '')
      + '</article>';
  }
  if(bandOn){
    const now = new Date();
    const mosaic = bandList.map(function(b,bi){
      const c = b.items[0].accent;
      return '<button class="cm-tile" data-band="band-'+bi+'" data-name="'+attr(b.name)+'"'
        + ' style="--cc:'+c+'" title="'+attr(b.name)+'">'
        + '<span class="cm-num">'+esc(b.num)+'</span></button>';
    }).join('');
    const cover = '<header class="cover">'
      + '<div class="cover-main">'
      + '<p class="cover-issue"><span>Vinea · Knowledge Atlas · '+now.getFullYear()+' 年 '+(now.getMonth()+1)+' 月</span><span class="cover-issue-r">Private Press · No. '+String(now.getMonth()+1).padStart(2,'0')+'</span></p>'
      + '<h1 class="cover-title">'+esc(n.title)+'<span class="cover-dot">.</span></h1>'
      + (n.excerpt ? '<p class="cover-sub">'+esc(n.excerpt)+'</p>' : '')
      + '</div>'
      + (bandList.length ? '<nav class="cover-mosaic" aria-label="卷索引">'
          + '<span class="cover-mosaic-tag">Volumes · '+bandList.length+'</span>'
          + '<div class="cm-rail">'+mosaic+'</div>'
          + '<p class="cm-caption" id="cm-caption" style="--cnow:'+bandList[0].items[0].accent+'">'+esc(bandList[0].name)+'</p>'
          + '</nav>' : '')
      + '</header>';
    let body = '';
    bandList.forEach(function(b,bi){
      const layout = b.items[0].groupLayout || 'tiles';
      const bandLast = b.items.reduce(function(m,t){
        const mt = new Date(t.mtime||0).getTime(); return mt>m?mt:m; },0);
      body += '<section class="band band--'+esc(layout)+'" id="band-'+bi+'" style="--c:'+b.items[0].accent+'">'
        + '<header class="band-head">'
        + '<span class="band-num">'+esc(b.num)+'</span>'
        + '<h2 class="band-name">'+esc(b.name)+'</h2>'
        + '<div class="band-meta">'
        + '<span><b>'+b.items.length+'</b> 领域</span>'
        + '<span><b>'+b.notes.reduce(function(a,c){return a+c;},0)+'</b> 篇</span>'
        + (bandLast ? '<span>更新于 '+esc(relTime(bandLast))+'</span>' : '')
        + '</div></header>'
        + '<div class="vbody">'+b.items.map(entryHTML).join('')+'</div>'
        + '</section>';
    });
    return cover + '<div class="bands">'+body+'</div>';
  }
  // 子 MOC 墙（非根墙）：轻量扉页 + 统一 .ventry 网格，继承父卷色
  const pc = n.accent; // 父卷色（MOC 自身 category accent，与首页卷带呼应）
  const subLast = Math.max.apply(null, list.map(function(t){ return new Date(t.mtime||0).getTime(); }).concat([0]));
  const subLastStr = subLast ? relTime(subLast) : '';
  const vgrp = n.group>=0 ? '卷 '+esc(n.groupNum)+' · '+esc(n.groupName) : '章节 · 目录墙';
  const front = '<header class="subhead" style="--c:'+pc+'">'
    + '<span class="subhead-rule"></span>'
    + '<div class="subhead-inner">'
    + '<p class="eyebrow">'+vgrp+'</p>'
    + '<h1 class="subhead-title">'+esc(n.title)+'</h1>'
    + '</div>'
    + (list.length ? '<div class="subhead-meta">'
        + '<span><b>'+list.length+'</b> 项</span>'
        + (subLastStr ? '<span class="sep"></span><span>更新于 '+esc(subLastStr)+'</span>' : '')
        + '</div>' : '')
    + '</header>';
  function subGrid(items, getChip){
    return '<div class="vbody subwall-body">'+items.map(function(t){ return entryHTML(t, pc, getChip ? getChip(t) : null); }).join('')+'</div>';
  }
  function subSec(name, items, getChip){
    if(!items.length) return '';
    return '<section class="subwall"><header class="subwall-head">'
      + '<span class="subwall-bar"></span>'
      + '<h2 class="subwall-name">'+esc(name)+'</h2>'
      + '<span class="subwall-meta">'+items.length+' 项</span>'
      + '</header>'+subGrid(items, getChip)+'</section>';
  }
  // 注册了 MOC_FACETS 的子墙：按语义分组 + 特性 chip（替代默认「子地图 / 笔记」二段切）
  if(facet){
    const groups = facet.groups.map(function(g){
      const items = g.ids.map(function(id){ return list.find(function(t){ return t.id === id; }); }).filter(Boolean);
      return subSec(g.name, items, function(t){ return { chip: facet.traits[t.id] || '' }; });
    }).join('');
    return front + '<div class="subwalls" style="--c:'+pc+'">'+groups+'</div>';
  }
  const mocs = plain.filter(function(t){return t.type==='moc';});
  const notes = plain.filter(function(t){return t.type!=='moc';});
  if(!mocs.length || !notes.length){
    const all = plain;
    const label = mocs.length ? '子地图' : '笔记';
    return front + '<div class="subwalls" style="--c:'+pc+'">'+subSec(label, all)+'</div>';
  }
  return front + '<div class="subwalls" style="--c:'+pc+'">'
    + subSec('子地图', mocs) + subSec('笔记', notes) + '</div>';
}

function articleHTML(n){
  // 概念脉搏：解析每 H2/H3 节 → 字数 / 结构密度
  const SEG_RE = /<(h2|h3)([^>]*)>([\s\S]*?)<\/\1>/g;
  const heads = []; let _m;
  while((_m = SEG_RE.exec(n.html))){ heads.push({tag:_m[1], attrs:_m[2], inner:_m[3], start:_m.index, end:SEG_RE.lastIndex}); }
  heads.forEach(function(h,i){
    const segEnd = (i+1 < heads.length) ? heads[i+1].start : n.html.length;
    const seg = n.html.slice(h.end, segEnd);
    h.chars = charCount(seg);
    h.d = densityOf(seg);
    h.text = h.inner.replace(/<[^>]+>/g,'').trim();
    h.id = 'h-'+i;
  });
  const tocItems = heads.filter(function(h){return h.text;}).map(function(h){
    return {tag:h.tag, id:h.id, text:h.text, chars:h.chars, d:h.d};
  });
  let body = '', _cur = 0;
  heads.forEach(function(h){
    body += n.html.slice(_cur, h.start);
    body += '<'+h.tag+' id="'+h.id+'"'+h.attrs+' data-d="'+h.d.toFixed(2)+'">'+h.inner
          + '<span class="rt-cap" title="本节约 '+h.chars+' 字 · 结构密度 '+(h.d*100|0)+'%">密度 '+(h.d*100|0)+'%</span>'
          + '</'+h.tag+'>';
    _cur = h.end;
  });
  body += n.html.slice(_cur);
  spineNodes.innerHTML = tocItems.map(function(it){
    return '<button class="sp-node '+(it.tag==='h3'?'h3':'h2')+'" data-id="'+it.id+'" data-d="'+it.d.toFixed(2)+'" data-t="'+attr(it.text)+'" style="--d:'+it.d.toFixed(3)+'">'
      + '<span class="sp-density"></span>'
      + '<span class="sp-dot"></span>'
      + '<span class="sp-label">'+esc(it.text)+'<span class="rt-cap" title="结构密度 '+(it.d*100|0)+'%">'+(it.d*100|0)+'%</span></span>'
      + '</button>';
  }).join('');
  markRead(n.id);
  const fr = freshLabel(n.id);
  const pad = n => String(n).padStart(2,'0');
  const mt = n.mtime ? new Date(n.mtime) : null;
  const etStr = mt && !isNaN(mt) ? mt.getFullYear()+'-'+pad(mt.getMonth()+1)+'-'+pad(mt.getDate())+' · '+pad(mt.getHours())+':'+pad(mt.getMinutes()) : '';
  const etHtml = etStr
    ? '<div class="et" title="最后修改时间"><svg class="ei" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>最后编辑 · '+etStr+'</div>'
    : '';
  const cur = masteryGet(n.id);
  const msHtml = '<div class="ms'+(cur?'':' unrated')+'" data-ms="'+esc(n.id)+'">'
    + '<span class="ms-lab">Mastery</span>'
    + '<span class="ms-set" title="点击评级 · 再点一次取消">'
    + MASTERY.map(function(m){
        return '<button class="ms-b'+(cur&&cur.k===m.k?' on':'')+'" data-k="'+m.k+'" style="--mc:'+MASTERY_COLOR[m.k]+'" title="'+esc(m.hint)+'">'
          + '<span class="dot"></span>'+esc(m.label)+'</button>';
      }).join('')
    + '</span>'
    + '</div>';
  return '<article class="art" style="--accent:'+n.accent+';--accent-ink:'+n.accentInk+'">'
    + '<h1>'+esc(n.title)+'</h1>'
    + '<div class="meta">'
    +   '<div class="rt'+(fr.due?' due':'')+'">'+fr.text+'</div>'
    +   etHtml
    +   msHtml
    + '</div>'
    + body
    + '</article>';
}

function bind(){
  // stopPropagation：磁贴预览里的笔记链接嵌在 data-target 卡片内，避免双重 go()
  stage.querySelectorAll('[data-target]').forEach(function(el){ el.onclick=function(e){ e.stopPropagation(); go(el.getAttribute('data-target')); }; });
  stage.querySelectorAll('a.wikilink:not(.broken)').forEach(function(el){ el.onclick=function(){go(el.getAttribute('data-target'));}; });
  // 封面卷色带 — 点击滚到对应卷带；hover/focus 暂停轮播并切到该段；离开后立即跳到下一段继续；静止 2.2s 自动轮播
  const cmCap = stage.querySelector('#cm-caption');
  const cmRail = stage.querySelector('.cover-mosaic .cm-rail');
  const cmTiles = stage.querySelectorAll('.cover-mosaic [data-band]');
  if(cmCap && cmTiles.length){
    if(!stage.__cm) stage.__cm = { idx: 0, paused: false, tok: 0 };
    const S = stage.__cm; S.paused = false;
    function showCap(b){
      if(!b) return;
      const newName = b.getAttribute('data-name') || '';
      const myTok = ++S.tok;
      const c = (b.style && b.style.getPropertyValue ? b.style.getPropertyValue('--cc') : '') || '';
      // 色带同步激活态（文字未变也要更新，故放在 early return 之前）
      stage.querySelectorAll('.cover-mosaic [data-band]').forEach(function(t){
        t.classList.toggle('cm-on', t === b);
      });
      const cap = stage.querySelector('#cm-caption');
      if(!cap) return;
      if(newName === cap.textContent) return;
      cap.style.opacity = '0';
      setTimeout(function(){
        if(myTok !== S.tok) return;
        const cap2 = stage.querySelector('#cm-caption');
        if(!cap2) return;
        cap2.textContent = newName;
        if(c) cap2.style.setProperty('--cnow', c.trim());
        cap2.style.opacity = '1';
      }, 180);
    }
    function cmTick(){
      if(S.paused) return;
      const tiles = stage.querySelectorAll('.cover-mosaic [data-band]');
      if(!tiles.length) return;
      S.idx = (S.idx + 1) % tiles.length;
      showCap(tiles[S.idx]);
    }
    cmTiles.forEach(function(b, bi){
      b.onclick = function(){
        const t = document.getElementById(b.getAttribute('data-band'));
        if(t) t.scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block:'start' });
      };
      b.addEventListener('mouseenter', function(){ S.paused = true; S.idx = bi; showCap(b); });
      b.addEventListener('focus', function(){ S.paused = true; S.idx = bi; showCap(b); });
      b.addEventListener('blur', function(){ S.paused = false; });
    });
    if(cmRail) cmRail.addEventListener('mouseleave', function(){
      S.paused = false;
      const tiles = stage.querySelectorAll('.cover-mosaic [data-band]');
      S.idx = (S.idx + 1) % Math.max(tiles.length, 1);
      if(tiles.length) showCap(tiles[S.idx]);
    });
    // interval 只启动一次（多次 bind 不重复跑）
    if(!stage.__cmTimer && !RM) stage.__cmTimer = setInterval(cmTick, 2200);
    showCap(cmTiles[0]);   // 初始：第一段即激活态（文字已相同，只落激活样式）
  }
  bindMastery();
  bindPop();
  bindCopy();
}

/* mastery buttons on an article: click to set, click 清除 to clear */
function bindMastery(){
  stage.querySelectorAll('.ms').forEach(function(box){
    const id = box.getAttribute('data-ms');
    function clear(){
      masterySet(id, null);
      box.querySelectorAll('.ms-b').forEach(function(o){ o.classList.remove('on'); });
      box.classList.add('unrated');
    }
    box.querySelectorAll('button.ms-b').forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        const k = b.getAttribute('data-k');
        if(b.classList.contains('on')){
          clear();
        } else {
          masterySet(id, k);
          box.querySelectorAll('.ms-b').forEach(function(o){ o.classList.toggle('on', o===b); });
          box.classList.remove('unrated');
        }
      });
    });
  });
}

function bindPop(){
  if(!FINE_HOVER) return; // 触屏：点按直达正文，hover 预览气泡只绑给鼠标（否则点按时 mouseenter 会闪出气泡）
  stage.querySelectorAll('a.wikilink:not(.broken)').forEach(function(a){
    const t = NOTES[a.getAttribute('data-target')];
    if(!t) return;
    a.addEventListener('mouseenter', function(){
      pop.innerHTML = '<div class="pop-t">'+esc(t.title)+'</div><div class="pop-x">'+esc(t.excerpt||'')+'</div>';
      const r = a.getBoundingClientRect();
      // 水平：贴右边界夹回视口内
      let left = r.left;
      if(left + 276 > window.innerWidth) left = window.innerWidth - 284;
      if(left < 8) left = 8;
      // 垂直：默认挂链接下方；下方塞不下就翻到上方，两边都不够就贴底 8px。
      // 不翻的话，文章末尾几个双链的预览会整个落到视口外，等于没出。
      const ph = pop.offsetHeight; // pop 无 display:none，可直接量
      let top = r.bottom + 8;
      if(top + ph > window.innerHeight - 8) top = r.top - ph - 8;
      if(top < 8) top = Math.max(8, window.innerHeight - ph - 8);
      pop.style.left = left + 'px';
      pop.style.top = top + 'px';
      pop.classList.add('on');
    });
    a.addEventListener('mouseleave', function(){ pop.classList.remove('on'); });
  });
}

const COPY_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>';
const CHECK_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>';
function bindCopy(){
  stage.querySelectorAll('figure.code').forEach(function(pre){
    const head = pre.querySelector('.code-head') || pre;
    const btn = document.createElement('button');
    btn.className = 'copy-btn'; btn.type = 'button';
    btn.innerHTML = COPY_SVG + '<span class="ct">复制</span>';
    btn.onclick = function(e){
      e.stopPropagation();
      const txt = pre.querySelector('.code-body code').innerText;
      navigator.clipboard.writeText(txt).then(function(){
        btn.classList.add('ok'); btn.innerHTML = CHECK_SVG + '<span class="ct">已复制</span>';
        setTimeout(function(){ btn.classList.remove('ok'); btn.innerHTML = COPY_SVG + '<span class="ct">复制</span>'; }, 1400);
      }).catch(function(){
        btn.innerHTML = '<span class="ct">复制失败</span>';
        setTimeout(function(){ btn.innerHTML = COPY_SVG + '<span class="ct">复制</span>'; }, 1400);
      });
    };
    head.appendChild(btn);
  });
}

/* mermaid: 外置到 vendor/mermaid.min.js，运行时按需懒加载（首次渲染含图笔记才拉取，不用 CDN） */
let _mmLoading = null;
function ensureMermaid(){
  if(window.mermaid && window.mermaid.__vineaReady) return Promise.resolve(window.mermaid);
  if(_mmLoading) return _mmLoading;
  _mmLoading = new Promise(function(res, rej){
    const s = document.createElement('script');
    s.src = 'vendor/mermaid.min.js';
    s.onload = function(){
      // ponytail: initMermaid (~80-120ms) 推到 requestIdleCallback，让首屏纯文笔记不再被卡
      const go = function(){
        try { initMermaid(window.mermaid); } catch(e){ console.warn('mermaid init fail:', e); }

let _mmId = 0; // 全局自增：多次 runMermaidOn（首屏 + 每次展开 details）不能复用同一 render id
function runMermaidOn(nodes){
  if(!nodes || !nodes.length) return;
  // 失败必须显性化：只留源码文本会被当成「图还没加载出来」，.mm-err 角标 + title 带上原因
  const fail = function(n, e){
    const msg = (e && e.message) || e;
    n.classList.add('mm-err'); n.title = 'Mermaid 渲染失败：' + msg;
    console.warn('mermaid render fail:', msg);
  };

    // v11 run() 对 classDiagram DOM textContent 解析有兼容问题；统一用 render()
    Promise.all(Array.from(nodes).map(function(n){
      let code = n.textContent.trim();

      // 插到首行会让 detectType 整个失灵 → 解析抛错 → 只剩源码文本（曾全站 classDiagram 静默挂掉）
      if(code.startsWith('classDiagram') && !/^\s*direction\s+(TB|LR|BT|RL)\b/m.test(code)){
        const nl = code.indexOf('\n');
        code = nl < 0 ? code + '\ndirection LR'
                      : code.slice(0, nl) + '\ndirection LR' + code.slice(nl);
      }
      return mm.render('mm'+(++_mmId), code)
        .then(function(r){ n.innerHTML = r.svg; n.dataset.mmOk='1'; })
        .catch(function(e){ fail(n, e); });
    })).then(function(){
      nodes.forEach(function(n){ if(n.dataset.mmOk) n.dataset.mmRendered='1'; });
      enrichMermaid(); layoutSpine();
      // svg 注入改变文档高度晚于导航恢复：若用户尚未手动滚动（距目标 <60px）则按原位置校正一次
      if(_scrollAnchor !== null && Math.abs(window.scrollY - _scrollAnchor) < 60) jumpTo(_scrollAnchor);
      _scrollAnchor = null;

// 按 diagram 类型分派增强；任何单类型的增强失败都用 try 兜住，绝不拖垮渲染
function enrichMermaid(){
  stage.querySelectorAll('.mermaid svg').forEach(function(svg){
    const wrap = svg.parentElement;

      else if (type !== 'classDiagram') enrichGraph(svg, wrap, type === 'flowchart' ? /execute task|开始|start/ : null); // flowchart/state/er/mindmap

// graph 类（flowchart / stateDiagram-v2 / classDiagram / erDiagram / mindmap）：节点浮入 + hover 高亮相邻节点与边
function enrichGraph(svg, wrap, startRegex){
  const nodes = Array.from(svg.querySelectorAll('.node'));
  const edges = Array.from(svg.querySelectorAll('.edgePath, .edgePaths .edgePath, .transition'));
  if (startRegex) {
    const start = nodes.find(function(n){ const txt = (n.textContent || '').toLowerCase(); return startRegex.test(txt); });
    if (start) start.classList.add('flow-start');
  }
  const nodeIndex = new Map();
  nodes.forEach(function(n,i){ nodeIndex.set(n,i); n.dataset.idx=i; n.style.animationDelay=(i*70)+'ms'; });
  const nodeEdges = new Map();
  nodes.forEach(function(n){ nodeEdges.set(n,{in:[],out:[]}); });
  edges.forEach(function(e){
    const path = e.querySelector('path');
    if(!path) return;
    const d = path.getAttribute('d') || '';
    const pts = parsePathPoints(d);
    if(pts.length < 2) return;
    let src=null, dst=null, srcDist=Infinity, dstDist=Infinity;
    nodes.forEach(function(n){ const r=n.getBBox(); const c={x:r.x+r.width/2,y:r.y+r.height/2}; const a=pts[0], b=pts[pts.length-1];
      const da=Math.hypot(a.x-c.x,a.y-c.y), db=Math.hypot(b.x-c.x,b.y-c.y);
      if(da<srcDist){srcDist=da;src=n;} if(db<dstDist){dstDist=db;dst=n;}
    });
    if(src && dst){ e.dataset.from = src.dataset.idx; e.dataset.to = dst.dataset.idx; nodeEdges.get(src).out.push(e); nodeEdges.get(dst).in.push(e); }
  });
  function highlight(root, active){
    wrap.classList.toggle('flow-dim', active);
    nodes.forEach(function(n){ n.classList.toggle('active', false); });
    edges.forEach(function(e){ e.classList.toggle('active', false); });
    if(!active || !root) return;
    const seenNodes = new Set([root]), seenEdges = new Set();
    let frontier = [root];
    while(frontier.length){
      const next = [];
      frontier.forEach(function(n){
        nodeEdges.get(n).out.forEach(function(e){ const t = nodes[parseInt(e.dataset.to,10)]; if(t && !seenNodes.has(t)){ seenNodes.add(t); seenEdges.add(e); next.push(t); } });
        nodeEdges.get(n).in.forEach(function(e){ seenEdges.add(e); });
      });
      frontier = next;
    }
    seenNodes.forEach(function(n){ n.classList.add('active'); });
    seenEdges.forEach(function(e){ e.classList.add('active'); });
  }
  nodes.forEach(function(n){
    n.addEventListener('mouseenter', function(){ highlight(n, true); });
    n.addEventListener('mouseleave', function(){ highlight(null, false); });
    n.addEventListener('focus', function(){ highlight(n, true); });
    n.addEventListener('blur', function(){ highlight(null, false); });
    n.style.cursor = 'pointer';
  });
  wrap.addEventListener('mouseleave', function(){ highlight(null, false); });
}
// sequenceDiagram：hover 角色 → 高亮其参与的消息线
function enrichSequence(svg, wrap){
  const actors = Array.from(svg.querySelectorAll('.actor'));
  // v11 实际生成的是 messageLine0（实线）/ messageLine1（虚线），没有 messageLine
  const lines = Array.from(svg.querySelectorAll('.messageLine0,.messageLine1'));
  if(!actors.length) return;
  actors.forEach(function(a,i){ a.style.animationDelay=(i*70)+'ms'; });
  lines.forEach(function(l,i){ if(!l.style.animationDelay) l.style.animationDelay=(i*70)+'ms'; });
  function centerX(el){ const b = el.getBBox ? el.getBBox() : null; return b ? b.x + b.width/2 : 0; }
  function highlight(actor, on){
    wrap.classList.toggle('flow-dim', on);
    actors.forEach(function(a){ a.classList.toggle('active', false); });
    lines.forEach(function(l){ l.classList.toggle('active', false); });
    if(!on || !actor) return;
    actor.classList.add('active');
    const ax = centerX(actor);
    // 判定「该角色是这条消息的端点」：角色中心落在消息线的横向跨度内。
    // 旧的「|中点-角色中心| < 半宽+36」对每条消息都对两端成立，会把所有线全高亮。
    lines.forEach(function(l){
      const b = l.getBBox ? l.getBBox() : null; if(!b) return;
      if(ax >= b.x - 24 && ax <= b.x + b.width + 24) l.classList.add('active');
    });
  }
  actors.forEach(function(a){
    a.addEventListener('mouseenter', function(){ highlight(a, true); });
    a.addEventListener('mouseleave', function(){ highlight(null, false); });
    a.addEventListener('focus', function(){ highlight(a, true); });
    a.addEventListener('blur', function(){ highlight(null, false); });
    a.style.cursor = 'pointer';
  });
  wrap.addEventListener('mouseleave', function(){ highlight(null, false); });
}
function parsePathPoints(d){
  const nums = d.match(/[MmLlHhVvCcQqTtSsAaZz][d.-s,]+/g) || [];
  const pts = [];
  let x=0,y=0;
  nums.forEach(function(seg){
    const cmd=seg[0].toUpperCase();
    const vals=seg.slice(1).trim().split(/[s,]+/).filter(Boolean).map(parseFloat);
    if(cmd==='M' && vals.length>=2){ x=vals[0]; y=vals[1]; pts.push({x,y}); }
    else if(cmd==='L' && vals.length>=2){ x=vals[0]; y=vals[1]; pts.push({x,y}); }
    else if(cmd==='H' && vals.length>=1){ x=vals[0]; pts.push({x,y}); }
    else if(cmd==='V' && vals.length>=1){ y=vals[0]; pts.push({x,y}); }
    else if((cmd==='C' || cmd==='S') && vals.length>=2){ x=vals[vals.length-2]; y=vals[vals.length-1]; pts.push({x,y}); }
  });
  return pts;
}
function setupChainScroll(){
  stage.querySelectorAll('.chain').forEach(function(chain){
    if(chain.dataset.scrollSet) return;
    chain.dataset.scrollSet='1';
    const fl=document.createElement('span'); fl.className='chain-fade l';
    const fr=document.createElement('span'); fr.className='chain-fade r';
    chain.append(fl,fr);
    /* overflow 是布局属性：只在初始化/resize 时算一次并缓存，
       绝不在 scroll 事件里重算，否则平滑滚动到末端瞬间测量抖动会让 has-scroll 翻转、箭头整体消失 */
    let overflow=false;
    function measure(){
      const sw=Math.ceil(chain.scrollWidth), cw=Math.ceil(chain.clientWidth);
      overflow = sw > cw + 1;
      chain.classList.toggle('has-scroll', overflow);
      update();
    }
    function update(){
      if(!overflow) return;
      const sl=Math.round(chain.scrollLeft), cw=Math.round(chain.clientWidth), sw=Math.round(chain.scrollWidth);
      chain.classList.toggle('at-start', sl <= 2);
      chain.classList.toggle('at-end', sl + cw >= sw - 2);
    }
    measure();
    chain.addEventListener('scroll', update, {passive:true});
    if(window.ResizeObserver) (new ResizeObserver(measure)).observe(chain);
    else window.addEventListener('resize', measure);
  });
}

let _transTimer = 0;
function transitionTo(slug){

  catch(e){ location.hash = slug; } // file:// 下失败则回退到 location.hash

  _transTimer = setTimeout(function(){

// 滚动位置记忆：离开某页时记 scrollY，back/fwd/双链跳回时恢复（不一律回顶）
const scrollMem = {};
let _scrollAnchor = null; // 本次导航的期望位置：mermaid svg 晚于恢复就位，渲染完若用户没手动滚则校正一次
function leave(){ scrollMem[hist[idx]] = window.scrollY; }
function jumpTo(y){
  const de = document.documentElement;
  const sb = de.style.scrollBehavior;
  de.style.scrollBehavior = 'auto'; // 覆盖 html{scroll-behavior:smooth}：恢复定位必须瞬时，不许平滑滑过整页
  window.scrollTo(0, y);
  de.style.scrollBehavior = sb;
}

// 导航驱动源 = 浏览器历史栈（Vinea 内部 hist[] 与其镜像同步）。
// 原先只 replaceState 不入栈 → 浏览器历史永远 1 条 → 侧键后退退化成「切标签页」（JS 拦不住）。
// 改：go() pushState 入历史，侧键/浏览器按钮交给原生导航，渲染统一由 popstate 驱动。
function go(slug){
  if(!NOTES[slug] || hist[idx]===slug) return; // 防重复入栈
  leave();
  hist=hist.slice(0,idx+1); hist.push(slug); idx++;
  try{ window.history.pushState({slug:slug, vi:idx},'', '#'+slug); }
  catch(e){ location.hash = slug; } // file:// 下 pushState 可能抛，退回 hash
  transitionTo(slug); // transitionTo 内 replaceState 仅同步 URL，不再入栈
}
// 侧键导航视觉反馈：方向箭头 + 目标标题，短暂浮现
let navHintT;
function showNavHint(dir, slug){

// 不接管鼠标侧键：mousedown 里 preventDefault() 对 X1/X2 的拦截不可靠（浏览器/驱动差异），
// 一旦没拦住就会出现「JS 调 history.back() + 浏览器再退一级」= 一次按键退两级。
// 既然 go() 已 pushState（历史栈有内容），侧键完全交给浏览器原生导航，
// Vinea 只通过下面的 popstate 渲染 —— 单一驱动源，不可能双导航。
// （原 back()/fwd() 已无调用者，删；需要键盘/UI 入口时两行即可加回。）

// 统一渲染入口：浏览器历史变化（侧键 / 浏览器前后退按钮 / 手改 hash）→ 对齐 Vinea 栈 + 渲染。
// 边界：slug 不在 Vinea 栈内或已在当前页 → 直接 return，绝不破坏栈（原「安全兜底」语义保留）。
window.addEventListener('popstate', function(e){
  const slug = (e.state && e.state.slug) ? e.state.slug : _decodeHash();
  if(!slug || !NOTES[slug]) return;
  // 定位优先用 state.vi（入历史时记下的栈下标，精确）；缺失或越界才退化到 indexOf
  let i = (e.state && typeof e.state.vi === 'number') ? e.state.vi : -1;
  if(i < 0 || i >= hist.length || hist[i] !== slug) i = hist.indexOf(slug);
  if(i === -1 || i === idx) return; // 不在栈内 / 已在当前页 → 忽略
  const dir = i < idx ? -1 : 1;
  leave(); idx = i;
  showNavHint(dir, slug); // 方向由新旧 idx 推出，不用猜浏览器是前进还是后退
  transitionTo(slug);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ go(ROOT_ID); return; }
});
let _toastEl, _toastT;
function toast(msg){
  if(!_toastEl){ _toastEl=document.createElement('div'); _toastEl.id='toast'; document.body.appendChild(_toastEl); }
  _toastEl.textContent=msg; _toastEl.classList.add('on');
  clearTimeout(_toastT); _toastT=setTimeout(function(){ _toastEl.classList.remove('on'); }, 2400);
}
cpPrev.onclick=function(){ jumpSection(-1); };
cpNext.onclick=function(){ jumpSection(1); };
window.addEventListener('resize', layoutSpine);
function layoutSpine(){
  if(!tocLinks.length) return;
  const total = document.documentElement.scrollHeight - window.innerHeight;
  const denom = total > 0 ? total : 1;
  tocLinks.forEach(function(a){
    const h = tocMap[a.getAttribute('data-id')];
    if(!h) return;
    const top = h.getBoundingClientRect().top + window.scrollY;
    const pct = Math.max(0, Math.min(1, top/denom));
    a.style.top = (pct*100) + '%';
  });
}
function jumpSection(dir){
  if(!tocLinks.length) return;
  let cur = -1;
  tocLinks.forEach(function(l,i){ if(l.classList.contains('active')) cur=i; });
  let ni = cur + dir;
  if(cur === -1) ni = dir > 0 ? 0 : tocLinks.length - 1;
  ni = Math.max(0, Math.min(tocLinks.length - 1, ni));
  const h = tocMap[tocLinks[ni].getAttribute('data-id')];
  if(h) h.scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'start' });
}
function updateTimeline(){
  const h=document.documentElement;
  const max=h.scrollHeight-h.clientHeight;
  const p= max>0 ? h.scrollTop/max : 0;
  progress.style.transform='scaleX('+p.toFixed(4)+')';
  let active=null;
  for(const l of tocLinks){
    const hd=tocMap[l.getAttribute('data-id')]; if(!hd) continue;
    const r=hd.getBoundingClientRect();
    const passed=r.top<=120;
    l.classList.toggle('passed', passed);
    if(passed) active=l; // 最后一个越过上边界的标题 = 当前所在节
  }
  if(!active && tocLinks.length && window.scrollY < 200) active = tocLinks[0]; // 顶部未滚动时默认第一节
  tocLinks.forEach(function(l){ l.classList.toggle('active', l===active); });
  // 章节进度环：已读节数 / 总节数 → strokeDashoffset
  const read = tocLinks.filter(function(l){ return l.classList.contains('passed') || l===active; }).length;
  const ratio = tocLinks.length ? read / tocLinks.length : 0;
  cpRingBar.style.strokeDashoffset = (CP_C * (1 - ratio)).toFixed(2);
  if(spineFill){
    let fh = p*100;
    if(active){
      const t = parseFloat(active.style.top) || 0;
      if(t>0 && t<100) fh = t;
    }
    spineFill.style.height = fh + '%';
  }
  if(active && companion && NOTES[hist[idx]]?.type !== 'moc'){
    const sec = tocLinks.indexOf(active); // 注意别写成 idx —— 那是历史栈指针
    cpTitle.innerHTML = '<b>'+(sec+1)+'/'+tocLinks.length+'</b> '+esc(active.getAttribute('data-t'));
    cpPrev.disabled = sec<=0;
    cpNext.disabled = sec>=tocLinks.length-1;
    companion.classList.add('show');
  } else if(companion){
    companion.classList.remove('show');
  }
}
let _tlRaf = 0;
window.addEventListener('scroll', function(){ if(_tlRaf) return; _tlRaf = requestAnimationFrame(function(){ _tlRaf = 0; updateTimeline(); }); });

const _decodeHash = () => { try { return decodeURIComponent(location.hash.slice(1)); } catch(e){ return location.hash.slice(1); } };
const _hslug = _decodeHash();
const startId = (_hslug && NOTES[_hslug]) ? _hslug
  : (() => { try { const l = localStorage.getItem('vinea:last'); return (l && NOTES[l]) ? l : ROOT_ID; } catch(e){ return ROOT_ID; } })();
/* ===== interaction layer wiring (delegated; survives every transition) ===== */
(function fx(){
  if(RM) return;                       // ponytail: one guard, skip all FX for reduced-motion

  // ink ripple on any interactive tap (delegated) — 鼠标/触屏通用（触屏拿它当点按反馈）
  function spawnRipple(e){
    const t = e.target.closest('.ventry,button,.copy-btn,.branch-card,.callout');
    if(!t || t.getBoundingClientRect().width === 0) return;
    const r = t.getBoundingClientRect();
    const d = Math.max(r.width, r.height) * 2.2;
    const c = getComputedStyle(t).getPropertyValue('--c') || getComputedStyle(t).getPropertyValue('--mc');
    const span = document.createElement('span');
    span.className = 'ripple';
    if(c) span.style.setProperty('--c', c.trim());
    span.style.width = span.style.height = d + 'px';
    span.style.left = (e.clientX - r.left) + 'px';
    span.style.top = (e.clientY - r.top) + 'px';
    if(getComputedStyle(t).position === 'static') t.style.position = 'relative';
    t.appendChild(span);
    setTimeout(function(){ span.remove(); }, 600);
  }
  stage.addEventListener('pointerdown', spawnRipple, true);

  if(!FINE_HOVER) return;              // 触屏（无 hover）：halo/磁吸只属鼠标语言，到此为止
  const halo = document.getElementById('halo');
  let raf = 0, lx = 0, ly = 0, hoverEl = null;

  // pointer halo position/size (rAF-throttled, single delegated listener)
  // ponytail: elementFromPoint + closest 是整帧最贵的一步（大文档上千节点）。
  // 指针移动不足 8px 就不重查命中 —— 微抖动/静止时零 hit-test，视觉上无差别。
  let hitX = -1e4, hitY = -1e4, lastHot = null;
  window.addEventListener('pointermove', function(e){
    lx = e.clientX; ly = e.clientY;
    if(halo){ halo.style.left = lx+'px'; halo.style.top = ly+'px'; }
    if(raf) return;
    raf = requestAnimationFrame(function(){
      raf = 0;
      if(Math.abs(lx - hitX) < 8 && Math.abs(ly - hitY) < 8) return; // 没挪动够，沿用上次结果
      hitX = lx; hitY = ly;
      const f = document.elementFromPoint(lx, ly);
      const hot = f && f.closest ? f.closest('a,button,.ms-b,.copy-btn,.branch-card,.callout,[data-target]') : null;
      if(hot !== lastHot){
        lastHot = hot;
        if(halo) halo.classList.toggle('big', !!hot); // 只在「命中结果变了」才碰 DOM
      }
    });
  }, {passive:true});
  window.addEventListener('pointerdown', function(){ if(halo) halo.classList.add('on'); });
  window.addEventListener('pointerup',   function(){ if(halo) halo.classList.remove('on'); });
  document.addEventListener('pointerleave', function(){ if(halo) halo.classList.remove('on'); });

  // magnetic pull on small controls (delegated; auto-applies to freshly rendered wall)
  stage.addEventListener('pointermove', function(e){
    const el = e.target.closest('#cpPrev,#cpNext,.copy-btn');
    if(hoverEl && hoverEl !== el) { hoverEl.style.transform = ''; hoverEl = null; }
    if(!el) return;
    hoverEl = el;
    const r = el.getBoundingClientRect();
    el.style.transform = 'translate(' + ((e.clientX - r.left - r.width/2) * 0.22) + 'px,'
                                + ((e.clientY - r.top - r.height/2) * 0.22) + 'px)';
  });
  stage.addEventListener('pointerleave', function(){ if(hoverEl){ hoverEl.style.transform=''; hoverEl=null; } });
})();

hist=[startId]; idx=0; transitionTo(startId);
