name: Deploy Vinea

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: .build/package-lock.json

      - name: Install
        run: npm ci --prefix .build

      - name: Build
        run: node .build/build.mjs

      - name: Prepare
        run: |
          mkdir -p _deploy
          cp reader.html _deploy/
          cp -r vendor _deploy/
          cp -r notes _deploy/
          touch _deploy/.nojekyll

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_deploy
          force_orphan: true
          commit_message: deploy
