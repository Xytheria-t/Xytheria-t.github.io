name: Deploy Vinea

on:
  push:
    branches: [master, main]
    # 触发：notes/ 与 .build/ 改动才部署；纯文档/记忆改动不浪费构建额度
    paths:
      - 'notes/**'
      - '.build/**'
      - '.github/workflows/deploy.yml'
  # 每日自动部署：即使无人 push，也定时重建并强推 Pages 镜像，保证公网镜像常新
  schedule:
    - cron: '30 17 * * *'   # UTC 17:30 ≈ 北京时间次日 01:30
  # 手动触发入口（Actions 页 → Run workflow）
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: .build/package-lock.json

      - name: Install
        run: npm ci --prefix .build

      - name: Build
        run: node .build/build.mjs

      - name: Verify
        # 与本地 watch/watch 后校验同一套（check + groups + mastery + spans + health）
        run: node .build/verify.mjs

      - name: Prepare
        run: |
          mkdir -p _deploy
          cp Vinea.html _deploy/
          # GitHub Pages 用户站只认 index.html；首页软链到 Vinea.html
          cp Vinea.html _deploy/index.html
          cp -r vendor _deploy/
          cp -r notes _deploy/
          touch _deploy/.nojekyll

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_deploy
          force_orphan: true
          commit_message: deploy
