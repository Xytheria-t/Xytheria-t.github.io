 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">不保证复合操作原子性\u003c/div>\u003cp>\u003ccode>i++\u003c/code> 是读-改-写三步,volatile 只保每步可见,不保三步之间不被插空,并发自增仍会丢更新。单变量原子更新用 \u003ca class=\"wikilink\" data-target=\"cas-与原子类\">CAS 与原子类\u003c/a> 的 \u003ccode>AtomicInteger\u003c/code>。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">内存屏障(JSR-133)\u003c/div>\u003cp>volatile 写：前插 StoreStore、后插 StoreLoad;volatile 读：后插 LoadLoad + LoadStore。StoreLoad 是唯一能挡住「写后读」重排的屏障,也是 volatile 写开销的主要来源。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">JDK 5 前后语义不同\u003c/div>\u003cp>JSR-133(JDK 5)之前 volatile 不禁止重排序,\u003cstrong>双重检查单例在 JDK 5 之前仍可能拿到半初始化对象\u003c/strong>。谈 DCL 安全性默认 JDK 5+。\u003c/p>\n\u003c/div>\n\u003ch2>适用场景\u003c/h2>\n\u003cul>\n\u003cli>✅ \u003cstrong>状态标志\u003c/strong>：\u003ccode>volatile boolean running\u003c/code>,一写多读的控制开关。\u003c/li>\n\u003cli>✅ \u003cstrong>双重检查单例\u003c/strong>：\u003ca class=\"wikilink\" data-target=\"dcl\">DCL\u003c/a>——\u003ccode>private static volatile Singleton instance\u003c/code>,禁止「引用赋值」与「对象初始化」重排。\u003c/li>\n\u003cli>❌ \u003cstrong>复合操作\u003c/strong>：\u003ccode>i++\u003c/code>、先检查后更新(\u003ccode>if(x==0) x=1\u003c/code>)。\u003c/li>\n\u003cli>❌ \u003cstrong>容器内容可见性\u003c/strong>：volatile 只保\u003cstrong>引用\u003c/strong>可见,数组元素 / 对象字段的改动不跟着可见。\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">与 synchronized 的分工\u003c/div>\u003cp>要互斥/复合原子用 \u003ca class=\"wikilink\" data-target=\"synchronized\">synchronized\u003c/a> 或 \u003ca class=\"wikilink\" data-target=\"reentrantlock\">ReentrantLock\u003c/a>；只要可见性不要锁开销才用 volatile。横向对比见 \u003ca class=\"wikilink\" data-target=\"java-锁对比\">Java 锁对比\u003c/a>。\u003c/p>\n\u003c/div>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(3题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">volatile 能保证线程安全吗？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">只保证可见性与有序性,以及单次读写的原子性;不保证复合操作原子性,\u003ccode>i++\u003c/code> 等仍不安全,需配合锁或原子类。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">为什么双重检查单例要 volatile？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">new 对象分分配内存/初始化/赋值引用三步,重排序可能让引用先赋值后初始化,其他线程拿到半初始化对象；volatile 禁止该重排。前提是 JDK 5+。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">volatile 与 happens-before？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">volatile 变量规则——对 volatile 变量的写 happens-before 后续对该变量的读;借助传递性,写线程在 volatile 写之前的普通变量写,也一起对读线程可见。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(4条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：volatile 完全不保证原子性。JDK 5+ 对 volatile 变量的\u003cstrong>单次读/写\u003c/strong>是原子的(含 long/double 不撕裂),不保证的只是 \u003ccode>i++\u003c/code> 这类复合操作。\u003c/li>\n\u003cli>误区：volatile 能替代锁。多变量一致性、先检查后更新这类不变式都守不住,该用 \u003ca class=\"wikilink\" data-target=\"synchronized\">synchronized\u003c/a> 还是要用。\u003c/li>\n\u003cli>误区：volatile 数组的元素改动也可见。只保数组引用可见,元素级要 \u003ccode>AtomicIntegerArray\u003c/code>。\u003c/li>\n\u003cli>误区：volatile 没有开销。写要插 StoreLoad 屏障,会挡住后续读的重排,频繁写的 hot path 比普通变量慢。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["jmm","cas-与原子类","dcl","synchronized","reentrantlock","java-锁对比"],"excerpt":"volatile 是变量可见性原语(非锁),可见性与有序性语义由 JMM 定义 → 写立即刷主存、读不缓存 → 内存屏障禁止重排序 → 单次读写原子但复合操作不原子 → 只适合状态标志与双重检查。","featured":"","order":0,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":3,"groupLayout":"tiles"},"动态代理":{"id":"动态代理","title":"动态代理","type":"note","category":"javase","file":"notes/动态代理.md","accent":"#00E676","accentInk":"#00A344","catLabel":"JavaSE","mtime":"2026-09-05T09:27:18.394Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">两条实现路线 \u003cspan class=\"chain-pill\">选型\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">JDK Proxy vs CGLIB 对比\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">JDK Proxy 与 CGLIB \u003cspan class=\"chain-pill\">原理\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">接口代理 vs 子类代理\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">代理失效边界 \u003cspan class=\"chain-pill\">陷阱\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">哪些调用织不进去\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">落地场景 \u003cspan class=\"chain-pill\">实战\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">Spring / MyBatis 里谁用谁\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>全篇主心骨只有一个：目标\u003cstrong>有没有接口\u003c/strong>——它决定走 JDK Proxy 还是 CGLIB，机制、边界与框架落地都围着它转。\u003c/p>\n\u003c/details>\u003ch2>两条实现路线\u003c/h2>\n\u003cp>运行期\u003cstrong>现场生成代理类的字节码\u003c/strong>并加载，增强逻辑由统一的回调接口承载，一个回调可服务任意多个目标。\u003c/p>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>维度\u003c/th>\n\u003cth>JDK Proxy\u003c/th>\n\u003cth>CGLIB / Byte Buddy\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>依赖\u003c/td>\n\u003ctd>JDK 自带 \u003ccode>java.lang.reflect\u003c/code>\u003c/td>\n\u003ctd>第三方（Spring 内已 repackage）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>前提\u003c/td>\n\u003ctd>目标\u003cstrong>必须实现接口\u003c/strong>\u003c/td>\n\u003ctd>目标可继承即可，无需接口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>手法\u003c/td>\n\u003ctd>生成「实现指定接口」的代理类\u003c/td>\n\u003ctd>生成目标的\u003cstrong>子类\u003c/strong>，重写非 final 方法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>回调\u003c/td>\n\u003ctd>\u003ccode>InvocationHandler.invoke\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>MethodInterceptor.intercept\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>分发\u003c/td>\n\u003ctd>反射 \u003ccode>method.invoke\u003c/code>\u003c/td>\n\u003ctd>FastClass 索引直调（绕开反射）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>不能代理\u003c/td>\n\u003ctd>无接口的类\u003c/td>\n\u003ctd>\u003ccode>final\u003c/code> 类 / \u003ccode>final\u003c/code> / \u003ccode>private\u003c/code> / \u003ccode>static\u003c/code> 方法\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">选型口诀\u003c/div>\u003cp>有接口用 JDK Proxy，无接口只能 CGLIB；\u003cstrong>现代 JDK（9+）下两者性能差距已可忽略\u003c/strong>，选型只看有没有接口。\u003ca class=\"wikilink\" data-target=\"静态代理\">静态代理\u003c/a> 则是编译期手写，规模一大就不可维护。\u003c/p>\n\u003c/div>\n\u003ch2>JDK Proxy 机制\u003c/h2>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">一句话机制\u003c/div>\u003cp>动态代理 = 运行期现拼一个\u003cstrong>接口实现类\u003c/strong> \u003ccode>$Proxy0\u003c/code> 并加载（机制见 \u003ca class=\"wikilink\" data-target=\"类加载过程\">类加载过程\u003c/a>），它的每个方法体\u003cstrong>只做一件事：转调 handler\u003c/strong>。此后你调任何接口方法，真正执行的其实是 \u003ccode>invoke\u003c/code> 里的代码。\u003c/p>\n\u003c/div>\n\u003cp>这个类没法手写，但拼出来的字节码 ≈ 下面这段源码（示意，非 JDK 真实产物）：\u003c/p>\n\u003cfigure class=\"code\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">final\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">$Proxy0\u003c/span> \u003cspan class=\"hljs-keyword\">extends\u003c/span> \u003cspan class=\"hljs-title class_\">Proxy\u003c/span> \u003cspan class=\"hljs-keyword\">implements\u003c/span> \u003cspan class=\"hljs-title class_\">UserService\u003c/span> {\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-comment\">// extends Proxy：父类里就存着 handler（protected InvocationHandler h）\u003c/span>\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-comment\">//   → 单继承被占死：JDK Proxy 只能代理接口，代理不了类\u003c/span>\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-comment\">// 类名 com.sun.proxy.$Proxy0 按序递增，现拼产物勿硬依赖\u003c/span>\u003c/span>\u003cspan class=\"ln\"> \u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">save\u003c/span>\u003cspan class=\"hljs-params\">(String name)\u003c/span> {\u003c/span>\u003cspan class=\"ln\">        \u003cspan class=\"hljs-type\">Method\u003c/span> \u003cspan class=\"hljs-variable\">m\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> 构造期从接口反射出的 save 方法;   \u003cspan class=\"hljs-comment\">// 示意略去异常处理\u003c/span>\u003c/span>\u003cspan class=\"ln\">        h.invoke(\u003cspan class=\"hljs-built_in\">this\u003c/span>, m, \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">Object\u003c/span>[]{ name });     \u003cspan class=\"hljs-comment\">// 唯一动作：转调统一回调\u003c/span>\u003c/span>\u003cspan class=\"ln\">    }\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-comment\">// equals / hashCode / toString 也走同一套转调，全进 handler\u003c/span>\u003c/span>\u003cspan class=\"ln\">}\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">11 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cp>看清 \u003ccode>$Proxy0\u003c/code> \u003cstrong>只认 handler、不认任何业务对象\u003c/strong>之后，\u003ccode>newProxyInstance\u003c/code> 的三个参数就各归其位——注意参数里并没有 target：\u003c/p>\n\u003cfigure class=\"code\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">UserServiceImpl\u003c/span> \u003cspan class=\"hljs-variable\">target\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">UserServiceImpl\u003c/span>();              \u003cspan class=\"hljs-comment\">// target 与参数无关\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">UserService\u003c/span> \u003cspan class=\"hljs-variable\">proxy\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> (UserService) Proxy.newProxyInstance(\u003c/span>\u003cspan class=\"ln\">        target.getClass().getClassLoader(),  \u003cspan class=\"hljs-comment\">// ① 用哪个 ClassLoader 定义 $Proxy0\u003c/span>\u003c/span>\u003cspan class=\"ln\">        \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">Class\u003c/span>&lt;?&gt;[]{ UserService.class }, \u003cspan class=\"hljs-comment\">// ② 实现哪些接口 → 决定 $Proxy0 长啥样\u003c/span>\u003c/span>\u003cspan class=\"ln\">        (p, method, args) -&gt; {               \u003cspan class=\"hljs-comment\">// ③ 统一回调：所有方法都进这里\u003c/span>\u003c/span>\u003cspan class=\"ln\">            \u003cspan class=\"hljs-comment\">// p = 代理对象本身（$Proxy0 的 this，当转发目标会无限递归）\u003c/span>\u003c/span>\u003cspan class=\"ln\">            \u003cspan class=\"hljs-comment\">// method = 正在被调的接口方法；args = 实参\u003c/span>\u003c/span>\u003cspan class=\"ln\">            \u003cspan class=\"hljs-keyword\">return\u003c/span> method.invoke(target, args);  \u003cspan class=\"hljs-comment\">// 想转发 target 才调这行\u003c/span>\u003c/span>\u003cspan class=\"ln\">        });\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">9 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">转发 target 不是必须的\u003c/div>\u003cp>handler 完全可以不碰 target——MyBatis Mapper 连实现类都没有，\u003ccode>invoke\u003c/code> 里直接按方法名拼 SQL 执行。「代理必然转发给真实对象」是常见误解，转不转由 handler 自己决定。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>参数\u003c/th>\n\u003cth>边界坑速查\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>ClassLoader\u003c/code>\u003c/td>\n\u003ctd>看不见目标接口 → 定义代理类时报错\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>interfaces\u003c/code>\u003c/td>\n\u003ctd>上限 65535；重复接口报错\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>InvocationHandler\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>toString\u003c/code>/\u003ccode>equals\u003c/code>/\u003ccode>hashCode\u003c/code> 一并被代理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>invoke\u003c/code> 的 \u003ccode>proxy\u003c/code> 参数\u003c/td>\n\u003ctd>是代理对象自身；误当 target 转发 → 无限递归\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">newProxyInstance \u003cspan class=\"chain-pill\">生成\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">拼字节码并加载\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">客户端调用接口方法 \u003cspan class=\"chain-pill\">入口\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">命中代理类\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">转发 InvocationHandler \u003cspan class=\"chain-pill\">分发\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">统一拦截点\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">method.invoke(target, args) \u003cspan class=\"chain-pill\">执行\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">委派真实对象\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">返回 Object \u003cspan class=\"chain-pill\">出口\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">原路回客户端\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cdetails>\u003csummary>展开时序图\u003c/summary>\u003cdiv class=\"mermaid\" data-mm-type=\"sequenceDiagram\">sequenceDiagram\n    participant C as Client\n    participant P as $Proxy0\n    participant H as InvocationHandler\n    participant T as Target\n    C->>P: save(name)\n    P->>H: invoke(proxy, method, args)\n    H->>H: 前置增强\n    H->>T: method.invoke(target, args)\n    T-->>H: 返回值\n    H->>H: 后置增强\n    H-->>P: 返回值\n    P-->>C: 返回值\n\u003c/div>\n\u003c/details>\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">无限递归\u003c/div>\u003cp>\u003ccode>invoke\u003c/code> 里写成 \u003ccode>method.invoke(proxy, args)\u003c/code> 会再次进入代理对象 → 再次触发 \u003ccode>invoke\u003c/code> → \u003ccode>StackOverflowError\u003c/code>。必须传 \u003cstrong>target\u003c/strong>，不是 proxy。\u003c/p>\n\u003c/div>\n\u003ch2>CGLIB 机制\u003c/h2>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">一句话机制\u003c/div>\u003cp>CGLIB = 运行期用 \u003ccode>Enhancer\u003c/code> 生成目标类的\u003cstrong>子类\u003c/strong>，重写所有非 \u003ccode>final\u003c/code> 方法，方法体\u003cstrong>只做一件事：转调 \u003ccode>MethodInterceptor\u003c/code>\u003c/strong>。无需接口即可代理，代价是 \u003ccode>final\u003c/code>/\u003ccode>private\u003c/code>/\u003ccode>static\u003c/code> 拦不住。\u003c/p>\n\u003c/div>\n\u003cp>Enhancer 现拼的子类 ≈ 下面这段源码（示意，类名形如 \u003ccode>UserServiceImpl$EnhancerByCGLIB$xxxx\u003c/code>）：\u003c/p>\n\u003cfigure class=\"code\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">UserServiceImpl$EnhancerByCGLIB$1\u003c/span> \u003cspan class=\"hljs-keyword\">extends\u003c/span> \u003cspan class=\"hljs-title class_\">UserServiceImpl\u003c/span> {\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">private\u003c/span> MethodInterceptor interceptor;   \u003cspan class=\"hljs-comment\">// 回调就存在子类实例自己身上\u003c/span>\u003c/span>\u003cspan class=\"ln\"> \u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">save\u003c/span>\u003cspan class=\"hljs-params\">(String name)\u003c/span> {\u003c/span>\u003cspan class=\"ln\">        \u003cspan class=\"hljs-comment\">// 每个非 final 方法体同构：转调统一拦截点（m / mp 构造期已缓存）\u003c/span>\u003c/span>\u003cspan class=\"ln\">        interceptor.intercept(\u003cspan class=\"hljs-built_in\">this\u003c/span>, m, \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">Object\u003c/span>[]{ name }, mp);\u003c/span>\u003cspan class=\"ln\">    }\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-comment\">// final 方法无法被重写、private 方法对子类不可见\u003c/span>\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-comment\">//   → 它们的调用落不到这里，增强自然失效\u003c/span>\u003c/span>\u003cspan class=\"ln\">}\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">10 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cp>\u003ccode>intercept\u003c/code> 比 JDK Proxy 的 \u003ccode>invoke\u003c/code> 多一个 \u003ccode>MethodProxy\u003c/code> 参数——它承载 CGLIB 提速的核心（FastClass），也直接对位到上一节的 JDK 心智：\u003c/p>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>CGLIB 概念\u003c/th>\n\u003cth>对位 JDK Proxy\u003c/th>\n\u003cth>作用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>intercept(obj, method, args, proxy)\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>invoke(proxy, method, args)\u003c/code>\u003c/td>\n\u003ctd>统一拦截点；\u003ccode>obj\u003c/code> = 被代理的子类实例\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>proxy.invokeSuper(obj, args)\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>method.invoke(target, args)\u003c/code>\u003c/td>\n\u003ctd>直调\u003cstrong>父类\u003c/strong>实现，不会再进 intercept\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>MethodProxy\u003c/code> + FastClass 索引\u003c/td>\n\u003ctd>反射 \u003ccode>Method.invoke\u003c/code>\u003c/td>\n\u003ctd>方法签名 → 整数下标，switch 直调，省掉反射\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">invokeSuper 与 invoke 差一个字母，语义相反\u003c/div>\u003cp>\u003ccode>invokeSuper\u003c/code> 走 FastClass 索引直调\u003cstrong>父类\u003c/strong>实现（正确）；\u003ccode>invoke\u003c/code> 调\u003cstrong>子类\u003c/strong>方法 → 方法体又转调 intercept → 无限递归。对应 JDK 侧的 \u003ccode>method.invoke(proxy)\u003c/code>。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">JDK 9 模块化的后续收紧\u003c/div>\u003cp>JDK 9 起进入模块化（JEP 261），JDK 16 强封装（JEP 396）后，CGLIB 在 \u003ccode>java.*\u003c/code> 包下定义子类会被拦，需 \u003ccode>--add-opens java.base/java.lang=ALL-UNNAMED\u003c/code>。这也是新项目倾向 Byte Buddy 的原因之一。\u003c/p>\n\u003c/div>\n\u003ch2>代理失效边界\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>后果\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>同类方法自调用 \u003ccode>this.inner()\u003c/code>\u003c/td>\n\u003ctd>增强不生效\u003c/td>\n\u003ctd>\u003ccode>this\u003c/code> 是原始对象，不是代理对象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>final\u003c/code> 方法\u003c/td>\n\u003ctd>CGLIB 无法重写\u003c/td>\n\u003ctd>JDK Proxy 不受影响（接口方法本身可重写）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>private\u003c/code> / \u003ccode>static\u003c/code> 方法\u003c/td>\n\u003ctd>两者都拦不住\u003c/td>\n\u003ctd>不参与多态分发\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>字段访问\u003c/td>\n\u003ctd>拦不住\u003c/td>\n\u003ctd>字节码层面只重写方法\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>目标类为 \u003ccode>final\u003c/code>\u003c/td>\n\u003ctd>CGLIB 直接失败（无法生成子类）\u003c/td>\n\u003ctd>有接口可退 JDK Proxy（接口代理不涉及目标子类）；无接口则无法代理，换 Byte Buddy 或改设计\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">自调用是 Spring 事务失效的头号原因\u003c/div>\u003cp>\u003ccode>@Transactional\u003c/code> 走 AOP 代理，同一个类里 \u003ccode>this.methodB()\u003c/code> 绕过了代理，事务、缓存、异步注解\u003cstrong>全部失效\u003c/strong>。修法：注入自身代理、拆到另一个类、或用 \u003ccode>AopContext.currentProxy()\u003c/code>。\u003c/p>\n\u003c/div>\n\u003ch2>落地场景\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>用什么\u003c/th>\n\u003cth>原因\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>MyBatis Mapper\u003c/td>\n\u003ctd>JDK Proxy\u003c/td>\n\u003ctd>接口本就没有实现类，代理负责把方法映射成 SQL\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Spring Boot AOP / 声明式事务\u003c/td>\n\u003ctd>CGLIB\u003c/td>\n\u003ctd>Boot 2.0+ 默认 \u003ccode>proxyTargetClass=true\u003c/code>，见下方策略说明\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>纯 Spring Framework（有接口时）\u003c/td>\n\u003ctd>JDK Proxy\u003c/td>\n\u003ctd>Framework 层默认面向接口，无接口才退回 CGLIB\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RPC 客户端 Stub\u003c/td>\n\u003ctd>JDK Proxy\u003c/td>\n\u003ctd>面向接口契约，天然匹配\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">Spring 用谁，取决于你跑在哪个环境\u003c/div>\u003cp>纯 Spring Framework：目标\u003cstrong>有接口 → 默认 JDK Proxy\u003c/strong>，无接口才 CGLIB。\u003cstrong>Spring Boot 2.0 起 \u003ccode>proxyTargetClass\u003c/code> 默认 \u003ccode>true\u003c/code>，有接口也优先 CGLIB\u003c/strong>——代理对象是目标类的子类，按实现类注入也不会类型不匹配。老资料「有接口用 JDK Proxy」只在纯 Framework 成立，Boot 项目里已不适用。\u003c/p>\n\u003c/div>\n\u003ch2>落地：织入代码与类图\u003c/h2>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">关键前提\u003c/div>\u003cp>运行期织入的前提是「拿到代理对象」。调用方拿到的是原始对象时，再强的代理也是摆设。\u003c/p>\n\u003c/div>\n\u003cfigure class=\"code\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// 1. JDK Proxy：目标必须有接口\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">UserService\u003c/span> \u003cspan class=\"hljs-variable\">proxy\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> (UserService) Proxy.newProxyInstance(\u003c/span>\u003cspan class=\"ln\">        target.getClass().getClassLoader(),\u003c/span>\u003cspan class=\"ln\">        \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">Class\u003c/span>&lt;?&gt;[]{ UserService.class },\u003c/span>\u003cspan class=\"ln\">        (p, method, args) -&gt; {\u003c/span>\u003cspan class=\"ln\">            \u003cspan class=\"hljs-type\">long\u003c/span> \u003cspan class=\"hljs-variable\">t\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> System.nanoTime();\u003c/span>\u003cspan class=\"ln\">            \u003cspan class=\"hljs-keyword\">try\u003c/span> {\u003c/span>\u003cspan class=\"ln\">                \u003cspan class=\"hljs-keyword\">return\u003c/span> method.invoke(target, args);   \u003cspan class=\"hljs-comment\">// 注意：target，不是 p\u003c/span>\u003c/span>\u003cspan class=\"ln\">            } \u003cspan class=\"hljs-keyword\">finally\u003c/span> {\u003c/span>\u003cspan class=\"ln\">                System.out.println(\u003cspan class=\"hljs-string\">&quot;cost &quot;\u003c/span> + (System.nanoTime() - t) + \u003cspan class=\"hljs-string\">&quot;ns&quot;\u003c/span>);\u003c/span>\u003cspan class=\"ln\">            }\u003c/span>\u003cspan class=\"ln\">        });\u003c/span>\u003cspan class=\"ln\"> \u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// 2. CGLIB：目标无需接口\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">Enhancer\u003c/span> \u003cspan class=\"hljs-variable\">enhancer\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">Enhancer\u003c/span>();\u003c/span>\u003cspan class=\"ln\">enhancer.setSuperclass(UserService.class);\u003c/span>\u003cspan class=\"ln\">enhancer.setCallback((MethodInterceptor) (obj, method, args, p) -&gt; {\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-type\">long\u003c/span> \u003cspan class=\"hljs-variable\">t\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> System.nanoTime();\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">try\u003c/span> {\u003c/span>\u003cspan class=\"ln\">        \u003cspan class=\"hljs-keyword\">return\u003c/span> p.invokeSuper(obj, args);              \u003cspan class=\"hljs-comment\">// 注意：invokeSuper\u003c/span>\u003c/span>\u003cspan class=\"ln\">    } \u003cspan class=\"hljs-keyword\">finally\u003c/span> {\u003c/span>\u003cspan class=\"ln\">        System.out.println(\u003cspan class=\"hljs-string\">&quot;cost &quot;\u003c/span> + (System.nanoTime() - t) + \u003cspan class=\"hljs-string\">&quot;ns&quot;\u003c/span>);\u003c/span>\u003cspan class=\"ln\">    }\u003c/span>\u003cspan class=\"ln\">});\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">UserService\u003c/span> \u003cspan class=\"hljs-variable\">cglibProxy\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> (UserService) enhancer.create();\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">25 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cdetails>\u003csummary>展开类图\u003c/summary>\u003cdiv class=\"mermaid\" data-mm-type=\"classDiagram\">classDiagram\n    class UserService {\n        &lt;&lt;interface>>\n        +save(String)\n    }\n    class UserServiceImpl {\n        +save(String)\n    }\n    class Proxy0 {\n        -InvocationHandler h\n        +save(String)\n    }\n    class CglibSub {\n        -MethodInterceptor c\n        +save(String)\n    }\n    class InvocationHandler {\n        &lt;&lt;interface>>\n        +invoke(Object, Method, Object[])\n    }\n    class MethodInterceptor {\n        &lt;&lt;interface>>\n        +intercept(Object, Method, Object[], MethodProxy)\n    }\n    UserService &lt;|.. UserServiceImpl\n    UserService &lt;|.. Proxy0\n    UserServiceImpl &lt;|-- CglibSub\n    Proxy0 --> InvocationHandler : h\n    CglibSub --> MethodInterceptor : c\n\u003c/div>\n\u003c/details>\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(4题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">JDK 动态代理和 CGLIB 的区别？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">JDK Proxy 只能代理接口，运行期生成接口实现类，靠反射分发；CGLIB 生成目标子类、重写方法，靠 FastClass 索引分发，能代理无接口的类但拦不住 final。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">为什么 JDK 9 之后两者性能差距变小？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">早期 JDK Proxy 每次调用走反射 \u003ccode>Method.invoke\u003c/code>，而 CGLIB 用 FastClass 索引直调；现代 JDK（9+）的 JIT 已能优化反射调用，且 JDK Proxy 创建代理类的开销更小，两者调用耗时已在同一量级。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">CGLIB 为什么不能代理 final 方法？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">它的机制是生成子类并重写方法，final 方法在字节码层面禁止重写，子类根本无法覆盖，调用会直接落到父类实现，增强被跳过。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">Spring 事务在同一个类里调用为什么失效？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">事务增强挂在代理对象上，\u003ccode>this.xxx()\u003c/code> 拿到的是原始对象引用，调用根本没经过代理，事务拦截器不会触发。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(4条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：动态代理性能很差。字节码只生成一次并缓存，调用开销主要是反射分发，且 JDK 9+ 已被 JIT 优化；真实业务里毫秒级 IO 面前可以忽略。\u003c/li>\n\u003cli>误区：CGLIB 一定比 JDK Proxy 快。JDK 8 时代成立，现在不再成立；反而 CGLIB 创建成本高、还受模块封装限制。\u003c/li>\n\u003cli>误区：动态代理能代理任何方法。字段访问、\u003ccode>private\u003c/code>、\u003ccode>static\u003c/code>、\u003ccode>final\u003c/code> 方法以及同类自调用，全都拦不住。\u003c/li>\n\u003cli>误区：Spring 有接口就用 JDK Proxy。纯 Spring Framework 成立；\u003cstrong>Spring Boot 2.0+ 默认 \u003ccode>proxyTargetClass=true\u003c/code>，优先 CGLIB\u003c/strong>。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["静态代理","类加载过程"],"excerpt":"全篇主心骨只有一个：目标**有没有接口**——它决定走 JDK Proxy 还是 CGLIB，机制、边界与框架落地都围着它转。","featured":"","order":0,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":0,"groupLayout":"tiles"},"双亲委派模型":{"id":"双亲委派模型","title":"双亲委派模型","type":"note","category":"jvm","file":"notes/双亲委派模型.md","accent":"#FF5252","accentInk":"#D32F2F","catLabel":"JVM","mtime":"2026-09-05T09:27:18.394Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">委派规则 \u003cspan class=\"chain-pill\">规则\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">请求如何向上传递\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">源码实现 \u003cspan class=\"chain-pill\">原理\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">loadClass 三步\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">收益 \u003cspan class=\"chain-pill\">价值\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">为什么必须这样设计\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">常见误区 \u003cspan class=\"chain-pill\">收尾\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">认知纠偏\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>一张加载请求先&quot;向上问&quot;、逐层落空才&quot;向下装&quot;——先立规则，再对照源码印证，随后回答为什么非这样设计不可，最后用高频问答与常见误区收尾复盘。\u003c/p>\n\u003c/details>\u003ch2>委派规则\u003c/h2>\n\u003cp>核心一句话：\u003cstrong>先问父、再问己\u003c/strong> —— 收到加载请求先向上委派给父加载器，父层全部落空，加载器才自己读取字节码。\u003c/p>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>步骤\u003c/th>\n\u003cth>动作\u003c/th>\n\u003cth>结果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>\u003ccode>findLoadedClass\u003c/code> 查本加载器缓存\u003c/td>\n\u003ctd>命中直接返回\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>委派 \u003ccode>parent.loadClass\u003c/code>，逐层上抛至 Bootstrap\u003c/td>\n\u003ctd>父层失败抛 \u003ccode>ClassNotFoundException\u003c/code> → 被吞掉，继续下一步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>自己 \u003ccode>findClass\u003c/code> 读字节码 → \u003ccode>defineClass\u003c/code>\u003c/td>\n\u003ctd>仍失败，才由本层抛出 \u003ccode>ClassNotFoundException\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">术语纠正\u003c/div>\u003cp>「双亲」是 parent 的翻译，\u003cstrong>不是两个父加载器\u003c/strong>。除 Bootstrap 外每个加载器只有一个父加载器，链路是单链。\u003c/p>\n\u003c/div>\n\u003ch2>源码实现\u003c/h2>\n\u003cfigure class=\"code\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-keyword\">protected\u003c/span> \u003cspan class=\"hljs-type\">Class\u003c/span>&lt;?&gt; \u003cspan class=\"hljs-title function_\">loadClass\u003c/span>\u003cspan class=\"hljs-params\">(String name, \u003cspan class=\"hljs-type\">boolean\u003c/span> resolve)\u003c/span> \u003cspan class=\"hljs-keyword\">throws\u003c/span> ClassNotFoundException {\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">synchronized\u003c/span> (getClassLoadingLock(name)) {\u003c/span>\u003cspan class=\"ln\">        \u003cspan class=\"hljs-type\">Class\u003c/span>&lt;?&gt; \u003cspan class=\"hljs-variable\">c\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> findLoadedClass(name);          \u003cspan class=\"hljs-comment\">// 1. 查缓存\u003c/span>\u003c/span>\u003cspan class=\"ln\">        \u003cspan class=\"hljs-keyword\">if\u003c/span> (c == \u003cspan class=\"hljs-literal\">null\u003c/span>) {\u003c/span>\u003cspan class=\"ln\">            \u003cspan class=\"hljs-keyword\">try\u003c/span> {\u003c/span>\u003cspan class=\"ln\">                \u003cspan class=\"hljs-keyword\">if\u003c/span> (parent != \u003cspan class=\"hljs-literal\">null\u003c/span>)\u003c/span>\u003cspan class=\"ln\">                    c = parent.loadClass(name, \u003cspan class=\"hljs-literal\">false\u003c/span>); \u003cspan class=\"hljs-comment\">// 2. 委派父加载器\u003c/span>\u003c/span>\u003cspan class=\"ln\">                \u003cspan class=\"hljs-keyword\">else\u003c/span>\u003c/span>\u003cspan class=\"ln\">                    c = findBootstrapClassOrNull(name);\u003cspan class=\"hljs-comment\">// 3. 到达 Bootstrap\u003c/span>\u003c/span>\u003cspan class=\"ln\">            } \u003cspan class=\"hljs-keyword\">catch\u003c/span> (ClassNotFoundException e) {\u003c/span>\u003cspan class=\"ln\">                \u003cspan class=\"hljs-comment\">// 父加载器加载失败，不处理，往下走自己加载\u003c/span>\u003c/span>\u003cspan class=\"ln\">            }\u003c/span>\u003cspan class=\"ln\">            \u003cspan class=\"hljs-keyword\">if\u003c/span> (c == \u003cspan class=\"hljs-literal\">null\u003c/span>)\u003c/span>\u003cspan class=\"ln\">                c = findClass(name);                  \u003cspan class=\"hljs-comment\">// 4. 自己加载\u003c/span>\u003c/span>\u003cspan class=\"ln\">        }\u003c/span>\u003cspan class=\"ln\">        \u003cspan class=\"hljs-keyword\">if\u003c/span> (resolve) resolveClass(c);                 \u003cspan class=\"hljs-comment\">// 链接（解析）\u003c/span>\u003c/span>\u003cspan class=\"ln\">        \u003cspan class=\"hljs-keyword\">return\u003c/span> c;\u003c/span>\u003cspan class=\"ln\">    }\u003c/span>\u003cspan class=\"ln\">}\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">19 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">自定义加载器的正确姿势\u003c/div>\u003cp>重写 \u003ccode>findClass\u003c/code>，\u003cstrong>不要\u003c/strong>重写 \u003ccode>loadClass\u003c/code>。重写 \u003ccode>loadClass\u003c/code> 会绕过委派逻辑，等于主动破坏模型 —— 除非你就是要破坏它，见 \u003ca class=\"wikilink\" data-target=\"破坏双亲委派\">破坏双亲委派\u003c/a>。\u003c/p>\n\u003c/div>\n\u003cdetails>\u003csummary>展开流程图\u003c/summary>\u003cdiv class=\"mermaid\" data-mm-type=\"flowchart\">flowchart TD\n  A([收到加载请求 name]) --> B{本层缓存命中?&lt;br>findLoadedClass}\n  B -->|命中| Z([返回 Class])\n  B -->|未命中| C{存在父加载器?}\n  C -->|有| D[parent.loadClass&lt;br>递归执行本流程]\n  C -->|无 · 已是链顶| E[findBootstrapClassOrNull&lt;br>向 Bootstrap 探测]\n  D -->|父链加载成功| Z\n  D -->|父链抛 CNFE 被本层吞| F([父层全部落空&lt;br>轮到本层兜底])\n  E -->|Bootstrap 命中| Z\n  E -->|返回 null| F\n  F --> G{findClass&lt;br>本层搜索字节码}\n  G -->|找到| H[defineClass&lt;br>生成 Class]\n  H --> Z\n  G -->|未找到| X([抛 CNFE&lt;br>沿链回溯给请求方])\n\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">读图提示\u003c/div>\u003cp>本图是\u003cstrong>某一层\u003c/strong>加载器的完整流程：\u003ccode>parent.loadClass\u003c/code> 会递归重复同一套逻辑（父级先查自己缓存，再继续向上），任一级失败抛出的 CNFE 沿链回溯、被各级吞掉后轮到各自 \u003ccode>findClass\u003c/code> 兜底；链顶（parent 为空的 Platform / Ext）才负责向 Bootstrap 探测。JDK 9+ 会先判模块归属，见上文收益区。\u003c/p>\n\u003c/div>\n\u003c/details>\u003ch2>收益\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>收益\u003c/th>\n\u003cth>机制\u003c/th>\n\u003cth>反例后果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>类的唯一性\u003c/td>\n\u003ctd>委派让同一个类总由同一个加载器加载\u003c/td>\n\u003ctd>不同加载器加载的同名类是\u003cstrong>不同类型\u003c/strong>，\u003ccode>instanceof\u003c/code> 与强转全失败\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>沙箱安全\u003c/td>\n\u003ctd>核心库只认 Bootstrap 的搜索范围\u003c/td>\n\u003ctd>自定义 \u003ccode>java.lang.String\u003c/code> 永远轮不到被加载，核心 API 无法被替换\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>避免重复加载\u003c/td>\n\u003ctd>父层缓存命中即返回\u003c/td>\n\u003ctd>内存中多份同名 Class 对象，静态字段各存一份\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">同名类 ≠ 同一个类\u003c/div>\u003cp>类的唯一性由 \u003cstrong>加载器 + 全限定名\u003c/strong> 共同决定。两个不同加载器加载同一个 \u003ccode>com.x.User\u003c/code>，\u003ccode>equals\u003c/code> 为 false，互相赋值抛 \u003ccode>ClassCastException\u003c/code>。这是 \u003ca class=\"wikilink\" data-target=\"类加载器\">类加载器\u003c/a> 命名空间隔离的直接后果。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">委派是「约定」不是「强制」\u003c/div>\u003cp>JDK 9 引入模块系统后，Bootstrap 加载器的职责被 Platform 加载器分走一部分；委派顺序在模块化场景下会先按模块归属判断，不再是纯父子链。\u003c/p>\n\u003c/div>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(4题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">双亲委派的工作过程？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">收到加载请求先查缓存，未命中则委派给父加载器，逐层上抛到 Bootstrap；父层全部无法完成时，才由自身 \u003ccode>findClass\u003c/code> 加载并 \u003ccode>defineClass\u003c/code>。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">为什么设计双亲委派？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">两点。一是保证类的唯一性，避免同一类被重复加载产生多份 Class 对象；二是沙箱安全，防止用户自定义类替换 JDK 核心类。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">如何破坏双亲委派？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">三种典型方式 —— 重写 \u003ccode>loadClass\u003c/code>、用线程上下文类加载器（TCCL）、自定义加载器做隔离。详见 \u003ca class=\"wikilink\" data-target=\"破坏双亲委派\">破坏双亲委派\u003c/a>。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">可以用自定义类加载器加载 \u003ccode>java.lang.Object\u003c/code> 吗？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">不行。包名以 \u003ccode>java.\u003c/code> 开头会触发安全校验，\u003ccode>defineClass\u003c/code> 抛 \u003ccode>SecurityException\u003c/code>；即使绕过，「先父后子」的委派顺序也会让 Bootstrap 优先返回官方版本。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(3条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：双亲委派是 JVM 规范强制的。实际是 JDK 1.2 引入的\u003cstrong>代码实现约定\u003c/strong>，\u003ccode>ClassLoader\u003c/code> 是普通 Java 类，能被覆盖。\u003c/li>\n\u003cli>误区：「父加载器」是继承关系。实际是\u003cstrong>组合\u003c/strong>（\u003ccode>parent\u003c/code> 字段），不是 \u003ccode>extends\u003c/code>。\u003c/li>\n\u003cli>误区：委派失败会立刻抛异常。\u003ccode>loadClass\u003c/code> 捕获父层的 \u003ccode>ClassNotFoundException\u003c/code> 后继续自己加载，异常只在自身也找不到时才抛出。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["破坏双亲委派","类加载器"],"excerpt":"一张加载请求先\"向上问\"、逐层落空才\"向下装\"——先立规则，再对照源码印证，随后回答为什么非这样设计不可，最后用高频问答与常见误区收尾复盘。","featured":"","order":1,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":2,"groupLayout":"tiles","pinned":true},"基本数据类型":{"id":"基本数据类型","title":"基本数据类型","type":"note","category":"javase","file":"notes/基本数据类型.md","accent":"#00E676","accentInk":"#00A344","catLabel":"JavaSE","mtime":"2026-09-05T09:27:18.394Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">八种类型全表 \u003cspan class=\"chain-pill\">速查\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">位宽与取值\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">整数溢出与浮点精度 \u003cspan class=\"chain-pill\">核心\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">两个精度陷阱\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">字面量与转换 \u003cspan class=\"chain-pill\">规则\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">后缀与提升\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">装箱与缓存 \u003cspan class=\"chain-pill\">分野\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">包装类\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>八种类型先混个脸熟，坑全藏在「边界」里：整数溢出与浮点精度是数字的坑，后缀与类型提升是表达式的坑，装箱缓存让 \u003ccode>==\u003c/code> 也成了坑。\u003c/p>\n\u003c/details>\u003ch2>八种类型全表\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>类型\u003c/th>\n\u003cth>位数\u003c/th>\n\u003cth>字节\u003c/th>\n\u003cth>默认值\u003c/th>\n\u003cth>取值范围\u003c/th>\n\u003cth>包装类\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>byte\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>-128 ~ 127\u003c/td>\n\u003ctd>Byte\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>short\u003c/td>\n\u003ctd>16\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>-32768 ~ 32767\u003c/td>\n\u003ctd>Short\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>int\u003c/td>\n\u003ctd>32\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>-2³¹ ~ 2³¹-1\u003c/td>\n\u003ctd>Integer\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>long\u003c/td>\n\u003ctd>64\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>0L\u003c/td>\n\u003ctd>-2⁶³ ~ 2⁶³-1\u003c/td>\n\u003ctd>Long\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>float\u003c/td>\n\u003ctd>32\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>0.0f\u003c/td>\n\u003ctd>约 ±3.4e38，7 位有效数字\u003c/td>\n\u003ctd>Float\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>double\u003c/td>\n\u003ctd>64\u003c/td>\n\u003ctd>8\u003c/td>\n\u003ctd>0.0d\u003c/td>\n\u003ctd>约 ±1.8e308，15 位有效数字\u003c/td>\n\u003ctd>Double\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>char\u003c/td>\n\u003ctd>16\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>&#39;\\u0000&#39;\u003c/td>\n\u003ctd>0 ~ 65535（无符号）\u003c/td>\n\u003ctd>Character\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>boolean\u003c/td>\n\u003ctd>未规定\u003c/td>\n\u003ctd>未规定\u003c/td>\n\u003ctd>false\u003c/td>\n\u003ctd>true / false\u003c/td>\n\u003ctd>Boolean\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">默认值只属于字段\u003c/div>\u003cp>上表默认值是\u003cstrong>成员变量\u003c/strong>才有的待遇；局部变量不赋初值就读取，直接编译报错。数组元素是例外，new 出来的数组自动填默认值，与字段一致。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">char 是唯一的无符号整型\u003c/div>\u003cp>\u003ccode>char\u003c/code> 存的是 UTF-16 码元，能直接当 16 位无符号整数参与运算，赋值用单引号 \u003ccode>&#39;A&#39;\u003c/code> 或码值 \u003ccode>65\u003c/code>，二者等价。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">boolean 的位宽没有标准答案\u003c/div>\u003cp>JVM 规范没规定 boolean 占几位：单独使用时通常按 int 处理（4 字节），放进 \u003ccode>boolean[]\u003c/code> 时多数虚拟机按 byte 处理（1 字节）。答题说&quot;1 位&quot;或&quot;1 字节&quot;都不严谨，正确说法是\u003cstrong>未明确规定、由虚拟机实现决定\u003c/strong>。\u003c/p>\n\u003c/div>\n\u003ch2>整数溢出\u003c/h2>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">溢出不报错，静默绕圈\u003c/div>\u003cp>\u003ccode>Integer.MAX_VALUE + 1 == Integer.MIN_VALUE\u003c/code>。整数运算溢出\u003cstrong>不抛异常\u003c/strong>，按二进制补码绕回，是线上金额/计数类 bug 的经典来源。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>写法\u003c/th>\n\u003cth>结果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>int 越界\u003c/td>\n\u003ctd>\u003ccode>2147483647 + 1\u003c/code>\u003c/td>\n\u003ctd>-2147483648\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>大数相乘再转型\u003c/td>\n\u003ctd>\u003ccode>long t = 24 * 60 * 60 * 1000 * 1000\u003c/code>\u003c/td>\n\u003ctd>先按 int 算，已溢出才转 long\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>求中间值\u003c/td>\n\u003ctd>\u003ccode>(l + r) / 2\u003c/code>\u003c/td>\n\u003ctd>l+r 可能溢出\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>取绝对值\u003c/td>\n\u003ctd>\u003ccode>Math.abs(Integer.MIN_VALUE)\u003c/code>\u003c/td>\n\u003ctd>仍是负数 -2147483648\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">三个修法\u003c/div>\u003cp>常量先带 \u003ccode>L\u003c/code> 后缀把运算抬到 long：\u003ccode>24L * 60 * 60 * 1000 * 1000\u003c/code>；求中点写 \u003ccode>l + (r - l) / 2\u003c/code>；JDK 8 起可用 \u003ccode>Math.addExact / multiplyExact\u003c/code>，溢出直接抛 \u003ccode>ArithmeticException\u003c/code>，把静默错误变成显式失败。\u003c/p>\n\u003c/div>\n\u003ch2>浮点精度\u003c/h2>\n\u003cdiv class=\"branch\">\u003cdiv class=\"branch-stem\">\u003cdiv class=\"branch-step\">\u003cspan class=\"branch-num\">01\u003c/span>\u003cdiv class=\"branch-body\">\u003cdiv class=\"branch-t\">浮点比较\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"branch-link-v\">\u003cspan>触发\u003c/span>\u003c/div>\u003cdiv class=\"branch-step\">\u003cspan class=\"branch-num\">02\u003c/span>\u003cdiv class=\"branch-body\">\u003cdiv class=\"branch-t\">按写法分流\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"branch-join\">\u003c/div>\u003cdiv class=\"branch-fan\">\u003c/div>\u003cdiv class=\"branch-grid\">\u003cdiv class=\"branch-card\">\u003cdiv class=\"branch-h\">a == b\u003c/div>\u003cdiv class=\"branch-b\">位模式严格相等\u003c/div>\u003cspan class=\"branch-tag\">0.1+0.2 != 0.3\u003c/span>\u003c/div>\u003cdiv class=\"branch-card\">\u003cdiv class=\"branch-h\">Math.abs(a-b) &lt; 1e-6\u003c/div>\u003cdiv class=\"branch-b\">允许误差\u003c/div>\u003cspan class=\"branch-tag\">一般工程够用\u003c/span>\u003c/div>\u003cdiv class=\"branch-card\">\u003cdiv class=\"branch-h\">BigDecimal.compareTo\u003c/div>\u003cdiv class=\"branch-b\">精确十进制\u003c/div>\u003cspan class=\"branch-tag\">金额必用\u003c/span>\u003c/div>\u003cdiv class=\"branch-card\">\u003cdiv class=\"branch-h\">Double.compare\u003c/div>\u003cdiv class=\"branch-b\">处理 NaN 与 ±0.0\u003c/div>\u003cspan class=\"branch-tag\">排序场景\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">0.1 + 0.2 != 0.3\u003c/div>\u003cp>二进制浮点无法精确表示 0.1，\u003ccode>0.1 + 0.2\u003c/code> 得到 \u003ccode>0.30000000000000004\u003c/code>。\u003cstrong>任何金额计算都不要用 float / double\u003c/strong>，一律 \u003ccode>BigDecimal\u003c/code>。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">float 的有效位只有 7 位\u003c/div>\u003cp>\u003ccode>float\u003c/code> 常被称为&quot;单精度&quot;，但它的有效数字只有约 7 位，整数部分一大，小数就不保真。字面量必须带 \u003ccode>f\u003c/code> 后缀，写 \u003ccode>float x = 0.1;\u003c/code> 编译不过——因为 \u003ccode>0.1\u003c/code> 默认 double，大转小要强转。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">特殊值也是正常值\u003c/div>\u003cp>\u003ccode>NaN\u003c/code> 与任何值比较都是 false（包括 \u003ccode>NaN != NaN\u003c/code> 为 true）；\u003ccode>1.0/0.0\u003c/code> 得 \u003ccode>Infinity\u003c/code> 而不抛异常。判空与校验要显式用 \u003ccode>Double.isNaN\u003c/code> / \u003ccode>isInfinite\u003c/code>。\u003c/p>\n\u003c/div>\n\u003ch2>字面量与类型提升\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>字面量\u003c/th>\n\u003cth>默认类型\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>100\u003c/code>\u003c/td>\n\u003ctd>int\u003c/td>\n\u003ctd>整数字面量默认 int\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>100L\u003c/code>\u003c/td>\n\u003ctd>long\u003c/td>\n\u003ctd>后缀 L/l，建议大写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>0.1\u003c/code>\u003c/td>\n\u003ctd>double\u003c/td>\n\u003ctd>小数字面量默认 double\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>0.1f\u003c/code>\u003c/td>\n\u003ctd>float\u003c/td>\n\u003ctd>后缀 F/f\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>0x1F\u003c/code> / \u003ccode>0b101\u003c/code>\u003c/td>\n\u003ctd>int\u003c/td>\n\u003ctd>十六 / 二进制，JDK 7 起支持\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>1_000_000\u003c/code>\u003c/td>\n\u003ctd>int\u003c/td>\n\u003ctd>下划线仅分隔，编译期丢弃\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>&#39;A&#39;\u003c/code>\u003c/td>\n\u003ctd>char\u003c/td>\n\u003ctd>单引号\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">运算前一律先升到 int\u003c/div>\u003cp>\u003ccode>byte\u003c/code>、\u003ccode>short\u003c/code>、\u003ccode>char\u003c/code> 参与算术运算时\u003cstrong>先整体提升为 int\u003c/strong> 再算，所以 \u003ccode>byte b = 1; b = b + 1;\u003c/code> 编译报错（int 不能赋回 byte），而 \u003ccode>b += 1;\u003c/code> 能过——复合赋值运算符自带隐式强转。\u003c/p>\n\u003c/div>\n\u003cdetails>\u003csummary>展开类型提升图\u003c/summary>\u003cdiv class=\"mermaid\" data-mm-type=\"flowchart\">flowchart LR\n  B[byte] --> I[int]\n  S[short] --> I\n  C[char] --> I\n  I --> L[long]\n  L --> F[float]\n  F --> D[double]\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">三条路都直接到 int\u003c/div>\u003cp>byte / short / char 是\u003cstrong>各自独立\u003c/strong>提升为 int，不存在 \u003ccode>byte → short\u003c/code> 这一跳。图里画成汇聚而非串联，正是为了避免误以为 byte 会先经过 short。\u003c/p>\n\u003c/div>\n\u003c/details>\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">long 转 float 会丢精度\u003c/div>\u003cp>自动转换方向是 \u003ccode>long → float → double\u003c/code>，因为 float 的\u003cstrong>取值范围\u003c/strong>比 long 大。但 float 只有 24 位有效位，long 有 63 位，\u003ccode>long\u003c/code> 转 \u003ccode>float\u003c/code> 高位数值会被截断。大 → 小看范围，范围大不代表精度高。\u003c/p>\n\u003c/div>\n\u003ch2>装箱与缓存\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>包装类\u003c/th>\n\u003cth>缓存区间\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Byte / Short / Integer / Long\u003c/td>\n\u003ctd>-128 ~ 127\u003c/td>\n\u003ctd>\u003ccode>valueOf\u003c/code> 复用对象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Character\u003c/td>\n\u003ctd>0 ~ 127\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Boolean\u003c/td>\n\u003ctd>true / false\u003c/td>\n\u003ctd>全部缓存\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Float / Double\u003c/td>\n\u003ctd>无\u003c/td>\n\u003ctd>浮点区间内取值无限，无法缓存\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">127 与 128 的分水岭\u003c/div>\u003cp>\u003ccode>Integer a = 127, b = 127; a == b\u003c/code> 为 \u003cstrong>true\u003c/strong>（同一缓存对象）；换成 \u003ccode>128\u003c/code> 则为 \u003cstrong>false\u003c/strong>（各自 new）。包装类比较值\u003cstrong>一律用 \u003ccode>equals\u003c/code>\u003c/strong>，不要用 \u003ccode>==\u003c/code>。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">自动拆箱会 NPE\u003c/div>\u003cp>\u003ccode>Integer\u003c/code> 字段为 null 时参与运算或赋给 int，触发拆箱抛 \u003ccode>NullPointerException\u003c/code>；三目运算符 \u003ccode>flag ? integerObj : 0\u003c/code> 也会因类型对齐把对象拆箱。数据库可空列映射成包装类时尤其容易踩。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">存储位置分两处\u003c/div>\u003cp>基本类型局部变量占栈帧的局部变量表，包装类对象是堆里的对象（字段另存 value）。为什么数组与对象的布局长这样，见 \u003ca class=\"wikilink\" data-target=\"jvm-运行时数据区\">JVM 运行时数据区\u003c/a>。\u003c/p>\n\u003c/div>\n\u003ch2>落地：易错点代码\u003c/h2>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">落地四条\u003c/div>\u003cp>金额用 \u003ccode>BigDecimal(String)\u003c/code> 构造（不用 double 构造）；状态、金额、计数类字段优先包装类以表达 null；循环里的装箱是隐形开销，热路径用基本类型；集合只能装对象，装箱发生的时机见 \u003ca class=\"wikilink\" data-target=\"java-collection\">Java Collection\u003c/a>。\u003c/p>\n\u003c/div>\n\u003cfigure class=\"code\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// 1. 溢出：不报错，绕回\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">int\u003c/span> \u003cspan class=\"hljs-variable\">max\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> Integer.MAX_VALUE;\u003c/span>\u003cspan class=\"ln\">System.out.println(max + \u003cspan class=\"hljs-number\">1\u003c/span>);              \u003cspan class=\"hljs-comment\">// -2147483648\u003c/span>\u003c/span>\u003cspan class=\"ln\">System.out.println(Math.abs(Integer.MIN_VALUE)); \u003cspan class=\"hljs-comment\">// -2147483648\u003c/span>\u003c/span>\u003cspan class=\"ln\">Math.addExact(max, \u003cspan class=\"hljs-number\">1\u003c/span>);                    \u003cspan class=\"hljs-comment\">// ArithmeticException，显式失败\u003c/span>\u003c/span>\u003cspan class=\"ln\"> \u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// 2. 常量先抬类型，别让 int 先溢出\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">long\u003c/span> \u003cspan class=\"hljs-variable\">wrong\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-number\">24\u003c/span> * \u003cspan class=\"hljs-number\">60\u003c/span> * \u003cspan class=\"hljs-number\">60\u003c/span> * \u003cspan class=\"hljs-number\">1000\u003c/span> * \u003cspan class=\"hljs-number\">1000\u003c/span>;  \u003cspan class=\"hljs-comment\">// 500654080，已溢出\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">long\u003c/span> \u003cspan class=\"hljs-variable\">right\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-number\">24L\u003c/span> * \u003cspan class=\"hljs-number\">60\u003c/span> * \u003cspan class=\"hljs-number\">60\u003c/span> * \u003cspan class=\"hljs-number\">1000\u003c/span> * \u003cspan class=\"hljs-number\">1000\u003c/span>; \u003cspan class=\"hljs-comment\">// 86400000000\u003c/span>\u003c/span>\u003cspan class=\"ln\"> \u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// 3. 浮点：金额别用 double\u003c/span>\u003c/span>\u003cspan class=\"ln\">System.out.println(\u003cspan class=\"hljs-number\">0.1\u003c/span> + \u003cspan class=\"hljs-number\">0.2\u003c/span>);            \u003cspan class=\"hljs-comment\">// 0.30000000000000004\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">BigDecimal\u003c/span>(\u003cspan class=\"hljs-string\">&quot;0.1&quot;\u003c/span>).add(\u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">BigDecimal\u003c/span>(\u003cspan class=\"hljs-string\">&quot;0.2&quot;\u003c/span>)); \u003cspan class=\"hljs-comment\">// 0.3，构造用字符串\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">BigDecimal\u003c/span>(\u003cspan class=\"hljs-number\">0.1\u003c/span>);                      \u003cspan class=\"hljs-comment\">// 0.1000000000000000055511151231257827\u003c/span>\u003c/span>\u003cspan class=\"ln\"> \u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// 4. 转换(byte/short/char 运算前先升 int)\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">byte\u003c/span> \u003cspan class=\"hljs-variable\">b\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-number\">1\u003c/span>;\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// b = b + 1;                             // 编译错：int 赋回 byte\u003c/span>\u003c/span>\u003cspan class=\"ln\">b += \u003cspan class=\"hljs-number\">1\u003c/span>;                                   \u003cspan class=\"hljs-comment\">// 复合赋值自带强转，能过\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">long\u003c/span> \u003cspan class=\"hljs-variable\">big\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-number\">1L\u003c/span> &lt;&lt; \u003cspan class=\"hljs-number\">62\u003c/span>; \u003cspan class=\"hljs-type\">float\u003c/span> \u003cspan class=\"hljs-variable\">f\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> big;       \u003cspan class=\"hljs-comment\">// long → float 丢精度\u003c/span>\u003c/span>\u003cspan class=\"ln\"> \u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// 5. 装箱缓存：常量池复用\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">Integer\u003c/span> \u003cspan class=\"hljs-variable\">a\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-number\">127\u003c/span>, c = \u003cspan class=\"hljs-number\">127\u003c/span>; System.out.println(a == c);       \u003cspan class=\"hljs-comment\">// true\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">Integer\u003c/span> \u003cspan class=\"hljs-variable\">d\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-number\">128\u003c/span>, e = \u003cspan class=\"hljs-number\">128\u003c/span>; System.out.println(d == e);       \u003cspan class=\"hljs-comment\">// false\u003c/span>\u003c/span>\u003cspan class=\"ln\">System.out.println(d.equals(e));                            \u003cspan class=\"hljs-comment\">// true，一律用 equals\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">Integer\u003c/span> \u003cspan class=\"hljs-variable\">nullable\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-literal\">null\u003c/span>; \u003cspan class=\"hljs-type\">int\u003c/span> \u003cspan class=\"hljs-variable\">n\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> nullable;                  \u003cspan class=\"hljs-comment\">// NPE\u003c/span>\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">26 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(5题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">Java 有几种基本数据类型，分别占多少字节？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">八种。byte 1、short 2、int 4、long 8、float 4、double 8、char 2，boolean 由 JVM 实现决定、规范未规定。boolean 单独使用时通常按 int 处理，数组中常按 byte 处理。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">\u003ccode>Integer a = 127, b = 127; a == b\u003c/code> 为什么是 true，换成 128 就是 false？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">因为 \u003ccode>Integer.valueOf\u003c/code> 对 -128~127 做了缓存，装箱时复用同一对象，所以 \u003ccode>==\u003c/code> 也为 true；128 超出缓存区间，各自 new 出新对象，\u003ccode>==\u003c/code> 比的是引用地址故为 false。包装类比大小一律用 \u003ccode>equals\u003c/code>。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">\u003ccode>0.1 + 0.2\u003c/code> 为什么不等于 0.3？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">float / double 是二进制浮点，无法精确表示十进制的 0.1，累加后误差暴露，结果是 \u003ccode>0.30000000000000004\u003c/code>。金融场景改用 \u003ccode>BigDecimal\u003c/code>，且必须用字符串构造，用 double 构造会把误差原样带进去。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">\u003ccode>byte b = 1; b = b + 1;\u003c/code> 报错，而 \u003ccode>b += 1;\u003c/code> 不报错？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">byte、short、char 参与算术运算会先提升为 int，\u003ccode>b + 1\u003c/code> 结果是 int，赋回 byte 属大转小，需强转；\u003ccode>+=\u003c/code> 这类复合赋值运算符自带隐式强制转换，等价于 \u003ccode>b = (byte)(b + 1)\u003c/code>，所以能编译通过。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">\u003ccode>short s = 1; s = s + 1;\u003c/code> 和 \u003ccode>long\u003c/code> 转 \u003ccode>float\u003c/code> 有什么共同点？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">都考&quot;自动转换&quot;的方向。\u003ccode>s + 1\u003c/code> 提升成 int 不能自动赋回 short；而 \u003ccode>long → float\u003c/code> 反而是自动的，因为自动转换看\u003cstrong>取值范围\u003c/strong>而非精度，float 范围大于 long，但有效位只有 24 位，转换会丢精度。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(4条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：boolean 占 1 字节。规范根本没规定位数，只规定了取值；数组与单独字段在 HotSpot 里的实现宽度都不一样。\u003c/li>\n\u003cli>误区：包装类 == 比的是值。\u003ccode>==\u003c/code> 永远比引用，只是缓存区间内恰好命中同一对象，换个数就翻车。\u003c/li>\n\u003cli>误区：long 转 float 更安全。自动转换成立只因范围够大，精度反而从 63 位有效位掉到 24 位。\u003c/li>\n\u003cli>误区：\u003ccode>new BigDecimal(0.1)\u003c/code> 能精确表示 0.1。double 本身的误差会被 BigDecimal 完整保留，必须用 \u003ccode>new BigDecimal(&quot;0.1&quot;)\u003c/code> 或 \u003ccode>BigDecimal.valueOf(0.1)\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["jvm-运行时数据区","java-collection"],"excerpt":"八种类型先混个脸熟，坑全藏在「边界」里：整数溢出与浮点精度是数字的坑，后缀与类型提升是表达式的坑，装箱缓存让 `==` 也成了坑。","featured":"","order":0,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":0,"groupLayout":"tiles"},"引用计数":{"id":"引用计数","title":"引用计数","type":"note","category":"jvm","file":"notes/引用计数.md","accent":"#FF5252","accentInk":"#D32F2F","catLabel":"JVM","mtime":"2026-09-05T09:27:18.394Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">机制 \u003cspan class=\"chain-pill\">起点\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\"
