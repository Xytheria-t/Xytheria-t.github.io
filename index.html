003c/code> / \u003ccode>tryWriteLock(t)\u003c/code>\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>拿不到就超时返回 0\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>乐观读用法\u003c/h2>\n\u003cfigure class=\"code\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">StampedLock\u003c/span> \u003cspan class=\"hljs-variable\">sl\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">StampedLock\u003c/span>();\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">long\u003c/span> \u003cspan class=\"hljs-variable\">stamp\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> sl.tryOptimisticRead(); \u003cspan class=\"hljs-comment\">// 无锁拿戳\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">int\u003c/span> \u003cspan class=\"hljs-variable\">v\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> data;                         \u003cspan class=\"hljs-comment\">// 读进局部变量\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-keyword\">if\u003c/span> (!sl.validate(stamp)) {            \u003cspan class=\"hljs-comment\">// 戳变了说明有写\u003c/span>\u003c/span>\u003cspan class=\"ln\">    stamp = sl.readLock();            \u003cspan class=\"hljs-comment\">// 升级为读锁重读\u003c/span>\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">try\u003c/span> { v = data; } \u003cspan class=\"hljs-keyword\">finally\u003c/span> { sl.unlockRead(stamp); }\u003c/span>\u003cspan class=\"ln\">}\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">7 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">乐观读的两个陷阱\u003c/div>\n\u003col>\n\u003cli>\u003cstrong>先把值读进局部变量再 \u003ccode>validate\u003c/code>\u003c/strong>：边校验边读共享字段,校验通过也可能读到被写线程改过的新值,前后不一致。\u003c/li>\n\u003cli>\u003cstrong>\u003ccode>tryOptimisticRead()\u003c/code> 返回 0 = 已有写锁持有\u003c/strong>,直接走 \u003ccode>readLock()\u003c/code> 悲观读,别拿 0 继续乐观读。\u003c/li>\n\u003c/ol>\n\u003c/div>\n\u003ch2>模式转换\u003c/h2>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">持锁状态下也能升降级\u003c/div>\u003cp>\u003ccode>tryConvertToWriteLock(stamp)\u003c/code> / \u003ccode>tryConvertToReadLock(stamp)\u003c/code> / \u003ccode>tryConvertToOptimisticRead(stamp)\u003c/code>：在已持锁时尝试换模式,成功返回新 stamp(\u003cstrong>不释放锁\u003c/strong>),失败返回 0 再走常规获取。这是 \u003ca class=\"wikilink\" data-target=\"reentrantreadwritelock\">ReentrantReadWriteLock\u003c/a> 没有的能力。\u003c/p>\n\u003c/div>\n\u003ch2>不可重入与接口适配\u003c/h2>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">不可重入 &amp; 无 Condition\u003c/div>\u003cp>StampedLock \u003cstrong>不可重入\u003c/strong>,同一线程重入会死锁;也没有 Condition 原生支持。需要可重入/多条件时退回 \u003ca class=\"wikilink\" data-target=\"reentrantreadwritelock\">ReentrantReadWriteLock\u003c/a>。补偿手段：\u003ccode>asReadLock()\u003c/code> / \u003ccode>asWriteLock()\u003c/code> 把戳记包装成 \u003ccode>Lock\u003c/code> 视图,给只认 \u003ccode>Lock\u003c/code> 接口的 API 用。\u003c/p>\n\u003c/div>\n\u003ch2>与读写锁对比\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>ReentrantReadWriteLock\u003c/th>\n\u003cth>StampedLock\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>读方式\u003c/td>\n\u003ctd>读锁(阻塞)\u003c/td>\n\u003ctd>乐观读(无锁)+校验\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可重入\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003ctd>❌\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可中断\u003c/td>\n\u003ctd>✅ read/writeLockInterruptibly\u003c/td>\n\u003ctd>✅ read/writeLockInterruptibly\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Condition\u003c/td>\n\u003ctd>✅(仅写锁)\u003c/td>\n\u003ctd>❌\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>锁降级\u003c/td>\n\u003ctd>✅ 写→读\u003c/td>\n\u003ctd>✅ tryConvertToReadLock\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>极读多性能\u003c/td>\n\u003ctd>中\u003c/td>\n\u003ctd>优\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">选型\u003c/div>\u003cp>极端读多写少、读操作短 → StampedLock 乐观读；否则读写锁更稳。完整对比见 \u003ca class=\"wikilink\" data-target=\"java-锁对比\">Java 锁对比\u003c/a>。\u003c/p>\n\u003c/div>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(3题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">乐观读为什么快？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">tryOptimisticRead 不加锁,只是读戳,无阻塞、无 CAS 争用；只有戳被写变更才升级为读锁重读,读多写少时几乎零竞争开销。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">StampedLock 能替代读写锁吗？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">不能完全替代：不可重入、无 Condition,且在写稍多时乐观读频繁升级反而更慢；按读写比选型。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">乐观读期间要注意什么？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">先把所有需要的字段读进局部变量,再 validate(stamp);读过程不能有副作用,否则校验失败重读时会重复执行。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(3条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：乐观读随便用。读期间不要调有副作用的方法,读多个字段必须先进局部变量,否则读到的是不一致快照。\u003c/li>\n\u003cli>误区：StampedLock 完全不可中断。\u003ccode>readLockInterruptibly()\u003c/code> / \u003ccode>writeLockInterruptibly()\u003c/code> 就是中断版,只是普通 \u003ccode>readLock()\u003c/code> 不响应中断。\u003c/li>\n\u003cli>误区：StampedLock 全面优于读写锁。写稍多时乐观读频繁校验失败 + 重读,开销反超读写锁;且不可重入,改造老代码风险高。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["reentrantreadwritelock","java-锁对比"],"excerpt":"StampedLock(JDK8)用戳记(stamp)管理三种模式 → 乐观读无锁读后校验戳 → 戳记还能在持有锁时升降级 → 但不可重入、无原生 Condition → 适合极读多写少且读短。","featured":"","order":0,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":3,"groupLayout":"tiles"},"tcp":{"id":"tcp","title":"TCP","type":"note","category":"network","file":"notes/TCP.md","accent":"#00B0FF","accentInk":"#0081CB","catLabel":"Network","mtime":"2026-09-05T09:27:18.394Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">协议定位 \u003cspan class=\"chain-pill\">前提\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">与 UDP 的分野\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">建连与断连 \u003cspan class=\"chain-pill\">连接\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">三次握手 · 四次挥手\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">可靠与效率 \u003cspan class=\"chain-pill\">传输\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">重传 · 滑动窗口\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">流量与拥塞 \u003cspan class=\"chain-pill\">控制\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">rwnd 与 cwnd 取小\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>三次握手建连、四次挥手断连 → 序列号 / 确认 / 重传保证可靠 → 滑动窗口同时承载流量与拥塞控制，发送窗口取二者最小值。\u003ca class=\"wikilink\" data-target=\"http\">HTTP\u003c/a>、\u003ca class=\"wikilink\" data-target=\"https\">HTTPS\u003c/a> 等应用层协议均承载于 TCP 之上。\u003c/p>\n\u003c/details>\u003ch2>协议定位与对比\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>维度\u003c/th>\n\u003cth>TCP\u003c/th>\n\u003cth>UDP\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>连接\u003c/td>\n\u003ctd>面向连接（握手建连）\u003c/td>\n\u003ctd>无连接\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可靠性\u003c/td>\n\u003ctd>不丢、不重、按序\u003c/td>\n\u003ctd>尽力交付，不保证\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>传输单位\u003c/td>\n\u003ctd>字节流\u003c/td>\n\u003ctd>数据报\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>流量 / 拥塞控制\u003c/td>\n\u003ctd>有\u003c/td>\n\u003ctd>无\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>首部开销\u003c/td>\n\u003ctd>20 字节起\u003c/td>\n\u003ctd>8 字节\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>校验和\u003c/td>\n\u003ctd>必选（覆盖伪首部）\u003c/td>\n\u003ctd>IPv4 可选（可置 0 跳过，现代实现默认开启）；IPv6 强制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>适用场景\u003c/td>\n\u003ctd>文件、网页、邮件\u003c/td>\n\u003ctd>实时音视频、DNS、游戏\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">定位\u003c/div>\u003cp>TCP 在 IP 之上提供端到端的可靠字节流；同属 \u003ca class=\"wikilink\" data-target=\"computer-networking\">计算机网络\u003c/a> 传输层，\u003ca class=\"wikilink\" data-target=\"udp\">UDP\u003c/a> 走另一条路线。\u003c/p>\n\u003c/div>\n\u003ch2>三次握手\u003c/h2>\n\u003cp>三次握手本质不是为了「确认对方在线」，而是\u003cstrong>协商初始序列号并同步窗口信息\u003c/strong>，为后续可靠传输与流量控制铺路。\u003c/p>\n\u003cp>先统一记号：\u003cstrong>大写 = 标志位\u003c/strong>（首部里的 1 bit 开关），\u003cstrong>小写 = 字段值\u003c/strong>（首部里的编号），下文全程使用。\u003c/p>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>记号\u003c/th>\n\u003cth>全称\u003c/th>\n\u003cth>含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>SYN\u003c/td>\n\u003ctd>Synchronize\u003c/td>\n\u003ctd>标志位：请求建连，同时宣告自己的初始序列号\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ACK\u003c/td>\n\u003ctd>Acknowledgment\u003c/td>\n\u003ctd>标志位：确认号有效；连接建立后每个报文都置 1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FIN\u003c/td>\n\u003ctd>Finish\u003c/td>\n\u003ctd>标志位：数据发完，请求关闭（四次挥手用）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RST\u003c/td>\n\u003ctd>Reset\u003c/td>\n\u003ctd>标志位：连接异常，立即强制断开\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>seq\u003c/td>\n\u003ctd>Sequence Number，序列号\u003c/td>\n\u003ctd>本报文所发数据第一个字节在字节流中的编号\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ack\u003c/td>\n\u003ctd>Acknowledgment Number，确认号\u003c/td>\n\u003ctd>期望对方下一个字节的编号，隐含「此前全部收到」\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ISN\u003c/td>\n\u003ctd>Initial Sequence Number，初始序列号\u003c/td>\n\u003ctd>握手要协商的核心，双方各自随机生成（见下）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">客户端 SYN \u003cspan class=\"chain-pill\">第一次\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">seq=x\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">服务端 SYN+ACK \u003cspan class=\"chain-pill\">第二次\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">seq=y, ack=x+1\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">客户端 ACK \u003cspan class=\"chain-pill\">第三次\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">seq=x+1, ack=y+1\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">+1 来历：SYN / FIN 各占一个序号\u003c/div>\u003cp>对方确认号 = 我方 seq + 1。第二次握手 ack=x+1 即「你的 SYN（第 x 号）我收到了」。\u003c/p>\n\u003c/div>\n\u003cdetails>\u003csummary>展开三次握手时序图\u003c/summary>\u003cdiv class=\"mermaid\" data-mm-type=\"sequenceDiagram\">sequenceDiagram\n    participant C as 客户端\n    participant S as 服务端\n    C->>S: SYN, seq=x\n    S->>C: SYN+ACK, seq=y, ack=x+1\n    C->>S: ACK, seq=x+1, ack=y+1\n    Note over C,S: 双方进入 ESTABLISHED，连接建立\n\u003c/div>\n\u003c/details>\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">为什么是三次\u003c/div>\u003cp>两次不够：服务端无法确认客户端能收；三次让双方都确认「自己能发、对方能收」。第三次可携带数据。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">初始序列号 ISN 为何随机\u003c/div>\u003cp>不从 0 开始：① 防历史连接旧报文被误认成新连接的合法数据（防序列号缠绕）；② 可预测 ISN 易被伪造 RST 包强制断连（RST 攻击）。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">SYN 泛洪\u003c/div>\u003cp>攻击方只发 SYN 不回 ACK，撑爆服务端半连接队列 → 资源耗尽。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">防护\u003c/div>\u003cp>SYN Cookie、调大 \u003ccode>listen\u003c/code> backlog、限速。\u003c/p>\n\u003c/div>\n\u003ch2>四次挥手\u003c/h2>\n\u003cdetails>\u003csummary>展开四次挥手时序图\u003c/summary>\u003cdiv class=\"mermaid\" data-mm-type=\"sequenceDiagram\">sequenceDiagram\n    participant C as 客户端\n    participant S as 服务端\n    C->>S: FIN, seq=u\n    S->>C: ACK, ack=u+1\n    Note over S: 服务端仍可发数据（半关闭）\n    S->>C: FIN, seq=v\n    C->>S: ACK, ack=v+1\n    Note over C: 等待 2MSL 后进入 CLOSED\n\u003c/div>\n\u003c/details>\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">为什么是四次\u003c/div>\u003cp>TCP 全双工，关闭需双向各发 FIN/ACK。服务端收到 FIN 先回 ACK，待自身数据发完再发 FIN，故 ACK 与 FIN 分开 → 四次。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">TIME_WAIT 与 2MSL\u003c/div>\u003cp>主动关闭方保持 2MSL（MSL = Maximum Segment Lifetime，报文最大生存时间）：确保最后 ACK 抵达，并让旧报文消亡避免新连接误收。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">TIME_WAIT 堆积\u003c/div>\u003cp>主动关闭方端口耗尽 → 调 \u003ccode>tcp_tw_reuse\u003c/code> / \u003ccode>SO_REUSEADDR\u003c/code> 或改长连接。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">CLOSE_WAIT 堆积\u003c/div>\u003cp>服务端未调 \u003ccode>close()\u003c/code> → 查应用代码，非调内核。\u003c/p>\n\u003c/div>\n\u003ch2>可靠传输机制\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>机制\u003c/th>\n\u003cth>作用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>序列号 / 确认号\u003c/td>\n\u003ctd>保证字节有序、去重\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>超时重传 RTO\u003c/td>\n\u003ctd>未收到 ACK 则重发，RTO 随 RTT 动态估算\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>累积确认\u003c/td>\n\u003ctd>ACK=n 表示 n 之前全部收到\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>滑动窗口\u003c/td>\n\u003ctd>批量发送、流水线，提高吞吐\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">丢包判定\u003c/div>\u003cp>超时 或 连续 3 个重复 ACK（快重传触发点）→ 判定丢包并重传，无需等待超时。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">线上丢包排查\u003c/div>\u003cp>\u003ccode>ss -ti\u003c/code> 看重传率 / RTT；\u003ccode>tcpdump\u003c/code> 抓重复 ACK 判断丢包；\u003ccode>netstat -s\u003c/code> 看全局重传统计。一行命令即可定位是否重传、RTT 是否异常。\u003c/p>\n\u003c/div>\n\u003ch2>流量控制\u003c/h2>\n\u003cp>接收方通过 \u003cstrong>窗口字段\u003c/strong> 通告剩余缓冲区。\u003c/p>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">核心公式\u003c/div>\u003cp>发送窗口 = min(接收窗口 rwnd, 拥塞窗口 cwnd)。rwnd 防压垮接收方（流量控制），cwnd 防压垮网络（拥塞控制），二者独立、取小生效。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">糊涂窗口综合征\u003c/div>\u003cp>接收方腾出极小窗口、发送方发极小报文 → 信道利用率骤降。解法：接收方凑够空间再通告（Clark 算法）、发送方用 Nagle 算法攒批。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">零窗口\u003c/div>\u003cp>接收方缓冲区满 → 通告窗口=0，发送方停止发送并启动持续探测（零窗口探测报文）待窗口恢复。\u003c/p>\n\u003c/div>\n\u003ch2>拥塞控制\u003c/h2>\n\u003cp>以「网络不超载」为目标，发送方维护拥塞窗口 cwnd：\u003c/p>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>阶段\u003c/th>\n\u003cth>行为\u003c/th>\n\u003cth>触发\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>慢启动\u003c/td>\n\u003ctd>cwnd 指数增长（每 RTT 翻倍）\u003c/td>\n\u003ctd>连接初 / 超时后\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>拥塞避免\u003c/td>\n\u003ctd>cwnd 线性增长（+1 MSS/RTT）\u003c/td>\n\u003ctd>cwnd ≥ ssthresh\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>快重传\u003c/td>\n\u003ctd>收 3 个重复 ACK 即重传\u003c/td>\n\u003ctd>丢包（未超时）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>快恢复\u003c/td>\n\u003ctd>ssthresh=cwnd/2，cwnd=ssthresh，线性增长\u003c/td>\n\u003ctd>快重传后\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">超时 vs 快重传\u003c/div>\u003cp>超时 = 网络可能重度拥塞 → 重置 cwnd=1 回到慢启动；3 重复 ACK = 轻度丢包 → 快恢复，不归零。两者均将 ssthresh 减半。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">Reno / Tahoe 差异\u003c/div>\u003cp>快重传后是否进快恢复看实现：TCP Reno 进快恢复（ssthresh=cwnd/2 后线性增长）；TCP Tahoe 仍回慢启动（cwnd=1）。现代 Linux 多为 Reno / CUBIC 变体（CUBIC 在拥塞避免段改用立方函数而非线性）。\u003c/p>\n\u003c/div>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(3题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">TCP 如何保证可靠传输？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">序列号 + 确认号保证有序去重；超时重传与快重传补丢包；滑动窗口提升吞吐；校验和丢弃坏包。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">TIME_WAIT 为什么需要 2MSL？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">确保最后 ACK 抵达对端；让本连接残余报文在网络中消亡，避免被新连接误收。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">拥塞控制与流量控制区别？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">流量控制是接收方能力约束（窗口匹配接收缓冲）；拥塞控制是网络整体负载约束（避免网络过载）。发送窗口取二者最小值。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(3条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：握手 / 挥手次数可随意减少。三次握手与四次挥手由全双工与确认必要性决定，少一次都无法双向确认。\u003c/li>\n\u003cli>误区：流量控制 = 拥塞控制。前者防压垮接收方，后者防压垮网络，二者独立。\u003c/li>\n\u003cli>误区：UDP 不可靠就没用。实时音视频、DNS 等场景要低延迟，丢一两包优于等待重传，UDP 更合适。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["http","https","computer-networking","udp"],"excerpt":"三次握手建连、四次挥手断连 → 序列号 / 确认 / 重传保证可靠 → 滑动窗口同时承载流量与拥塞控制，发送窗口取二者最小值。HTTP、HTTPS 等应用层协议均承载于 TCP 之上。","featured":"","order":0,"group":1,"groupNum":"Ⅱ","groupName":"架构与系统设计","groupRank":2,"groupLayout":"spread"},"threadpoolexecutor":{"id":"threadpoolexecutor","title":"ThreadPoolExecutor","type":"note","category":"juc","file":"notes/ThreadPoolExecutor.md","accent":"#7C4DFF","accentInk":"#5E35B1","catLabel":"Concurrency","mtime":"2026-09-05T09:27:18.394Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">七大参数 \u003cspan class=\"chain-pill\">配置\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">7 个旋钮\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">执行路径决策 \u003cspan class=\"chain-pill\">核心\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">任务如何路由\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">落地：构造示例 \u003cspan class=\"chain-pill\">实战\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">代码与陷阱\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">常见误区 \u003cspan class=\"chain-pill\">收尾\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">避坑清单\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>七个参数是旋钮，执行路径才是主线：核心线程 → 队列缓冲 → 扩容 → 拒绝，一条路串起每个旋钮的生效时机 —— 最后落到代码陷阱与常见误区复盘。\u003c/p>\n\u003c/details>\u003ch2>七大参数\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>参数\u003c/th>\n\u003cth>作用\u003c/th>\n\u003cth>注意\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>corePoolSize\u003c/td>\n\u003ctd>常驻核心线程数\u003c/td>\n\u003ctd>默认不会被回收\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>maximumPoolSize\u003c/td>\n\u003ctd>队列满后扩容上限\u003c/td>\n\u003ctd>须 ≥ corePoolSize\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>keepAliveTime\u003c/td>\n\u003ctd>空闲线程存活时间\u003c/td>\n\u003ctd>仅作用于超出核心的线程\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>workQueue\u003c/td>\n\u003ctd>任务缓冲队列\u003c/td>\n\u003ctd>容量决定何时触发扩容\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>threadFactory\u003c/td>\n\u003ctd>线程创建工厂\u003c/td>\n\u003ctd>可定制名称 / 守护属性\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>handler\u003c/td>\n\u003ctd>拒绝策略\u003c/td>\n\u003ctd>默认 AbortPolicy 抛异常，详见 \u003ca class=\"wikilink\" data-target=\"拒绝策略\">拒绝策略\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>allowCoreThreadTimeOut\u003c/td>\n\u003ctd>核心线程是否超时回收\u003c/td>\n\u003ctd>默认 false\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">关键提醒\u003c/div>\u003cp>默认 AbortPolicy 直接抛异常；高吞吐场景用 CallerRunsPolicy 让调用方自己跑，避免雪崩。行为差异见 \u003ca class=\"wikilink\" data-target=\"拒绝策略\">拒绝策略\u003c/a>。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">容量公式\u003c/div>\u003cp>合理容量 ≈ 峰值 QPS × 平均耗时。队列过短易触发拒绝，过长易 OOM；队列选型见 \u003ca class=\"wikilink\" data-target=\"阻塞队列\">阻塞队列\u003c/a>。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">调参顺序\u003c/div>\u003cp>先压测得峰值 QPS 与平均耗时 → 估算队列容量 → corePoolSize 按任务类型估算（CPU 密集 ≈ N_cpu+1，IO 密集 ≈ N_cpu×U×(1+W/C)，粗略 2N）→ 压测验证。公式详见 \u003ca class=\"wikilink\" data-target=\"阻塞队列\">阻塞队列\u003c/a>。\u003c/p>\n\u003c/div>\n\u003ch2>执行路径决策\u003c/h2>\n\u003cp>任务提交后的路由顺序：\u003c/p>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">提交任务 \u003cspan class=\"chain-pill\">入口\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">execute / submit\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">核心线程 \u003cspan class=\"chain-pill\">满\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">直接执行\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">工作队列 \u003cspan class=\"chain-pill\">满\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">入队缓冲\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">最大线程 \u003cspan class=\"chain-pill\">满\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">扩容执行\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">拒绝策略 \u003cspan class=\"chain-pill\">全满\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">handler 兜底\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cdetails>\u003csummary>展开决策流程图\u003c/summary>\u003cdiv class=\"mermaid\" data-mm-type=\"flowchart\">flowchart TD\n  S([execute task]) --> Q{\"线程数 &lt;br> corePoolSize\"}\n  Q -->|是| C1[创建核心线程执行]\n  Q -->|否| W{\"队列未满\"}\n  W -->|是| C2[入队等待]\n  W -->|否| M{\"线程数 &lt;br> maximumPoolSize\"}\n  M -->|是| C3[创建非核心线程执行]\n  M -->|否| R[触发拒绝策略]\n\u003c/div>\n\u003c/details>\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">与流程图的差异\u003c/div>\u003cp>上面的流程图回答「走哪条路」，调用方关心的是「谁来跑」：直接执行与扩容执行都落到工作线程，入队与拒绝则根本没出线程池边界。\u003c/p>\n\u003c/div>\n\u003ch2>落地：构造示例\u003c/h2>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">关键前提\u003c/div>\u003cp>合理设置队列容量与拒绝策略，防止资源耗尽。属于 \u003ca class=\"wikilink\" data-target=\"juc\">JUC\u003c/a> 并发工具包的核心能力。\u003c/p>\n\u003c/div>\n\u003cfigure class=\"code mini\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">ThreadPoolExecutor\u003c/span> \u003cspan class=\"hljs-variable\">ex\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">ThreadPoolExecutor\u003c/span>(\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-number\">4\u003c/span>, \u003cspan class=\"hljs-number\">8\u003c/span>, \u003cspan class=\"hljs-number\">60\u003c/span>, TimeUnit.SECONDS,\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">LinkedBlockingQueue\u003c/span>&lt;&gt;(\u003cspan class=\"hljs-number\">100\u003c/span>));\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">3 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cdetails>\u003csummary>展开核心类图\u003c/summary>\u003cdiv class=\"mermaid\" data-mm-type=\"classDiagram\">classDiagram\n    class ThreadPoolExecutor {\n        -int corePoolSize\n        -int maximumPoolSize\n        -BlockingQueue workQueue\n        -RejectedExecutionHandler handler\n        +execute(Runnable)\n        +submit(Callable)\n    }\n    class RejectedExecutionHandler {\n        &lt;&lt;interface>>\n        +rejectedExecution(Runnable, ThreadPoolExecutor)\n    }\n    ThreadPoolExecutor --> RejectedExecutionHandler : handler\n\u003c/div>\n\u003c/details>\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">工厂方法陷阱\u003c/div>\u003cp>避免使用 Executors.newFixedThreadPool / newSingleThreadExecutor 等工厂方法创建的线程池，底层使用无界 \u003ca class=\"wikilink\" data-target=\"阻塞队列\">阻塞队列\u003c/a>，任务持续堆积可能撑爆内存。\u003c/p>\n\u003c/div>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(2题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">为什么不建议用 Executors.newFixedThreadPool？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">它使用无界 LinkedBlockingQueue，任务堆积可能撑爆内存；应手动指定队列容量与拒绝策略。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">核心线程会被回收吗？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">默认不会；设 allowCoreThreadTimeOut(true) 后，核心线程也会按 keepAliveTime 回收。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(3条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：线程数越多越好。实际受 CPU 核数与任务类型（CPU/IO 密集）约束。\u003c/li>\n\u003cli>误区：队列越大越安全。无界队列隐藏反压，任务堆积终致 OOM。\u003c/li>\n\u003cli>误区：拒绝策略 = 异常 = 故障。CallerRunsPolicy 是合法的兜底，会形成天然背压。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["拒绝策略","阻塞队列","juc"],"excerpt":"七个参数是旋钮，执行路径才是主线：核心线程 → 队列缓冲 → 扩容 → 拒绝，一条路串起每个旋钮的生效时机 —— 最后落到代码陷阱与常见误区复盘。","featured":"","order":1,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":3,"groupLayout":"tiles","pinned":true},"udp":{"id":"udp","title":"UDP","type":"note","category":"network","file":"notes/UDP.md","accent":"#00B0FF","accentInk":"#0081CB","catLabel":"Network","mtime":"2026-09-05T09:27:18.394Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">协议定位 \u003cspan class=\"chain-pill\">前提\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">与 TCP 的分野\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">首部与特点 \u003cspan class=\"chain-pill\">骨架\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">8 字节 · 数据报边界\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">校验和 \u003cspan class=\"chain-pill\">检测\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">伪首部差错检测\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">工程陷阱 \u003cspan class=\"chain-pill\">避坑\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">MTU · 截断 · 放大\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">选型与面试 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">何时选 UDP\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>UDP 是传输层无连接的「尽力交付」协议：8 字节极简首部、无握手无重传，以数据报为单位发送，适合实时与查询类低延迟场景，对照 \u003ca class=\"wikilink\" data-target=\"tcp\">TCP\u003c/a> 走另一条路线。\u003c/p>\n\u003c/details>\u003ch2>协议定位与对比\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>维度\u003c/th>\n\u003cth>UDP\u003c/th>\n\u003cth>TCP\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>连接\u003c/td>\n\u003ctd>无连接\u003c/td>\n\u003ctd>面向连接（握手建连）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可靠性\u003c/td>\n\u003ctd>尽力交付，不保证到达 / 不重 / 有序\u003c/td>\n\u003ctd>不丢、不重、按序\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>数据有序性\u003c/td>\n\u003ctd>不保证，乱序到达需应用层排序\u003c/td>\n\u003ctd>严格按序交付\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>传输单位\u003c/td>\n\u003ctd>数据报（保留消息边界）\u003c/td>\n\u003ctd>字节流（无边界）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>全双工\u003c/td>\n\u003ctd>支持对称收发，但无连接状态\u003c/td>\n\u003ctd>面向连接的全双工\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>流量 / 拥塞控制\u003c/td>\n\u003ctd>无\u003c/td>\n\u003ctd>有\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>首部开销\u003c/td>\n\u003ctd>8 字节固定\u003c/td>\n\u003ctd>20 字节起\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>校验和\u003c/td>\n\u003ctd>标准强制（现代实现默认开启），IPv4 允许置 0 但生产极少关闭；IPv6 强制\u003c/td>\n\u003ctd>必选（覆盖伪首部）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>广播 / 多播\u003c/td>\n\u003ctd>支持\u003c/td>\n\u003ctd>不支持\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>适用场景\u003c/td>\n\u003ctd>实时音视频、DNS、游戏\u003c/td>\n\u003ctd>文件、网页、邮件\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">定位\u003c/div>\u003cp>UDP 在 IP 之上仅提供「多路复用 + 差错检测」，把可靠、顺序、拥塞全交给应用层；同属 \u003ca class=\"wikilink\" data-target=\"computer-networking\">计算机网络\u003c/a> 传输层，与 \u003ca class=\"wikilink\" data-target=\"tcp\">TCP\u003c/a> 互补而非劣化版。\u003c/p>\n\u003c/div>\n\u003ch2>首部格式\u003c/h2>\n\u003cp>UDP 首部固定 8 字节，无变长选项：\u003c/p>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>字段\u003c/th>\n\u003cth>字节\u003c/th>\n\u003cth>作用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>源端口\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>可选，不需回包可置 0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>目的端口\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>必填，接收方多路复用依据\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>长度\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>首部 + 数据总长，最小 8；\u003cstrong>不表示 IP 层总长度\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>校验和\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>标准强制（现代 OS 默认开启）；失败直接丢弃\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">极简即优势\u003c/div>\u003cp>无序列号、确认、窗口字段 → 首部零协商开销；发方拼好首部即转发，单包延迟仅由链路决定。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">长度字段与 IP 分片\u003c/div>\u003cp>UDP「长度」是原始数据报长度；若 IP 层分片，每个分片里的 IP 总长会小于 UDP 长度，不可混为一谈。\u003c/p>\n\u003c/div>\n\u003cdetails>\u003csummary>展开首部封装图\u003c/summary>\u003cdiv class=\"mermaid\" data-mm-type=\"flowchart\">flowchart TD\n  A[UDP 数据报] --> B[UDP 首部 8B]\n  B --> C[源端口 2B]\n  B --> D[目的端口 2B]\n  B --> E[长度 2B]\n  B --> F[校验和 2B]\n  A --> G[UDP 数据]\n\u003c/div>\n\u003c/details>\u003ch2>核心特点\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>特点\u003c/th>\n\u003cth>含义\u003c/th>\n\u003cth>影响\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>无连接\u003c/td>\n\u003ctd>发前不握手、不维护连接状态\u003c/td>\n\u003ctd>单包独立、延迟最低\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>尽力交付\u003c/td>\n\u003ctd>不保证到达 / 不重 / 有序\u003c/td>\n\u003ctd>无重传、无确认，丢包静默\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>数据报边界\u003c/td>\n\u003ctd>send 一次 ≈ recv 一次\u003c/td>\n\u003ctd>应用层按消息收发，不像 TCP 需自己拆流\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>无拥塞控制\u003c/td>\n\u003ctd>发送速率不随网络状况收敛\u003c/td>\n\u003ctd>网络拥塞时可能批量丢包，需应用层限速\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>无状态\u003c/td>\n\u003ctd>服务端无需保存每连接上下文\u003c/td>\n\u003ctd>易做高并发、可水平扩展，但也易成反射放大源\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">数据报边界 ≠ 可靠\u003c/div>\u003cp>UDP 保留消息边界，但单次 send 超过 MTU 会被 IP 分片；任一片丢失整包作废。大数据走 UDP 仍要应用层做分片 / 确认。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">接收缓冲区截断\u003c/div>\u003cp>\u003ccode>recvfrom\u003c/code> 传入缓冲区小于实际数据报长度时，\u003cstrong>剩余字节被内核静默丢弃\u003c/strong>（Linux / macOS 不报错）。建议缓冲区 ≥ 65535 或用 \u003ccode>MSG_TRUNC\u003c/code> 探测实际长度。\u003c/p>\n\u003c/div>\n\u003ch2>校验和\u003c/h2>\n\u003cul>\n\u003cli>覆盖 \u003cstrong>伪首部 + UDP 首部 + 数据\u003c/strong>；伪首部含源 / 目的 IP、协议号（17）、UDP 长度 → 防错投到错误主机 / 端口。\u003c/li>\n\u003cli>\u003cstrong>标准强制\u003c/strong>：几乎所有现代操作系统默认开启；IPv4 首部虽允许置 0，生产环境极少关闭；\u003cstrong>IPv6 强制\u003c/strong>，为 0 则收端丢弃。\u003c/li>\n\u003cli>检测到差错直接丢弃，不通知发送方（无重传机制）。\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">伪首部不参与传输\u003c/div>\u003cp>伪首部是临时构造、仅用于校验计算，不会真的出现在网络上；它的存在是为了让传输层能验证「IP 层没把包送错地方」。\u003c/p>\n\u003c/div>\n\u003ch2>工程陷阱\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>陷阱\u003c/th>\n\u003cth>后果\u003c/th>\n\u003cth>工程应对\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>IP 分片\u003c/td>\n\u003ctd>任一分片丢失整包作废；中间设备易丢大包\u003c/td>\n\u003ctd>应用层控制单包 &lt; MTU（常用 1400B），或自研分片\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接收缓冲区满\u003c/td>\n\u003ctd>无流量控制，新包直接丢弃\u003c/td>\n\u003ctd>加大 \u003ccode>rmem\u003c/code>、应用层 ACK 反馈、限速\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>反射放大攻击\u003c/td>\n\u003ctd>无状态 + 小请求大响应 → 被利用做 DDoS\u003c/td>\n\u003ctd>源 IP 限速、请求验证、QUIC Retry / Cookie\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>sendto 成功 ≠ 送达\u003c/td>\n\u003ctd>仅进入内核发送队列\u003c/td>\n\u003ctd>应用层回包确认或 QUIC 化\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">大包策略\u003c/div>\u003cp>DNS 响应 &gt; 512B、游戏快照、日志上报等大 UDP 包，优先在应用层拆成 ≤ 1400B；宁可多发几小包，也别触发 IP 分片。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">无状态双刃剑\u003c/div>\u003cp>无状态让服务端高并发扩展容易，也让 NTP / DNS / SSDP 等协议成为反射放大攻击重灾区。对外暴露 UDP 服务必须做源验证与限速。\u003c/p>\n\u003c/div>\n\u003ch2>适用场景\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>选 UDP 的原因\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>实时音视频 / 通话\u003c/td>\n\u003ctd>偶发丢包 &lt; 重传等待，宁可丢帧保流畅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DNS / DHCP / SNMP\u003c/td>\n\u003ctd>单请求单响应、报文短小，握手开销不划算\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>多人在线游戏\u003c/td>\n\u003ctd>高频小包、可容忍少量丢；关键帧重传 + 非关键帧丢弃 + FEC\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>广播 / 多播\u003c/td>\n\u003ctd>TCP 仅点对点，UDP 天然支持一对多\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>QUIC / HTTP3 / RTP\u003c/td>\n\u003ctd>在 UDP 之上自建可靠 / 加密 / 多路复用，见 \u003ca class=\"wikilink\" data-target=\"http\">HTTP\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>VPN / 隧道（WireGuard / IPSec）\u003c/td>\n\u003ctd>基于 UDP 承载加密隧道，规避 TCP 头阻塞，性能优于 TCP 隧道\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">现代趋势\u003c/div>\u003cp>QUIC 把 \u003ca class=\"wikilink\" data-target=\"tcp\">TCP\u003c/a> 的可靠、拥塞、TLS 搬进用户态跑在 UDP 上，规避内核协议栈改造成本，是 HTTP/3 的承载层（见 \u003ca class=\"wikilink\" data-target=\"http\">HTTP\u003c/a> / \u003ca class=\"wikilink\" data-target=\"https\">HTTPS\u003c/a>）；游戏常用 RUDP / FEC（前向纠错）只在关键帧做重传，是「UDP 不可靠但好用」的典型反证。\u003c/p>\n\u003c/div>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(4题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">UDP 如何实现可靠传输？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">UDP 本身不保证可靠；需可靠时由应用层在 UDP 上自建序列号、确认、重传与超时（如 QUIC、RTP+RTCP、游戏自研协议）。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">UDP 有粘包问题吗？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">没有。UDP 保留数据报边界，recvfrom 一次取到完整一个数据报；「粘包」是 TCP 字节流无边界引发的，需应用层自己定界。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">为什么 DNS 用 UDP 而不是 TCP？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">DNS 查询多为单请求单响应、报文 &lt; 512 字节，走 UDP 免握手、延迟低；仅在响应超 512 字节（或区域传送）时回落 TCP。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">UDP Client 一直高速发包，Server 处理不过来会怎样？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">UDP 没有流量控制 / 背压，Server 内核接收缓冲区（\u003ccode>rmem\u003c/code>）满后，后续数据报被\u003cstrong>直接丢弃\u003c/strong>，Client 完全不知 Server 已过载——除非应用层有 ACK 反馈或限速机制。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(4条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：UDP 不可靠 = 没用。实时音视频、DNS、游戏等要低延迟，丢一两包优于等重传，UDP 更合适。\u003c/li>\n\u003cli>误区：UDP 校验和保证可靠。校验和仅检测差错并丢弃，不重传不通知，与可靠性无关。\u003c/li>\n\u003cli>误区：UDP 一定比 TCP 快。小数据单连接时 UDP 省握手确实快；但要做可靠 + 拥塞控制，应用层重写一遍未必比 TCP 高效。\u003c/li>\n\u003cli>误区：UDP \u003ccode>sendto\u003c/code> 成功 = 对端收到。成功只说明数据进入内核发送队列；网络拥堵时中间路由器直接丢弃，发送端无感。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["tcp","computer-networking","http","https"],"excerpt":"UDP 是传输层无连接的「尽力交付」协议：8 字节极简首部、无握手无重传，以数据报为单位发送，适合实时与查询类低延迟场景，对照 TCP 走另一条路线。","featured":"","order":0,"group":1,"groupNum":"Ⅱ","groupName":"架构与系统设计","groupRank":2,"groupLayout":"spread"},"java-collection":{"id":"java-collection","title":"Java Collection","type":"moc","category":"java-collection","file":"notes/java-collection.md","accent":"#1DE9B6","accentInk":"#00A37A","catLabel":"Collections","mtime":"2026-09-05T09:27:18.394Z","html":"\u003ch1>Java Collection\u003c/h1>\n\u003cp>集合框架核心笔记。\u003c/p>\n","links":[],"excerpt":"集合框架核心笔记。","featured":"","order":0,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":1,"groupLayout":"tiles"},"javase":{"id":"javase","title":"JavaSE","type":"moc","category":"javase","file":"notes/javase.md","accent":"#00E676","accentInk":"#00A344","catLabel":"JavaSE","mtime":"2026-09-05T09:27:18.394Z","html":"\u003ch1>JavaSE\u003c/h1>\n\u003cp>Java 语言基础总览：语法、面向对象、常用类库等。Java 集合为其子分类。\u003c/p>\n\u003cul>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"java-collection\">Java Collection\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"基本数据类型\">基本数据类型\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"线程创建\">线程创建\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"静态代理\">静态代理\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"动态代理\">动态代理\u003c/a>\u003c/li>\n\u003c/ul>\n","links":["java-collection","基本数据类型","线程创建","静态代理","动态代理"],"excerpt":"Java 语言基础总览：语法、面向对象、常用类库等。Java 集合为其子分类。","featured":"","order":0,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":0,"groupLayout":"tiles"},"juc":{"id":"juc","title":"JUC","type":"moc","category":"juc","file":"notes/juc.md","accent":"#7C4DFF","accentInk":"#5E35B1","catLabel":"Concurrency","mtime":"2026-09-05T09:27:18.394Z","html":"\u003ch1>JUC\u003c/h1>\n\u003cp>从进程与线程的基本概念、JMM(Java 内存模型)的并发语义,到虚拟线程、线程池的执行工具与锁族同步原语。\u003c/p>\n\u003cul>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"进程与线程\">进程与线程\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"jmm\">JMM\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"虚拟线程\">虚拟线程\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"线程池\">线程池\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"java-锁\">Java 锁\u003c/a>\u003c/li>\n\u003c/ul>\n","links":["进程与线程","jmm","虚拟线程","线程池","java-锁"],"excerpt":"从进程与线程的基本概念、JMM(Java 内存模型)的并发语义,到虚拟线程、线程池的执行工具与锁族同步原语。","featured":"","order":0,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":3,"groupLayout":"tiles"},"jvm":{"id":"jvm","title":"JVM","type":"moc","category":"jvm","file":"notes/jvm.md","accent":"#FF5252","accentInk":"#D32F2F","catLabel":"JVM","mtime":"2026-09-05T09:27:18.394Z","html":"\u003ch1>JVM\u003c/h1>\n\u003cp>内存模型与垃圾回收，以及字节码如何变成可用的 Class 对象。\u003c/p>\n\u003cul>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"类加载\">类加载\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"jvm-运行时数据区\">JVM 运行时数据区\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"jvm-垃圾回收\">JVM 垃圾回收\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"引用计数\">引用计数\u003c/a>\u003c/li>\n\u003c/ul>\n","links":["类加载","jvm-运行时数据区","jvm-垃圾回收","引用计数"],"excerpt":"内存模型与垃圾回收，以及字节码如何变成可用的 Class 对象。","featured":"","order":0,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":2,"groupLayout":"tiles"},"leetcode":{"id":"leetcode","title":"LeetCode","type":"moc","category":"leetcode","file":"notes/leetcode.md","accent":"#FFD600","accentInk":"#F5A600","catLabel":"LeetCode","mtime":"2026-09-05T09:27:18.394Z","html":"\u003ch1>LeetCode\u003c/h1>\n\ ass=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">锁升级 \u003cspan class=\"chain-pill\">核心\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">偏向→轻量→重量\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">编译期优化 \u003cspan class=\"chain-pill\">实战\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">消除/粗化\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>synchronized 是 JVM 内置互斥锁(管程) → 加锁范围决定锁对象 → 自动释放 + 可重入 + 可见性 → 竞争加剧触发锁升级 → 编译期还有锁消除/粗化 → 面试常考升级与对比。\u003c/p>\n\u003c/details>\u003ch2>加锁范围\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>用法\u003c/th>\n\u003cth>锁对象\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>实例方法\u003c/td>\n\u003ctd>\u003ccode>this\u003c/code>(当前实例)\u003c/td>\n\u003ctd>同一实例互斥\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>静态方法\u003c/td>\n\u003ctd>\u003ccode>Class\u003c/code> 对象\u003c/td>\n\u003ctd>类级互斥,所有实例共享\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>同步块 \u003ccode>synchronized(obj)\u003c/code>\u003c/td>\n\u003ctd>指定对象\u003c/td>\n\u003ctd>粒度最细,推荐\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">锁对象选择\u003c/div>\u003cp>锁必须是对所有竞争线程\u003cstrong>同一个\u003c/strong>对象；用 \u003ccode>new Object()\u003c/code> 每次新建或锁 \u003ccode>String\u003c/code> 常量池对象都会失效。字符串字面量进运行时常量池,不同处写 \u003ccode>&quot;x&quot;\u003c/code> 可能是同一把锁,易踩坑——底层见 \u003ca class=\"wikilink\" data-target=\"jvm-运行时数据区\">JVM 运行时数据区\u003c/a> 的「String.intern() 与字符串驻留」。\u003c/p>\n\u003c/div>\n\u003ch2>释放与可重入\u003c/h2>\n\u003cp>三条语义都由同一个结构兑现——\u003cstrong>monitor(管程)\u003c/strong>:JVM 给每个对象配的锁实体,内部记两个字段:\u003cstrong>owner\u003c/strong>(当前持锁线程)、\u003cstrong>重入计数\u003c/strong>(同一线程再进一次就 +1):\u003c/p>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>语义\u003c/th>\n\u003cth>规则\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>可重入\u003c/td>\n\u003ctd>加锁时 owner 已是自己 → 计数 +1 直接进,不重新抢\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>自动释放\u003c/td>\n\u003ctd>退出时计数 -1,\u003cstrong>归零才清 owner、真正放锁\u003c/strong>;正常返回、抛异常都会走到,不会锁泄漏\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可见性\u003c/td>\n\u003ctd>放锁前的写,对随后拿到\u003cstrong>同一把锁\u003c/strong>的线程可见(happens-before 监视器锁规则,见 \u003ca class=\"wikilink\" data-target=\"jmm\">JMM\u003c/a>)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">没有可重入,嵌套调用就自己锁自己\u003c/div>\n\u003cul>\n\u003cli>同步方法调本类另一个同步方法——还是同一把 \u003ccode>this\u003c/code>,自己等自己\u003c/li>\n\u003cli>子类 \u003ccode>synchronized\u003c/code> 方法里调 \u003ccode>super.method()\u003c/code>——锁的还是同一个 \u003ccode>this\u003c/code>\u003c/li>\n\u003c/ul>\n\u003cp>可重入 = 同一线程再进同一把锁只 +1 计数,不重抢。\u003c/p>\n\u003c/div>\n\u003cp>计数怎么走,看一段递归:\u003c/p>\n\u003cfigure class=\"code\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">MathUtil\u003c/span> {\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">synchronized\u003c/span> \u003cspan class=\"hljs-type\">int\u003c/span> \u003cspan class=\"hljs-title function_\">fact\u003c/span>\u003cspan class=\"hljs-params\">(\u003cspan class=\"hljs-type\">int\u003c/span> n)\u003c/span> {   \u003cspan class=\"hljs-comment\">// 每进入一层,同一把锁重入一次:计数 1→2→3→…\u003c/span>\u003c/span>\u003cspan class=\"ln\">        \u003cspan class=\"hljs-keyword\">return\u003c/span> n &lt;= \u003cspan class=\"hljs-number\">1\u003c/span> ? \u003cspan class=\"hljs-number\">1\u003c/span> : n * fact(n - \u003cspan class=\"hljs-number\">1\u003c/span>);\u003c/span>\u003cspan class=\"ln\">    }\u003c/span>\u003cspan class=\"ln\">}\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// 递归回程逐层退出:计数 -1、-1、-1…减到 0 这一刻才真正放锁\u003c/span>\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">6 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cp>「自动释放」由 JVM 在字节码层兑现:一段看似三行的 Java 代码\u003c/p>\n\u003cfigure class=\"code\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">m\u003c/span>\u003cspan class=\"hljs-params\">()\u003c/span> {\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">synchronized\u003c/span> (\u003cspan class=\"hljs-built_in\">this\u003c/span>) {\u003c/span>\u003cspan class=\"ln\">        x++;\u003c/span>\u003cspan class=\"ln\">    }\u003c/span>\u003cspan class=\"ln\">}\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">5 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cp>编译出的字节码骨架(只留锁相关指令,\u003ccode>x++\u003c/code> 本体省略):\u003c/p>\n\u003cfigure class=\"code\" data-lang=\"text\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">TE\u003c/span>\u003cspan class=\"code-lang\">TEXT\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">monitorenter        ← 进入:拿 this 的 monitor,计数 0→1\u003c/span>\u003cspan class=\"ln\">   ...              ← x++ 的字段读写,与锁无关\u003c/span>\u003cspan class=\"ln\">monitorexit         ← 退出 1:正常路径,计数 1→0,放锁\u003c/span>\u003cspan class=\"ln\">goto  RETURN\u003c/span>\u003cspan class=\"ln\">monitorexit         ← 退出 2:异常路径,任何异常先跳到这\u003c/span>\u003cspan class=\"ln\">athrow              ← 放完锁,再把异常抛出去\u003c/span>\u003cspan class=\"ln\">RETURN\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">7 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">两个 \u003ccode>monitorexit\u003c/code> 不是冗余\u003c/div>\n\u003cul>\n\u003cli>编译器不知道 m 会不会抛异常,正常路径、异常路径\u003cstrong>各配一个 exit\u003c/strong>\u003c/li>\n\u003cli>异常表(编译器生成的异常处理器)把任意异常引到第二个 exit:先放锁、再 rethrow——「抛异常也不锁泄漏」的落地位置\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">同步方法为什么没有这两条指令\u003c/div>\n\u003cul>\n\u003cli>锁信息不在指令里,记在方法的访问标志 \u003cstrong>\u003ccode>ACC_SYNCHRONIZED\u003c/code>\u003c/strong> 上(静态方法再叠 \u003ccode>ACC_STATIC\u003c/code>)\u003c/li>\n\u003cli>JVM 调用时读 flag,隐式走「enter → 方法体 → exit」等价流程;返回/抛异常同样保证释放,与同步块底层是同一个 monitor\u003c/li>\n\u003cli>\u003ccode>javap -v\u003c/code> 一眼分辨:有 \u003ccode>monitorenter\u003c/code> = 同步块;没有但带 \u003ccode>ACC_SYNCHRONIZED\u003c/code> = 同步方法\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003ch2>锁升级（JDK 6+）\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>阶段\u003c/th>\n\u003cth>触发\u003c/th>\n\u003cth>实现\u003c/th>\n\u003cth>代价\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>无锁\u003c/td>\n\u003ctd>未竞争\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>最低\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>偏向锁\u003c/td>\n\u003ctd>单线程进入\u003c/td>\n\u003ctd>偏向线程 ID 写入 Mark Word,省 CAS\u003c/td>\n\u003ctd>极低\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>轻量级锁\u003c/td>\n\u003ctd>多线程交替\u003c/td>\n\u003ctd>自旋 CAS 抢锁\u003c/td>\n\u003ctd>低(自旋耗 CPU)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>重量级锁\u003c/td>\n\u003ctd>竞争激烈\u003c/td>\n\u003ctd>操作系统互斥量,线程 park 阻塞\u003c/td>\n\u003ctd>高(上下文切换)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">各阶段在做什么\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>偏向\u003c/strong>:对象头 Mark Word 里记下「这把锁归线程 X」,同一个线程再来连 CAS 都省了;一旦发现第二个线程来抢 → 升级为轻量级。\u003c/li>\n\u003cli>\u003cstrong>轻量级\u003c/strong>:每个线程在自己栈帧里生成「锁记录(Lock Record)」,用 \u003cstrong>CAS\u003c/strong> 把对象头的指针改成自己记录的指针;抢到就干活,抢不到就\u003cstrong>自适应自旋\u003c/strong>几下再试,不立刻 park。\u003c/li>\n\u003cli>\u003cstrong>重量级\u003c/strong>:自旋白烧 CPU 也拿不到,CAS 失败次数超阈值 → 把对象头指针换成指向\u003cstrong>互斥量(mutex)\u003c/strong>;没抢到的线程进\u003cstrong>等待队列\u003c/strong>被 OS 挂起,park / unpark 来回,代价高(用户态 ↔ 内核态切换)。\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">升级不可逆 · 偏向锁已下线\u003c/div>\u003cp>锁只能升级不能降级(批量重偏向/撤销除外)。\u003cstrong>偏向锁在 JDK 15 起默认禁用、JDK 18 起实质移除\u003c/strong>,新版本 \u003ccode>synchronized\u003c/code> 直接走 轻量级→重量级;JDK 8/11 默认开启,可用 \u003ccode>-XX:-UseBiasedLocking\u003c/code> 关闭。升级路径只属于 \u003ccode>synchronized\u003c/code>,基于 \u003ca class=\"wikilink\" data-target=\"aqs\">AQS\u003c/a> 的 \u003ca class=\"wikilink\" data-target=\"reentrantlock\">ReentrantLock\u003c/a> 等无此路径。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">自适应自旋 vs 固定自旋\u003c/div>\u003cp>轻量级阶段的自旋\u003cstrong>次数不写死\u003c/strong>,由 JVM 根据上一次自旋成功率动态调:上次转几圈就拿到 = 这次多转几圈;上次转半天也拿不到 = 这次少转甚至不自旋。目的是让「短临界区」少走重量级路径,「长临界区」别白烧 CPU。\u003c/p>\n\u003c/div>\n\u003ch2>编译期优化\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>锁消除\u003c/strong>：逃逸分析判定变量不逃逸出线程,自动去掉无用锁(如方法内局部 \u003ccode>StringBuffer\u003c/code>)。\u003c/li>\n\u003cli>\u003cstrong>锁粗化\u003c/strong>：连续对同一对象加锁(如循环体内),合并为一次大锁减少开销。\u003c/li>\n\u003c/ul>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(4题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">synchronized 怎么保证释放？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">同步块编译出 \u003ccode>monitorenter\u003c/code> 与两个 \u003ccode>monitorexit\u003c/code>(正常 + 异常路径),同步方法走 \u003ccode>ACC_SYNCHRONIZED\u003c/code>;无论正常还是异常退出 JVM 都会释放,不会锁泄漏。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">锁升级过程？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">无锁→偏向锁(单线程,Mark Word 记线程 ID)→轻量级锁(自旋 CAS)→重量级锁(OS 互斥量,线程 park)。只升不降;注：偏向锁在 JDK 15 后已逐步下线。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">synchronized 能保证可见性吗？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">能。unlock 前的所有写,对随后 lock 同一监视器的线程可见(happens-before 监视器锁规则);但只覆盖加同一把锁的线程,不加锁的线程仍可能读到旧值。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">和 ReentrantLock 比？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">synchronized 自动释放、简单、非公平、不可中断/超时；ReentrantLock 灵活但需手动 unlock。详见 \u003ca class=\"wikilink\" data-target=\"java-锁对比\">Java 锁对比\u003c/a>。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(4条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：synchronized 性能一定差。JDK6 锁升级后低竞争场景开销很小,多数场景与 \u003ca class=\"wikilink\" data-target=\"reentrantlock\">ReentrantLock\u003c/a> 差距可忽略。\u003c/li>\n\u003cli>误区：锁字符串安全。字面量进常量池,不同处写同一个字面量可能意外共享同一把锁(底层见 \u003ca class=\"wikilink\" data-target=\"jvm-运行时数据区\">JVM 运行时数据区\u003c/a> 的字符串驻留)。\u003c/li>\n\u003cli>误区：锁 \u003ccode>Integer\u003c/code> 等包装类没问题。\u003ccode>-128~127\u003c/code> 走缓存且 \u003ccode>i++\u003c/code> 会换新对象,锁会失效;要用专门的锁对象。\u003c/li>\n\u003cli>误区：加了 synchronized 就全局互斥。实例方法锁 \u003ccode>this\u003c/code>、静态方法锁 \u003ccode>Class\u003c/code>,两者互不阻塞;要全局互斥必须锁同一个对象。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["jvm-运行时数据区","jmm","aqs","reentrantlock","java-锁对比"],"excerpt":"synchronized 是 JVM 内置互斥锁(管程) → 加锁范围决定锁对象 → 自动释放 + 可重入 + 可见性 → 竞争加剧触发锁升级 → 编译期还有锁消除/粗化 → 面试常考升级与对比。","featured":"","order":0,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":3,"groupLayout":"tiles"},"volatile":{"id":"volatile","title":"volatile","type":"note","category":"juc","file":"notes/volatile.md","accent":"#7C4DFF","accentInk":"#5E35B1","catLabel":"Concurrency","mtime":"2026-09-05T09:27:18.394Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">可见性 \u003cspan class=\"chain-pill\">核心\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">写回主存/读主存\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">有序性 \u003cspan class=\"chain-pill\">核心\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">内存屏障禁重排\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">原子性 \u003cspan class=\"chain-pill\">边界\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">单次读写 vs 复合\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">适用场景 \u003cspan class=\"chain-pill\">实战\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">标志/双重检查\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>volatile 是变量可见性原语(非锁),可见性与有序性语义由 \u003ca class=\"wikilink\" data-target=\"jmm\">JMM\u003c/a> 定义 → 写立即刷主存、读不缓存 → 内存屏障禁止重排序 → 单次读写原子但复合操作不原子 → 只适合状态标志与双重检查。\u003c/p>\n\u003c/details>\u003ch2>它解决什么\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>问题\u003c/th>\n\u003cth>机制\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>可见性\u003c/td>\n\u003ctd>写后强制刷主内存,读前强制从主内存取,跳过线程工作内存缓存\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>有序性\u003c/td>\n\u003ctd>插入内存屏障(StoreStore/StoreLoad/LoadLoad/LoadStore),禁止编译/CPU 重排序,建立 happens-before\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>原子性\u003c/td>\n\u003ctd>单次读/写 ✅；复合操作(\u003ccode>i++\u003c/code>) ❌\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12
