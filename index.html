\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">✅ 正确范式\u003c/div>\u003cp>先提交事务（afterCommit）→ 再删缓存。必须提前删时，用 1s TTL 兜底，否则回滚会留下脏缓存。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">❌ 反模式：先删缓存再更新 DB\u003c/div>\u003cp>删后、提交前如有并发读，会回填旧值；DB 虽已更新，缓存却长期为旧。严禁使用。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout important\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/>\u003c/svg>重点\u003c/div>\u003cdiv class=\"callout-sub\">残留风险\u003c/div>\u003cp>更新 DB 后、删缓存前并发读仍可能回填旧值 → 叠加延迟双删或 TTL 兜底。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"mermaid\" data-mm-type=\"sequenceDiagram\">sequenceDiagram\n    participant C as 客户端\n    participant A as 应用\n    participant DB as DB\n    participant R as Redis\n    C->>A: 写请求\n    A->>DB: 更新数据\n    A->>R: 删除缓存\n    Note right of R: 删前若有并发读，可能回填旧值(脏窗口)\n    Note over A,R: 正确范式&lt;br/>事务提交后再删(afterCommit)\n\u003c/div>\n\u003ch2>延迟双删（Cache-Aside 的并发补丁）\u003c/h2>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">定位\u003c/div>\u003cp>不是独立策略，只是 Cache-Aside 的并发回填补丁：更新 DB 后延时再删一次，清掉并发读回填的旧值。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">首次删除 \u003cspan class=\"chain-pill\">清当前值\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">更新 DB 后立刻删\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">延时等待 \u003cspan class=\"chain-pill\">让并发读落地\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">P99 读耗时 + 主从延迟\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">二次删除 \u003cspan class=\"chain-pill\">清回填旧值\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">异步再删一次\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>项\u003c/th>\n\u003cth>做法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>延时 T\u003c/td>\n\u003ctd>\u003ccode>P99 读耗时 + 主从延迟 + 100ms\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>二次删除\u003c/td>\n\u003ctd>异步执行（MQ 延迟消息），不阻塞主流程\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>⚠️ 二次仍失败\u003c/td>\n\u003ctd>不阻塞主线程，回退短 TTL + 补偿队列补删\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>Read / Write-Through\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>模式\u003c/th>\n\u003cth>行为\u003c/th>\n\u003cth>职责归属\u003c/th>\n\u003cth>关键注意\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Read-Through\u003c/td>\n\u003ctd>读 miss 由缓存层自动回源回填\u003c/td>\n\u003ctd>缓存层代理\u003c/td>\n\u003ctd>业务无感知\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Write-Through\u003c/td>\n\u003ctd>写同步写缓存 + DB\u003c/td>\n\u003ctd>缓存层代理\u003c/td>\n\u003ctd>代码层强依赖，但 ≠ 分布式线性一致\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cache-Aside\u003c/td>\n\u003ctd>读 miss 业务回源；写更新 DB + 删缓存\u003c/td>\n\u003ctd>业务代码\u003c/td>\n\u003ctd>灵活、代码侵入\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">分布式强一致？\u003c/div>\u003cp>Write-Through 的同步阻塞 ≠ 线性一致。除非同一本地事务（如单机 JTA），否则缓存与 DB 间仍有极小提交时序 / 写失败窗口。真要分布式强一致需 TCC 等，代价极高，不建议让缓存参与。\u003c/p>\n\u003c/div>\n\u003ch2>Write-Behind\u003c/h2>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">写请求 \u003cspan class=\"chain-pill\">立即返回\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">只更缓存并记变更日志\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">定时 flush \u003cspan class=\"chain-pill\">异步\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">批量拉取并合并落库\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">清缓冲 \u003cspan class=\"chain-pill\">失败下轮重放\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">落库成功才删 pending\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>要点\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>一致性\u003c/td>\n\u003ctd>最终一致\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>性能来源\u003c/td>\n\u003ctd>写路径不同步落库，只记缓存/日志\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>幂等\u003c/td>\n\u003ctd>落库必须幂等，失败日志可下轮重放\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>风险\u003c/td>\n\u003ctd>宕机可能丢未落库数据，仅用于可丢失场景\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>多实例\u003c/td>\n\u003ctd>分布式锁防重复 flush\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>binlog 订阅\u003c/h2>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">DB 变更 \u003cspan class=\"chain-pill\">源头\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">binlog 落盘\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">解析投递 \u003cspan class=\"chain-pill\">解耦\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">Canal / Maxwell 转消息\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">消费失效 \u003cspan class=\"chain-pill\">落地\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">异步删或更新缓存\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>特性\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>优势\u003c/td>\n\u003ctd>与业务解耦，多写入口统一保证，近强一致\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>代价\u003c/td>\n\u003ctd>引入中间件与消息链路，需处理丢失 / 乱序 / 延迟\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>兜底机制\u003c/h2>\n\u003cp>缓存异常通常归为 \u003ca class=\"wikilink\" data-target=\"缓存击穿\">缓存击穿\u003c/a>、\u003ca class=\"wikilink\" data-target=\"缓存穿透\">缓存穿透\u003c/a>、\u003ca class=\"wikilink\" data-target=\"缓存雪崩\">缓存雪崩\u003c/a> 三类；下表机制分别对症下药，全部再叠加短 TTL 兜底。\u003c/p>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>机制\u003c/th>\n\u003cth>作用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>短 TTL\u003c/td>\n\u003ctd>遗漏失效 / 失败最终靠过期重建，窗口收敛到 TTL\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>空值缓存\u003c/td>\n\u003ctd>防 \u003ca class=\"wikilink\" data-target=\"缓存穿透\">缓存穿透\u003c/a>：查不到也写 null + 短 TTL，挡住反复 miss 的无效回源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>布隆过滤器\u003c/td>\n\u003ctd>在入口拦截不存在的 key，零 DB 开销（与空值缓存常叠加）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>失效失败重试 / 补偿\u003c/td>\n\u003ctd>删缓存失败 → 重试 3 次（指数退避）→ 仍失败投递补偿队列（MQ）或记失败日志，定时任务扫表补偿；极端情况靠短 TTL 兜底，不无限重试阻塞主线程\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>fail-open 降级\u003c/td>\n\u003ctd>缓存异常不抛业务异常：读降级直查 DB、写放弃缓存\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>一致性级别与选型\u003c/h2>\n\u003cdiv class=\"mermaid\" data-mm-type=\"flowchart\">flowchart TD\n    A[数据不一致业务代价?] -->|大| B[强一致]\n    A -->|小| C{读多写少?}\n    B --> B1[写不频繁 → Write-Through]\n    B --> B2[多写入口/解耦 → binlog订阅]\n    B --> B3[写频繁 → 放弃缓存，直查DB/从库]\n    B3 --> B3n[缓存解决读多写少；写频繁+强一致硬上缓存一致性方案，每次写仍压垮DB且缓存意义不大]\n    C -->|是| D[Cache-Aside + TTL]\n    C -->|高频可丢| E[Write-Behind]\n    D --> D1[并发回填风险高 → 叠加延迟双删补丁]\n\u003c/div>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(4题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">先删缓存还是先更新 DB？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">先更新 DB，再删缓存。反过来（先删缓存后更 DB）时，删完到提交前的并发读会把旧值回填进缓存，DB 虽已更新，缓存却长期为旧——这是明确的反模式。更稳的做法是事务提交后（afterCommit）再删。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">为什么是删除缓存而不是更新缓存？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">更新缓存要组装完整缓存对象，代价高且容易失败；更要命的是「写 DB 成功 → 更新缓存失败」会留下永久脏数据。删除则让下次读自然回填，失败最多是一次 cache miss。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">Cache-Aside 下怎么尽可能减少脏数据？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">三层叠加——事务提交后再删缓存（afterCommit）；并发回填风险高时加延迟双删；无论怎样都配短 TTL 作为最后兜底，把不一致窗口收敛到 TTL 长度。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">Write-Through 能保证强一致吗？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">不能。它只是把「写缓存 + 写 DB」同步阻塞在同一调用里，除非二者在同一本地事务中，否则仍存在提交时序与部分失败的窗口。真正的分布式强一致需要 TCC 之类的方案，代价极高，不建议让缓存参与。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(3条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：分布式锁防超卖 = 缓存一致性。锁解决的是 DB 并发写，缓存失效是另一件事，二者正交。\u003c/li>\n\u003cli>误区：缓存必须永远等于 DB。接受短暂不一致 + TTL 兜底，比追求瞬时一致稳健得多。\u003c/li>\n\u003cli>误区：只删缓存就够了。必须配合 TTL / 延迟双删 / 失败重试，单靠一次删除兜不住并发回填与删除失败。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["缓存击穿","缓存穿透","缓存雪崩"],"excerpt":"缓存与 DB 在某个窗口内必然不一致，按一致性要求分级处理；全部配 TTL 兜底。","featured":"","order":0,"group":1,"groupNum":"Ⅱ","groupName":"架构与系统设计","groupRank":1,"groupLayout":"spread"},"缓存击穿":{"id":"缓存击穿","title":"缓存击穿","type":"note","category":"system-design","file":"notes/缓存击穿.md","accent":"#FF6D00","accentInk":"#C43E00","catLabel":"System Design","mtime":"2026-09-05T09:27:18.395Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">现象定义 \u003cspan class=\"chain-pill\">区分\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">单热点 key 击穿\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">成因与危害 \u003cspan class=\"chain-pill\">核心\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">并发重建打 DB\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">解法全景 \u003cspan class=\"chain-pill\">策略\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">互斥/逻辑过期/预热\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">三场景对比 \u003cspan class=\"chain-pill\">关联\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">见 MOC\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>击穿 = 某个被高频访问的热点 key 在失效瞬间，大量并发请求同时 miss → 同时回源 DB 重建，压垮单条数据查询。它与 \u003ca class=\"wikilink\" data-target=\"缓存雪崩\">缓存雪崩\u003c/a>、\u003ca class=\"wikilink\" data-target=\"缓存穿透\">缓存穿透\u003c/a> 同属缓存引发的典型异常，差异只在「失效范围」：雪崩是一片、穿透是无此物、击穿是单点。\u003c/p>\n\u003c/details>\u003ch2>现象定义\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>概念\u003c/th>\n\u003cth>触发\u003c/th>\n\u003cth>受影响范围\u003c/th>\n\u003cth>根因\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>缓存击穿\u003c/td>\n\u003ctd>单个热点 key 失效\u003c/td>\n\u003ctd>单点\u003c/td>\n\u003ctd>热点 key 并发重建\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>缓存雪崩\u003c/td>\n\u003ctd>大量 key 同时过期 / 宕机\u003c/td>\n\u003ctd>大面积\u003c/td>\n\u003ctd>过期集中或缓存层不可用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>缓存穿透\u003c/td>\n\u003ctd>查不存在的 key\u003c/td>\n\u003ctd>单点\u003c/td>\n\u003ctd>key 不存在，无缓存可命中\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout important\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/>\u003c/svg>重点\u003c/div>\u003cdiv class=\"callout-sub\">心法\u003c/div>\u003cp>击穿是「一个热点失效、千军万马回源」。锁住重建、或让旧值续命，核心是「同一时刻只回源一次」。\u003c/p>\n\u003c/div>\n\u003ch2>成因与危害\u003c/h2>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">热点 key \u003cspan class=\"chain-pill\">挂了\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">超高并发访问\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">TTL 到点 \u003cspan class=\"chain-pill\">同时回源\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">瞬间全 miss\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">无合并 \u003cspan class=\"chain-pill\">单查询被打爆\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">每个请求各查一次 DB\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>成因\u003c/th>\n\u003cth>典型场景\u003c/th>\n\u003cth>危害\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>热点 key 突增 + 到期\u003c/td>\n\u003ctd>大 V 商品、首页爆款\u003c/td>\n\u003ctd>单 SQL 被并发放大\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>无回源合并\u003c/td>\n\u003ctd>每个线程各自查 DB\u003c/td>\n\u003ctd>DB 连接 / CPU 飙升\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>重建慢\u003c/td>\n\u003ctd>复杂查询 / 远程调用\u003c/td>\n\u003ctd>等待期间请求堆积\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>解法全景\u003c/h2>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">互斥重建 \u003cspan class=\"chain-pill\">合并回源\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">锁/单飞\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">逻辑过期 \u003cspan class=\"chain-pill\">不阻塞读\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">异步续期\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">热点预热 \u003cspan class=\"chain-pill\">抗峰\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">提前加载\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方案\u003c/th>\n\u003cth>做法\u003c/th>\n\u003cth>防什么\u003c/th>\n\u003cth>代价\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>互斥锁 / singleflight\u003c/td>\n\u003ctd>同一 key 只放一个请求回源，其余等待复用\u003c/td>\n\u003ctd>并发重建\u003c/td>\n\u003ctd>等待线程占用连接\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>逻辑过期\u003c/td>\n\u003ctd>value 内嵌过期时间，过期后异步重建，返回旧值\u003c/td>\n\u003ctd>重建期间击穿\u003c/td>\n\u003ctd>短暂返回旧数据\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>热点 key 预热\u003c/td>\n\u003ctd>预估热点提前加载、长 TTL\u003c/td>\n\u003ctd>冷启动击穿\u003c/td>\n\u003ctd>需预判\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>永不过期 + 异步刷新\u003c/td>\n\u003ctd>物理 TTL 不设，靠后台任务刷新\u003c/td>\n\u003ctd>任意时间点击穿\u003c/td>\n\u003ctd>内存占用、一致性弱\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">互斥 vs 逻辑过期\u003c/div>\u003cp>互斥锁实现简单、数据新鲜，但并发等待占用资源；逻辑过期读不阻塞、可用性高，但会短暂返回旧值。二者可叠加：先查到逻辑过期 → 触发异步重建 → 返回旧值。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">singleflight 实现要点\u003c/div>\u003cp>首个线程拿到锁并查 DB 回填，其余线程 \u003ccode>await\u003c/code> 同一结果；重建失败要放行下一个重试，避免「锁内失败、大家一起饿死」。\u003c/p>\n\u003c/div>\n\u003ch2>三场景对比\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>异常\u003c/th>\n\u003cth>治的是\u003c/th>\n\u003cth>核心手段\u003c/th>\n\u003cth>详见\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ca class=\"wikilink\" data-target=\"缓存击穿\">缓存击穿\u003c/a>\u003c/td>\n\u003ctd>一点（单热点失效）\u003c/td>\n\u003ctd>互斥重建 / 逻辑过期\u003c/td>\n\u003ctd>本篇\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca class=\"wikilink\" data-target=\"缓存穿透\">缓存穿透\u003c/a>\u003c/td>\n\u003ctd>无此物（key 不存在）\u003c/td>\n\u003ctd>布隆过滤器 / 空值缓存\u003c/td>\n\u003ctd>查的 key 在 DB 里也没有\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca class=\"wikilink\" data-target=\"缓存雪崩\">缓存雪崩\u003c/a>\u003c/td>\n\u003ctd>一片（集中失效 / 宕机）\u003c/td>\n\u003ctd>错峰 TTL / 多级缓存 / 熔断\u003c/td>\n\u003ctd>失效范围最大\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">一眼区分\u003c/div>\u003cp>三者的差异只在\u003cstrong>失效范围\u003c/strong>：击穿是「一个热点没了」，穿透是「压根没这个东西」，雪崩是「一整片同时没了」。先判断范围，再选手段——把击穿当雪崩治、盲目上多级缓存，是常见的过度设计。\u003c/p>\n\u003c/div>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(3题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">缓存击穿和缓存雪崩区别？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">击穿是单个热点 key 失效、并发回源单条数据；雪崩是大量 key 同时失效或缓存层整体不可用，影响面更大。击穿用互斥重建 / 逻辑过期，雪崩用错峰 TTL + 熔断。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">怎么解决缓存击穿？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">互斥锁 / singleflight 合并回源；或逻辑过期（过期后异步重建、返回旧值）；热点 key 提前预热并给长 TTL。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">逻辑过期和物理过期区别？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">物理过期由 Redis 直接删除，过期瞬间可能击穿；逻辑过期值里自带过期时间，Redis 不删，读时判断是否过期并异步刷新，读不阻塞但可能命中旧值。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(3条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：击穿 = 雪崩，解法一样。击穿是单点，靠互斥即可，不必上多级缓存。\u003c/li>\n\u003cli>误区：加锁会导致超时。锁只保护回源，且 singleflight 合并，等待方不重复查 DB。\u003c/li>\n\u003cli>误区：不设 TTL 最省事。永不过期需后台刷新兜底，否则一致性与内存双输。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["缓存雪崩","缓存穿透","缓存击穿"],"excerpt":"单个热点 key 失效瞬间，大量并发请求同时打到 DB 重建；用互斥锁 / singleflight / 逻辑过期保护。与雪崩、穿透并称缓存三大异常。","featured":"","order":0,"group":1,"groupNum":"Ⅱ","groupName":"架构与系统设计","groupRank":1,"groupLayout":"spread"},"缓存穿透":{"id":"缓存穿透","title":"缓存穿透","type":"note","category":"system-design","file":"notes/缓存穿透.md","accent":"#FF6D00","accentInk":"#C43E00","catLabel":"System Design","mtime":"2026-09-05T09:27:18.395Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">现象定义 \u003cspan class=\"chain-pill\">区分\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">key 根本不存在\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">成因与危害 \u003cspan class=\"chain-pill\">核心\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">每次都打 DB\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">解法全景 \u003cspan class=\"chain-pill\">策略\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">四层防御体系\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">三场景对比 \u003cspan class=\"chain-pill\">关联\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">见 MOC\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>穿透 = 查询的 key 在缓存和 DB 中都不存在，缓存无法命中、也无法回填有效值，每次请求都穿透到 DB。它与 \u003ca class=\"wikilink\" data-target=\"缓存雪崩\">缓存雪崩\u003c/a>、\u003ca class=\"wikilink\" data-target=\"缓存击穿\">缓存击穿\u003c/a> 同属缓存引发的典型异常，差异只在「失效范围」：雪崩是一片、击穿是单点、穿透是无此物。\u003c/p>\n\u003c/details>\u003ch2>现象定义\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>概念\u003c/th>\n\u003cth>触发\u003c/th>\n\u003cth>受影响范围\u003c/th>\n\u003cth>根因\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>缓存穿透\u003c/td>\n\u003ctd>查不存在的 key\u003c/td>\n\u003ctd>单点\u003c/td>\n\u003ctd>key 本身不存在，无缓存可命中\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>缓存击穿\u003c/td>\n\u003ctd>单个热点 key 失效\u003c/td>\n\u003ctd>单点\u003c/td>\n\u003ctd>热点 key 失效 + 高并发重建\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>缓存雪崩\u003c/td>\n\u003ctd>大量 key 同时过期 / 宕机\u003c/td>\n\u003ctd>大面积\u003c/td>\n\u003ctd>过期集中或缓存层不可用\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout important\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/>\u003c/svg>重点\u003c/div>\u003cdiv class=\"callout-sub\">心法\u003c/div>\u003cp>穿透的本质是「查一个永远 miss 的 key」。解法不是优化缓存命中，而是「要么提前知道它没有，要么别让请求到达 DB」。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">边界：冷启动不是穿透\u003c/div>\u003cp>冷数据首查 miss 后从 DB 回填（Cache-Aside），仅一次查询、回填即命中 → 属预热缺失。穿透是 key 在 DB 也不存在，无法回填、反复落 DB。\u003c/p>\n\u003c/div>\n\u003ch2>成因与危害\u003c/h2>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">恶意/id 错误 \u003cspan class=\"chain-pill\">刷不存在 id\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">非法参数或爬虫\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">缓存无此键 \u003cspan class=\"chain-pill\">每查必落 DB\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">永不命中\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">DB 也无 \u003cspan class=\"chain-pill\">资源被无意义消耗\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">无值可回填\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>成因\u003c/th>\n\u003cth>典型场景\u003c/th>\n\u003cth>危害\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>业务异常参数\u003c/td>\n\u003ctd>错误 id / 越权查询\u003c/td>\n\u003ctd>无意义 DB 查询激增\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>恶意爬虫 / 攻击\u003c/td>\n\u003ctd>随机不存在 key 扫库\u003c/td>\n\u003ctd>DB 被打满\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>解法全景\u003c/h2>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">入口拦截 \u003cspan class=\"chain-pill\">防恶意\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">校验+限流\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">前置过滤 \u003cspan class=\"chain-pill\">挡大部分\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">布隆过滤器\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">事后兜底 \u003cspan class=\"chain-pill\">补误判\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">空值缓存\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">终极熔断 \u003cspan class=\"chain-pill\">防打死\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">DB 限流降级\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>层级\u003c/th>\n\u003cth>方案\u003c/th>\n\u003cth>做法\u003c/th>\n\u003cth>防什么\u003c/th>\n\u003cth>代价\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第一层（入口拦截）\u003c/td>\n\u003ctd>参数校验 + 限流\u003c/td>\n\u003ctd>格式/范围/权限拦截 + 单 IP 频次限制\u003c/td>\n\u003ctd>非法请求与恶意扫库到达 DB\u003c/td>\n\u003ctd>业务侵入、误伤正常用户\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第二层（前置过滤）\u003c/td>\n\u003ctd>布隆过滤器\u003c/td>\n\u003ctd>所有合法 key 预置 bitmap，不存在直接拒绝\u003c/td>\n\u003ctd>绝大多数不存在 key 落 DB（零 DB 开销）\u003c/td>\n\u003ctd>需维护、有误判（删不了）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第三层（事后兜底）\u003c/td>\n\u003ctd>空值缓存\u003c/td>\n\u003ctd>查不到也写 \u003ccode>null\u003c/code> + 短 TTL\u003c/td>\n\u003ctd>布隆误判与漏网请求重复查 DB\u003c/td>\n\u003ctd>短暂内存浪费、可能缓存穿透窗口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第四层（终极熔断）\u003c/td>\n\u003ctd>DB 限流/降级\u003c/td>\n\u003ctd>resilience4j / Hystrix 兜底\u003c/td>\n\u003ctd>DB 被打死\u003c/td>\n\u003ctd>需引入熔断组件\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">布隆过滤器还是空值缓存？\u003c/div>\u003cp>布隆过滤器在「入口」拦截，零 DB 查询，但需预置且有误判（说存在不一定存在）；空值缓存在「查完之后」兜底，实现简单但每次首次仍落 DB。生产常两者叠加：布隆挡大部分，空值兜底误判与边界。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">布隆过滤器 \u003cspan class=\"chain-pill\">拦截\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">说「没有」直接返回\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">查缓存 \u003cspan class=\"chain-pill\">未命中\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">布隆说「有」才查\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">查 DB \u003cspan class=\"chain-pill\">也为空\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">缓存 miss 回源\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">写空值 \u003cspan class=\"chain-pill\">兜底\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">null + 短 TTL\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>四层按「入口 → 缓存 → DB → 空值兜底」的顺序层层递进，前一层拦不住的才落到下一层。\u003c/p>\n\u003cdiv class=\"callout info\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>信息\u003c/div>\u003cdiv class=\"callout-sub\">布隆过滤器怎么维护（面试官常追问）\u003c/div>\n\u003cul>\n\u003cli>定期全量重建：每天凌晨跑 Job 重建 Bitmap（最简单、工业级常见）。\u003c/li>\n\u003cli>RedisBloom 模块：支持动态扩容，免手动重建。\u003c/li>\n\u003cli>替代结构：布谷鸟过滤器（Cuckoo Filter）支持删除。\u003c/li>\n\u003cli>误判影响：误判只会让个别本不存在的 key 穿透到 DB，由空值缓存兜底——布隆 + 空值是黄金搭档，不必过度担心误判。\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">空值缓存的坑\u003c/div>\u003cp>空值 TTL 要短（如 1~5min），否则大量不存在 key 长期占用内存；且必须序列化为特殊占位符（如 \u003ccode>&quot;NULL&quot;\u003c/code>），避免和业务正常空字符串混淆。\n进阶：按 key 动态性设 TTL——恶意随机 ID（如 \u003ccode>userId=-1\u003c/code>）TTL 极短（30s）并限频；业务边界值（如未上架商品 ID）TTL 稍长（10min）。\u003c/p>\n\u003c/div>\n\u003ch2>三场景对比\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>异常\u003c/th>\n\u003cth>治的是\u003c/th>\n\u003cth>核心手段\u003c/th>\n\u003cth>详见\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ca class=\"wikilink\" data-target=\"缓存穿透\">缓存穿透\u003c/a>\u003c/td>\n\u003ctd>无此物（key 不存在）\u003c/td>\n\u003ctd>布隆过滤器 / 空值缓存\u003c/td>\n\u003ctd>本篇\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca class=\"wikilink\" data-target=\"缓存击穿\">缓存击穿\u003c/a>\u003c/td>\n\u003ctd>一点（单热点失效）\u003c/td>\n\u003ctd>互斥重建 / 逻辑过期\u003c/td>\n\u003ctd>查的 key 存在，只是刚过期\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca class=\"wikilink\" data-target=\"缓存雪崩\">缓存雪崩\u003c/a>\u003c/td>\n\u003ctd>一片（集中失效 / 宕机）\u003c/td>\n\u003ctd>错峰 TTL / 多级缓存 / 熔断\u003c/td>\n\u003ctd>失效范围最大\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">一眼区分\u003c/div>\u003cp>三者的差异只在\u003cstrong>失效范围\u003c/strong>：穿透是「压根没这个东西」，击穿是「一个热点没了」，雪崩是「一整片同时没了」。穿透加分布式锁是典型错配——查不存在的 key 根本没有可合并的回源。\u003c/p>\n\u003c/div>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(4题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">缓存穿透怎么解决？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">布隆过滤器在入口拦截不存在的 key；查不到也缓存空值并设短 TTL 兜底；再加接口参数校验与限流。三者常叠加。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">布隆过滤器有什么缺点？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">有误判率（说存在不一定真存在，说不存在一定不存在），且不支持删除。需要定期重建或用布谷鸟过滤器支持删除。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">空值缓存会不会撑爆内存？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">会，如果大量不存在 key 都缓存 null。所以空值 TTL 要短，且生产优先用布隆过滤器在入口拦截，空值只兜底层。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">怎么区分是穿透攻击还是正常业务？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">监控 DB 的 qps 与缓存命中率。若大量查询的 key 具备「随机性」（UUID 或自增 ID 跳跃）且 DB 返回空结果集比例飙升，基本可判定为穿透攻击，需触发布隆过滤器重建或加 IP 黑名单。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(3条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：穿透 = 击穿，都加锁。穿透查的是「无此物」，锁无用；加分布式锁不仅无效，锁竞争反而加剧 DB 压力，纯属负优化。要靠过滤 / 空值。\u003c/li>\n\u003cli>误区：布隆过滤器万能。有误判、不支持删除，需配合空值兜底。\u003c/li>\n\u003cli>误区：不缓存 null。不缓存会导致每次穿透落 DB，必须缓存空值或在入口拦截。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["缓存雪崩","缓存击穿","缓存穿透"],"excerpt":"请求查根本不存在的 key，缓存与 DB 都没有，每次都穿透到 DB；用布隆过滤器、空值缓存、参数校验拦截。与雪崩、击穿并称缓存三大异常。","featured":"","order":0,"group":1,"groupNum":"Ⅱ","groupName":"架构与系统设计","groupRank":1,"groupLayout":"spread"},"缓存穿透、击穿与雪崩":{"id":"缓存穿透、击穿与雪崩","title":"缓存穿透、击穿与雪崩","type":"moc","category":"system-design","file":"notes/缓存穿透、击穿与雪崩.md","accent":"#FF6D00","accentInk":"#C43E00","catLabel":"System Design","mtime":"2026-09-05T09:27:18.395Z","html":"\u003ch1>缓存穿透、击穿与雪崩\u003c/h1>\n\u003cp>缓存三类异常本质都是「缓存层失效、请求落到 DB」。它们不是三个独立问题，而是\u003cstrong>同一个处理过程里、失效范围由小到大的三阶\u003c/strong>：\u003c/p>\n\u003cblockquote>\n\u003cp>一个请求进来 → 缓存救不救得了你？\u003c/p>\n\u003col>\n\u003cli>数据根本不存在 → \u003cstrong>穿透\u003c/strong>（缓存管不了）\u003c/li>\n\u003cli>单热点瞬间失效 → \u003cstrong>击穿\u003c/strong>（同一 key 并发回源）\u003c/li>\n\u003cli>大量 key 同时失效 / 缓存层宕机 → \u003cstrong>雪崩\u003c/strong>（整片塌方）\u003c/li>\n\u003c/ol>\n\u003c/blockquote>\n\u003cdiv class=\"callout important\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/>\u003c/svg>重点\u003c/div>\u003cdiv class=\"callout-sub\">排序口诀\u003c/div>\u003cp>\u003cstrong>穿透 → 击穿 → 雪崩\u003c/strong>：从「数据问题」到「时间问题」再到「规模问题」；\n解法也从「入口拦截 → 单点合并 → 整体防护」逐级升级。三者都建立在「缓存是可丢弃的加速层」前提上。\u003c/p>\n\u003c/div>\n\u003ch2>关系图\u003c/h2>\n\u003cdiv class=\"mermaid\" data-mm-type=\"flowchart\">flowchart LR\n  A[缓存层失效] --> B[穿透: key 不存在]\n  A --> C[击穿: 单热点失效]\n  A --> D[雪崩: 一片 key 失效]\n  B --> B1[布隆 / 空值 / 校验]\n  C --> C1[singleflight / 逻辑过期]\n  D --> D1[错峰 TTL / 熔断 / 多级缓存]\n\u003c/div>\n\u003cul>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"缓存穿透\">缓存穿透\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"缓存击穿\">缓存击穿\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"缓存雪崩\">缓存雪崩\u003c/a>\u003c/li>\n\u003c/ul>\n","links":["缓存穿透","缓存击穿","缓存雪崩"],"excerpt":"缓存三类异常：穿透（无此物）、击穿（单点瞬时）、雪崩（一片失效）。同属「缓存层救不了 DB」的不同尺度，按失效范围递增排列。","featured":"","order":0,"group":1,"groupNum":"Ⅱ","groupName":"架构与系统设计","groupRank":1,"groupLayout":"spread"},"缓存雪崩":{"id":"缓存雪崩","title":"缓存雪崩","type":"note","category":"system-design","file":"notes/缓存雪崩.md","accent":"#FF6D00","accentInk":"#C43E00","catLabel":"System Design","mtime":"2026-09-05T09:27:18.395Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">现象定义 \u003cspan class=\"chain-pill\">区分\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">大量 key 同时失效\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">成因与危害 \u003cspan class=\"chain-pill\">核心\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">瞬时 DB 压力\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">解法全景 \u003cspan class=\"chain-pill\">策略\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">错峰/多级/降级/预热\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">三场景对比 \u003cspan class=\"chain-pill\">关联\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">见 MOC\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>雪崩 = 大量 key 集中过期或缓存层整体不可用 → 请求穿透到 DB，DB 被打垮。它与 \u003ca class=\"wikilink\" data-target=\"缓存击穿\">缓存击穿\u003c/a>、\u003ca class=\"wikilink\" data-target=\"缓存穿透\">缓存穿透\u003c/a> 同属缓存引发的典型异常，差异只在「失效范围」：击穿是单点、穿透是无此物、雪崩是一片。\u003c/p>\n\u003c/details>\u003ch2>现象定义\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>概念\u003c/th>\n\u003cth>触发场景\u003c/th>\n\u003cth>影响范围\u003c/th>\n\u003cth>根因\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>缓存雪崩\u003c/td>\n\u003ctd>大量 key 同时过期 / Redis 宕机\u003c/td>\n\u003ctd>大面积\u003c/td>\n\u003ctd>过期时间集中或缓存层不可用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>缓存击穿\u003c/td>\n\u003ctd>单个热点 key 失效\u003c/td>\n\u003ctd>单点\u003c/td>\n\u003ctd>热点 key 并发重建\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>缓存穿透\u003c/td>\n\u003ctd>查不存在的 key\u003c/td>\n\u003ctd>单点\u003c/td>\n\u003ctd>key 本身不存在，无缓存可命中\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout important\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/>\u003c/svg>重点\u003c/div>\u003cdiv class=\"callout-sub\">心法\u003c/div>\u003cp>雪崩的本质不是「某个 key 丢了」，而是「同一时刻丢一片」或「缓存层整体失效」。解法核心：别让失效/不可用同时发生，即便发生也要兜底不打垮 DB。\u003c/p>\n\u003c/div>\n\u003ch2>成因与危害\u003c/h2>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">集中设置 TTL \u003cspan class=\"chain-pill\">同时过期\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">同一批写入\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">热点聚集 \u003cspan class=\"chain-pill\">峰值叠加\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">促销 / 零点\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">缓存层宕机 \u003cspan class=\"chain-pill\">全量 miss\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">内存满 / 网络分区\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">连锁恶化 \u003cspan class=\"chain-pill\">正反馈\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">响应变慢 → 重试加压\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>成因\u003c/th>\n\u003cth>典型场景\u003c/th>\n\u003cth>危害\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>批量 key 同 TTL\u003c/td>\n\u003ctd>定时任务批量回写缓存、统一过期\u003c/td>\n\u003ctd>到点后请求全落 DB\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>时钟漂移 / 批量刷新\u003c/td>\n\u003ctd>服务重启后统一预热\u003c/td>\n\u003ctd>集中重建\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>缓存层不可用\u003c/td>\n\u003ctd>宕机 / 网络割裂\u003c/td>\n\u003ctd>全量回源\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">DB 连锁恶化\u003c/div>\u003cp>雪崩时 DB 被打满 → 响应变慢 → 业务线程堆积 → 超时重试 → 进一步加压，形成正反馈，最终拖垮整个系统而非单库。\u003c/p>\n\u003c/div>\n\u003ch2>解法全景\u003c/h2>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">错峰过期 \u003cspan class=\"chain-pill\">预防\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">加随机抖动\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">熔断降级 \u003cspan class=\"chain-pill\">兜底\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">限流/降级\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">预热与容量 \u003cspan class=\"chain-pill\">抗峰\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">提前加载\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方案\u003c/th>\n\u003cth>做法\u003c/th>\n\u003cth>防什么\u003c/th>\n\u003cth>代价\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>错峰 TTL\u003c/td>\n\u003ctd>基础 TTL + 随机 jitter（如 ±5min）\u003c/td>\n\u003ctd>集中过期\u003c/td>\n\u003ctd>几乎无\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>二级缓存\u003c/td>\n\u003ctd>本地缓存 + Redis，本地兜底\u003c/td>\n\u003ctd>Redis 宕机\u003c/td>\n\u003ctd>一致性稍弱\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>熔断 / 限流\u003c/td>\n\u003ctd>DB 侧限流、熔断，超出拒绝或降级\u003c/td>\n\u003ctd>DB 被打垮\u003c/td>\n\u003ctd>部分请求失败\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>缓存预热\u003c/td>\n\u003ctd>启动 / 大促前主动加载热点\u003c/td>\n\u003ctd>冷启动峰值\u003c/td>\n\u003ctd>需预判热点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>高可用\u003c/td>\n\u003ctd>Redis 主从 + 哨兵 / 集群，避免单点不可用\u003c/td>\n\u003ctd>缓存层整体失效\u003c/td>\n\u003ctd>运维成本\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">最划算的两招\u003c/div>\u003cp>错峰 TTL（随机过期）几乎零成本，先上；再叠加缓存层高可用（主从/集群）兜底整体失效。其余按需。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">关于「互斥重建」\u003c/div>\u003cp>互斥锁 / singleflight 是「同一个 key 并发回源」的合并手段，本质是 \u003ca class=\"wikilink\" data-target=\"缓存击穿\">缓存击穿\u003c/a> 的解法（单点并发重建）。雪崩场景下同一时刻丢一片 key，但每个 key 通常只是被自身请求回源一次，单飞收益小、实现复杂度高，不列为核心方案；只有「雪崩撞上热点击穿」时才叠加使用。\u003c/p>\n\u003c/div>\n\u003ch2>三场景对比\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>异常\u003c/th>\n\u003cth>治的是\u003c/th>\n\u003cth>核心手段\u003c/th>\n\u003cth>详见\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ca class=\"wikilink\" data-target=\"缓存雪崩\">缓存雪崩\u003c/a>\u003c/td>\n\u003ctd>一片（集中失效 / 宕机）\u003c/td>\n\u003ctd>错峰 TTL / 多级缓存 / 熔断\u003c/td>\n\u003ctd>本篇\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca class=\"wikilink\" data-target=\"缓存击穿\">缓存击穿\u003c/a>\u003c/td>\n\u003ctd>一点（单热点失效）\u003c/td>\n\u003ctd>互斥重建 / 逻辑过期\u003c/td>\n\u003ctd>失效范围最小，单点即可搞定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca class=\"wikilink\" data-target=\"缓存穿透\">缓存穿透\u003c/a>\u003c/td>\n\u003ctd>无此物（key 不存在）\u003c/td>\n\u003ctd>布隆过滤器 / 空值缓存\u003c/td>\n\u003ctd>与过期无关，锁和错峰都无效\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">一眼区分\u003c/div>\u003cp>三者的差异只在\u003cstrong>失效范围\u003c/strong>：雪崩是「一整片同时没了」，击穿是「一个热点没了」，穿透是「压根没这个东西」。范围判断错了，手段必然错配——用互斥锁防雪崩，挡不住缓存层整体宕机。\u003c/p>\n\u003c/div>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(3题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">缓存雪崩和缓存击穿的区别？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">雪崩是大量 key 同时失效或缓存层整体不可用，影响面大；击穿是单个热点 key 失效，大量并发打到同一数据。前者靠错峰 TTL + 熔断，后者靠 mutex/singleflight。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">怎么预防缓存雪崩？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">基础 TTL 加随机抖动避免集中过期；缓存层做高可用（主从/集群），本地缓存兜底整体宕机；DB 侧限流熔断保护；大促前预热热点。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">Redis 真的挂了怎么办？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">多级缓存（本地兜底）+ 熔断降级，读降级直查 DB 并限流，避免请求雪崩冲击 DB；Redis 恢复后靠 TTL 自然重建。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(3条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：只给 key 设 TTL 就够了。同步批量写入会导致同时过期，须加随机抖动。\u003c/li>\n\u003cli>误区：雪崩 = 击穿，解法一样。雪崩是「一片」、击穿是「一点」，前者需错峰，后者需互斥。\u003c/li>\n\u003cli>误区：加互斥锁一定好。锁保护热点重建，但解决不了「缓存层整体宕机」，还需多级缓存 + 降级。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["缓存击穿","缓存穿透","缓存雪崩"],"excerpt":"大量 key 同时过期或缓存层不可用导致请求直击 DB；靠错峰 TTL、多级缓存、熔断降级与预热收敛。与击穿、穿透并称缓存三大异常，差异在失效范围。","featured":"","order":0,"group":1,"groupNum":"Ⅱ","groupName":"架构与系统设计","groupRank":1,"groupLayout":"spread"},"虚拟线程":{"id":"虚拟线程","title":"虚拟线程","type":"note","category":"juc","file":"notes/虚拟线程.md","accent":"#7C4DFF","accentInk":"#5E35B1","catLabel":"Concurrency","mtime":"2026-09-05T09:27:18.395Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">平台线程对比 \u003cspan class=\"chain-pill\">定位\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">本质差异\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">调度原理 \u003cspan class=\"chain-pill\">核心\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">为什么轻量\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">创建方式 \u003cspan class=\"chain-pill\">落地\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">两种 API\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">适用场景 \u003cspan class=\"chain-pill\">决策\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">何时该用\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>JDK 21 正式引入（JEP 444）的轻量线程 → 与平台线程的本质差异 → 载体线程与自动让出的调度原理 → 两种创建 API → 按任务类型选型 → 面试问答复盘。\u003c/p>\n\u003c/details>\u003ch2>平台线程 vs 虚拟线程\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>对比项\u003c/th>\n\u003cth>平台线程\u003c/th>\n\u003cth>虚拟线程\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>底层载体\u003c/td>\n\u003ctd>每个线程 = 一个 OS 线程\u003c/td>\n\u003ctd>JVM 对象，映射到少量 OS「载体线程」\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>栈\u003c/td>\n\u003ctd>固定（常 1MB），受内存上限\u003c/td>\n\u003ctd>动态，可百万级同存\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>创建 / 销毁\u003c/td>\n\u003ctd>走内核，开销大\u003c/td>\n\u003ctd>纯用户态，近普通对象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>阻塞代价\u003c/td>\n\u003ctd>占住 OS 线程，白白等\u003c/td>\n\u003ctd>自动让出载体，去跑别的任务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>调度者\u003c/td>\n\u003ctd>OS 调度器\u003c/td>\n\u003ctd>JVM 调度器\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>状态 API\u003c/td>\n\u003ctd>全状态可见\u003c/td>\n\u003ctd>只报 NEW / RUNNABLE / TERMINATED\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">与线程创建的关系\u003c/div>\u003cp>平台线程怎么生出来、任务体怎么写见 \u003ca class=\"wikilink\" data-target=\"线程创建\">线程创建\u003c/a>——虚拟线程仍以 \u003ccode>Thread\u003c/code> 表达任务体，只是不再一任务一 OS 线程。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">定位\u003c/div>\u003cp>面向 \u003cstrong>IO 密集 + 海量任务\u003c/strong>（每请求一线程模型）的解法：让「线程数」不再是瓶颈。CPU 密集与重度锁争用场景没有收益，见下。\u003c/p>\n\u003c/div>\n\u003ch2>调度原理\u003c/h2>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">轻量来自「阻塞不占坑」\u003c/div>\u003cp>平台线程阻塞在 IO / \u003ccode>park\u003c/code> 上会占住 OS 线程；虚拟线程阻塞时 JVM 把它\u003cstrong>摘下（unmount）载体\u003c/strong>，载体立刻转去执行别的虚拟线程——这就是上万虚拟线程只靠几十个载体线程的真相。\u003c/p>\n\u003c/div>\n\u003cdetails>\u003csummary>展开挂载示意\u003c/summary>\u003cdiv class=\"mermaid\" data-mm-type=\"flowchart\">flowchart LR\n    subgraph JVM[\"JVM 内\"]\n        V1[虚拟线程 A] --> C1[载体线程 1]\n        V2[虚拟线程 B] --> C1\n        V3[虚拟线程 C] --> C2[载体线程 2]\n        V4[虚拟线程 D] --> C2\n        V5[... 数千虚拟线程]\n    end\n    C1 -.阻塞时自动换挂.-> V3\n    C2 -.阻塞时自动换挂.-> V5\n\u003c/div>\n\u003c/details>\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">pinning：synchronized 会让载体被钉住\u003c/div>\u003cp>虚拟线程在 \u003ccode>synchronized\u003c/code> 块内阻塞时，载体被该线程\u003cstrong>钉住（pinned）\u003c/strong>，无法让出——JDK 21 仍如此。高争用或长阻塞的临界区用 \u003ccode>ReentrantLock\u003c/code>（不 pin）；JDK 24 起（JEP 491）才解除 synchronized 钉住。\u003c/p>\n\u003c/div>\n\u003ch2>创建方式\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>API\u003c/th>\n\u003cth>形态\u003c/th>\n\u003cth>适合\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>Thread.ofVirtual().start(task)\u003c/code>\u003c/td>\n\u003ctd>单个虚拟线程\u003c/td>\n\u003ctd>少量 / 组合结构\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Executors.newVirtualThreadPerTaskExecutor()\u003c/code>\u003c/td>\n\u003ctd>每任务一线程的 ExecutorService\u003c/td>\n\u003ctd>批量 IO 任务，替代 \u003ccode>new Thread\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">别再套线程池参数\u003c/div>\u003cp>虚拟线程按任务即建即弃，\u003cstrong>不需要 core / max / 队列\u003c/strong>；给它配池参数反而违背设计。默认 \u003ccode>newVirtualThreadPerTaskExecutor\u003c/code> 已够，吞吐由任务量自然撑起。\u003c/p>\n\u003c/div>\n\u003cfigure class=\"code\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// 方式一：单线程\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">Thread\u003c/span> \u003cspan class=\"hljs-variable\">vt\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> Thread.ofVirtual().name(\u003cspan class=\"hljs-string\">&quot;fetch-&quot;\u003c/span>).start(() -&gt; doIO());\u003c/span>\u003cspan class=\"ln\"> \u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// 方式二：每任务一线程（推荐，批量 IO 场景）\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-keyword\">try\u003c/span> (\u003cspan class=\"hljs-type\">var\u003c/span> \u003cspan class=\"hljs-variable\">executor\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> Executors.newVirtualThreadPerTaskExecutor()) {\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">for\u003c/span> (String url : urls) {\u003c/span>\u003cspan class=\"ln\">        executor.submit(() -&gt; fetch(url));   \u003cspan class=\"hljs-comment\">// 一万个 URL = 一万个虚拟线程\u003c/span>\u003c/span>\u003cspan class=\"ln\">    }\u003c/span>\u003cspan class=\"ln\">} \u003cspan class=\"hljs-comment\">// try-with-resources 自动关闭并等待全部完成\u003c/span>\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">9 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">关闭语义\u003c/div>\u003cp>\u003ccode>newVirtualThreadPerTaskExecutor\u003c/code> 实现 \u003ccode>AutoCloseable\u003c/code>，try 块结束即 \u003ccode>close()\u003c/code>（等待已提交任务完成后关闭），退出机制干净，无 shutdown 噩梦。\u003c/p>\n\u003c/div>\n\u003ch2>适用场景\u003c/h2>\n\u003cdiv class=\"branch\">\u003cdiv class=\"branch-stem\">\u003cdiv class=\"branch-step\">\u003cspan class=\"branch-num\">01\u003c/span>\u003cdiv class=\"branch-body\">\u003cdiv class=\"branch-t\">任务类型\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"branch-link-v\">\u003cspan>触发\u003c/span>\u003c/div>\u003cdiv class=\"branch-step\">\u003cspan class=\"branch-num\">02\u003c/span>\u003cdiv class=\"branch-body\">\u003cdiv class=\"branch-t\">按特征分流\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"branch-join\">\u003c/div>\u003cdiv class=\"branch-fan\">\u003c/div>\u003cdiv class=\"branch-grid\">\u003cdiv class=\"branch-card\">\u003cdiv class=\"branch-h\">IO 密集 + 海量并发\u003c/div>\u003cdiv class=\"branch-b\">虚拟线程\u003c/div>\u003cspan class=\"branch-tag\">每请求一线程\u003c/span>\u003c/div>\u003cdiv class=\"branch-card\">\u003cdiv class=\"branch-h\">CPU 密集\u003c/div>\u003cdiv class=\"branch-b\">平台线程 + 池\u003c/div>\u003cspan class=\"branch-tag\">无收益，虚拟线程不加算力\u003c/span>\u003c/div>\u003cdiv class=\"branch-card\">\u003cdiv class=\"branch-h\">高争用 synchronized\u003c/div>\u003cdiv class=\"branch-b\">先换 ReentrantLock\u003c/div>\u003cspan class=\"branch-tag\">避免 pinning\u003c/span>\u003c/div>\u003cdiv class=\"branch-card\">\u003cdiv class=\"branch-h\">有界资源（DB 连接 / 下游限流）\u003c/div>\u003cdiv class=\"branch-b\">信号量限流\u003c/div>\u003cspan class=\"branch-tag\">虚拟线程不解决资源上限\u003c/span>\u003c/div>\u003cdiv class=\"branch-card\">\u003cdiv class=\"branch-h\">延迟敏感小任务\u003c/div>\u003cdiv class=\"branch-b\">平台线程池\u003c/div>\u003cspan class=\"branch-tag\">虚拟线程调度有额外开销\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">有界资源仍需限流\u003c/div>\u003cp>虚拟线程消除了线程数上限，但\u003cstrong>连接池 / 下游 QPS 上限还在\u003c/strong>。无脑开万级并发打 DB 或第三方，等于把雪崩从「线程 OOM」挪到「打爆下游」。用 \u003ca class=\"wikilink\" data-target=\"java-锁对比\">Java 锁对比\u003c/a> 里的 Semaphore 共享同步器对比,或池本身做反压。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">结合点\u003c/div>\u003cp>线程池的调参与拒绝策略适用于\u003cstrong>平台线程\u003c/strong>（\u003ca class=\"wikilink\" data-target=\"线程池创建\">线程池创建\u003c/a>）；虚拟线程把「并发度」从池参数里解放出来，改由资源限流决定。\u003c/p>\n\u003c/div>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(4题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">虚拟线程和平台线程的本质区别？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">平台线程一线程一 OS 线程、栈固定约 1MB，数量受内存限制；虚拟线程是 JVM 管理的轻量对象，映射到少量载体线程，阻塞时自动摘下让出载体，因此能支撑百万级并发任务，创建销毁也远便宜。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">虚拟线程为什么能扛那么多并发？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">关键在「阻塞不占坑」。IO / park 阻塞时 JVM 把虚拟线程从载体上摘下，载体立刻执行别的虚拟线程，OS 线程数量保持在几十个量级，不再随任务数线性增长。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">什么场景用虚拟线程，什么场景不用？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">用：IO 密集、海量并发任务（HTTP 调用、DB 访问、每请求一线程的服务）。不用：CPU 密集计算（不加算力反增调度开销）、高争用 synchronized（pinning 钉住载体），有界资源场景必须额外限流。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">有了虚拟线程还需要线程池吗？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">需要。虚拟线程适合「任务数大、各自阻塞」的形态；CPU 密集、需排队限流的场景仍用平台线程池（\u003ca class=\"wikilink\" data-target=\"threadpoolexecutor\">ThreadPoolExecutor\u003c/a>）。且虚拟线程不解决下游资源上限，DB / 第三方调用仍要信号量或连接池反压。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(3条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：虚拟线程能提高 CPU 密集任务吞吐。它不加算力，密集计算场景收益约等于零，还有调度开销。\u003c/li>\n\u003cli>误区：虚拟线程数量随便开。并发数受下游资源约束，无界打 IO 是把雪崩从本地线程转移到远端服务。\u003c/li>\n\u003cli>误区：synchronized 也能放心用在虚拟线程里。阻塞时 pinning 钉住载体线程，JDK 21 仍如此；临界区优先 ReentrantLock。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["线程创建","java-锁对比","线程池创建","threadpoolexecutor"],"excerpt":"JDK 21 正式引入（JEP 444）的轻量线程 → 与平台线程的本质差异 → 载体线程与自动让出的调度原理 → 两种创建 API → 按任务类型选型 → 面试问答复盘。","featured":"","order":0,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":3,"groupLayout":"tiles"},"computer-networking":{"id":"computer-networking","title":"Computer Networking","type":"moc","category":"network","file":"notes/计算机网络.md","accent":"#00B0FF","accentInk":"#0081CB","catLabel":"Network","mtime":"2026-09-05T09:27:18.395Z","html":"\u003ch1>Computer Networking\u003c/h1>\n\u003cp>分层模型、传输层协议（TCP / UDP）与应用层协议（HTTP / HTTPS）等网络基础。不绑定具体项目，可被任意分布式 / 后端经历笔记引用。\u003c/p>\n\u003cul>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"tcp\">TCP\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"udp\">UDP\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"http\">HTTP\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"https\">HTTPS\u003c/a>\u003c/li>\n\u003c/ul>\n","links":["tcp","udp","http","https"],"excerpt":"分层模型、传输层协议（TCP / UDP）与应用层协议（HTTP / HTTPS）等网络基础。不绑定具体项目，可被任意分布式 / 后端经历笔记引用。","featured":"","order":0,"group":1,"groupNum":"Ⅱ","groupName":"架构与系统设计","groupRank":2,"groupLayout":"spread"},"进程与线程":{"id":"进程与线程","title":"进程与线程","type":"note","category":"juc","file":"notes/进程与线程.md","accent":"#7C4DFF","accentInk":"#5E35B1","catLabel":"Concurrency","mtime":"2026-09-05T09:27:18.395Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">资源视角对比 \u003cspan class=\"chain-pill\">本质分野\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">地址空间 / 开销\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">调度与并发 \u003cspan class=\"chain-pill\">核心\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">谁被调度\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">通信方式 \u003cspan class=\"chain-pill\">实战\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">IPC vs 共享内存\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">适用场景 \u003cspan class=\"chain-pill\">决策落地\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">多进程还是多线程\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>进程是资源分配的最小单位，线程是 CPU 调度的最小单位 → 由此推出地址空间、开销、通信的根本差异 → 线程间共享内存、进程间走 IPC → 按崩溃隔离 / 共享需求选型 → 面试问答复盘。\u003c/p>\n\u003c/details>\u003ch2>一句话定义\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>维度\u003c/th>\n\u003cth>进程 Process\u003c/th>\n\u003cth>线程 Thread\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>本质\u003c/td>\n\u003ctd>\u003cstrong>资源分配\u003c/strong>的最小单位\u003c/td>\n\u003ctd>\u003cstrong>CPU 调度\u003c/strong>的最小单位\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>地址空间\u003c/td>\n\u003ctd>独立，互不可见\u003c/td>\n\u003ctd>同进程内共享同一地址空间\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>包含关系\u003c/td>\n\u003ctd>一个进程可有多个线程\u003c/td>\n\u003ctd>线程必须隶属于某个进程\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">一个好记的比喻\u003c/div>\u003cp>进程是\u003cstrong>工厂\u003c/strong>（独立厂房、资源边界），线程是\u003cstrong>流水线工人\u003c/strong>（共享厂房里的设备与原料，各自干活）。工厂之间搬东西要走正式的物流（IPC），工人之间直接递工具（共享内存）。\u003c/p>\n\u003c/div>\n\u003c
