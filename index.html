ss=\"chain-pill\">核心\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">tryAcquire→入队→park\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">模板方法 \u003cspan class=\"chain-pill\">扩展点\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">tryAcquire/Release\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">独占/共享 \u003cspan class=\"chain-pill\">模式\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">两种模式\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>AQS(AbstractQueuedSynchronizer)是 JUC 同步器基石 → 用 volatile int state + CLH 队列变体 → 抢锁失败入队 park、释放时 unpark 后继 → 子类只重写 tryAcquire/tryRelease → 支撑 \u003ca class=\"wikilink\" data-target=\"reentrantlock\">ReentrantLock\u003c/a>、Semaphore、CountDownLatch。\u003c/p>\n\u003c/details>\u003ch2>核心结构\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>组件\u003c/th>\n\u003cth>作用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>volatile int state\u003c/code>\u003c/td>\n\u003ctd>同步状态(0=未占用,&gt;0=重入次数/许可数),CAS 修改\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>同步队列\u003c/td>\n\u003ctd>CLH 队列\u003cstrong>变体\u003c/strong>:双向 Node 队列,抢锁失败线程 park 入队\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>head / tail\u003c/td>\n\u003ctd>队列头尾指针,head 是&quot;当前持锁&quot;的哨兵节点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Node.waitStatus\u003c/code>\u003c/td>\n\u003ctd>CANCELLED(1 已取消) / SIGNAL(-1 需唤醒后继) / CONDITION(-2 在条件队列) / PROPAGATE(-3 共享传播)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">为什么是 CLH 变体\u003c/div>\u003cp>经典 CLH 是\u003cstrong>单向 + 自旋\u003c/strong>;AQS 改成\u003cstrong>双向(加 prev 指针) + park/unpark\u003c/strong>。加 prev 才能处理节点取消与中断出队,改 park 才不至于空烧 CPU。\u003c/p>\n\u003c/div>\n\u003ch2>获取流程\u003c/h2>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">tryAcquire \u003cspan class=\"chain-pill\">快路径\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">抢 state\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">addWaiter \u003cspan class=\"chain-pill\">入队\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">失败包装 Node 入队尾\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">acquireQueued \u003cspan class=\"chain-pill\">阻塞\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">前驱是 head 才再抢,否则 park\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">release \u003cspan class=\"chain-pill\">出队\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">unpark 后继,被唤醒者接替\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cdetails>\u003csummary>展开获取流程图\u003c/summary>\u003cdiv class=\"mermaid\" data-mm-type=\"flowchart\">flowchart TD\n  A([acquire]) --> B{tryAcquire 成功}\n  B -->|是| Z([持有锁返回])\n  B -->|否| C[addWaiter 包装成 Node 入队尾]\n  C --> D{前驱是 head 且 tryAcquire 成功}\n  D -->|是| E[setHead 出队]\n  E --> Z\n  D -->|否| F[shouldParkAfterFailedAcquire 前驱置 SIGNAL]\n  F --> G[LockSupport.park 挂起]\n  G --> D\n\u003c/div>\n\u003c/details>\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">自旋很克制\u003c/div>\u003cp>入队后不是无脑自旋:\u003ccode>acquireQueued\u003c/code> 只在\u003cstrong>前驱是 head\u003c/strong> 时才再试一次 tryAcquire,否则 park 挂起,等前驱释放时 unpark。\u003c/p>\n\u003c/div>\n\u003ch2>底层原语：LockSupport\u003c/h2>\n\u003cblockquote>\n\u003cp>AQS 的挂起/唤醒\u003cstrong>全部\u003c/strong>走 LockSupport,它就是 AQS 的 \u003ccode>Thread.sleep\u003c/code> 替代品——能精确唤醒、能脱离 monitor、能被中断。\u003c/p>\n\u003c/blockquote>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>API\u003c/th>\n\u003cth>行为\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>park()\u003c/code> / \u003ccode>park(Object blocker)\u003c/code>\u003c/td>\n\u003ctd>有许可就消耗并返回,否则阻塞;带 blocker 的版本让 \u003ccode>jstack\u003c/code> 能看到阻塞对象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>parkNanos\u003c/code> / \u003ccode>parkUntil\u003c/code>\u003c/td>\n\u003ctd>带超时,线程进入 \u003ccode>TIMED_WAITING\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>unpark(Thread t)\u003c/code>\u003c/td>\n\u003ctd>给指定线程补 1 个许可(上限 1,不累积)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>getBlocker\u003c/code>\u003c/td>\n\u003ctd>读回 blocker,诊断用\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">许可是二元的,不是计数器\u003c/div>\u003cp>只有 0 和 1 两态：连着 \u003ccode>unpark\u003c/code> 5 次再 \u003ccode>park\u003c/code>,只放行 1 次,多出的被丢弃。\u003c/p>\n\u003c/div>\n\u003ch3>park vs wait vs suspend\u003c/h3>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>维度\u003c/th>\n\u003cth>LockSupport\u003c/th>\n\u003cth>Object.wait / notify\u003c/th>\n\u003cth>Thread.suspend / resume\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>需不需要持锁\u003c/td>\n\u003ctd>❌\u003c/td>\n\u003ctd>✅ 必须在 synchronized 内\u003c/td>\n\u003ctd>❌\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>唤醒目标\u003c/td>\n\u003ctd>精确指定线程\u003c/td>\n\u003ctd>notify 随机 / notifyAll 全体\u003c/td>\n\u003ctd>指定线程\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可先于阻塞调用\u003c/td>\n\u003ctd>✅ 先 unpark 不丢失\u003c/td>\n\u003ctd>❌ 先 notify 后 wait 信号丢失\u003c/td>\n\u003ctd>❌ 先 resume 永久挂起\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中断响应\u003c/td>\n\u003ctd>直接返回,\u003cstrong>不抛异常\u003c/strong>\u003c/td>\n\u003ctd>抛 \u003ccode>InterruptedException\u003c/code>\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>现状\u003c/td>\n\u003ctd>推荐\u003c/td>\n\u003ctd>配合 \u003ca class=\"wikilink\" data-target=\"synchronized\">synchronized\u003c/a> 仍可用\u003c/td>\n\u003ctd>已废弃(易死锁)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">park 会虚假唤醒\u003c/div>\u003cp>正确姿势是 \u003ccode>while (!canAcquire()) LockSupport.park(this);\u003c/code>,必须循环判条件。AQS 的 \u003ccode>acquireQueued\u003c/code> 就是这么写的。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">中断不抛异常,标记要自己查\u003c/div>\u003cp>被中断唤醒时 park 直接返回,中断标记被置上但\u003cstrong>不抛异常\u003c/strong>。调用方要么用 \u003ccode>Thread.interrupted()\u003c/code> 检测后处理,要么明确忽略——否则上层 \u003ccode>lockInterruptibly\u003c/code> 这类中断语义失效。\u003c/p>\n\u003c/div>\n\u003ch3>在 AQS 中的落点\u003c/h3>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>环节\u003c/th>\n\u003cth>调用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>入队后挂起\u003c/td>\n\u003ctd>\u003ccode>shouldParkAfterFailedAcquire\u003c/code> 把前驱置为 \u003ccode>SIGNAL\u003c/code> → \u003ccode>LockSupport.park(this)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>释放时唤醒\u003c/td>\n\u003ctd>\u003ccode>unparkSuccessor\u003c/code> 找 head 之后的有效节点 → \u003ccode>LockSupport.unpark(s.thread)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>取消/中断出队\u003c/td>\n\u003ctd>\u003ccode>cancelAcquire\u003c/code> 修正前后指针,唤醒仍交给 unpark\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">为什么 AQS 不用 wait/notify\u003c/div>\u003cp>两条硬伤:wait 要求先持有 monitor,而 AQS 的阻塞恰发生在\u003cstrong>不持任何 monitor\u003c/strong> 的路径上;notify 无法精确唤醒队列里某一个后继。\u003c/p>\n\u003c/div>\n\u003ch2>模板方法（子类重写）\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>模式\u003c/th>\n\u003cth>方法\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>独占\u003c/td>\n\u003ctd>\u003ccode>tryAcquire\u003c/code> / \u003ccode>tryRelease\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>共享\u003c/td>\n\u003ctd>\u003ccode>tryAcquireShared\u003c/code> / \u003ccode>tryReleaseShared\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>判断\u003c/td>\n\u003ctd>\u003ccode>isHeldExclusively\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">实现者只需写 try* 方法\u003c/div>\u003cp>入队、park/unpark、CAS 改 state、取消与中断处理等复杂逻辑已由 AQS 实现；子类只定义「如何获取/释放 state」。\u003c/p>\n\u003c/div>\n\u003ch2>两种模式\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>独占\u003c/strong>：同一时刻一个线程持有。例：\u003ca class=\"wikilink\" data-target=\"reentrantlock\">ReentrantLock\u003c/a>、ReentrantReadWriteLock 的写锁。\u003c/li>\n\u003cli>\u003cstrong>共享\u003c/strong>：多个线程可同时持有。例：\u003ca class=\"wikilink\" data-target=\"reentrantreadwritelock\">ReentrantReadWriteLock\u003c/a> 的读锁、共享同步器(见 \u003ca class=\"wikilink\" data-target=\"java-锁对比\">Java 锁对比\u003c/a>)。\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">共享模式会传播\u003c/div>\u003cp>共享释放走 \u003ccode>doReleaseShared\u003c/code> + \u003ccode>setHeadAndPropagate\u003c/code>,唤醒是\u003cstrong>级联\u003c/strong>的(唤醒一个后继后继续向后传播),保证多个等待者一起被放行,而不是一次只放一个。\u003c/p>\n\u003c/div>\n\u003ch2>Condition：第二条队列\u003c/h2>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">ConditionObject 是独立的条件队列\u003c/div>\u003cp>\u003ccode>await()\u003c/code> 会\u003cstrong>完全释放锁\u003c/strong>并把节点移入条件队列;\u003ccode>signal()\u003c/code> 把节点从条件队列移回同步队列重新排队抢锁。这就是 \u003ca class=\"wikilink\" data-target=\"reentrantlock\">ReentrantLock\u003c/a> 能有多个等待集、而 \u003ca class=\"wikilink\" data-target=\"synchronized\">synchronized\u003c/a> 只有一个等待集的原因。\u003c/p>\n\u003c/div>\n\u003ch2>依赖 AQS 的组件\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>组件\u003c/th>\n\u003cth>模式\u003c/th>\n\u003cth>state 语义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ca class=\"wikilink\" data-target=\"reentrantlock\">ReentrantLock\u003c/a>\u003c/td>\n\u003ctd>独占\u003c/td>\n\u003ctd>重入次数\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"%E5%86%99\">[ReentrantReadWriteLock]\u003c/a>\u003c/td>\n\u003ctd>独占\u003c/td>\n\u003ctd>读/写锁各占 16 位\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"%E8%AF%BB\">[ReentrantReadWriteLock]\u003c/a>\u003c/td>\n\u003ctd>共享\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>共享同步器(Semaphore / CountDownLatch / CyclicBarrier)\u003c/td>\n\u003ctd>共享\u003c/td>\n\u003ctd>见 \u003ca class=\"wikilink\" data-target=\"java-锁对比\">Java 锁对比\u003c/a> 共享同步器一节\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">state 语义由子类定义\u003c/div>\u003cp>AQS 只提供存储与 CAS,不解释含义——同一个 \u003ccode>int\u003c/code>,在锁里是重入次数、在信号量里是许可数、在门闩里是计数值,差别全在子类重写的 \u003ccode>try*\u003c/code> 方法里。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">理解锁的底层\u003c/div>\u003cp>上层锁的「公平/非公平」「可中断」「Condition」都源于 AQS 的队列与 state 管理；看不懂锁行为时回到 AQS。横向对比见 \u003ca class=\"wikilink\" data-target=\"java-锁对比\">Java 锁对比\u003c/a>。\u003c/p>\n\u003c/div>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(3题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">AQS 怎么实现阻塞？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">抢锁失败线程被包装成 Node 入 CLH 队列变体,\u003ccode>shouldParkAfterFailedAcquire\u003c/code> 把前驱置为 SIGNAL 后调用 \u003ccode>LockSupport.park()\u003c/code> 挂起；持有线程释放时 \u003ccode>unpark\u003c/code> 唤醒后继节点。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">state 为什么用 volatile？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">保证 state 的可见性,且配合 CAS 实现无锁原子修改,是 AQS 正确性的基础。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">公平锁和非公平锁在 AQS 上差在哪？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">只差一行判断——公平实现在 tryAcquire 前先调 \u003ccode>hasQueuedPredecessors()\u003c/code> 确认前面没人排队;非公平实现跳过检查直接 CAS 抢,所以能插队(barging)、吞吐更高。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(3条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：AQS 队列就是经典 CLH。经典 CLH 单向自旋,AQS 是双向 + park 的变体,多了 prev 指针才能处理取消与中断。\u003c/li>\n\u003cli>误区：state 就是&quot;锁重入次数&quot;。语义由子类定义,可以是重入数、许可数、门闩计数。\u003c/li>\n\u003cli>误区：公平性由 AQS 保证。AQS 只提供 \u003ccode>hasQueuedPredecessors()\u003c/code>,查不查取决于子类;\u003ccode>ReentrantLock\u003c/code> 的非公平实现就是故意不查。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["reentrantlock","synchronized","reentrantreadwritelock","java-锁对比"],"excerpt":"AQS(AbstractQueuedSynchronizer)是 JUC 同步器基石 → 用 volatile int state + CLH 队列变体 → 抢锁失败入队 park、释放时 unpark 后继 → 子类只重写 tryAcquire/tryRelease → 支撑 ReentrantLock、Semaph…","featured":"","order":0,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":3,"groupLayout":"tiles"},"architecture":{"id":"architecture","title":"Architecture","type":"moc","category":"architecture","file":"notes/Architecture.md","accent":"#FF6D00","accentInk":"#C43E00","catLabel":"Architecture","mtime":"2026-09-05T09:27:18.393Z","html":"\u003ch1>Architecture\u003c/h1>\n\u003cp>软件架构与分层设计：经典三层架构的职责切分、层间解耦与演进方向。\u003c/p>\n\u003cul>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"经典三层架构\">经典三层架构\u003c/a>\u003c/li>\n\u003c/ul>\n","links":["经典三层架构"],"excerpt":"软件架构与分层设计：经典三层架构的职责切分、层间解耦与演进方向。","featured":"","order":0,"group":1,"groupNum":"Ⅱ","groupName":"架构与系统设计","groupRank":0,"groupLayout":"spread"},"cas-与原子类":{"id":"cas-与原子类","title":"CAS 与原子类","type":"note","category":"juc","file":"notes/CAS 与原子类.md","accent":"#7C4DFF","accentInk":"#5E35B1","catLabel":"Concurrency","mtime":"2026-09-05T09:27:18.393Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">CAS 原理 \u003cspan class=\"chain-pill\">核心\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">比较并交换\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">原子类 \u003cspan class=\"chain-pill\">用法\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">Unsafe/VarHandle+CAS\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">ABA \u003cspan class=\"chain-pill\">坑点\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">版本戳解决\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">代价与优化 \u003cspan class=\"chain-pill\">优化\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">自旋/LongAdder\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>CAS 是比较并交换的 CPU 原子指令 → 原子类(AtomicInteger 等)封装 Unsafe+CAS → 存在 ABA 与自旋问题 → 高竞争用 LongAdder 等优化。\u003c/p>\n\u003c/details>\u003ch2>CAS 原理\u003c/h2>\n\u003cpre>\u003ccode>旧值 = 读; 新值 = f(旧值);\nif (内存值 == 预期旧值) 内存值 = 新值; else 重试;\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>由 CPU 指令保证原子性(x86 是 \u003ccode>LOCK CMPXCHG\u003c/code>;ARM 靠 LL/SC 指令对 + 独占监视器)。\u003c/li>\n\u003cli>失败则自旋重试,直到成功或无界循环(实际代码要设重试上限或退避)。\u003c/li>\n\u003c/ul>\n\u003ch2>原子类\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>类\u003c/th>\n\u003cth>用途\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>AtomicInteger / AtomicLong\u003c/td>\n\u003ctd>原子计数\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AtomicReference\u003cT>\u003c/td>\n\u003ctd>原子引用对象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AtomicIntegerArray\u003c/td>\n\u003ctd>数组元素原子更新\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AtomicStampedReference\u003c/td>\n\u003ctd>带版本戳,解决 ABA\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AtomicMarkableReference\u003c/td>\n\u003ctd>带布尔标记,只关心&quot;是否被改过&quot;\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>LongAdder / DoubleAdder\u003c/td>\n\u003ctd>分桶累加,高并发计数\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"code mini\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">AtomicInteger\u003c/span> \u003cspan class=\"hljs-variable\">c\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">AtomicInteger\u003c/span>(\u003cspan class=\"hljs-number\">0\u003c/span>);\u003c/span>\u003cspan class=\"ln\">c.incrementAndGet(); \u003cspan class=\"hljs-comment\">// i++ 的线程安全版\u003c/span>\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">2 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">实现方式随 JDK 变化\u003c/div>\u003cp>JDK 8 原子类基于 \u003ccode>Unsafe.compareAndSwapXxx\u003c/code>;JDK 9+ 改为 \u003ccode>VarHandle\u003c/code>(JEP 193 之后 \u003ccode>Unsafe\u003c/code> 逐步收敛)。语义不变,读源码时注意版本差异。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">ABA 问题\u003c/div>\u003cp>值 A→B→A,CAS 校验「还是 A」便认为没变,但中间已被改过。解决：AtomicStampedReference 用版本戳,每次改戳+1,校验值+戳。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">ABA 实战场景\u003c/div>\u003cp>无锁栈：\u003ccode>top\u003c/code> 弹出 A → 压入 B → 又把 A 压回来,CAS 判定「top 仍是 A」通过,但 A 的 next 已指向被弹出的节点,结构被破坏。用 \u003ccode>AtomicStampedReference\u003c/code>(值 + 版本戳)或 \u003ccode>AtomicMarkableReference\u003c/code>(值 + 标记位)。\u003c/p>\n\u003c/div>\n\u003ch2>代价与优化\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>问题\u003c/th>\n\u003cth>表现\u003c/th>\n\u003cth>缓解\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>自旋开销\u003c/td>\n\u003ctd>高竞争下 CPU 空转\u003c/td>\n\u003ctd>控制竞争/减小临界区,必要时退回锁\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>单变量\u003c/td>\n\u003ctd>只能保一个变量\u003c/td>\n\u003ctd>用 AtomicReference 包不可变对象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>高并发计数\u003c/td>\n\u003ctd>CAS 争用严重\u003c/td>\n\u003ctd>LongAdder 分桶累加\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>伪共享\u003c/td>\n\u003ctd>相邻 cell 同缓存行互相失效\u003c/td>\n\u003ctd>\u003ccode>@Contended\u003c/code> 填充(JDK 8 起 LongAdder 内部已用)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">LongAdder 不是 AtomicLong 的平替\u003c/div>\u003cp>\u003ccode>sum()\u003c/code> 只是各 cell 的\u003cstrong>瞬时求和\u003c/strong>,并发更新下不是原子快照;也不支持 \u003ccode>compareAndSet\u003c/code>、不支持「读到值再 CAS」这类依赖当前值的逻辑。适合监控计数这类高频自增统计,不适合精确读-改-写。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">与锁的关系\u003c/div>\u003cp>CAS 是无锁基石,\u003ca class=\"wikilink\" data-target=\"aqs\">AQS\u003c/a> 与 \u003ca class=\"wikilink\" data-target=\"reentrantlock\">ReentrantLock\u003c/a> 的 state 修改也靠 CAS；原子类适合单变量原子更新,复杂临界区仍需锁。对比见 \u003ca class=\"wikilink\" data-target=\"java-锁对比\">Java 锁对比\u003c/a>。\u003c/p>\n\u003c/div>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(2题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">CAS 有什么缺点？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">ABA 问题(用版本戳解决)、高竞争自旋耗 CPU、只能保证一个共享变量原子(可用引用对象变通)。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">LongAdder 为什么比 AtomicLong 快？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">LongAdder 把计数分散到多个 cell,写时各加各的,读时汇总,降低 CAS 争用,高并发计数更优;代价是 sum() 非原子快照。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(3条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：CAS 无锁就无开销。高竞争下自旋空转,CPU 打满且延迟可能比阻塞锁更高,竞争大时该用锁。\u003c/li>\n\u003cli>误区：原子类能保证多个变量一起原子。只能保单个变量;多变量要包成不可变对象用 \u003ccode>AtomicReference\u003c/code>,或直接用锁。\u003c/li>\n\u003cli>误区：LongAdder 的 sum() 是精确值。并发更新时是瞬时近似值,做余额、限额这类强一致判断会出错。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["aqs","reentrantlock","java-锁对比"],"excerpt":"CAS 是比较并交换的 CPU 原子指令 → 原子类(AtomicInteger 等)封装 Unsafe+CAS → 存在 ABA 与自旋问题 → 高竞争用 LongAdder 等优化。","featured":"","order":0,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":3,"groupLayout":"tiles"},"dcl":{"id":"dcl","title":"DCL","type":"note","category":"juc","file":"notes/DCL.md","accent":"#7C4DFF","accentInk":"#5E35B1","catLabel":"Concurrency","mtime":"2026-09-05T09:27:18.393Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">问题 \u003cspan class=\"chain-pill\">成因\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">new 半初始化对象被发布\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">屏障 \u003cspan class=\"chain-pill\">核心\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">volatile 写插 StoreLoad\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">JDK 5 \u003cspan class=\"chain-pill\">历史\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">JSR-133 之前不保\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">落地 \u003cspan class=\"chain-pill\">实战\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">volatile + 二次判空\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>Double-Checked Locking(DCL)——单例懒加载的经典模式,核心靠 \u003ca class=\"wikilink\" data-target=\"volatile\">volatile\u003c/a> 写后插入的 \u003ccode>StoreLoad\u003c/code> 屏障,\u003cstrong>JDK 5 之前\u003c/strong> volatile 不禁重排,DCL 会拿到「引用已赋值但对象未初始化」的半成品;JDK 5 起 \u003ccode>StoreLoad\u003c/code> 严格兜底,DCL 才安全。\u003c/p>\n\u003c/details>\u003ch2>它解决什么\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>问题\u003c/th>\n\u003cth>场景\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>半初始化对象发布\u003c/td>\n\u003ctd>\u003ccode>new Singleton()\u003c/code> 分「分配内存 → 初始化字段 → 引用赋值」三步,重排可能让引用先于初始化对其他线程可见\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>重复加锁开销\u003c/td>\n\u003ctd>首次判空跳过 \u003ccode>synchronized\u003c/code>,只有竞争时才进锁\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>正确性 vs 性能\u003c/td>\n\u003ctd>单例同时要懒加载 + 高并发读 + 低延迟,DCL 是唯一两手都抓的模式\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">半初始化为什么危险\u003c/div>\u003cp>\u003ccode>Singleton s = new Singleton()\u003c/code> 在没有 \u003ccode>StoreLoad\u003c/code> 屏障保护时,JIT/CPU 可能把步骤重排成「分配内存 → 引用赋值 → 初始化字段」。此时另一个线程进入首次判空会看到 \u003ccode>s != null\u003c/code>,直接拿去用——对象字段是默认值,方法可能抛 NPE 或返回错数据。\u003c/p>\n\u003c/div>\n\u003ch2>屏障机制\u003c/h2>\n\u003cdiv class=\"mermaid\" data-mm-type=\"sequenceDiagram\">sequenceDiagram\n    autonumber\n    participant T1 as 写线程\n    participant M as 主内存\n    participant T2 as 读线程\n    Note over T1: 进入 synchronized\n    T1->>T1: 分配内存(memory=allocate())\n    T1->>T1: 初始化字段\n    T1->>T1: 引用赋值 instance=memory\n    T1->>T1: 插入 StoreLoad 屏障&lt;br/>禁后续 load/store 上提\n    T1-->>M: instance 写回主内存\n    Note over T2: 首次判空\n    T2->>M: 读 instance\n    M-->>T2: 返回非空引用\n    Note over T2: 看到完整初始化的对象&lt;br/>(屏障保证初始化的写也在 instance 之前)\n    T2->>T2: 返回 s\n\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">为什么 volatile 写\u003cstrong>后\u003c/strong>插 \u003ccode>StoreLoad\u003c/code> 就够\u003c/div>\u003cp>重排风险只有一种形态:「\u003ccode>instance = s\u003c/code> 被重排到初始化之前」,即 volatile 写被提前到后续读/写之前。\u003ccode>StoreLoad\u003c/code> 正好挡这一刀——保证「写\u003cstrong>之后\u003c/strong>的所有读写都不能跨过该写上提」。而普通写与 volatile 写之间的重排(\u003ccode>StoreStore\u003c/code>),靠程序次序规则天然建立 happens-before(8 条规则全表见 \u003ca class=\"wikilink\" data-target=\"jmm\">JMM\u003c/a>),\u003cstrong>不需要\u003c/strong>额外屏障。\u003c/p>\n\u003c/div>\n\u003ch2>JDK 5 前后的语义差异\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>版本\u003c/th>\n\u003cth>volatile 写屏障\u003c/th>\n\u003cth>DCL 安全性\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>JDK 1.4 及以前\u003c/td>\n\u003ctd>不强制禁重排\u003c/td>\n\u003ctd>❌ 可能拿到半初始化对象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>JDK 5+(JSR-133)\u003c/td>\n\u003ctd>写后插 \u003ccode>StoreLoad\u003c/code>,严格禁重排\u003c/td>\n\u003ctd>✅ 安全\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>JDK 8+\u003c/td>\n\u003ctd>同上,模式无变化\u003c/td>\n\u003ctd>✅ 安全\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">谈 DCL 默认 JDK 5+\u003c/div>\u003cp>「DCL + volatile 单例」正确性只在 JSR-133 之后成立。面试答 DCL 要带「JDK 5 之后」这半句,否则会被追「那 JDK 5 之前呢」——旧 volatile 写无 \u003ccode>StoreLoad\u003c/code>,重排不被挡。\u003c/p>\n\u003c/div>\n\u003ch2>落地：DCL 模板\u003c/h2>\n\u003cfigure class=\"code\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">Singleton\u003c/span> {\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">private\u003c/span> \u003cspan class=\"hljs-keyword\">static\u003c/span> \u003cspan class=\"hljs-keyword\">volatile\u003c/span> Singleton instance;  \u003cspan class=\"hljs-comment\">// volatile 写后插 StoreLoad\u003c/span>\u003c/span>\u003cspan class=\"ln\"> \u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-type\">private\u003c/span> \u003cspan class=\"hljs-title function_\">Singleton\u003c/span>\u003cspan class=\"hljs-params\">()\u003c/span> {}\u003c/span>\u003cspan class=\"ln\"> \u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">static\u003c/span> \u003cspan class=\"hljs-type\">Singleton\u003c/span> \u003cspan class=\"hljs-title function_\">getInstance\u003c/span>\u003cspan class=\"hljs-params\">()\u003c/span> {\u003c/span>\u003cspan class=\"ln\">        \u003cspan class=\"hljs-type\">Singleton\u003c/span> \u003cspan class=\"hljs-variable\">s\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> instance;             \u003cspan class=\"hljs-comment\">// 1. 首次判空(无锁)\u003c/span>\u003c/span>\u003cspan class=\"ln\">        \u003cspan class=\"hljs-keyword\">if\u003c/span> (s == \u003cspan class=\"hljs-literal\">null\u003c/span>) {\u003c/span>\u003cspan class=\"ln\">            \u003cspan class=\"hljs-keyword\">synchronized\u003c/span> (Singleton.class) { \u003cspan class=\"hljs-comment\">// 2. 竞争时才进锁\u003c/span>\u003c/span>\u003cspan class=\"ln\">                s = instance;              \u003cspan class=\"hljs-comment\">// 3. 二次判空(防并发期间其他线程已建好)\u003c/span>\u003c/span>\u003cspan class=\"ln\">                \u003cspan class=\"hljs-keyword\">if\u003c/span> (s == \u003cspan class=\"hljs-literal\">null\u003c/span>) {\u003c/span>\u003cspan class=\"ln\">                    s = \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">Singleton\u003c/span>();    \u003cspan class=\"hljs-comment\">// 4. 分配 + 初始化\u003c/span>\u003c/span>\u003cspan class=\"ln\">                    instance = s;           \u003cspan class=\"hljs-comment\">// 5. volatile 写,禁重排\u003c/span>\u003c/span>\u003cspan class=\"ln\">                }\u003c/span>\u003cspan class=\"ln\">            }\u003c/span>\u003cspan class=\"ln\">        }\u003c/span>\u003cspan class=\"ln\">        \u003cspan class=\"hljs-keyword\">return\u003c/span> s;\u003c/span>\u003cspan class=\"ln\">    }\u003c/span>\u003cspan class=\"ln\">}\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">19 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">三步校验\u003c/div>\n\u003col>\n\u003cli>\u003cstrong>JDK ≥ 5\u003c/strong>——\u003ccode>StoreLoad\u003c/code> 兜底的前提。\u003c/li>\n\u003cli>\u003cstrong>\u003ccode>instance\u003c/code> 必须 volatile\u003c/strong>——普通变量写无屏障,DCL 必坏。\u003c/li>\n\u003cli>\u003cstrong>二次判空不能省\u003c/strong>——第一次判空为了跳过锁,第二次判空为了防「线程 A 在等锁时,线程 B 已建好实例」。\u003c/li>\n\u003c/ol>\n\u003c/div>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(3题)\u003c/span>\u003c/summary>\u003cp>Q：双重检查单例为什么要 volatile？\nA：\u003ccode>new Singleton()\u003c/code> 分配内存/初始化/赋值引用三步可能被重排,volatile 写后的 \u003ccode>StoreLoad\u003c/code> 屏障禁该重排,保证其他线程拿到的是完整初始化的对象。\u003c/p>\n\u003cp>Q：DCL 为什么只在 JDK 5 之后才安全？\nA：JDK 5 之前(JSR-133 之前)volatile 写不强制禁重排,引用可能先于初始化对其他线程可见,半初始化对象就被发布了。JSR-133 给 volatile 写加了 \u003ccode>StoreLoad\u003c/code> 屏障,才把 DCL 兜回安全。\u003c/p>\n\u003cp>Q：DCL 能否用 \u003ccode>AtomicReference\u003c/code> 或 \u003ccode>synchronized\u003c/code> 完全替代？\nA：\u003ccode>AtomicReference\u003c/code> 加 \u003ccode>compareAndSet\u003c/code> 能写一个无 volatile 的懒加载单例,但代码更绕;全部用 \u003ccode>synchronized\u003c/code>/\u003ccode>ReentrantLock\u003c/code> 是正确但慢的方案,失去了 DCL「无竞争零开销」的意义。生产场景多用\u003cstrong>饿汉 / 静态内部类 holder / 枚举\u003c/strong>直接绕过 DCL 的复杂度。\u003c/p>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(3条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：DCL 在任何 JDK 都安全。错,JDK 5 前 volatile 不禁重排,DCL 会拿到半初始化对象。\u003c/li>\n\u003cli>误区：\u003ccode>synchronized\u003c/code> 包整个方法就够了,不需要 volatile。错,\u003ccode>synchronized\u003c/code> 只对\u003cstrong>同一把锁\u003c/strong>的线程互斥,首次判空走无锁路径,看不到锁内字段的初始化结果。\u003c/li>\n\u003cli>误区：DCL 是单例最优解。错,Java 里更推荐\u003cstrong>静态内部类 holder\u003c/strong>或\u003cstrong>枚举\u003c/strong>,既天然懒加载又无 DCL 的屏障复杂度。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["volatile","jmm"],"excerpt":"Double-Checked Locking(DCL)——单例懒加载的经典模式,核心靠 volatile 写后插入的 `StoreLoad` 屏障,**JDK 5 之前** volatile 不禁重排,DCL 会拿到「引用已赋值但对象未初始化」的半成品;JDK 5 起 `StoreLoad` 严格兜底,DCL 才安全。","featured":"","order":0,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":3,"groupLayout":"tiles"},"easyorange-缓存一致性":{"id":"easyorange-缓存一致性","title":"EasyOrange 缓存一致性","type":"note","category":"projects","file":"notes/EasyOrange 缓存一致性.md","accent":"#FF4081","accentInk":"#C60055","catLabel":"Projects","mtime":"2026-09-05T09:27:18.393Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">全局底座 \u003cspan class=\"chain-pill\">框架\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">单层 Redis + fail-open\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">三模式落地 \u003cspan class=\"chain-pill\">核心\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">Cache-Aside / Write-Behind / 取舍\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">兜底与边界 \u003cspan class=\"chain-pill\">收尾\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">TTL · 分布式锁 · 正交项\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>一致性靠「分层取舍」收敛，不靠消灭窗口：先立单层 Redis + fail-open 的全局底座，再把业务按一致性要求拆进三种模式，余下的边界风险交给 TTL 与分布式锁兜底。\u003c/p>\n\u003cdiv class=\"callout important\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/>\u003c/svg>重点\u003c/div>\u003cdiv class=\"callout-sub\">简历口径\u003c/div>\n\u003cul>\n\u003cli>设计统一缓存底座（RedisCacheConfig）：单层 Redis + 注解驱动 \u003ccode>@Cacheable\u003c/code>/\u003ccode>@CacheEvict\u003c/code>，业务近零缓存代码\u003c/li>\n\u003cli>按数据一致性要求分三模式：Cache-Aside+写失效（强一致主数据）、Write-Behind（高频计数）、fail-open（缓存故障降级不阻塞）\u003c/li>\n\u003cli>关键取舍：订单失效放 afterCommit 防并发回填，商品用同步事件 + TTL 兜底换简单；序列化统一防限流器失灵\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003cp>通用机制见 \u003ca class=\"wikilink\" data-target=\"缓存与数据库一致性\">缓存与数据库一致性\u003c/a>。本篇只记 EasyOrange 的落地与取舍。\u003c/p>\n\u003c/details>\u003ch2>全局底座：统一 Redis 单层 + fail-open\u003c/h2>\n\u003cp>所有「与 DB 一致」的缓存跑在同一底座（RedisCacheConfig）：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>单层 Redis\u003c/strong>：早期手写多级缓存（L1 本地 + L2 Redis）已移除，改纯 Redis 单层。理由：单层一致性只靠「写路径显式失效 + TTL 兜底」，不需要 L1/L2 配平和跨节点广播。\u003c/li>\n\u003cli>\u003cstrong>注解驱动\u003c/strong>：业务侧只用 \u003ccode>@Cacheable\u003c/code> / \u003ccode>@CacheEvict\u003c/code>，几乎零缓存代码（适配层实现端口，方法体为空）。\u003c/li>\n\u003cli>\u003cstrong>统一短 TTL\u003c/strong>：\u003ccode>default-ttl\u003c/code> 控制，最后防线是「TTL 过期自动重建」。\u003c/li>\n\u003cli>\u003cstrong>fail-open（缓存故障降级）\u003c/strong>：\u003ccode>CacheErrorHandler\u003c/code> 集中吞掉 Redis 异常——读 → 直查 DB；写 → 放弃本次缓存。Redis 挂了业务不阻塞，代价是降级期间缓存与 DB 短暂不一致（可接受）。\u003c/li>\n\u003cli>\u003cstrong>序列化统一\u003c/strong>：强制 \u003ccode>StringRedisSerializer\u003c/code>（key）+ \u003ccode>GenericJacksonJsonRedisSerializer\u003c/code>（value，带类型信息），否则 Spring Boot 默认 \u003ccode>JdkSerializationRedisSerializer\u003c/code> 产出二进制，Redis CLI 不可读、Lua 脚本 \u003ccode>tonumber()\u003c/code> 失败导致限流器失灵。\u003c/li>\n\u003c/ul>\n\u003ch2>模式一：Cache-Aside + 写失效\u003c/h2>\n\u003cp>适用：商品详情、分类列表、订单列表（写少读多、用户看到旧数据代价高）。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>读路径\u003c/strong>：\u003ccode>@Cacheable\u003c/code>（如商品 \u003ccode>cacheNames=&quot;eo:product:info&quot;, key=productId\u003c/code>），\u003ccode>unless=&quot;#result==null&quot;\u003c/code> 让空结果不落缓存——防的是无意义占位污染缓存，\u003cstrong>不是防穿透\u003c/strong>（穿透拦截靠上游参数校验，口径见 \u003ca class=\"wikilink\" data-target=\"缓存穿透\">缓存穿透\u003c/a>）；订单列表因 key 多维组合（userId+status+page）手写 get/put，整体存 30 分钟 TTL。\u003c/li>\n\u003cli>\u003cstrong>写路径（失效而非更新）\u003c/strong>：商品在 \u003ccode>@Transactional\u003c/code> 内改完聚合 → 发领域事件 → 监听用 \u003ccode>@CacheEvict\u003c/code> 删缓存；分类同理（缓存未富化的原始列表，计数变化不触发失效风暴）；订单用 \u003ccode>evictOrderCacheAfterCommit\u003c/code> 删 \u003ccode>eo:order:list:&lt;userId&gt;:*\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">时序细节（面试/复盘最高频）\u003c/div>\u003cp>经典坑是「先删缓存 vs 先改 DB」和「失效在提交前还是提交后」。本项目两处做法不同。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">订单列表：afterCommit 正确范式\u003c/div>\n\u003cul>\n\u003cli>实现：\u003ccode>TransactionSynchronizationManager.registerSynchronization(... afterCommit)\u003c/code>\u003c/li>\n\u003cli>原因：事务提交后再删缓存，避免「提交前删缓存 → 并发读回填旧 DB 值」。\u003c/li>\n\u003cli>背景：订单 key 多维（userId+status+page），回填成本高，必须提交后删。\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">商品详情：同步同事务(提交前) — 有意取舍\u003c/div>\n\u003cul>\n\u003cli>实现：\u003ccode>@EventListener\u003c/code> 同步监听，与发布者同事务同线程。\u003c/li>\n\u003cli>风险：失效后、提交前并发读可能回填旧值。\u003c/li>\n\u003cli>兜底：靠短 TTL 容忍（商品可见性要求没订单严苛）。\u003c/li>\n\u003cli>升级：一致性要求变高时改为 afterCommit（或 \u003ccode>@TransactionalEventListener(phase=AFTER_COMMIT)\u003c/code>）。\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003cdiv class=\"callout important\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/>\u003c/svg>重点\u003c/div>\u003cdiv class=\"callout-sub\">笔记重点\u003c/div>\u003cp>订单用 afterCommit 是对的范式；商品用提交前同步失效是「TTL 兜底换实现简单」的有意取舍，不是没考虑到。\u003c/p>\n\u003c/div>\n\u003ch2>模式二：Write-Behind（浏览量）\u003c/h2>\n\u003cp>适用：商品浏览量（ViewCount）——高频写、允许短暂不一致、丢了影响极小。\u003c/p>\n\u003cpre>\u003ccode>用户访问 → Redis Hash eo:product:views:pending 做 increment（不碰 DB）\n                  │  定时调度（每 5s，首启 15s）\n                  ▼\n       ViewCountFlushScheduler（Redis 分布式锁 setIfAbsent 10s 防重复）\n                  │\n                  ▼\n       ViewCountBatchProcessor.flush()：读 pending → 批量 UPDATE DB → 成功删 pending（best-effort）\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>DB 唯一真实来源，Redis 只是计数缓冲：任何时刻 Redis 丢失都不影响正确性。\u003c/li>\n\u003cli>顺序保证不丢：先「DB 写成功」再「删 Redis pending」；失败下轮重放。\u003c/li>\n\u003cli>分布式锁防重复：多实例下 \u003ccode>eo:product:views:lock\u003c/code> 的 \u003ccode>setIfAbsent\u003c/code> 保证单节点 flush；锁 10s 超时防死锁。\u003c/li>\n\u003cli>最终一致性，业务完全可接受。\u003c/li>\n\u003c/ul>\n\u003ch2>与 DB 一致性无关的缓存\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>AI 语义缓存\u003c/strong>（SemanticCacheService）：相似问题 → LLM 回答存 Redis Hash，靠 embedding 余弦相似度命中复用，纯成本优化。Redis/embedding 不可用就 fail-open 不命中，不影响 DB 数据。\u003c/li>\n\u003cli>\u003cstrong>AI stale 缓存\u003c/strong>（AiStaleCacheConfig，Caffeine 本地）：LLM 调用结果本地 stale 降级副本，Redis 挂了还能用本地旧结果兜底——可用性设计，非 DB 一致性设计。\u003c/li>\n\u003c/ul>\n\u003ch2>兜底机制汇总\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>机制\u003c/th>\n\u003cth>作用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>统一短 TTL\u003c/td>\n\u003ctd>遗漏失效 / 失败最终靠过期重建\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>fail-open（CacheErrorHandler）\u003c/td>\n\u003ctd>Redis 异常不抛业务异常；读降级直查 DB、写放弃缓存\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>unless=&quot;#result==null&quot;\u003c/code>\u003c/td>\n\u003ctd>空结果不落缓存，防缓存污染（防穿透另靠参数校验，见 \u003ca class=\"wikilink\" data-target=\"缓存穿透\">缓存穿透\u003c/a>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SCAN 替代 KEYS\u003c/td>\n\u003ctd>订单按 pattern 批量失效用游标遍历，避免阻塞生产 Redis\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>分布式锁（浏览量/超卖）\u003c/td>\n\u003ctd>防多实例重复 flush、防超卖\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>易混淆：分布式锁防超卖 ≠ 缓存一致性\u003c/h2>\n\u003cp>\u003ccode>DistributedRedissonLockAdapter\u003c/code> + 库存扣减（\u003ccode>Product.decrementStock\u003c/code>）解决 DB 并发写一致性（防超卖），不是缓存。链路：Redis 分布式锁保证扣库存串行 → DB 事务内校验并扣减 → 再走模式一缓存失效。与「缓存 vs DB 一致性」正交。\u003c/p>\n\u003cdiv class=\"callout important\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/>\u003c/svg>重点\u003c/div>\u003cdiv class=\"callout-sub\">项目收束\u003c/div>\u003cp>EasyOrange 的答案 = 底座统一（单层 Redis / fail-open / 短 TTL）+ 按一致性要求分三模式；所有取舍收敛到两个变量——\u003cstrong>失效时机\u003c/strong>（提交前 vs afterCommit）与 \u003cstrong>TTL 兜底\u003c/strong>。\u003c/p>\n\u003c/div>\n","links":["缓存与数据库一致性","缓存穿透"],"excerpt":"EasyOrange 的统一缓存底座与三模式落地：单层 Redis + fail-open，订单 afterCommit、商品同步失效 + TTL 兜底，ViewCount 走 Write-Behind。","featured":"","order":0,"group":4,"groupNum":"Ⅴ","groupName":"简历项目","groupRank":0,"groupLayout":"feature"},"easyorange":{"id":"easyorange","title":"EasyOrange","type":"moc","category":"projects","file":"notes/EasyOrange.md","accent":"#FF4081","accentInk":"#C60055","catLabel":"Projects","mtime":"2026-09-05T09:27:18.393Z","html":"\u003ch1>EasyOrange\u003c/h1>\n\u003cp>（简历第一个项目）后端服务。核心挑战是缓存与数据库一致性，在分层与 CQRS 约束下设计统一缓存底座。技术栈围绕 Redis + DB。\u003c/p>\n\u003cul>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"easyorange-缓存一致性\">EasyOrange 缓存一致性\u003c/a>\u003c/li>\n\u003c/ul>\n","links":["easyorange-缓存一致性"],"excerpt":"（简历第一个项目）后端服务。核心挑战是缓存与数据库一致性，在分层与 CQRS 约束下设计统一缓存底座。技术栈围绕 Redis + DB。","featured":"","order":0,"group":4,"groupNum":"Ⅴ","groupName":"简历项目","groupRank":0,"groupLayout":"feature"},"http":{"id":"http","title":"HTTP","type":"note","category":"network","file":"notes/HTTP.md","accent":"#00B0FF","accentInk":"#0081CB","catLabel":"Network","mtime":"2026-09-05T09:27:18.393Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">协议定位与报文 \u003cspan class=\"chain-pill\">骨架\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">请求-响应 · 行头体\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">方法与状态码 \u003cspan class=\"chain-pill\">语义\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">语义与结果\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">连接与版本 \u003cspan class=\"chain-pill\">演进\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">长连接 · HTTP2 · HTTP3\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">缓存与状态 \u003cspan class=\"chain-pill\">加速\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">强缓存 · Cookie\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>应用层「请求-响应」协议：先定报文骨架与语义（方法 / 状态码），再看连接与版本如何省 RTT，最后用缓存与 Cookie 补性能与状态。\u003c/p>\n\u003c/details>\u003ch2>协议定位\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>维度\u003c/th>\n\u003cth>HTTP\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>层次\u003c/td>\n\u003ctd>应用层，默认跑在 \u003ca class=\"wikilink\" data-target=\"tcp\">TCP\u003c/a> 80 端口上（HTTP/3 改跑 QUIC over \u003ca class=\"wikilink\" data-target=\"udp\">UDP\u003c/a>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>模式\u003c/td>\n\u003ctd>一问一答，客户端主动发起\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>状态\u003c/td>\n\u003ctd>无状态，每次请求自带全部上下文\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>报文\u003c/td>\n\u003ctd>HTTP/1.x 为纯文本；HTTP/2 起改为二进制分帧\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可靠传输\u003c/td>\n\u003ctd>不负责，交给下层 \u003ca class=\"wikilink\" data-target=\"tcp\">TCP\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>安全\u003c/td>\n\u003ctd>不负责，明文传输，由 \u003ca class=\"wikilink\" data-target=\"https\">HTTPS\u003c/a> 补上\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">定位\u003c/div>\u003cp>HTTP 只定义「语义约定」——怎么描述请求、怎么表达结果。可靠、加密、寻址分别由 \u003ca class=\"wikilink\" data-target=\"tcp\">TCP\u003c/a>、\u003ca class=\"wikilink\" data-target=\"https\">HTTPS\u003c/a>、IP 承担，同属 \u003ca class=\"wikilink\" data-target=\"computer-networking\">计算机网络\u003c/a> 分层模型的一环。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">无状态不是缺陷\u003c/div>\u003cp>无状态让服务端无需保存每连接上下文，天然易水平扩展。代价是每个请求都要重复携带身份与上下文，于是有了 Cookie / Token。\u003c/p>\n\u003c/div>\n\u003ch2>报文结构\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>组成\u003c/th>\n\u003cth>示例\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>请求行\u003c/td>\n\u003ctd>\u003ccode>GET /api/user HTTP/1.1\u003c/code>\u003c/td>\n\u003ctd>方法 + 路径 + 版本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>请求头\u003c/td>\n\u003ctd>\u003ccode>Host\u003c/code> / \u003ccode>Accept\u003c/code> / \u003ccode>Cookie\u003c/code>\u003c/td>\n\u003ctd>键值元数据，一行一个\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>空行\u003c/td>\n\u003ctd>CRLF\u003c/td>\n\u003ctd>头与体的分界\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>请求体\u003c/td>\n\u003ctd>JSON / 表单\u003c/td>\n\u003ctd>GET 通常为空\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>响应报文同构，首行换成状态行 \u003ccode>HTTP/1.1 200 OK\u003c/code>，头部换成 \u003ccode>Content-Type\u003c/code> / \u003ccode>Cache-Control\u003c/code> / \u003ccode>Set-Cookie\u003c/code>。\u003c/p>\n\u003cfigure class=\"code\" data-lang=\"http\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">HT\u003c/span>\u003cspan class=\"code-lang\">HTTP\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">POST /api/login HTTP/1.1\u003c/span>\u003cspan class=\"ln\">Host: example.com\u003c/span>\u003cspan class=\"ln\">Content-Type: application/json\u003c/span>\u003cspan class=\"ln\">Content-Length: 38\u003c/span>\u003cspan class=\"ln\"> \u003c/span>\u003cspan class=\"ln\">{\"username\":\"ada\",\"password\":\"••••\"}\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">6 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">纯文本红利\u003c/div>\u003cp>HTTP/1.x 报文肉眼可读，\u003ccode>telnet host 80\u003c/code> 手敲请求即可调试；HTTP/2 起改为二进制帧，语义不变但抓包必须用支持 HTTP/2 的解析器。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">定长与分块二选一\u003c/div>\u003cp>体长度靠 \u003ccode>Content-Length\u003c/code> 声明，或改用 \u003ccode>Transfer-Encoding: chunked\u003c/code> 分块；两者同时出现会让接收方解析错乱。\u003c/p>\n\u003c/div>\n\u003ch2>方法与状态码\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方法\u003c/th>\n\u003cth>语义\u003c/th>\n\u003cth>安全\u003c/th>\n\u003cth>幂等\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>GET\u003c/td>\n\u003ctd>获取资源\u003c/td>\n\u003ctd>是\u003c/td>\n\u003ctd>是\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HEAD\u003c/td>\n\u003ctd>只要响应头\u003c/td>\n\u003ctd>是\u003c/td>\n\u003ctd>是\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>OPTIONS\u003c/td>\n\u003ctd>探测支持的方法 / 跨域预检\u003c/td>\n\u003ctd>是\u003c/td>\n\u003ctd>是\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>POST\u003c/td>\n\u003ctd>创建 / 提交，语义由服务端定\u003c/td>\n\u003ctd>否\u003c/td>\n\u003ctd>否\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PUT\u003c/td>\n\u003ctd>整体替换\u003c/td>\n\u003ctd>否\u003c/td>\n\u003ctd>是\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PATCH\u003c/td>\n\u003ctd>局部修改\u003c/td>\n\u003ctd>否\u003c/td>\n\u003ctd>否\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DELETE\u003c/td>\n\u003ctd>删除资源\u003c/td>\n\u003ctd>否\u003c/td>\n\u003ctd>是\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">安全 ≠ 幂等\u003c/div>\u003cp>安全 = 不修改服务端资源；幂等 = 重复执行结果一致。PUT 改数据（不安全）但重复调用结果相同（幂等）；POST 两者都不满足。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>类别\u003c/th>\n\u003cth>含义\u003c/th>\n\u003cth>高频码\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1xx\u003c/td>\n\u003ctd>继续 / 协议切换\u003c/td>\n\u003ctd>101 Switching Protocols（WebSocket 升级）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2xx\u003c/td>\n\u003ctd>成功\u003c/td>\n\u003ctd>200 / 201 Created / 204 No Content\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3xx\u003c/td>\n\u003ctd>重定向\u003c/td>\n\u003ctd>301 / 302 / 304 Not Modified\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4xx\u003c/td>\n\u003ctd>客户端错\u003c/td>\n\u003ctd>400 / 401 / 403 / 404 / 405 / 429\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5xx\u003c/td>\n\u003ctd>服务端错\u003c/td>\n\u003ctd>500 / 502 / 503 / 504\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">重定向语义差异\u003c/div>\u003cp>301 永久（浏览器缓存跳转，后续直连新址）；302 临时且允许把 POST 降级成 GET；307 / 308 是「保持原方法」的严格版本。要保住 POST 用 307 / 308。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">502 与 504 别混\u003c/div>\u003cp>502 Bad Gateway = 网关收到上游的\u003cstrong>非法响应\u003c/strong>；504 Gateway Timeout = 等上游\u003cstrong>超时\u003c/strong>。前者查上游是否在重启 / 返回畸形头，后者查上游耗时与超时配置。\u003c/p>\n\u003c/div>\n\u003ch2>连接管理\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>形态\u003c/th>\n\u003cth>做法\u003c/th>\n\u003cth>代价\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>短连接\u003c/td>\n\u003ctd>每请求建一次 \u003ca class=\"wikilink\" data-target=\"tcp\">TCP\u003c/a> 连接\u003c/td>\n\u003ctd>三次握手 + 慢启动，RTT 浪费严重\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>长连接\u003c/td>\n\u003ctd>\u003ccode>Connection: keep-alive\u003c/code>，连接复用\u003c/td>\n\u003ctd>占服务端 fd，需空闲超时回收\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>管道化\u003c/td>\n\u003ctd>不等响应连续发多个请求\u003c/td>\n\u003ctd>响应须按序返回，队头阻塞，实际被禁用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>多路复用\u003c/td>\n\u003ctd>HTTP/2 单连接并发多个流\u003c/td>\n\u003ctd>传输层仍可能因丢包整体停等\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">队头阻塞\u003c/div>\u003cp>管道化要求响应按请求顺序返回，前一个慢会堵死后面全部请求——这是 HTTP/1.1 管道化在浏览器默认关闭的原因，也是 HTTP/2 引入分帧多路复用的直接动因。\u003c/p>\n\u003c/div>\n\u003cdetails>\u003csummary>展开时序图\u003c/summary>\u003cdiv class=\"mermaid\" data-mm-type=\"sequenceDiagram\">sequenceDiagram\n    participant C as 客户端\n    participant S as 服务端\n    C->>S: TCP 三次握手\n    C->>S: HTTP 请求\n    S->>C: HTTP 响应\n    Note over C,S: keep-alive 保持连接\n    C->>S: 第二个请求复用连接\n    S->>C: 第二个响应\n    C->>S: 空闲超时后 FIN\n\u003c/div>\n\u003c/details>\u003ch2>版本演进\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>版本\u003c/th>\n\u003cth>关键变化\u003c/th>\n\u003cth>解决了什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>HTTP/1.0\u003c/td>\n\u003ctd>每请求一连接，无 Host 头\u003c/td>\n\u003ctd>从无到有\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HTTP/1.1\u003c/td>\n\u003ctd>长连接默认开、Host 头、分块传输、\u003ccode>Cache-Control\u003c/code>\u003c/td>\n\u003ctd>省掉重复握手\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HTTP/2\u003c/td>\n\u003ctd>二进制分帧、单连接多路复用、HPACK 头部压缩、服务端推送\u003c/td>\n\u003ctd>应用层队头阻塞\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HTTP/3\u003c/td>\n\u003ctd>跑在 QUIC over \u003ca class=\"wikilink\" data-target=\"udp\">UDP\u003c/a> 上，内置 TLS 1.3\u003c/td>\n\u003ctd>\u003ca class=\"wikilink\" data-target=\"tcp\">TCP\u003c/a> 层队头阻塞\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">HTTP/2 没解决传输层队头阻塞\u003c/div>\u003cp>HTTP/2 的多路复用在\u003cstrong>一条 TCP 连接\u003c/strong>上并行多个流，一旦丢包，\u003ca class=\"wikilink\" data-target=\"tcp\">TCP\u003c/a> 的按序交付会让所有流一起等重传。HTTP/3 因此抛弃 TCP，改用 QUIC 在 \u003ca class=\"wikilink\" data-target=\"udp\">UDP\u003c/a> 上自建可靠与拥塞控制，实现流级独立。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">演进主线一句话\u003c/div>\u003cp>一切优化都在减少 RTT 与连接数：1.1 复用连接 → 2 连接内并行 → 3 消除传输层队头阻塞。语义（方法 / 状态码 / 头部）始终保持兼容。\u003c/p>\n\u003c/div>\n\u003ch2>缓存机制\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>类型\u003c/th>\n\u003cth>头部\u003c/th>\n\u003cth>是否发请求\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>强缓存\u003c/td>\n\u003ctd>\u003ccode>Cache-Control: max-age=...\u003c/code> / \u003ccode>Expires\u003c/code>\u003c/td>\n\u003ctd>不发，直接用本地副本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>协商缓存\u003c/td>\n\u003ctd>\u003ccode>ETag\u003c/code> ↔ \u003ccode>If-None-Match\u003c/code>、\u003ccode>Last-Modified\u003c/code> ↔ \u003ccode>If-Modified-Since\u003c/code>\u003c/td>\n\u003ctd>发，命中返回 304 空体\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdetails>\u003csummary>展开流程图\u003c/summary>\u003cdiv class=\"mermaid\" data-mm-type=\"flowchart\">flowchart TD\n  A[发起请求] --> B{本地有副本&lt;br>且未过期}\n  B -->|是| C[直接用副本]\n  B -->|否| D[带上 If-None-Match 请求]\n  D --> E{服务端比对 ETag}\n  E -->|一致| F[304 Not Modified]\n  E -->|不一致| G[200 返回新资源]\n\u003c/div>\n\u003c/details>\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">ETag 优先于 Last-Modified\u003c/div>\u003cp>\u003ccode>Last-Modified\u003c/code> 只到秒级，一秒内多次修改无法区分；内容未变但时间戳变了也会误判失效。ETag 按内容生成，精度更高。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">no-cache ≠ no-store\u003c/div>\u003cp>\u003ccode>no-cache\u003c/code> = 可以存，但每次必须向服务端校验；\u003ccode>no-store\u003c/code> = 禁止任何存储。涉及敏感信息的响应用 \u003ccode>no-store\u003c/code>，写错等于把隐私写进磁盘缓存。\u003c/p>\n\u003c/div>\n\u003ch2>状态管理\u003c/h2>\n\u003cp>无状态协议要保持登录态，靠客户端每次回传凭证：\u003c/p>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方案\u003c/th>\n\u003cth>凭证放在哪\u003c/th>\n\u003cth>特点\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Cookie + Session\u003c/td>\n\u003ctd>浏览器自动带 \u003ccode>Cookie\u003c/code>，服务端存 Session\u003c/td>\n\u003ctd>服务端有状态，需共享存储\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Token / JWT\u003c/td>\n\u003ctd>\u003ccode>Authorization\u003c/code> 头，服务端无状态\u003c/td>\n\u003ctd>签发后难即时失效\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">Cookie 三个安全属性\u003c/div>\u003cp>\u003ccode>HttpOnly\u003c/code> 阻断 JS 读取（防 XSS 窃取）；\u003ccode>Secure\u003c/code> 仅 \u003ca class=\"wikilink\" data-target=\"https\">HTTPS\u003c/a> 传输；\u003ccode>SameSite\u003c/code> 限制跨站携带（防 CSRF）。生产环境三者都要配。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">无状态不等于「服务端什么都不存」\u003c/div>\u003cp>Token 方案只是把状态挪到了令牌里，黑名单 / 刷新令牌仍需存储。真正消除的是\u003cstrong>每连接\u003c/strong>状态，不是业务状态。\u003c/p>\n\u003c/div>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(5题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">HTTP 是无状态的，怎么保持登录？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">靠客户端每次请求回传凭证。Cookie + Session 由浏览器自动携带 \u003ccode>Cookie\u003c/code>，服务端查 Session；Token / JWT 放在 \u003ccode>Authorization\u003c/code> 头，服务端验签即可，无需查库但难以即时失效。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">GET 和 POST 的区别？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">语义上 GET 是安全且幂等的获取资源，POST 是提交 / 创建；实现上 GET 参数在 URL（长度受限、留在历史记录）、POST 参数在请求体。二者都不安全，明文传输，需要机密性得上 \u003ca class=\"wikilink\" data-target=\"https\">HTTPS\u003c/a>。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">HTTP/1.1 和 HTTP/2 的核心差异？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">HTTP/2 把报文拆成二进制帧，在单条 TCP 连接上并发多个流，解决了应用层队头阻塞；并用 HPACK 压缩头部。但 TCP 层的队头阻塞仍在，故有 HTTP/3 换 QUIC。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">301 和 302 的区别？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">301 永久重定向，浏览器缓存跳转关系后直接访问新地址；302 临时重定向，且允许把 POST 降级为 GET。需要保留原方法时用 307 / 308。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">强缓存和协商缓存的区别？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">强缓存命中不发请求（\u003ccode>Cache-Control: max-age\u003c/code>）；协商缓存必须发请求，服务端比对后返回 304 空体。强缓存优先级更高，过期后才进入协商缓存。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(4条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：HTTPS 是另一种协议。实为 HTTP over TLS，方法、状态码、头字段一字未改，只是传输时加密。\u003c/li>\n\u003cli>误区：GET 比 POST 安全。两者都是明文；GET 参数还在 URL 与浏览器历史里，暴露面更大。\u003c/li>\n\u003cli>误区：HTTP/2 彻底解决了队头阻塞。只解决了应用层，TCP 层按序交付导致的多流阻塞要 HTTP/3 才消除。\u003c/li>\n\u003cli>误区：\u003ccode>Cache-Control: no-cache\u003c/code> 等于不缓存。它只是要求每次校验，真正禁止存储的是 \u003ccode>no-store\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["tcp","udp","https","computer-networking"],"excerpt":"应用层「请求-响应」协议：先定报文骨架与语义（方法 / 状态码），再看连接与版本如何省 RTT，最后用缓存与 Cookie 补性能与状态。","featured":"","order":0,"group":1,"groupNum":"Ⅱ","groupName":"架构与系统设计","groupRank":2,"groupLayout":"spread"},"https":{"id":"https","title":"HTTPS","type":"note","category":"network","file":"notes/HTTPS.md","accent":"#00B0FF","accentInk":"#0081CB","catLabel":"Network","mtime":"2026-09-05T09:27:18.393Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">安全目标与威胁 \u003cspan class=\"chain-pill\">动因\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">窃听 · 篡改 · 冒充\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">混合加密体系 \u003cspan class=\"chain-pill\">骨架\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">对称 · 非对称 · 摘要\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">握手与 TLS 1.3 \u003cspan class=\"chain-pill\">核心\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">协商 · 密钥 · 省 RTT\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">证书与信任链 \u003cspan class=\"chain-pill\">信任\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">校验四道关 · 吊销\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">性能与面试 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">会话复用 · 高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>HTTP over TLS：先用混合加密解决窃听与篡改，再用证书链解决冒充，最后用会话复用与 TLS 1.3 把多出来的 RTT 省回去。\u003c/p>\n\u003c/details>\u003ch2>安全目标与威胁模型\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>威胁\u003c/th>\n\u003cth>\u003ca class=\"wikilink\" data-target=\"http\">HTTP\u003c/a> 明文传输的后果\u003c/th>\n\u003cth>HTTPS 对策\u003c/th>\n\u003cth>密码学工具\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>窃听\u003c/td>\n\u003ctd>中间人直接读出密码、Cookie\u003c/td>\n\u003ctd>加密\u003c/td>\n\u003ctd>对称加密（AES-GCM / ChaCha20-Poly1305）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>篡改\u003c/td>\n\u003ctd>插入广告、改写金额\u003c/td>\n\u003ctd>完整性校验\u003c/td>\n\u003ctd>AEAD 认证标签 / HMAC\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>冒充\u003c/td>\n\u003ctd>伪装成目标站骗取凭证\u003c/td>\n\u003ctd>身份认证\u003c/td>\n\u003ctd>证书 + CA 签名\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">定位\u003c/div>\u003cp>HTTPS 不是新协议，而是 \u003ca class=\"wikilink\" data-target=\"http\">HTTP\u003c/a> 跑在 TLS 之上：应用层语义一字未改，只在应用层与 \u003ca class=\"wikilink\" data-target=\"tcp\">TCP\u003c/a> 之间插入 TLS 层做加密与认证。默认端口 443。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">只加密不认证 = 白加\u003c/div>\u003cp>少了证书校验，攻击者可以把自己伪装成服务端、分别与双方握手（中间人攻击），两端都「加密」却全被看光。身份认证与加密同等重要。\u003c/p>\n\u003c/div>\n\u003c
