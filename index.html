h2>加密体系\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>类别\u003c/th>\n\u003cth>算法\u003c/th>\n\u003cth>用途\u003c/th>\n\u003cth>性能\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>对称加密\u003c/td>\n\u003ctd>AES-GCM、ChaCha20-Poly1305\u003c/td>\n\u003ctd>加密应用数据\u003c/td>\n\u003ctd>快，有 AES-NI 硬件加速\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>非对称加密\u003c/td>\n\u003ctd>RSA、ECDHE、ECDSA\u003c/td>\n\u003ctd>握手期身份认证与密钥协商\u003c/td>\n\u003ctd>慢 2~3 个数量级\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>摘要\u003c/td>\n\u003ctd>SHA-256、SHA-384\u003c/td>\n\u003ctd>证书签名、密钥派生 PRF\u003c/td>\n\u003ctd>快\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">混合加密\u003c/div>\u003cp>非对称加密只用来「安全地约出一把对称会话密钥」，之后全部应用数据走对称加密。既避免非对称的性能灾难，又解决了对称密钥分发难题。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">为什么不全用非对称\u003c/div>\u003cp>一是慢，二是 RSA 密钥交换无前向安全：服务器私钥一旦泄露，历史抓包流量可被全部解密。现代套件只用 ECDHE。\u003c/p>\n\u003c/div>\n\u003ch2>TLS 握手\u003c/h2>\n\u003cp>以 TLS 1.2 + ECDHE 为准：\u003c/p>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>步骤\u003c/th>\n\u003cth>报文\u003c/th>\n\u003cth>内容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>ClientHello\u003c/td>\n\u003ctd>支持的 TLS 版本、密码套件列表、随机数、SNI\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>ServerHello\u003c/td>\n\u003ctd>选定的版本与套件、随机数\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>Certificate\u003c/td>\n\u003ctd>服务器证书链\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>ServerKeyExchange\u003c/td>\n\u003ctd>ECDHE 临时公钥 + 签名\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>ClientKeyExchange\u003c/td>\n\u003ctd>客户端 ECDHE 临时公钥\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>ChangeCipherSpec / Finished\u003c/td>\n\u003ctd>双方切换密文并校验握手完整性\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdetails>\u003csummary>展开时序图\u003c/summary>\u003cdiv class=\"mermaid\" data-mm-type=\"sequenceDiagram\">sequenceDiagram\n    participant C as 客户端\n    participant S as 服务端\n    C->>S: ClientHello 套件列表 + 随机数\n    S->>C: ServerHello 选定套件 + 随机数\n    S->>C: Certificate 证书链\n    S->>C: ServerKeyExchange ECDHE 公钥 + 签名\n    C->>C: 校验证书链与域名\n    C->>S: ClientKeyExchange ECDHE 公钥\n    C->>S: ChangeCipherSpec + Finished\n    S->>C: ChangeCipherSpec + Finished\n    Note over C,S: 双方算出相同会话密钥，应用数据加密传输\n\u003c/div>\n\u003c/details>\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">密钥怎么算出来的\u003c/div>\u003cp>双方各生成临时 ECDHE 密钥对，交换公钥后各自用「自己的私钥 + 对方公钥」算出同一个共享密钥，再混入两个随机数派生会话密钥。私钥从不上传，故有前向安全（PFS）。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">随机数防重放\u003c/div>\u003cp>客户端与服务端各出一个随机数参与密钥派生，保证每次会话密钥不同，录制的握手无法重放。\u003c/p>\n\u003c/div>\n\u003ch2>TLS 1.3\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>差异\u003c/th>\n\u003cth>TLS 1.2\u003c/th>\n\u003cth>TLS 1.3\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>握手 RTT\u003c/td>\n\u003ctd>2-RTT\u003c/td>\n\u003ctd>1-RTT，会话复用 0-RTT\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>密钥交换\u003c/td>\n\u003ctd>支持 RSA、静态 DH\u003c/td>\n\u003ctd>只剩 (EC)DHE，强制前向安全\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>加密范围\u003c/td>\n\u003ctd>ServerHello 后部分明文\u003c/td>\n\u003ctd>握手报文尽早加密，证书也加密\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>密码套件\u003c/td>\n\u003ctd>含 CBC、SHA-1、RC4 等弱算法\u003c/td>\n\u003ctd>只保留 AEAD 套件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>协商方式\u003c/td>\n\u003ctd>先协商再握手\u003c/td>\n\u003ctd>首轮即带密钥共享，合并往返\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">RTT 怎么省掉的\u003c/div>\u003cp>1.3 让客户端在 ClientHello 里直接猜一个套件并附上密钥共享，服务端一次回包即可完成协商与认证，把 2-RTT 压到 1-RTT。猜错则用 HelloRetryRequest 纠正。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">0-RTT 不抗重放\u003c/div>\u003cp>0-RTT 数据在首个往返就发送，攻击者可截获后重放。只用于幂等请求（GET 静态资源），下单、转账类非幂等操作禁用。\u003c/p>\n\u003c/div>\n\u003ch2>证书与信任链\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>组成\u003c/th>\n\u003cth>内容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>证书字段\u003c/td>\n\u003ctd>域名、公钥、签发者、有效期、签名算法、签名值\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>信任链\u003c/td>\n\u003ctd>根 CA（预置在系统/浏览器）→ 中间 CA → 服务器证书\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>吊销查询\u003c/td>\n\u003ctd>CRL、OCSP、OCSP Stapling\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">有效期检查 \u003cspan class=\"chain-pill\">第一道\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">是否过期\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">签发链回溯 \u003cspan class=\"chain-pill\">第二道\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">逐层验签至根 CA\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">域名匹配 \u003cspan class=\"chain-pill\">第三道\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">证书 SAN 是否含访问域名\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">吊销状态 \u003cspan class=\"chain-pill\">第四道\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">CRL / OCSP 是否已被吊销\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">信任的根在哪\u003c/div>\u003cp>根 CA 证书预置在操作系统或浏览器里，是信任的锚点。自签证书不在信任库中，所以浏览器告警——它无法回溯到任何已知可信根。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">证书告警别乱点「继续访问」\u003c/div>\u003cp>域名不匹配、证书过期、链不完整都可能是真的在中间人攻击。点了继续就等于主动放弃身份认证，加密仍在但对面是谁已无从确认。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">OCSP Stapling\u003c/div>\u003cp>由服务器定期取回 CA 的吊销响应并「订」在握手报文里一并返回，客户端不必自己去问 CA——既省一次外部请求，也避免 CA 被拖垮时的可用性问题。\u003c/p>\n\u003c/div>\n\u003ch2>性能优化\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>手段\u003c/th>\n\u003cth>省下什么\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>会话复用 Session ID / Session Ticket\u003c/td>\n\u003ctd>省掉完整握手，回到 1-RTT\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>TLS 1.3 + 0-RTT\u003c/td>\n\u003ctd>首个应用数据即随握手发出\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>OCSP Stapling\u003c/td>\n\u003ctd>省一次 CA 查询往返\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HSTS\u003c/td>\n\u003ctd>省掉 80 → 443 的那次重定向\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ECC 证书\u003c/td>\n\u003ctd>同等安全下密钥更短、签名更快、报文更小\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">开销到底在哪\u003c/div>\u003cp>现代 CPU 有 AES-NI，对称加密几乎免费；真正的成本是握手的 1~2 个 RTT 与非对称运算。所以优化方向是「少握手、快握手」，而非削弱加密强度。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">HSTS 的单向门\u003c/div>\u003cp>一旦下发 \u003ccode>Strict-Transport-Security\u003c/code>，浏览器在 max-age 内强制走 HTTPS，此期间证书出问题用户无法跳过。上线前先确认证书与链路稳定，max-age 从小到大放。\u003c/p>\n\u003c/div>\n\u003ch2>抓包与调试\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>手段\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>看握手过程\u003c/td>\n\u003ctd>Wireshark 过滤 \u003ccode>tls\u003c/code>，ClientHello / 证书 / 告警都可见\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>看明文内容\u003c/td>\n\u003ctd>配置 \u003ccode>SSLKEYLOGFILE\u003c/code> 导出会话密钥，或用代理工具（Charles / mitmproxy）并安装其根证书\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>验证配置\u003c/td>\n\u003ctd>\u003ccode>openssl s_client -connect host:443\u003c/code>、SSL Labs 评级\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">装了代理根证书 = 主动开后门\u003c/div>\u003cp>抓包工具能解密是因为你信任了它的根证书。调试完务必从系统信任库移除，长期留着等于给任意中间人发了通行证。\u003c/p>\n\u003c/div>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(5题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">HTTPS 是怎么保证安全的？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">三个目标对应三套机制——对称加密保证机密性，AEAD / MAC 保证完整性，证书 + CA 签名保证身份认证。密钥通过非对称加密在握手期安全协商出来。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">为什么不全程用非对称加密？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">非对称运算慢 2~3 个数量级，且 RSA 密钥交换无前向安全（私钥泄露后历史流量可被解密）。混合加密只在握手期用非对称，数据全走对称，兼顾安全与性能。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">TLS 握手里证书起什么作用？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">证明「你连的服务器确实持有该域名的私钥」。客户端用预置的根 CA 公钥逐层验签回溯到根，并校验域名与有效期；任何一环不过就告警。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">中间人攻击如何发生，HTTPS 怎么防？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">攻击者冒充服务端与客户端握手。HTTPS 靠证书链校验阻断——攻击者拿不到受信任 CA 签发的该域名证书，握手即失败，除非用户手动信任了伪造证书。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">TLS 1.3 相比 1.2 主要改了什么？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">握手从 2-RTT 降到 1-RTT（会话复用 0-RTT），废除 RSA 与静态 DH 强制前向安全，删除 CBC / SHA-1 等弱算法只留 AEAD，并尽早加密握手报文。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(4条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：HTTPS 绝对安全。它防的是传输链路上的窃听、篡改与冒充；服务器被入侵、应用有 XSS / SQL 注入，HTTPS 一概不管。\u003c/li>\n\u003cli>误区：HTTPS 无法被抓包。装了抓包工具的根证书后就能解密——能解密的前提是「你信任了它」，而非协议有漏洞。\u003c/li>\n\u003cli>误区：有证书就等于身份认证通过。还要校验域名匹配、有效期、签发链与吊销状态；任一不过浏览器仍会告警。\u003c/li>\n\u003cli>误区：HTTPS 很慢。真正的开销是握手 RTT，加密本身的 CPU 成本在 AES-NI 下可忽略；会话复用与 TLS 1.3 已把 RTT 压到 1 甚至 0。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["http","tcp"],"excerpt":"HTTP over TLS：先用混合加密解决窃听与篡改，再用证书链解决冒充，最后用会话复用与 TLS 1.3 把多出来的 RTT 省回去。","featured":"","order":0,"group":1,"groupNum":"Ⅱ","groupName":"架构与系统设计","groupRank":2,"groupLayout":"spread"},"hot100-二分":{"id":"hot100-二分","title":"Hot100-二分","type":"moc","category":"leetcode","file":"notes/Hot100-二分.md","accent":"#FFD600","accentInk":"#F5A600","catLabel":"LeetCode","mtime":"2026-09-05T09:27:18.393Z","html":"\u003ch1>Hot100-二分\u003c/h1>\n\u003cp>二分套路题。（待填）\u003c/p>\n","links":[],"excerpt":"二分套路题。（待填）","featured":"","order":0,"group":3,"groupNum":"Ⅳ","groupName":"算法","groupRank":0,"groupLayout":"index"},"hot100-二叉树":{"id":"hot100-二叉树","title":"Hot100-二 003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">抽象结构 \u003cspan class=\"chain-pill\">模型\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">主内存 / 工作内存\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">三大问题 \u003cspan class=\"chain-pill\">成因\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">可见 / 原子 / 有序\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">happens-before \u003cspan class=\"chain-pill\">核心\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">8 条规则\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">重排序 \u003cspan class=\"chain-pill\">原理\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">三类 + as-if-serial\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>JMM(Java Memory Model)是 JSR-133 定义的\u003cstrong>规范\u003c/strong>,不是某块内存 → 规定线程与主内存如何交互 → 用 happens-before 回答「A 的写对 B 是否可见」 → 用禁止特定重排序保证有序 → \u003ca class=\"wikilink\" data-target=\"volatile\">volatile\u003c/a>、\u003ca class=\"wikilink\" data-target=\"synchronized\">synchronized\u003c/a> 的语义都由它背书。\u003c/p>\n\u003c/details>\u003ch2>抽象结构\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>概念\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>主内存\u003c/td>\n\u003ctd>所有共享变量的归属地(对应堆 / 方法区)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工作内存\u003c/td>\n\u003ctd>每个线程私有的变量副本(是抽象,不是区域)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>交互动作\u003c/td>\n\u003ctd>lock / unlock / read / load / use / assign / store / write,8 种各自原子\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">工作内存不是内存区域\u003c/div>\u003cp>它是对 CPU 缓存、写缓冲区、寄存器以及 JIT 优化后变量驻留寄存器的\u003cstrong>抽象\u003c/strong>。别去 JVM 里找「工作内存在哪」——栈、TLAB 都不是它。内存\u003cstrong>布局\u003c/strong>看 \u003ca class=\"wikilink\" data-target=\"jvm-运行时数据区\">JVM 运行时数据区\u003c/a>,两回事。\u003c/p>\n\u003c/div>\n\u003ch2>三大问题\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>问题\u003c/th>\n\u003cth>表现\u003c/th>\n\u003cth>JMM 的承诺\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>可见性\u003c/td>\n\u003ctd>A 改了,B 读到旧副本\u003c/td>\n\u003ctd>volatile / 锁 / final 安全发布\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>有序性\u003c/td>\n\u003ctd>代码顺序被重排,DCL 拿到半初始化对象\u003c/td>\n\u003ctd>内存屏障 + happens-before\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>原子性\u003c/td>\n\u003ctd>\u003ccode>i++\u003c/code> 三步被插空\u003c/td>\n\u003ctd>锁 / \u003ca class=\"wikilink\" data-target=\"cas-与原子类\">CAS 与原子类\u003c/a>;JMM 只保 8 个交互动作\u003cstrong>各自\u003c/strong>原子\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>happens-before（8 条）\u003c/h2>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">它是可见性判据,不是时间先后\u003c/div>\u003cp>A happens-before B ≠ A 在时间上先发生。它表示 \u003cstrong>A 的结果对 B 可见,且 A 不会被重排到 B 之后\u003c/strong>。时间上先发生、但无 hb 关系,读到的仍可能是旧值。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>规则\u003c/th>\n\u003cth>内容\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>程序次序\u003c/td>\n\u003ctd>单线程内,前面的操作 hb 后面的操作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>管程锁定\u003c/td>\n\u003ctd>对同一锁的 unlock hb 后续对同一锁的 lock\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>volatile 变量\u003c/td>\n\u003ctd>volatile 写 hb 后续对该变量的读\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>线程启动\u003c/td>\n\u003ctd>\u003ccode>Thread.start()\u003c/code> hb 该线程内的任何操作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>线程终止\u003c/td>\n\u003ctd>线程内任何操作 hb 其他线程 \u003ccode>join()\u003c/code> 返回\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>线程中断\u003c/td>\n\u003ctd>调 \u003ccode>interrupt()\u003c/code> hb 被中断线程检测到中断\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>对象终结\u003c/td>\n\u003ctd>构造器结束 hb \u003ccode>finalize()\u003c/code> 开始\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>传递性\u003c/td>\n\u003ctd>A hb B 且 B hb C ⇒ A hb C\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">写线程 \u003cspan class=\"chain-pill\">①\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">x=1; flag=true(volatile)\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">规则一 \u003cspan class=\"chain-pill\">②\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">程序次序:x=1 hb flag=true\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">规则二 \u003cspan class=\"chain-pill\">③\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">volatile 写 hb 后续 volatile 读\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">读线程 \u003cspan class=\"chain-pill\">④\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">读到 flag 为 true ⇒ x 必为 1\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">传递性是最实用的一条\u003c/div>\u003cp>写线程在 volatile 写\u003cstrong>之前\u003c/strong>的所有普通写,都跟着这条 volatile 写一起对读线程可见。这就是「借一个 volatile 变量发布一组成果」的原理(状态机结果、CopyOnWrite 快照发布都靠它)。\u003c/p>\n\u003c/div>\n\u003ch2>重排序\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>层次\u003c/th>\n\u003cth>谁做的\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>编译器优化重排\u003c/td>\n\u003ctd>javac / JIT(不改语义的前提下调换顺序)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>指令级并行重排\u003c/td>\n\u003ctd>CPU 乱序执行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>内存系统重排\u003c/td>\n\u003ctd>写缓冲区 / 缓存一致性导致的可见延迟(表现为「看起来乱序」)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">as-if-serial 是底线\u003c/div>\u003cp>单线程内不管怎么重排,\u003cstrong>执行结果必须与顺序执行一致\u003c/strong>;有数据依赖的语句(\u003ccode>a=1; b=a;\u003c/code>)不会被重排。多线程没有这个兜底,得自己用 hb 关系建立。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">缺 hb 就是数据竞争\u003c/div>\u003cp>两个线程一读一写同一变量且之间没有 hb 关系 → 数据竞争 → 读到的值未定义(旧值、新值都可能,甚至看到撕裂的中间态)。\u003c/p>\n\u003c/div>\n\u003ch2>与各原语的落点\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>原语\u003c/th>\n\u003cth>在 JMM 里的落点\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ca class=\"wikilink\" data-target=\"volatile\">volatile\u003c/a>\u003c/td>\n\u003ctd>volatile 变量规则 + 4 类内存屏障(StoreStore/StoreLoad/LoadLoad/LoadStore)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca class=\"wikilink\" data-target=\"synchronized\">synchronized\u003c/a>\u003c/td>\n\u003ctd>管程锁定规则:unlock 前的所有写,对后续 lock 全可见\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>final 字段\u003c/td>\n\u003ctd>构造器中正确初始化后无同步即可被其他线程看到(前提是 \u003ccode>this\u003c/code> 不逸出)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca class=\"wikilink\" data-target=\"cas-与原子类\">CAS 与原子类\u003c/a>\u003c/td>\n\u003ctd>volatile 读 + CAS 写,语义等价于 volatile 变量规则\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>线程协作\u003c/td>\n\u003ctd>\u003ca class=\"wikilink\" data-target=\"进程与线程\">进程与线程\u003c/a> 的 start/join 对应线程启动 / 终止规则\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(4题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">什么是 JMM？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">Java 内存模型,JSR-133 定义的规范。它规定线程如何与主内存交互、一个线程的写何时对另一个线程可见,目的是屏蔽硬件与编译器差异,给 Java 程序一套跨平台一致的并发语义。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">happens-before 是时间上的先后吗？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">不是。它是一组\u003cstrong>偏序规则\u003c/strong>:A hb B 表示 A 的结果对 B 可见且 A 不会被重排到 B 之后。时间上先发生但无 hb 关系,读到的仍可能是旧值。常用的是程序次序、管程锁定、volatile 变量与传递性。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">volatile 写之前的普通变量,读线程为什么也能看到？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">三条串起来——程序次序让普通写 hb volatile 写;volatile 变量规则让 volatile 写 hb 读线程的 volatile 读;程序次序再传到读线程后续操作。由传递性,普通变量也就可见了。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">为什么双重检查单例在 JDK 5 之前不安全？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">JSR-133 之前 volatile 不禁止重排序,\u003ccode>instance = new Singleton()\u003c/code> 的「赋值引用」可能排到「初始化」之前,其他线程拿到未初始化的对象。JDK 5 加强 volatile 语义后 DCL 才成立。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(3条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：happens-before = 先发生。它约束的是可见性与有序性,不是墙钟时间。\u003c/li>\n\u003cli>误区：JMM 描述堆和栈怎么放。它描述的是\u003cstrong>访问协议\u003c/strong>;内存布局属于 \u003ca class=\"wikilink\" data-target=\"jvm-运行时数据区\">JVM 运行时数据区\u003c/a>。\u003c/li>\n\u003cli>误区：单线程也有可见性问题。单线程内 as-if-serial 保证结果与顺序执行一致,可见性问题只在多线程共享时出现。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["volatile","synchronized","jvm-运行时数据区","cas-与原子类","进程与线程"],"excerpt":"JMM(Java Memory Model)是 JSR-133 定义的**规范**,不是某块内存 → 规定线程与主内存如何交互 → 用 happens-before 回答「A 的写对 B 是否可见」 → 用禁止特定重排序保证有序 → volatile、synchronized 的语义都由它背书。","featured":"","order":0,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":3,"groupLayout":"tiles"},"jvm-垃圾回收":{"id":"jvm-垃圾回收","title":"JVM 垃圾回收","type":"note","category":"jvm","file":"notes/JVM 垃圾回收.md","accent":"#FF5252","accentInk":"#D32F2F","catLabel":"JVM","mtime":"2026-09-05T09:27:18.393Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">判活 \u003cspan class=\"chain-pill\">根基\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">谁算垃圾\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">回收算法 \u003cspan class=\"chain-pill\">手段\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">清除 · 复制 · 整理\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">收集器演进 \u003cspan class=\"chain-pill\">落地\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">吞吐 → 低延迟\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">调优与排障 \u003cspan class=\"chain-pill\">收尾\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">日志 · 症状\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>先定「谁是垃圾」（GC Roots 可达性）→ 分代假设决定每代用哪种算法 → 收集器沿「吞吐优先 → 低延迟」一路演进 → 最后落到 GC 日志与症状排查。\u003c/p>\n\u003c/details>\u003ch2>判活：谁算垃圾\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>判活方案\u003c/th>\n\u003cth>原理\u003c/th>\n\u003cth>缺陷\u003c/th>\n\u003cth>采用方\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>引用计数\u003c/td>\n\u003ctd>对象被引用 +1，引用断开 -1，为 0 即回收\u003c/td>\n\u003ctd>循环引用永不归零；不能移动对象\u003c/td>\n\u003ctd>Python / COM 计数打底；\u003ca class=\"wikilink\" data-target=\"jvm\">JVM\u003c/a> 不用，理由见 \u003ca class=\"wikilink\" data-target=\"引用计数\">引用计数\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可达性分析\u003c/td>\n\u003ctd>从 GC Roots 出发，不可达即垃圾\u003c/td>\n\u003ctd>标记有成本，需 STW 起点\u003c/td>\n\u003ctd>HotSpot 及主流 JVM\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">不用引用计数，不只是因为循环引用\u003c/div>\u003cp>环只是导火索。真正的账是：每次引用赋值都要维护计数（写屏障摊到最高频操作上）、没有反向引用信息所以不能移动对象（复制 / 整理 / 分代全废）。完整对比见 \u003ca class=\"wikilink\" data-target=\"引用计数\">引用计数\u003c/a>。\u003c/p>\n\u003c/div>\n\u003cp>GC Roots 的集合：\u003c/p>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>根\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>虚拟机栈中的引用\u003c/td>\n\u003ctd>各线程栈帧的局部变量表，正在执行的方法用到谁谁就是根\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>静态变量\u003c/td>\n\u003ctd>方法区中类的 static 字段\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>常量引用\u003c/td>\n\u003ctd>运行时常量池里的引用（如字符串常量）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>JNI 引用\u003c/td>\n\u003ctd>native 代码持有的对象\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>其他\u003c/td>\n\u003ctd>持锁对象、JMXBean、类加载器本身等\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">可达 ≠ 存活，不可达 ≠ 立即死\u003c/div>\u003cp>强引用链可达就绝对不回收；不可达对象还要经过「两次标记」——第一次标记后若重写了 \u003ccode>finalize()\u003c/code> 且未被调用过，会被 F-Queue 拖着做最后自救（重新挂上引用链），第二次标记才真正回收。\u003ccode>finalize()\u003c/code> 已被 JDK 9 废弃，自救机制不要依赖。\u003c/p>\n\u003c/div>\n\u003cp>四种引用强度，强弱决定「什么时候才轮到它被回收」：\u003c/p>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>引用\u003c/th>\n\u003cth>语义\u003c/th>\n\u003cth>回收时机\u003c/th>\n\u003cth>典型用途\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>强引用\u003c/td>\n\u003ctd>普通赋值 \u003ccode>Object o = x\u003c/code>\u003c/td>\n\u003ctd>只要可达就永不回收\u003c/td>\n\u003ctd>绝大多数业务代码\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>软引用 SoftReference\u003c/td>\n\u003ctd>内存不足才让路\u003c/td>\n\u003ctd>抛 OOM 前回收\u003c/td>\n\u003ctd>内存敏感缓存\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>弱引用 WeakReference\u003c/td>\n\u003ctd>活到下次 GC 为止\u003c/td>\n\u003ctd>一旦 GC 立即回收\u003c/td>\n\u003ctd>\u003ccode>ThreadLocalMap\u003c/code> 的 key、WeakHashMap\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>虚引用 PhantomReference\u003c/td>\n\u003ctd>形同虚设，只管通知\u003c/td>\n\u003ctd>随时可回收\u003c/td>\n\u003ctd>堆外内存回收的 Cleaner 信号\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">ThreadLocal 泄漏的根源就在弱引用\u003c/div>\u003cp>\u003ccode>ThreadLocalMap.Entry\u003c/code> 的 key 是弱引用（保证 ThreadLocal 本体可回收），但 \u003cstrong>value 仍被 Entry 的强引用字段死死拉住\u003c/strong>——只要线程存活、Entry 不被清理，value 就永远可达。弱引用救不了 value，\u003ccode>remove()\u003c/code> 才是正解。\u003c/p>\n\u003c/div>\n\u003ch2>回收算法\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>算法\u003c/th>\n\u003cth>流程\u003c/th>\n\u003cth>优点\u003c/th>\n\u003cth>缺点\u003c/th>\n\u003cth>适合\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>标记-清除\u003c/td>\n\u003ctd>标记存活 → 直接清除死对象\u003c/td>\n\u003ctd>简单，对象多死快时高效\u003c/td>\n\u003ctd>内存碎片；效率随对象量下降\u003c/td>\n\u003ctd>CMS 老年代\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>标记-复制\u003c/td>\n\u003ctd>存活者复制到另一半空间，整块清空\u003c/td>\n\u003ctd>无碎片，分配快（指针碰撞）\u003c/td>\n\u003ctd>空间浪费一半；存活多则复制开销大\u003c/td>\n\u003ctd>新生代（朝生夕死）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>标记-整理\u003c/td>\n\u003ctd>标记存活 → 向一端移动\u003c/td>\n\u003ctd>无碎片，不浪费空间\u003c/td>\n\u003ctd>移动对象要停顿更新引用\u003c/td>\n\u003ctd>老年代\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">算法选择由分代假设决定\u003c/div>\u003cp>「绝大多数对象朝生夕死」→ 新生代用复制（存活者少，复制便宜）；「老对象大概率继续活」→ 老年代用标记-清除或标记-整理（复制 90% 存活对象不划算）。分代的前提见 \u003ca class=\"wikilink\" data-target=\"jvm-运行时数据区\">JVM 运行时数据区\u003c/a> 的堆内布局。\u003c/p>\n\u003c/div>\n\u003cdetails>\u003csummary>展开思维导图\u003c/summary>\u003cdiv class=\"mermaid\" data-mm-type=\"mindmap\">mindmap\n  root((垃圾回收))\n    判活\n      可达性分析\n        GC Roots\n        引用强度四档\n    算法\n      标记-清除\n      标记-复制\n      标记-整理\n    分代与晋升\n      新生代 Minor GC\n      老年代 Full GC\n      晋升 阈值 · 动态年龄 · 大对象\n      跨代引用 卡表 · 记忆集\n    收集器\n      CMS\n      G1\n      ZGC · Shenandoah\n\u003c/div>\n\u003c/details>\u003ch2>对象晋升与跨代引用\u003c/h2>\n\u003cp>Minor GC 只扫新生代，靠「晋升 + 卡表」兜住两件易漏的事：Survivor 放不下的对象去哪、老年代引用新生代的对象怎么不被误判为垃圾。\u003c/p>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>机制\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>晋升阈值\u003c/td>\n\u003ctd>熬过 \u003ccode>MaxTenuringThreshold\u003c/code>（默认 15）次 Minor GC 仍存活 → 移入老年代\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>动态年龄判断\u003c/td>\n\u003ctd>Survivor 中同龄对象之和超一半时，该年龄及以上整体晋升，不必等满 15\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>大对象直入\u003c/td>\n\u003ctd>超阈值对象免复制直接进老年代；G1 里是 Humongous Region\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>分配担保\u003c/td>\n\u003ctd>Minor GC 前评估老年代连续空间，不足则降级 / 触发 Full GC（担保失败）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>卡表 + 写屏障\u003c/td>\n\u003ctd>老年代按 ~512B 分卡，引用赋值处写屏障标脏该卡；Minor GC 只遍历脏卡找跨代引用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>记忆集 RSet\u003c/td>\n\u003ctd>G1 每个 Region 维护「谁引用了我」的集合，回收前按 RSet 反查，不必扫全堆\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">Minor GC 为什么不用扫整个老年代？\u003c/div>\u003cp>老年代对象可能持有新生代引用，若每次 Minor GC 都从全部老年代对象出发遍历，等于把「只收新生代」的省时全部还回去。卡表（Card Table）把「老年代哪些卡块可能含跨代引用」记成位图，靠引用赋值处的写屏障实时标脏，Minor GC 只扫脏卡。答「Minor GC 是否关心老年代」别一刀切说「不关心」。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">晋升失败会连坐成 Full GC\u003c/div>\u003cp>Minor GC 后存活对象要搬进老年代，若连续空间不足（分配担保失败），整场收集会退化成代价高得多的 Full GC。线上「Minor GC 频繁 + 伴随 Full GC 尖刺」时先查晋升量是否异常，而不是上来就调大堆。\u003c/p>\n\u003c/div>\n\u003ch2>并发标记与三色标记\u003c/h2>\n\u003cp>主流收集器都要把标记与用户线程并发执行，靠三色抽象追踪进度：\u003c/p>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>颜色\u003c/th>\n\u003cth>含义\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>白\u003c/td>\n\u003ctd>尚未访问，标记结束仍是白 → 回收\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>灰\u003c/td>\n\u003ctd>自身已标，成员引用还没扫完\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>黑\u003c/td>\n\u003ctd>自身与成员都已扫完，确认存活\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>并发期间用户线程改引用会产生两类漏标风险：\u003cstrong>新增引用\u003c/strong>（黑→白）与\u003cstrong>删除引用\u003c/strong>（灰→白断开）。两种修复思路：\u003c/p>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方案\u003c/th>\n\u003cth>手段\u003c/th>\n\u003cth>代价\u003c/th>\n\u003cth>采用者\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>增量更新\u003c/td>\n\u003ctd>黑新增指向白时，把黑记下来重扫\u003c/td>\n\u003ctd>重新标记阶段 STW 更长\u003c/td>\n\u003ctd>CMS\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>原始快照 SATB\u003c/td>\n\u003ctd>并发开始时拍快照，期间被删的白按快照存活\u003c/td>\n\u003ctd>产生浮动垃圾\u003c/td>\n\u003ctd>G1\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">浮动垃圾不是错误\u003c/div>\u003cp>SATB 宁可把「并发期间死了的对象」留到下一轮（浮动垃圾），也不漏标活对象——正确性优先于及时性，这个取舍是 G1 能并发标记的前提。\u003c/p>\n\u003c/div>\n\u003ch2>收集器演进\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>收集器\u003c/th>\n\u003cth>作用区\u003c/th>\n\u003cth>算法\u003c/th>\n\u003cth>目标\u003c/th>\n\u003cth>状态\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Serial\u003c/td>\n\u003ctd>新生代\u003c/td>\n\u003ctd>复制\u003c/td>\n\u003ctd>单线程，简单高效\u003c/td>\n\u003ctd>客户端/小内存\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ParNew\u003c/td>\n\u003ctd>新生代\u003c/td>\n\u003ctd>复制\u003c/td>\n\u003ctd>Serial 的多线程版\u003c/td>\n\u003ctd>配 CMS 的搭档\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Parallel Scavenge\u003c/td>\n\u003ctd>新生代\u003c/td>\n\u003ctd>复制\u003c/td>\n\u003ctd>吞吐量优先\u003c/td>\n\u003ctd>JDK 8 默认（配 Parallel Old）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Serial Old\u003c/td>\n\u003ctd>老年代\u003c/td>\n\u003ctd>标记-整理\u003c/td>\n\u003ctd>单线程\u003c/td>\n\u003ctd>CMS 失败后备\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Parallel Old\u003c/td>\n\u003ctd>老年代\u003c/td>\n\u003ctd>标记-整理\u003c/td>\n\u003ctd>吞吐量优先\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CMS\u003c/td>\n\u003ctd>老年代\u003c/td>\n\u003ctd>标记-清除\u003c/td>\n\u003ctd>最短停顿\u003c/td>\n\u003ctd>JDK 9 弃用，14 移除\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G1\u003c/td>\n\u003ctd>全堆\u003c/td>\n\u003ctd>Region 化，整体标记-整理、局部复制\u003c/td>\n\u003ctd>可预测停顿\u003c/td>\n\u003ctd>JDK 9+ 默认\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ZGC\u003c/td>\n\u003ctd>全堆\u003c/td>\n\u003ctd>着色指针 + 读屏障\u003c/td>\n\u003ctd>停顿 &lt;1ms，TB 级堆\u003c/td>\n\u003ctd>JDK 15 转正；21 引入分代（JEP 439）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Shenandoah\u003c/td>\n\u003ctd>全堆\u003c/td>\n\u003ctd>并发整理（转发指针 + 读屏障）\u003c/td>\n\u003ctd>停顿与堆大小无关\u003c/td>\n\u003ctd>JDK 15 转正（JEP 379）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">Serial \u003cspan class=\"chain-pill\">起点\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">单线程 STW\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">Parallel \u003cspan class=\"chain-pill\">JDK 8 默认\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">多线程换吞吐\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">CMS \u003cspan class=\"chain-pill\">先驱\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">并发标记换低停顿\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">G1 \u003cspan class=\"chain-pill\">现役默认\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">Region 分治 · 可预测停顿\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">ZGC \u003cspan class=\"chain-pill\">大堆未来\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">读屏障 · 停顿亚毫秒\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">ZGC vs Shenandoah：低延迟双雄怎么选\u003c/div>\u003cp>两者都靠「把标记与整理并发化」换停顿，停顿都不随堆增大而恶化。ZGC 用\u003cstrong>着色指针\u003c/strong>在指针上编码状态，Shenandoah 用**转发指针（Brooks Pointer）**做并发整理，实现更简单。版本线：ZGC 21 起分代、23 分代默认、24 移除非分代；Shenandoah 分代 24 引入、25 转正（默认仍单代）。选型看发行版与维护偏好，Oracle 系 ZGC 更亲，Red Hat 系 Shenandoah 更亲。\u003c/p>\n\u003c/div>\n\u003cdetails>\u003csummary>展开时间线\u003c/summary>\u003cdiv class=\"mermaid\" data-mm-type=\"timeline\">timeline\n  title 收集器演进\n  JDK 8 : Parallel 吞吐优先（默认）\n        : CMS 低停顿（已现碎片与并发失败）\n  JDK 9 : G1 转正默认\n  JDK 14 : CMS 正式移除\n  JDK 15 : ZGC 生产可用，亚毫秒停顿\n        : Shenandoah 转正（JEP 379）\n  JDK 21 : ZGC 引入分代模式（JEP 439）\n  JDK 23 : 分代 ZGC 转默认（JEP 474）\n  JDK 24 : 移除不分代 ZGC（JEP 490）\n\u003c/div>\n\u003c/details>\u003ch3>CMS：为低停顿付出的代价\u003c/h3>\n\u003cp>四阶段：初始标记（STW，只标 Roots 直连）→ 并发标记 → 重新标记（STW，增量更新修正）→ 并发清除。\u003c/p>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">并发失败是 CMS 的死穴\u003c/div>\u003cp>并发阶段用户线程还在分配，老年代预留空间不足即 \u003ccode>Concurrent Mode Failure\u003c/code>，退化成 Serial Old 单线程整理，停顿反而远超平时。参数 \u003ccode>-XX:CMSInitiatingOccupancyFraction\u003c/code> 调的就是「多早开始回收」的赌注。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">标记-清除注定碎片化\u003c/div>\u003cp>CMS 不移动对象，碎片积累到放不下大对象时提前触发 Full GC；JDK 9 起被 G1 取代的直接原因就在这。\u003c/p>\n\u003c/div>\n\u003ch3>G1：Region 分治\u003c/h3>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>机制\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Region\u003c/td>\n\u003ctd>堆切成 2048 个左右等大 Region，Eden / Survivor / Old / Humongous 只是角色标签，不是物理连续区\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Humongous\u003c/td>\n\u003ctd>≥ Region 一半的对象独占连续 Region，直接进老年代区\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>回收价值优先\u003c/td>\n\u003ctd>优先回收「垃圾占比高、回收收益大」的 Region 集（Garbage First 之名由此）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>停顿预测模型\u003c/td>\n\u003ctd>\u003ccode>-XX:MaxGCPauseMillis=200\u003c/code>，据此决定每轮收集多少 Region\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">G1 的调优入口只有一个\u003c/div>\u003cp>先只设 \u003ccode>-Xms\u003c/code> / \u003ccode>-Xmx\u003c/code> 与 \u003ccode>MaxGCPauseMillis\u003c/code>，让自适应模型工作；Region 数量、并发线程等交给 JVM 推导，手动干预越多越难对齐停顿目标。\u003c/p>\n\u003c/div>\n\u003ch2>调优与排障\u003c/h2>\n\u003cfigure class=\"code\" data-lang=\"bash\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">BA\u003c/span>\u003cspan class=\"code-lang\">BASH\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\"># GC 日志（JDK 9+ 统一日志）\u003c/span>\u003c/span>\u003cspan class=\"ln\">java -Xms4g -Xmx4g -XX:+UseG1GC \\\u003c/span>\u003cspan class=\"ln\">     -Xlog:gc*,gc+heap=debug:file=gc.log:\u003cspan class=\"hljs-keyword\">time\u003c/span>,\u003cspan class=\"hljs-built_in\">uptime\u003c/span>,level,tags:filecount=5,filesize=20m \\\u003c/span>\u003cspan class=\"ln\">     -jar app.jar\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">4 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>症状\u003c/th>\n\u003cth>首查方向\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Minor GC 频繁且晋升量大\u003c/td>\n\u003ctd>新生代偏小 / 存活对象被过早晋升，看 Survivor 使用率与年龄分布\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Full GC 频繁\u003c/td>\n\u003ctd>老年代泄漏（\u003ccode>jmap -histo\u003c/code> / MAT 看支配树）或元空间涨（动态类生成）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>单次 Full GC 特别长\u003c/td>\n\u003ctd>老年代过大堆上的整理停顿，考虑 G1 / ZGC 分而治之\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Concurrent Mode Failure\u003c/code>\u003c/td>\n\u003ctd>CMS 预留不足，调低触发阈值或换 G1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>停顿尖刺与负载相关\u003c/td>\n\u003ctd>\u003ccode>Safepoint\u003c/code> 偏头（大对象遍历、计数循环），开 \u003ccode>-Xlog:safepoint\u003c/code> 看\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">先定目标再选收集器\u003c/div>\u003cp>吞吐优先（批处理）→ Parallel；停顿可控（在线服务）→ G1；超大堆 + 亚毫秒延迟 → ZGC。目标定了，多数参数让自适应机制自己收敛。\u003c/p>\n\u003c/div>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(7题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">如何判断对象可以被回收？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">可达性分析——从 GC Roots（栈帧局部变量、静态变量、常量、JNI 引用等）出发，引用链不可达的对象可回收。引用计数因循环引用问题不被 JVM 采用。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">Minor GC、Major GC、Full GC 的区别？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">Minor GC 只收新生代，频繁且快；Major GC 通常指老年代收集（与 Full GC 常被混用）；Full GC 收整堆 + 方法区，最慢。盯 GC 问题先分清停顿来自哪一种。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">为什么新生代用复制、老年代用标记-整理？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">分代假设下新生代存活率极低，复制少量存活者代价小且无碎片；老年代存活率高，复制 90% 对象不划算，标记-整理（或清除）只处理死对象更划算。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">CMS 和 G1 的区别？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">CMS 基于标记-清除，并发清除但有碎片、有并发失败风险；G1 把堆切成 Region，按回收价值优先收集，整体标记-整理、局部复制，可用停顿目标建模，无内存碎片问题。JDK 9 起 G1 是默认。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">什么是三色标记？漏标怎么解决？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">并发标记的进度抽象：白未扫、灰扫到一半、黑扫完。漏标源于「黑新增指向白」或「灰到白的引用被删」；CMS 用增量更新（重扫黑），G1 用原始快照 SATB（按快照保活，产生浮动垃圾）。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">对象一定会分配在堆上吗？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">不一定。逃逸分析判定对象不出方法时可栈上分配甚至标量替换，压根不进堆；大对象直接进老年代（或 G1 的 Humongous Region）；TLAB 只决定堆内分配的线程私有通道，不改变「在堆上」这个事实。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">Minor GC 为什么要维护卡表（Card Table）？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">老年代对象可能引用新生代对象，若 Minor GC 每次扫根都遍历整个老年代，省时全还回去。卡表把老年代切成 ~512B 的卡，引用赋值处的写屏障把含跨代引用的卡标脏；Minor GC 只扫脏卡就能找到老年代 → 新生代的引用，不必全堆扫描。G1 在此基础上为每个 Region 维护记忆集 RSet，记录「谁引用了本 Region 的对象」，支撑按 Region 回收。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(7条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：不可达的对象立刻被回收。还要经过二次标记 / finalize 自救流程，且 finalize 已废弃，别把清理逻辑挂在它上面。\u003c/li>\n\u003cli>误区：引用计数是 JVM 的回收方式。HotSpot 从未用过，循环引用是它的死穴，可达性分析才是标准答案。\u003c/li>\n\u003cli>误区：JVM 不用引用计数只是因为循环引用。环是导火索，成本大头是写屏障与「不能移动对象」，见 \u003ca class=\"wikilink\" data-target=\"引用计数\">引用计数\u003c/a>。\u003c/li>\n\u003cli>误区：Python 是纯引用计数。循环回收靠 \u003ccode>gc\u003c/code> 模块的分代 tracing 兜底，它是 RC + tracing 混合。\u003c/li>\n\u003cli>误区：Full GC 频繁就该加大堆。内存泄漏时堆越大死得越慢，先 \u003ccode>jmap\u003c/code> / MAT 找支配树里的泄漏源，而不是扩容续命。\u003c/li>\n\u003cli>误区：CMS 被 G1 取代是因为停顿不够低。主因是标记-清除的碎片 + 并发失败退化；G1 换 Region 分治后碎片与失败模式都被解决。\u003c/li>\n\u003cli>误区：GC 日志只有出问题才开。GC 日志开销极小，生产常开；出问题再开，事故窗口里可能已经拿不到证据了。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["jvm","引用计数","jvm-运行时数据区"],"excerpt":"先定「谁是垃圾」（GC Roots 可达性）→ 分代假设决定每代用哪种算法 → 收集器沿「吞吐优先 → 低延迟」一路演进 → 最后落到 GC 日志与症状排查。","featured":"","order":6,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":2,"groupLayout":"tiles"},"jvm-运行时数据区":{"id":"jvm-运行时数据区","title":"JVM 运行时数据区","type":"note","category":"jvm","file":"notes/JVM 运行时数据区.md","accent":"#FF5252","accentInk":"#D32F2F","catLabel":"JVM","mtime":"2026-09-05T09:27:18.393Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">区域全景 \u003cspan class=\"chain-pill\">骨架\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">共享与私有两分\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">堆内布局 \u003cspan class=\"chain-pill\">主体\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">分代与对象流转\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">栈与元空间 \u003cspan class=\"chain-pill\">边界\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">栈帧 · 类元数据\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">堆外与排障 \u003cspan class=\"chain-pill\">收尾\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">直接内存 · OOM 信号\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>以「随线程生灭 / 随进程生灭」为界切开整块内存 → 堆的分代与对象流转 → 栈帧与类元数据各自的归宿 → 堆外那块不受 GC 管的地，最后落到参数与 OOM 排障。\u003c/p>\n\u003c/details>\u003ch2>区域全景\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>区域\u003c/th>\n\u003cth>归属\u003c/th>\n\u003cth>存放内容\u003c/th>\n\u003cth>溢出信号\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>程序计数器\u003c/td>\n\u003ctd>线程私有\u003c/td>\n\u003ctd>当前字节码指令地址（native 方法时为空）\u003c/td>\n\u003ctd>唯一未规定 OOM 的区域\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>虚拟机栈\u003c/td>\n\u003ctd>线程私有\u003c/td>\n\u003ctd>栈帧：局部变量表 / 操作数栈 / 动态连接 / 返回地址\u003c/td>\n\u003ctd>\u003ccode>StackOverflowError\u003c/code>；扩栈失败转 OOM\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>本地方法栈\u003c/td>\n\u003ctd>线程私有\u003c/td>\n\u003ctd>native 方法调用栈（HotSpot 与虚拟机栈合一）\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>堆\u003c/td>\n\u003ctd>线程共享\u003c/td>\n\u003ctd>对象实例、数组、字符串常量池、静态变量（JDK 7+）\u003c/td>\n\u003ctd>\u003ccode>OOM: Java heap space\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>方法区（元空间）\u003c/td>\n\u003ctd>线程共享\u003c/td>\n\u003ctd>类型信息、字段与方法字节码、运行时常量池\u003c/td>\n\u003ctd>\u003ccode>OOM: Metaspace\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>直接内存\u003c/td>\n\u003ctd>堆外\u003c/td>\n\u003ctd>NIO \u003ccode>DirectByteBuffer\u003c/code>、\u003ccode>Unsafe\u003c/code> 分配\u003c/td>\n\u003ctd>\u003ccode>OOM: Direct buffer memory\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">划分依据是生命周期，不是体积\u003c/div>\u003cp>判据是「这块内存随线程生灭还是随进程生灭」：堆虽大却共享，程序计数器只有一个字长却是私有。此视角是 \u003ca class=\"wikilink\" data-target=\"jvm\">JVM\u003c/a> 内存问题的第一刀，线程维度与 \u003ca class=\"wikilink\" data-target=\"进程与线程\">进程与线程\u003c/a> 互补，类元数据的来源见 \u003ca class=\"wikilink\" data-target=\"类加载过程\">类加载过程\u003c/a>。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">HotSpot 两栈合一\u003c/div>\u003cp>虚拟机栈与本地方法栈在 HotSpot 里是同一块内存，\u003ccode>-Xss\u003c/code> 同时决定两者大小，调它等于同时调 native 调用深度。\u003c/p>\n\u003c/div>\n\u003cdetails>\u003csummary>展开思维导图\u003c/summary>\u003cdiv class=\"mermaid\" data-mm-type=\"mindmap\">mindmap\n  root((运行时数据区))\n    线程私有\n      程序计数器\n      虚拟机栈\n      本地方法栈\n    线程共享\n      堆\n        Eden\n        Survivor\n        老年代\n      方法区\n        元空间\n        运行时常量池\n    堆外\n      直接内存\n      代码缓存\n\u003c/div>\n\u003c/details>\u003ch2>堆内布局\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>分区\u003c/th>\n\u003cth>默认占比\u003c/th>\n\u003cth>作用\u003c/th>\n\u003cth>参数\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>新生代\u003c/td>\n\u003ctd>堆的 1/3\u003c/td>\n\u003ctd>对象出生与快速回收\u003c/td>\n\u003ctd>\u003ccode>-Xmn\u003c/code> / \u003ccode>-XX:NewRatio=2\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Eden\u003c/td>\n\u003ctd>新生代 8/10\u003c/td>\n\u003ctd>绝大多数对象在此分配\u003c/td>\n\u003ctd>\u003ccode>-XX:SurvivorRatio=8\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Survivor From / To\u003c/td>\n\u003ctd>各 1/10\u003c/td>\n\u003ctd>复制算法的中转，永远空一块\u003c/td>\n\u003ctd>同上\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>老年代\u003c/td>\n\u003ctd>堆的 2/3\u003c/td>\n\u003ctd>长寿对象、大对象\u003c/td>\n\u003ctd>\u003ccode>-XX:NewRatio=2\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>对象从分配到晋升的完整路径：\u003c/p>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">栈上分配 \u003cspan class=\"chain-pill\">免入堆\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">逃逸分析判定不出方法\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">TLAB \u003cspan class=\"chain-pill\">无锁分配\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">Eden 内线程私有缓冲\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">Eden \u003cspan class=\"chain-pill\">朝生夕死\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">分配起点\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">Survivor \u003cspan class=\"chain-pill\">年龄 +1\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">Minor GC 后复制存活者\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">老年代 \u003cspan class=\"chain-pill\">长驻\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">阈值 15 / 动态年龄 / 大对象\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">TLAB 消除分配竞争\u003c/div>\u003cp>每线程先在 Eden 里占一小块（Thread Local Allocation Buffer），分配只挪指针、不加锁；\u003ccode>-XX:+UseTLAB\u003c/code> 默认开启，耗尽才走带锁的 CAS 分配。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">年龄阈值不是唯一出口\u003c/div>\u003cp>对象熬过 15 次 GC 才晋升（\u003ccode>-XX:MaxTenuringThreshold\u003c/code>），但 Survivor 中同龄对象占比过半时会触发动态年龄判定，整批提前进老年代。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">短命大对象是 Full GC 常客\u003c/div>\u003cp>超过 \u003ccode>G1HeapRegionSize\u003c/code> 一半（\u003ccode>PretenureSizeThreshold\u003c/code> 对 Serial / ParNew）的对象直接进老年代，躲开 Survivor 间反复复制。若这类对象其实很短命，老年代会被迅速填满。\u003c/p>\n\u003c/div>\n\u003ch2>元空间取代永久代\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>维度\u003c/th>\n\u003cth>永久代（≤ JDK 7）\u003c/th>\n\u003cth>元空间（JDK 8+）\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>位置\u003c/td>\n\u003ctd>JVM 堆内\u003c/td>\n\u003ctd>本地内存\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>上限\u003c/td>\n\u003ctd>\u003ccode>-XX:MaxPermSize\u003c/code> 固定\u003c/td>\n\u003ctd>默认受物理内存限制，靠 \u003ccode>-XX:MaxMetaspaceSize\u003c/code> 封顶\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>内容\u003c/td>\n\u003ctd>类元数据 + 字符串常量池 + 静态变量\u003c/td>\n\u003ctd>仅类元数据（另含运行时常量池）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>回收时机\u003c/td>\n\u003ctd>随 Full GC\u003c/td>\n\u003ctd>类加载器死亡即回收，独立于堆 GC\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">「PermGen 消失」的真实含义\u003c/div>\u003cp>JDK 7 起字符串常量池与静态变量已搬到堆，JDK 8 的元空间只留类元数据——搬走的比留下的多，这也是永久代 OOM 大幅减少的原因。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">不封顶不等于安全\u003c/div>\u003cp>CGLib、反射、热部署会持续生成新类，元空间不设 \u003ccode>-XX:MaxMetaspaceSize\u003c/code> 就会静默吃光本地内存，拖垮的不只 JVM 还有同机其他进程。\u003c/p>\n\u003c/div>\n\u003ch2>String.intern() 与字符串驻留\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>维度\u003c/th>\n\u003cth>JDK 6（池在永久代）\u003c/th>\n\u003cth>JDK 7+（池在堆）\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>首次遇到池中没有的内容\u003c/td>\n\u003ctd>复制一份进池\u003c/td>\n\u003ctd>把堆中该对象的引用记入池\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>对 new 出的串调用后拿到\u003c/td>\n\u003ctd>池中副本\u003c/td>\n\u003ctd>池中引用，即原对象本身\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>new String(x).intern() == 原串\u003c/code>\u003c/td>\n\u003ctd>恒 false\u003c/td>\n\u003ctd>池中此前无此内容时为 true\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">判据只有一条\u003c/div>\u003cp>内容已驻池 → 返回池中引用；未驻池 → 入池后返回。入池是\u003cstrong>惰性\u003c/strong>的：字面量首次被 \u003ccode>ldc\u003c/code> 解析才进池，与 \u003ca class=\"wikilink\" data-target=\"类加载过程\">类加载过程\u003c/a> 的解析时机同源，不是类加载即入。编译期可折叠的拼接（\u003ccode>&quot;a&quot;+&quot;b&quot;\u003c/code>、\u003ccode>final\u003c/code> 常量）直接就成字面量、天然驻池，运行期拼出来的串则不会。\u003c/p>\n\u003c/div>\n\u003cfigure class=\"code\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// JDK 7+ → true：引用入池，池与堆是同一对象；JDK 6 → false：入池的是副本\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">String\u003c/span> \u003cspan class=\"hljs-variable\">s\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">StringBuilder\u003c/span>(\u003cspan class=\"hljs-string\">&quot;计算机&quot;\u003c/span>).append(\u003cspan class=\"hljs-string\">&quot;软件&quot;\u003c/span>).toString();\u003c/span>\u003cspan class=\"ln\">System.out.println(s.intern() == s);\u003c/span>\u003cspan class=\"ln\"> \u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// 任何版本都 → false：&quot;java&quot; 在 HotSpot 启动阶段就已驻池\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">String\u003c/span> \u003cspan class=\"hljs-variable\">j\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">StringBuilder\u003c/span>(\u003cspan class=\"hljs-string\">&quot;ja&quot;\u003c/span>).append(\u003cspan class=\"hljs-string\">&quot;va&quot;\u003c/span>).toString();\u003c/span>\u003cspan class=\"ln\">System.out.println(j.intern() == j);\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">7 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">两题互为对照组\u003c/div>\u003cp>前者验证「引用入池」，后者验证「已驻池的内容不会被替换」。连起来回答，正好把字符串常量池从永久代搬进堆的实际影响讲全。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">驻留是笔慢账\u003c/div>\u003cp>字符串池本质是张哈希表（默认 60013 桶，JDK 7u40 起），只能变大不许缩小，intern 进去的字符串活到进程结束。拿它做大批量缓存：JDK 6 直接 \u003ccode>PermGen OOM\u003c/code>，JDK 7+ 拖慢驻留查找本身。G1 的 \u003ccode>-XX:+UseStringDeduplication\u003c/code> 能在 GC 时自动去重堆内重复串，不碰这张表。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">锁对象陷阱的根因\u003c/div>\u003cp>字面量驻池意味着 \u003ccode>&quot;x&quot;\u003c/code> 在任何模块、任何库里写出都是同一引用——这正是 \u003ca class=\"wikilink\" data-target=\"synchronized\">synchronized\u003c/a> 不能拿字符串字面量当锁对象的底层原因:锁它等于把锁作用域交到全局共享表,触发根本不知在哪的互斥或性能串扰。锁必须 \u003ccode>new Object()\u003c/code> 私有常量。\u003c/p>\n\u003c/div>\n\u003ch2>栈帧结构\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>组成\u003c/th>\n\u003cth>内容\u003c/th>\n\u003cth>要点\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>局部变量表\u003c/td>\n\u003ctd>方法参数 + 局部变量，以 slot 为单位\u003c/td>\n\u003ctd>\u003ccode>long\u003c/code> / \u003ccode>double\u003c/code> 占 2 个 slot；实例方法 slot 0 是 \u003ccode>this\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>操作数栈\u003c/td>\n\u003ctd>字节码的运算现场\u003c/td>\n\u003ctd>\u003ccode>iadd\u003c/code> 弹两个、压一个\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>动态连接\u003c/td>\n\u003ctd>指向运行时常量池的方法引用\u003c/td>\n\u003ctd>支撑多态分派\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>返回地址\u003c/td>\n\u003ctd>正常返回 / 异常出口\u003c/td>\n\u003ctd>异常走异常表，不走返回地址\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">编译期定长\u003c/div>\u003cp>局部变量表与操作数栈的最大深度在编译期就已写进 Code 属性的 \u003ccode>max_locals\u003c/code> / \u003ccode>max_stack\u003c/code>，运行时不再伸缩。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">-Xss 乘以线程数才是真实开销\u003c/div>\u003cp>1 MB 栈 × 1000 线程 ≈ 1 GB 虚拟内存。报 \u003ccode>unable to create native thread\u003c/code> 时，多半不是 CPU 不够，而是栈把地址空间吃完了——降 \u003ccode>-Xss\u003c/code> 或换线程池，别加内存。\u003c/p>\n\u003c/div>\n\u003ch2>直接内存\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>维度\u003c/th>\n\u003cth>堆内 \u003ccode>ByteBuffer\u003c/code>\u003c/th>\n\u003cth>直接内存 \u003ccode>DirectByteBuffer\u003c/code>\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>分配\u003c/td>\n\u003ctd>\u003ccode>ByteBuffer.allocate\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>allocateDirect\u003c/code> / \u003ccode>Unsafe.allocateMemory\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>位置\u003c/td>\n\u003ctd>堆（GC 直接管）\u003c/td>\n\u003ctd>本地内存（GC 只管得着那个引用壳）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>IO 拷贝\u003c/td>\n\u003ctd>写 socket 多一次到内核缓冲的复制\u003c/td>\n\u003ctd>零拷贝，省一次复制\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>回收\u003c/td>\n\u003ctd>随 GC 一起走\u003c/td>\n\u003ctd>Cleaner（虚引用）触发 \u003ccode>Unsafe.freeMemory\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>上限\u003c/td>\n\u003ctd>\u003ccode>-Xmx\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>-XX:MaxDirectMemorySize\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">池化摊薄两笔成本\u003c/div>\u003cp>直接内存分配慢、回收不即时，只适合长期复用的大缓冲。Netty 的 \u003ccode>PooledByteBufAllocator\u003c/code> 就是为摊薄这两笔成本而存在。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">堆还很空也能 OOM\u003c/div>\u003cp>\u003ccode>DirectByteBuffer\u003c/code> 对象本身只有几十字节，撑爆的是它背后的本地内存；而 Cleaner 只在老年代承压时才被触发——堆使用率 30% 时照样可能 \u003ccode>OOM: Direct buffer memory\u003c/code>。\u003c/p>\n\u003c/div>\n\u003ch2>参数与排障\u003c/h2>\n\u003cfigure class=\"code\" data-lang=\"bash\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">BA\u003c/span>\u003cspan class=\"code-lang\">BASH\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003c
