>加减计数与即时回收\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">死穴 \u003cspan class=\"chain-pill\">根因\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">循环引用永不归零\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">代价 \u003cspan class=\"chain-pill\">权衡\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">计数税 · 并发 · 不可移动\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">破环者 \u003cspan class=\"chain-pill\">对照\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">Python · COM · Swift\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">JVM 的选择 \u003cspan class=\"chain-pill\">结论\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">可达性分析\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>加减计数、即时回收看似干净，循环引用却让计数永远归不了零；补丁能救个别语言，结构性代价却躲不掉 —— 这正是 JVM 绕开它、改选可达性分析的理由。\u003c/p>\n\u003c/details>\u003ch2>机制：计数怎么工作\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>操作\u003c/th>\n\u003cth>计数变化\u003c/th>\n\u003cth>结果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>a = b\u003c/code>\u003c/td>\n\u003ctd>b +1，a 的旧值 -1\u003c/td>\n\u003ctd>赋值即维护\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>离开作用域 / 字段被覆盖\u003c/td>\n\u003ctd>-1\u003c/td>\n\u003ctd>断开即扣减\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>计数归零\u003c/td>\n\u003ctd>立即释放\u003c/td>\n\u003ctd>回收时机确定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>释放一个对象\u003c/td>\n\u003ctd>它引用的每个字段 -1\u003c/td>\n\u003ctd>可能触发级联释放\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">引用计数的优点是真实的\u003c/div>\u003cp>即时回收（引用断开那一刻就释放，析构时机可预测）、无集中 STW、堆占用低。面试只答「循环引用」一条是半个答案——它的优点同样明确，JVM 是算过账才放弃的。\u003c/p>\n\u003c/div>\n\u003ch2>死穴：循环引用\u003c/h2>\n\u003cp>两个对象互相持有，外部引用断开后各自计数仍是 1，谁都不会归零：\u003c/p>\n\u003cfigure class=\"code mini\" data-lang=\"python\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">PY\u003c/span>\u003cspan class=\"code-lang\">PYTHON\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">a = []; a.append(a); \u003cspan class=\"hljs-keyword\">del\u003c/span> a   \u003cspan class=\"hljs-comment\"># 计数 2 → 1，永不归零\u003c/span>\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">1 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cfigure class=\"code mini\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">Node\u003c/span> { Node next; }\u003c/span>\u003cspan class=\"ln\">x.next = y; y.next = x;\u003c/span>\u003cspan class=\"ln\">x = y = \u003cspan class=\"hljs-literal\">null\u003c/span>;   \u003cspan class=\"hljs-comment\">// 可达性分析下两者皆不可达 → 正常回收\u003c/span>\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">3 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">环不是边界情况，是对象图的常态\u003c/div>\u003cp>双向链表、父子节点互指、观察者注册、闭包捕获 \u003ccode>self\u003c/code>、模块与顶层函数互指——全是环。语言若把破环责任交还程序员，「自动内存管理」就只剩一半。\u003c/p>\n\u003c/div>\n\u003ch2>代价：不是「补个环检测」就完事\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>代价\u003c/th>\n\u003cth>痛点\u003c/th>\n\u003cth>对照 JVM\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>赋值计数税\u003c/td>\n\u003ctd>引用赋值最热，每次都要增减\u003c/td>\n\u003ctd>平时赋值零记账\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>并发计数税\u003c/td>\n\u003ctd>计数增减必须线程安全\u003c/td>\n\u003ctd>GIL 白嫖；去 GIL 得偏置计数硬扛\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>移动税\u003c/td>\n\u003ctd>无反向信息，移动要修全堆\u003c/td>\n\u003ctd>分代 · 复制 · 整理全靠能移动\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>头部开销\u003c/td>\n\u003ctd>计数字段人人付账\u003c/td>\n\u003ctd>对象头不带计数\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>零散释放\u003c/td>\n\u003ctd>写指针即结账，成本 ∝ 写操作数\u003c/td>\n\u003ctd>成本 ∝ 存活集，GC 期一次清算\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">前两项能削，第三项机制自带\u003c/div>\u003cp>\u003cstrong>计数税\u003c/strong> → 延迟计数 / 合并计数把加减挪到 GC 期批算，削掉大头。\n\u003cstrong>并发税\u003c/strong> → free-threaded CPython（PEP 703：3.13 实验性 → 3.14 起受支持选项，GIL 仍默认）上偏置计数 + 不朽对象 + 延迟计数三件套；账单是 AMD64 对象头从 16B 涨到约 32B（ob_tid + 本地/共享双计数 + per-object 锁）。\n\u003cstrong>移动税\u003c/strong> → 无解：复制、整理、分代复制直接出局。对照看，tracing 的写屏障只在跨代 / 并发标记时插一段固定代码，平时赋值真不记账。\u003c/p>\n\u003c/div>\n\u003ch2>破环：三种破环方案\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>采用者\u003c/th>\n\u003cth>主机制\u003c/th>\n\u003cth>谁负责破环\u003c/th>\n\u003cth>兜底\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>CPython\u003c/td>\n\u003ctd>RC 打底 + 分代 tracing（\u003ccode>gc\u003c/code> 模块只跟踪可能成环的容器对象）\u003c/td>\n\u003ctd>循环检测自动兜底\u003c/td>\n\u003ctd>环只能等 gc 跑，不再即时回收\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>COM\u003c/td>\n\u003ctd>\u003ccode>AddRef\u003c/code> / \u003ccode>Release\u003c/code> 手工计数\u003c/td>\n\u003ctd>程序员\u003c/td>\n\u003ctd>无；漏一次 Release 就泄漏，环自己拆（弱引用 / 显式 Shutdown）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Swift ARC\u003c/td>\n\u003ctd>编译器插桩计数\u003c/td>\n\u003ctd>程序员（\u003ccode>weak\u003c/code> / \u003ccode>unowned\u003c/code> 标注）\u003c/td>\n\u003ctd>无 tracing 兜底，标错就泄漏\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>JVM\u003c/td>\n\u003ctd>可达性分析\u003c/td>\n\u003ctd>无人\u003c/td>\n\u003ctd>环天然被吃掉\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">「Python 用引用计数」只是半句\u003c/div>\u003cp>真正的循环回收靠 \u003ccode>gc\u003c/code> 模块的分代 tracing 兜底。所以 CPython 是 RC + tracing 的混合体——问题从来不是「RC 还是 tracing」，而是「要不要为即时回收付两份机制的价钱」。\u003c/p>\n\u003c/div>\n\u003ch2>JVM 的选择\u003c/h2>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">正确性零负担 \u003cspan class=\"chain-pill\">首要\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">环天然被吃 · 程序员不用想谁持强引用\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">mutator 近零成本 \u003cspan class=\"chain-pill\">吞吐\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">平时赋值不带计数税\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">能移动对象 \u003cspan class=\"chain-pill\">算法空间\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">分代 · 复制 · 整理 · Region 全可用\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">缺点可工程化 \u003cspan class=\"chain-pill\">收尾\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">并发标记 · 分代 · 读屏障压停顿\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">一句话版\u003c/div>\u003cp>tracing 的缺点是「可以优化掉的成本」（集中停顿 → 并发标记、分代、Region 一步步压）；RC 的缺点是「机制自带的税」（环、计数税、不可移动）——压不下去。\u003c/p>\n\u003c/div>\n\u003ch2>Java 里还有引用计数吗\u003c/h2>\n\u003cp>有，但\u003cstrong>只在 GC 管不到的地方\u003c/strong>：\u003c/p>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>做法\u003c/th>\n\u003cth>为什么还得计数\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Netty \u003ccode>ByteBuf\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>refCnt\u003c/code> 手工 \u003ccode>retain\u003c/code> / \u003ccode>release\u003c/code>\u003c/td>\n\u003ctd>堆外内存不在堆里，tracing 扫不到\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>DirectByteBuffer\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>Cleaner\u003c/code>（虚引用）发信号触发释放\u003c/td>\n\u003ctd>同上：靠 GC 通知，不是靠计数判活\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">一条规律\u003c/div>\u003cp>引用计数在 Java 世界里只作为「GC 管辖范围之外」的手工手段出现，从不是堆内对象的判活方式。判活统统交给 \u003ca class=\"wikilink\" data-target=\"jvm-垃圾回收\">JVM 垃圾回收\u003c/a> 里的可达性分析。\u003c/p>\n\u003c/div>\n\u003cdetails>\u003csummary>展开流程图\u003c/summary>\u003cdiv class=\"mermaid\" data-mm-type=\"flowchart\">flowchart TD\n  A[判活方案] --> B[引用计数]\n  A --> C[可达性分析]\n  B --> B1[环 → 计数永不归零]\n  B --> B2[每次赋值都要维护计数]\n  B --> B3[没有反向引用信息 → 不能移动对象]\n  B1 --> B4[tracing 兜底 或 程序员手工破环]\n  C --> C1[环天然可回收]\n  C --> C2[可移动 → 分代 / 复制 / 整理 / Region]\n  C --> C3[开销集中在 GC 时机 · 可并发化]\n\u003c/div>\n\u003c/details>\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(5题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">JVM 为什么不用引用计数？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">三条账——循环引用（双向链表、父子互指、闭包捕获 self 都是环，计数永不归零）；每次引用赋值都要维护计数，这笔税摊在最高频操作上，多线程下还得原子或偏置计数；没有反向引用信息所以不能移动对象，复制 / 整理 / 分代算法全废。tracing 的集中停顿能用并发标记、分代、Region 工程化压下去，RC 的缺点是机制自带的。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">Python 用引用计数，它怎么解决循环引用？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">靠 \u003ccode>gc\u003c/code> 模块的分代循环检测兜底，只跟踪可能成环的容器对象（list / dict / 类实例等）。所以 CPython 是 RC + tracing 的混合，不是纯 RC；成环对象也不再即时回收，要等 gc 跑。（3.14 曾把 gc 改成增量式以压停顿，因生产内存压力在 3.14.5 回滚为分代。）\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">引用计数相比可达性分析有什么优点？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">回收时机确定（引用断开即释放，析构可预测）、无集中 STW、堆占用较低。代价是吞吐、破环责任，以及算法工具箱被砍掉一半。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">引用计数能不能配合压缩算法？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">几乎不能。移动对象要更新所有指向它的引用，而 RC 只记录「我引用了谁」，没有「谁引用了我」，也没有统一的引用枚举机制——复制、整理、分代都用不了。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">那 Java 里还见得到引用计数吗？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">见得到，但只在 GC 管不到的地方：Netty \u003ccode>ByteBuf\u003c/code> 的 \u003ccode>refCnt\u003c/code> 手工 \u003ccode>retain\u003c/code> / \u003ccode>release\u003c/code> 管堆外内存，\u003ccode>DirectByteBuffer\u003c/code> 用 \u003ccode>Cleaner\u003c/code>（虚引用）发信号触发释放。堆内对象的判活一律走可达性分析。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(4条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：不用引用计数只是因为循环引用。环是导火索，真正的账是每次赋值的计数税 + 不能移动对象。\u003c/li>\n\u003cli>误区：引用计数没有停顿。单次释放很分散，但一条长引用链的根断开会引发级联 Release，可能长停顿甚至爆栈（CPython 用 trashcan 机制缓解）。\u003c/li>\n\u003cli>误区：RC 一定更省内存。计数器本身占对象头，free-threaded CPython 为线程安全把头从 16B 撑到约 32B；tracing 则需要额外空闲堆做周转，两者方向不同，不是简单的谁更省。\u003c/li>\n\u003cli>误区：Python 是纯引用计数。循环回收靠 \u003ccode>gc\u003c/code> 模块的分代 tracing，本质仍是 RC + tracing 混合。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["jvm-垃圾回收"],"excerpt":"加减计数、即时回收看似干净，循环引用却让计数永远归不了零；补丁能救个别语言，结构性代价却躲不掉 —— 这正是 JVM 绕开它、改选可达性分析的理由。","featured":"","order":7,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":2,"groupLayout":"tiles"},"拒绝策略":{"id":"拒绝策略","title":"拒绝策略","type":"note","category":"juc","file":"notes/拒绝策略.md","accent":"#7C4DFF","accentInk":"#5E35B1","catLabel":"Concurrency","mtime":"2026-09-05T09:27:18.394Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">四种策略对比 \u003cspan class=\"chain-pill\">概览\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">Abort / CallerRuns / Discard / DiscardOldest\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">监控与选型 \u003cspan class=\"chain-pill\">实战\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">自定义 handler 与取舍\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>线程池饱和时的最后一道闸，默认 AbortPolicy 直接抛异常：四种策略决定「拒之门外」的姿势 —— 抛异常、请调用方自己跑，还是悄悄丢弃；选型先问业务能否承受静默丢失。\u003c/p>\n\u003c/details>\u003ch2>四种策略\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>策略\u003c/th>\n\u003cth>行为\u003c/th>\n\u003cth>适用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>AbortPolicy\u003c/td>\n\u003ctd>抛异常\u003c/td>\n\u003ctd>默认，需感知失败\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>CallerRunsPolicy\u003c/td>\n\u003ctd>调用方自行执行\u003c/td>\n\u003ctd>高吞吐、不丢任务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DiscardPolicy\u003c/td>\n\u003ctd>静默丢弃\u003c/td>\n\u003ctd>可丢的非关键任务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DiscardOldestPolicy\u003c/td>\n\u003ctd>丢最旧、重试\u003c/td>\n\u003ctd>允许牺牲旧任务\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">经验\u003c/div>\u003cp>高吞吐场景优先 CallerRunsPolicy，既能兜底又不丢任务；但会拖慢提交方，天然背压。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">注意\u003c/div>\u003cp>自定义 RejectedExecutionHandler 务必做监控告警，否则静默丢弃会掩盖故障。承接点与参数见 \u003ca class=\"wikilink\" data-target=\"threadpoolexecutor\">ThreadPoolExecutor\u003c/a>。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">陷阱\u003c/div>\u003cp>静默丢弃策略（Discard / DiscardOldest）在未配监控时会让任务丢失无感知，是线上事故的高发根因。\u003c/p>\n\u003c/div>\n\u003ch2>落地：选型与自定义\u003c/h2>\n\u003cp>拒绝策略在队列满且线程数达上限时触发，承接 \u003ca class=\"wikilink\" data-target=\"threadpoolexecutor\">ThreadPoolExecutor\u003c/a> 的执行链路。整组策略属于 \u003ca class=\"wikilink\" data-target=\"juc\">JUC\u003c/a> 并发工具包的一部分。自定义可实现 RejectedExecutionHandler 接入监控告警。\u003c/p>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(1题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">CallerRunsPolicy 有什么副作用？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">由提交任务的线程自己执行 runnable，会阻塞该线程、降低提交速率，形成天然背压。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails>\u003csummary>选型决策\u003c/summary>\u003cul>\n\u003cli>任务不可丢 + 接受降速 → CallerRunsPolicy\u003c/li>\n\u003cli>任务可丢 + 已配监控 → DiscardPolicy\u003c/li>\n\u003cli>任务可丢 + 优先新任务 → DiscardOldestPolicy\u003c/li>\n\u003cli>任务必须感知失败 → AbortPolicy（默认）\u003c/li>\n\u003c/ul>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(2条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：默认 AbortPolicy 抛异常就是 bug。它是合法失败信号，需调用方捕获处理，而非当成事故。\u003c/li>\n\u003cli>误区：CallerRunsPolicy 不丢任务就完美。它会阻塞提交线程，高负载下拖垮上游。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["threadpoolexecutor","juc"],"excerpt":"线程池饱和时的最后一道闸，默认 AbortPolicy 直接抛异常：四种策略决定「拒之门外」的姿势 —— 抛异常、请调用方自己跑，还是悄悄丢弃；选型先问业务能否承受静默丢失。","featured":"","order":3,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":3,"groupLayout":"tiles"},"死锁":{"id":"死锁","title":"死锁","type":"note","category":"juc","file":"notes/死锁.md","accent":"#7C4DFF","accentInk":"#5E35B1","catLabel":"Concurrency","mtime":"2026-09-05T09:27:18.394Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">四条件 \u003cspan class=\"chain-pill\">判定\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">缺一不可\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">复现现场 \u003cspan class=\"chain-pill\">代码\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">交叉持锁\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">定位三板斧 \u003cspan class=\"chain-pill\">排查\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">jstack/Arthas/自建检测\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">破环策略 \u003cspan class=\"chain-pill\">解法\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">破任一条件\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>死锁 = 多个线程互相持有对方要的锁,谁也不放 → 四个条件\u003cstrong>同时成立\u003c/strong>才可能发生 → 排查靠 Thread Dump 找环 → 解法是破坏任一条件,最常用固定加锁顺序与 tryLock 超时回滚。\u003c/p>\n\u003c/details>\u003ch2>四条件（缺一不可）\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>条件\u003c/th>\n\u003cth>含义\u003c/th>\n\u003cth>破坏手段\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>互斥\u003c/td>\n\u003ctd>资源同一时刻只能一个线程持有\u003c/td>\n\u003ctd>难破(锁的本质);改无锁 / 不可变 / 乐观读可绕开\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>占有且等待\u003c/td>\n\u003ctd>持有一把锁还去申请下一把\u003c/td>\n\u003ctd>一次性申请全部资源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>不可抢占\u003c/td>\n\u003ctd>已持的锁不能被强行抢走\u003c/td>\n\u003ctd>\u003ccode>tryLock(超时)\u003c/code> 主动释放已持有的锁\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>循环等待\u003c/td>\n\u003ctd>T1 等 T2 的锁,T2 等 T1 的\u003c/td>\n\u003ctd>\u003cstrong>固定加锁顺序\u003c/strong>(给锁编号,永远从小到大加)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">是必要条件,不是充分条件\u003c/div>\u003cp>四条同时成立也只是\u003cstrong>可能\u003c/strong>死锁,还要看调度时序是否真凑出环;反过来,只要死锁了,四条必然都成立。所以预防只需\u003cstrong>破一条\u003c/strong>。\u003c/p>\n\u003c/div>\n\u003ch2>复现：交叉持锁\u003c/h2>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">生产上的长相\u003c/div>\u003cp>通常不是这么直白的两把锁,而是嵌套调用链(业务锁 → 数据库连接池锁 / 远程调用),栈帧里表现为两层 \u003ccode>synchronized\u003c/code> 或两次 \u003ccode>lock()\u003c/code> 之间夹着外部调用。\u003c/p>\n\u003c/div>\n\u003cfigure class=\"code\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-keyword\">static\u003c/span> \u003cspan class=\"hljs-keyword\">final\u003c/span> \u003cspan class=\"hljs-type\">Object\u003c/span> \u003cspan class=\"hljs-variable\">A\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">Object\u003c/span>(), B = \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">Object\u003c/span>();\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-keyword\">static\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">sleep\u003c/span>\u003cspan class=\"hljs-params\">(\u003cspan class=\"hljs-type\">long\u003c/span> ms)\u003c/span> {\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">try\u003c/span> { Thread.sleep(ms); } \u003cspan class=\"hljs-keyword\">catch\u003c/span> (InterruptedException e) { Thread.currentThread().interrupt(); }\u003c/span>\u003cspan class=\"ln\">}\u003c/span>\u003cspan class=\"ln\"> \u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// T1：先 A 后 B\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">Thread\u003c/span>(() -&gt; { \u003cspan class=\"hljs-keyword\">synchronized\u003c/span> (A) { sleep(\u003cspan class=\"hljs-number\">100\u003c/span>); \u003cspan class=\"hljs-keyword\">synchronized\u003c/span> (B) { } } }, \u003cspan class=\"hljs-string\">&quot;T1&quot;\u003c/span>).start();\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// T2：先 B 后 A —— 顺序相反即成环\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">Thread\u003c/span>(() -&gt; { \u003cspan class=\"hljs-keyword\">synchronized\u003c/span> (B) { sleep(\u003cspan class=\"hljs-number\">100\u003c/span>); \u003cspan class=\"hljs-keyword\">synchronized\u003c/span> (A) { } } }, \u003cspan class=\"hljs-string\">&quot;T2&quot;\u003c/span>).start();\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">9 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">sleep 不是必需的\u003c/div>\u003cp>加 \u003ccode>sleep\u003c/code> 只是为了\u003cstrong>稳定复现\u003c/strong>(把时序拉开);真实环境靠运气撞上,这正是死锁难查的原因。\u003c/p>\n\u003c/div>\n\u003ch2>定位三板斧\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>手段\u003c/th>\n\u003cth>命令 / API\u003c/th>\n\u003cth>适用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Thread Dump\u003c/td>\n\u003ctd>\u003ccode>jstack -l &lt;pid&gt;\u003c/code> / \u003ccode>jcmd &lt;pid&gt; Thread.print\u003c/code>\u003c/td>\n\u003ctd>最通用,容器内也能用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>一键找环\u003c/td>\n\u003ctd>Arthas \u003ccode>thread -b\u003c/code>\u003c/td>\n\u003ctd>线上最快,直接打印阻塞链\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>代码内自检\u003c/td>\n\u003ctd>\u003ccode>ThreadMXBean.findDeadlockedThreads()\u003c/code>\u003c/td>\n\u003ctd>想做定时巡检 / 自愈\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>事后回放\u003c/td>\n\u003ctd>JFR / async-profiler 锁事件\u003c/td>\n\u003ctd>偶发、难复现\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">抓 dump \u003cspan class=\"chain-pill\">第一步\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">jstack -l pid &gt; dump.txt\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">找段落 \u003cspan class=\"chain-pill\">JVM 已代劳\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">搜 Found one Java-level deadlock\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">配对锁 \u003cspan class=\"chain-pill\">连出环\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">waiting to lock ↔ locked\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">回代码 \u003cspan class=\"chain-pill\">修\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">按栈帧找嵌套锁\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">dump 里认这三行\u003c/div>\u003cp>\u003ccode>Found one Java-level deadlock:\u003c/code> → 线程状态 \u003ccode>BLOCKED (on object monitor)\u003c/code> → 同一线程同时出现 \u003ccode>waiting to lock &lt;0x...&gt;\u003c/code>(想要的)与 \u003ccode>locked &lt;0x...&gt;\u003c/code>(已持有的)。把「谁 locked」和「谁 waiting to lock」连起来就是环。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">一次 dump 不够\u003c/div>\u003cp>偶发死锁要间隔 5s 抓 3~5 次,看 BLOCKED 的线程是不是\u003cstrong>同一批\u003c/strong>,排除「只是短暂竞争」。\u003c/p>\n\u003c/div>\n\u003ch2>破坏策略\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>破哪个条件\u003c/th>\n\u003cth>做法\u003c/th>\n\u003cth>代价\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>循环等待\u003c/td>\n\u003ctd>\u003cstrong>固定加锁顺序\u003c/strong>:给锁编号,永远从小到大加\u003c/td>\n\u003ctd>首选,最省力;靠编码纪律\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>不可抢占\u003c/td>\n\u003ctd>\u003ccode>tryLock(超时)\u003c/code> ,超时就回滚并释放已持有的锁再退避重试\u003c/td>\n\u003ctd>要写回滚与退避\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>占有且等待\u003c/td>\n\u003ctd>一次性拿全(转账场景先锁&quot;总账&quot;或按序转账)\u003c/td>\n\u003ctd>并发度下降\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>互斥\u003c/td>\n\u003ctd>改 \u003ca class=\"wikilink\" data-target=\"cas-与原子类\">CAS 与原子类\u003c/a> / 不可变对象 / \u003ca class=\"wikilink\" data-target=\"stampedlock\">StampedLock\u003c/a> 乐观读\u003c/td>\n\u003ctd>只适合特定场景\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">对象没有天然序号时怎么排序\u003c/div>\u003cp>用 \u003ccode>System.identityHashCode(a)\u003c/code> 比较大小决定加锁顺序;极小概率 hash 碰撞时,先抢一把全局 \u003ccode>tieLock\u003c/code>,保证同一时刻只有一个线程在操作这一对资源。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">光加 tryLock 不够\u003c/div>\u003cp>超时后必须\u003cstrong>释放已持有的锁 + 随机退避\u003c/strong>再重试。不释放就重试,等于换个姿势继续抢;同步退避则会退化成活锁。\u003c/p>\n\u003c/div>\n\u003ch2>相关故障对照\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>现象\u003c/th>\n\u003cth>线程状态\u003c/th>\n\u003cth>区别\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>死锁\u003c/td>\n\u003ctd>永久 BLOCKED\u003c/td>\n\u003ctd>互相持有,谁也不放,CPU 通常不高\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>活锁\u003c/td>\n\u003ctd>一直 RUNNABLE\u003c/td>\n\u003ctd>线程在动(不断重试 / 互相礼让),但整体不前进,CPU 可能打满\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>饥饿\u003c/td>\n\u003ctd>长期 WAITING\u003c/td>\n\u003ctd>拿得到锁但永远排不上(非公平锁插队、读锁饿死写锁)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">忘了 unlock 不是死锁\u003c/div>\u003cp>持有线程异常退出导致锁永不释放,其他线程无限 WAITING——\u003cstrong>没有环\u003c/strong>,dump 也不会标 deadlock。\u003ca class=\"wikilink\" data-target=\"reentrantlock\">ReentrantLock\u003c/a> 必须在 \u003ccode>finally{ unlock() }\u003c/code>。\u003c/p>\n\u003c/div>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(4题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">死锁的四个必要条件？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">互斥、占有且等待、不可抢占、循环等待。四条同时成立才可能死锁,破坏任意一条即可预防。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">线上怎么定位死锁？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">\u003ccode>jstack -l &lt;pid&gt;\u003c/code> 抓 Thread Dump,JVM 会直接打印 \u003ccode>Found one Java-level deadlock\u003c/code>,并列出每个线程的 \u003ccode>waiting to lock\u003c/code> / \u003ccode>locked\u003c/code> 的锁 id;线上用 Arthas \u003ccode>thread -b\u003c/code> 一键找环。偶发的间隔 5s 抓 3~5 次对比。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">怎么写一个必然死锁的例子？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">两个线程、两把锁,各自先持有一把再申请对方那把,加锁顺序相反,中间 sleep 保证时序错开,形成交叉持锁。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">怎么预防死锁？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">首选固定加锁顺序(破循环等待),其次 tryLock 超时 + 回滚已持有的锁(破不可抢占);另外缩小锁粒度、缩短持锁时间、不在持锁期间调用外部方法(开放调用)都能显著降低概率。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(3条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：四条成立就一定死锁。只是「可能」,还取决于调度时序是否恰好凑出环。\u003c/li>\n\u003cli>误区：死锁只发生在 synchronized。\u003ca class=\"wikilink\" data-target=\"reentrantlock\">ReentrantLock\u003c/a>、数据库行锁、分布式锁一样会成环,而 \u003ccode>jstack\u003c/code> 只能看到 JVM 内的锁,跨进程的环要另查。\u003c/li>\n\u003cli>误区：死锁一定伴随 CPU 飙高。阻塞在锁上的线程是 BLOCKED,不占 CPU;CPU 高更可能是活锁或自旋。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["cas-与原子类","stampedlock","reentrantlock"],"excerpt":"死锁 = 多个线程互相持有对方要的锁,谁也不放 → 四个条件**同时成立**才可能发生 → 排查靠 Thread Dump 找环 → 解法是破坏任一条件,最常用固定加锁顺序与 tryLock 超时回滚。","featured":"","order":0,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":3,"groupLayout":"tiles"},"破坏双亲委派":{"id":"破坏双亲委派","title":"破坏双亲委派","type":"note","category":"jvm","file":"notes/破坏双亲委派.md","accent":"#FF5252","accentInk":"#D32F2F","catLabel":"JVM","mtime":"2026-09-05T09:27:18.395Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">三次破坏 \u003cspan class=\"chain-pill\">全景\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">历史兼容 SPI 动态性\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">线程上下文加载器 \u003cspan class=\"chain-pill\">核心\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">父向子反向请求\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">容器隔离案例 \u003cspan class=\"chain-pill\">实战\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">Tomcat 与热部署\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>委派链被打破过三次：为兼容旧代码、为 SPI 反向请求、为容器动态性 —— 线程上下文类加载器是其中最标准的「父借子力」通道，Tomcat 则把「先己后父」做成了工程样本。\u003c/p>\n\u003c/details>\u003ch2>三次破坏\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>次序\u003c/th>\n\u003cth>原因\u003c/th>\n\u003cth>手段\u003c/th>\n\u003cth>代表场景\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>第一次\u003c/td>\n\u003ctd>委派模型是 JDK 1.2 才写进 \u003ccode>loadClass\u003c/code> 默认实现的；此前自定义加载器习惯重写 \u003ccode>loadClass\u003c/code> 直接自己加载\u003c/td>\n\u003ctd>新增 \u003ccode>findClass\u003c/code> 钩子引导新代码走委派，已重写 \u003ccode>loadClass\u003c/code> 的旧加载器\u003cstrong>不做强制迁移\u003c/strong>\u003c/td>\n\u003ctd>历史遗留加载器（仍「先自己后父」）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第二次\u003c/td>\n\u003ctd>模型自身缺陷：\u003cstrong>父加载器需要请求子加载器\u003c/strong>\u003c/td>\n\u003ctd>线程上下文类加载器 TCCL\u003c/td>\n\u003ctd>JDBC、JNDI、JCE、JAXB\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>第三次\u003c/td>\n\u003ctd>程序动态性：模块化多版本共存、热替换\u003c/td>\n\u003ctd>重排委派顺序（Tomcat 本地优先、OSGi 按声明委派），或整体丢弃重建（热部署）\u003c/td>\n\u003ctd>Tomcat、OSGi、JSP 热替换、Spring Boot devtools\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">第二次破坏是「设计缺陷」，不是「用错了」\u003c/div>\u003cp>SPI 接口（\u003ccode>java.sql.Driver\u003c/code>）由 Bootstrap 加载，但实现类（MySQL 驱动 jar）在 \u003ccode>classpath\u003c/code> 下只能由 Application 加载。按 \u003ca class=\"wikilink\" data-target=\"双亲委派模型\">双亲委派模型\u003c/a>，Bootstrap \u003cstrong>根本看不到\u003c/strong>子层加载的类 —— 委派链是单向的，模型在这里无解。\u003c/p>\n\u003c/div>\n\u003ch2>线程上下文类加载器\u003c/h2>\n\u003cp>让父层加载器可以通过线程上的一个变量，「借」子层加载器去加载类 —— 本质上是在单向委派链上开了一个反向通道。\u003c/p>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>API\u003c/th>\n\u003cth>作用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>Thread.currentThread().getContextClassLoader()\u003c/code>\u003c/td>\n\u003ctd>读取当前线程绑定的加载器\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Thread.currentThread().setContextClassLoader(cl)\u003c/code>\u003c/td>\n\u003ctd>绑定加载器到当前线程\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ServiceLoader.load(Xxx.class)\u003c/code>\u003c/td>\n\u003ctd>内部即使用 TCCL 查找 \u003ccode>META-INF/services\u003c/code> 实现\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">TCCL 的初值从哪来\u003c/div>\u003cp>main 线程的 TCCL 默认是 \u003ccode>AppClassLoader\u003c/code>；每个新线程会\u003cstrong>继承创建它的线程的 TCCL\u003c/strong>。这正是「改了不还原 = 污染线程池」的放大机制：一个池化线程被改动后，后续所有复用它的任务都拿到错误加载器。\u003c/p>\n\u003c/div>\n\u003cfigure class=\"code mini\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// ServiceLoader 的简化核心逻辑\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">ClassLoader\u003c/span> \u003cspan class=\"hljs-variable\">cl\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> Thread.currentThread().getContextClassLoader(); \u003cspan class=\"hljs-comment\">// 取 TCCL\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">Enumeration\u003c/span>&lt;URL&gt; \u003cspan class=\"hljs-variable\">resources\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> cl.getResources(\u003cspan class=\"hljs-string\">&quot;META-INF/services/&quot;\u003c/span> + service.getName());\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">3 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cfigure class=\"code\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// JNDI / SPI 的标准写法：用 TCCL 临时替换，用完必须还原\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">ClassLoader\u003c/span> \u003cspan class=\"hljs-variable\">origin\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> Thread.currentThread().getContextClassLoader();\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-keyword\">try\u003c/span> {\u003c/span>\u003cspan class=\"ln\">    Thread.currentThread().setContextClassLoader(myClassLoader);\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-type\">ServiceLoader\u003c/span>&lt;Driver&gt; \u003cspan class=\"hljs-variable\">loader\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> ServiceLoader.load(Driver.class);\u003c/span>\u003cspan class=\"ln\">} \u003cspan class=\"hljs-keyword\">finally\u003c/span> {\u003c/span>\u003cspan class=\"ln\">    Thread.currentThread().setContextClassLoader(origin); \u003cspan class=\"hljs-comment\">// 必须还原，否则污染线程\u003c/span>\u003c/span>\u003cspan class=\"ln\">}\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">8 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">TCCL 污染\u003c/div>\u003cp>改完不还原，这个线程会被后续所有任务复用，表现为类找不到或加载到错误版本。\u003ccode>finally\u003c/code> 里还原是硬性要求。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">为什么 JDBC 不再需要 \u003ccode>Class.forName\u003c/code>\u003c/div>\u003cp>JDBC 4.0 起，\u003ccode>DriverManager\u003c/code> 的静态块通过 \u003ccode>ServiceLoader\u003c/code> + TCCL 扫描 \u003ccode>META-INF/services/java.sql.Driver\u003c/code>，自动加载驱动实现。\u003ccode>Class.forName\u003c/code> 那条路依赖静态块注册，属于早期写法。对比可见 \u003ca class=\"wikilink\" data-target=\"类加载过程\">类加载过程\u003c/a>。\u003c/p>\n\u003c/div>\n\u003cdetails>\u003csummary>展开时序图\u003c/summary>\u003cdiv class=\"mermaid\" data-mm-type=\"sequenceDiagram\">sequenceDiagram\n    participant App as 应用代码\n    participant DM as DriverManager&lt;br>Bootstrap 加载\n    participant TC as 线程 TCCL\n    participant SL as ServiceLoader\n    participant My as MySQL Driver&lt;br>classpath\n    App->>DM: getConnection(url)\n    DM->>SL: load(Driver.class)\n    SL->>TC: getContextClassLoader()\n    TC-->>SL: AppClassLoader\n    SL->>My: 扫描 META-INF/services 并实例化\n    My-->>DM: registerDriver(this)\n    DM-->>App: 返回连接\n\u003c/div>\n\u003c/details>\u003ch2>容器隔离案例\u003c/h2>\n\u003cp>Tomcat 在委派链里给 Web 应用插入了「本地优先、再委派」的反向顺序 —— 与默认模型的分叉点只在 WebApp 这一级：\u003c/p>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>加载器\u003c/th>\n\u003cth>职责\u003c/th>\n\u003cth>委派顺序\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Common\u003c/td>\n\u003ctd>Tomcat 自身 + 所有 Web 应用共享的库（\u003ccode>lib/\u003c/code>，含 \u003ccode>servlet-api.jar\u003c/code>）\u003c/td>\n\u003ctd>标准委派\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>WebApp\u003c/td>\n\u003ctd>单个应用 \u003ccode>/WEB-INF/classes\u003c/code> + \u003ccode>/WEB-INF/lib\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>本地优先\u003c/strong>，找不到才委派（例外见下）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Jasper\u003c/td>\n\u003ctd>JSP 编译后的类，挂在 WebApp 之下\u003c/td>\n\u003ctd>JSP 改动即丢弃重建\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">老「四层共享」说法已过时\u003c/div>\u003cp>老资料常画 Common → Catalina → Shared → WebApp 四层；现代 Tomcat 默认只有 Common 一个共享层（\u003ccode>catalina.jar\u003c/code> 也在其中），Catalina / Shared 只是可选的高级配置（\u003ccode>server.loader\u003c/code> / \u003ccode>shared.loader\u003c/code>），层级树为 Bootstrap → System → Common → WebApp。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">「本地优先」有强制例外\u003c/div>\u003cp>两类类永远父优先：JRE 基础类（\u003ccode>java.*\u003c/code>，沙箱保护）与 Jakarta EE API（Servlet / JSP / EL，来自 Common 的 \u003ccode>servlet-api.jar\u003c/code>）——否则每个 WebApp 各带一份同名 API，类型互不兼容；想整体切回父优先可配 \u003ccode>&lt;Loader delegate=&quot;true&quot;/&gt;\u003c/code>。\u003c/p>\n\u003c/div>\n\u003cfigure class=\"code\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// WebAppClassLoader 的简化示意（省略父缓存命中检查，例外类永远父优先见上）\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">Class\u003c/span>&lt;?&gt; \u003cspan class=\"hljs-variable\">c\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> findLoadedClass(name);\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-keyword\">if\u003c/span> (c == \u003cspan class=\"hljs-literal\">null\u003c/span>) {\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">try\u003c/span> {\u003c/span>\u003cspan class=\"ln\">        c = findClass(name);                    \u003cspan class=\"hljs-comment\">// 1. 先自己找 WEB-INF\u003c/span>\u003c/span>\u003cspan class=\"ln\">    } \u003cspan class=\"hljs-keyword\">catch\u003c/span> (ClassNotFoundException e) {\u003c/span>\u003cspan class=\"ln\">        c = \u003cspan class=\"hljs-built_in\">super\u003c/span>.loadClass(name);              \u003cspan class=\"hljs-comment\">// 2. 失败才委派给父\u003c/span>\u003c/span>\u003cspan class=\"ln\">    }\u003c/span>\u003cspan class=\"ln\">}\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">9 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">各自隔离靠命名空间\u003c/div>\u003cp>每个 Web 应用一个 \u003ccode>WebAppClassLoader\u003c/code>，同名的 Spring 5 与 Spring 4 在不同命名空间下互不干扰 —— 底层判据见 \u003ca class=\"wikilink\" data-target=\"类加载器\">类加载器\u003c/a> 的唯一性规则。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">热部署的本质是「换加载器」不是「换类」\u003c/div>\u003cp>JVM 无法卸载单个类，只能连加载器一起回收。热部署 = 丢弃旧 \u003ccode>WebAppClassLoader\u003c/code>，让它的类与实例整体不可达，再新建一个。代价：静态状态全部丢失，且\u003cstrong>类加载器泄漏\u003c/strong>（某处仍持有旧加载器的引用）是 \u003ccode>OutOfMemoryError: Metaspace\u003c/code> 的头号成因。\u003c/p>\n\u003c/div>\n\u003cdetails>\u003csummary>展开思维导图\u003c/summary>\u003cdiv class=\"mermaid\" data-mm-type=\"mindmap\">mindmap\n  root((破坏双亲委派))\n    历史兼容\n      重写 loadClass\n      findClass 引导\n    模型缺陷\n      SPI 接口在父层\n      实现在子层\n      TCCL 反向通道\n      ServiceLoader\n    程序动态性\n      Tomcat WebAppClassLoader\n      OSGi 声明式委派\n      Jasper JSP 热替换\n\u003c/div>\n\u003c/details>\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(4题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">为什么要破坏双亲委派？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">三个场景 —— 兼容 JDK 1.2 前的旧加载器；SPI 中父层接口需要加载子层实现（TCCL）；容器需要多版本隔离与热部署。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">线程上下文类加载器解决了什么问题？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">父加载器无法访问子加载器加载的类。TCCL 把子层加载器挂在线程上，\u003ccode>ServiceLoader\u003c/code> 取它来加载 SPI 实现，绕开单向委派。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">Tomcat 为什么要自定义加载器？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">一是隔离，各 Web 应用可依赖同一库的不同版本；二是热部署，换加载器即可整体替换应用的类；三是共享，Common 层避免重复加载公共库。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">JDK 9 模块化后委派模型变了吗？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">变了。加载前先判断类归属哪个模块，若模块已定义给某个加载器则直接由它加载，不再从 Application 一路往上问；Extension 加载器也改名为 Platform。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(3条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：破坏双亲委派是错误做法。它是\u003cstrong>有明确收益的设计选择\u003c/strong>，隔离与热部署都建立在此之上。\u003c/li>\n\u003cli>误区：TCCL 是加载器继承链的反向指针。它只是 \u003ccode>Thread\u003c/code> 上的一个字段，与 \u003ccode>parent\u003c/code> 链无关，且默认由创建线程继承。\u003c/li>\n\u003cli>误区：热部署能卸载单个类。JVM 只支持「连加载器一起卸载」，静态字段与已实例化对象不会保留。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["双亲委派模型","类加载过程","类加载器"],"excerpt":"委派链被打破过三次：为兼容旧代码、为 SPI 反向请求、为容器动态性 —— 线程上下文类加载器是其中最标准的「父借子力」通道，Tomcat 则把「先己后父」做成了工程样本。","featured":"","order":4,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":2,"groupLayout":"tiles"},"projects":{"id":"projects","title":"Projects","type":"moc","category":"projects","file":"notes/简历项目.md","accent":"#FF4081","accentInk":"#C60055","catLabel":"Projects","mtime":"2026-09-05T09:27:18.395Z","html":"\u003ch1>Projects\u003c/h1>\n\u003cp>真实后端项目的经历笔记。一个项目一张卡，卡下挂多个经历子笔记（按技术难点拆分），子笔记用双链指向 System Design 卷的通用机制。\u003c/p>\n\u003cul>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"easyorange\">EasyOrange\u003c/a>\u003c/li>\n\u003c/ul>\n","links":["easyorange"],"excerpt":"真实后端项目的经历笔记。一个项目一张卡，卡下挂多个经历子笔记（按技术难点拆分），子笔记用双链指向 System Design 卷的通用机制。","featured":"","order":0,"group":4,"groupNum":"Ⅴ","groupName":"简历项目","groupRank":0,"groupLayout":"feature"},"类加载":{"id":"类加载","title":"类加载","type":"moc","category":"jvm","file":"notes/类加载.md","accent":"#FF5252","accentInk":"#D32F2F","catLabel":"JVM","mtime":"2026-09-05T09:27:18.395Z","html":"\u003ch1>类加载\u003c/h1>\n\u003cp>字节码文件进入 JVM 到变成可用 Class 对象的整条链路：谁来加载、按什么规则委派、生命周期各阶段做什么、为什么这套规则会被打破。\u003c/p>\n\u003cul>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"双亲委派模型\">双亲委派模型\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"类加载过程\">类加载过程\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"类加载器\">类加载器\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"破坏双亲委派\">破坏双亲委派\u003c/a>\u003c/li>\n\u003c/ul>\n","links":["双亲委派模型","类加载过程","类加载器","破坏双亲委派"],"excerpt":"字节码文件进入 JVM 到变成可用 Class 对象的整条链路：谁来加载、按什么规则委派、生命周期各阶段做什么、为什么这套规则会被打破。","featured":"双亲委派模型","order":0,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":2,"groupLayout":"tiles"},"类加载器":{"id":"类加载器","title":"类加载器","type":"note","category":"jvm","file":"notes/类加载器.md","accent":"#FF5252","accentInk":"#D32F2F","catLabel":"JVM","mtime":"2026-09-05T09:27:18.395Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">四层加载器 \u003cspan class=\"chain-pill\">全景\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">分层职责与加载范围\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">命名空间 \u003cspan class=\"chain-pill\">核心\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">类的唯一性判据\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">数组类 \u003cspan class=\"chain-pill\">边界\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">不由加载器创建\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">自定义加载器 \u003cspan class=\"chain-pill\">落地\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">覆写 findClass 的实践\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>四个加载器各管一块地盘，而「加载器 + 全限定名」才是类的真正身份；数组类是这条规则的豁免项，自定义加载器则把规则变成可编程的能力。\u003c/p>\n\u003c/details>\u003ch2>四层加载器\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>加载器\u003c/th>\n\u003cth>实现\u003c/th>\n\u003cth>加载范围\u003c/th>\n\u003cth>\u003ccode>getParent()\u003c/code>\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Bootstrap\u003c/td>\n\u003ctd>C++ / JVM 原生（不是 Java 对象）\u003c/td>\n\u003ctd>核心库：JDK8 的 \u003ccode>rt.jar\u003c/code>（\u003ccode>jre/lib\u003c/code>）→ JDK9+ 的 \u003ccode>lib/modules\u003c/code> 运行时镜像\u003c/td>\n\u003ctd>\u003ccode>null\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Platform（JDK8: Extension）\u003c/td>\n\u003ctd>Java；JDK8 实现类 \u003ccode>sun.misc.Launcher$ExtClassLoader\u003c/code>，JDK9+ \u003ccode>ClassLoaders$PlatformClassLoader\u003c/code>\u003c/td>\n\u003ctd>JDK8 的 \u003ccode>lib/ext\u003c/code> → JDK9+ 平台模块（\u003ccode>java.sql\u003c/code> 等）\u003c/td>\n\u003ctd>Bootstrap（\u003ccode>null\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Application（System）\u003c/td>\n\u003ctd>Java；JDK8 实现类 \u003ccode>sun.misc.Launcher$AppClassLoader\u003c/code>，JDK9+ \u003ccode>ClassLoaders$AppClassLoader\u003c/code>\u003c/td>\n\u003ctd>classpath（JDK9+ 含模块路径）\u003c/td>\n\u003ctd>Platform\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>自定义\u003c/td>\n\u003ctd>继承 \u003ccode>ClassLoader\u003c/code>\u003c/td>\n\u003ctd>网络、加密字节码、热部署目录等任意来源\u003c/td>\n\u003ctd>Application\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">Bootstrap 不是 Java 对象\u003c/div>\u003cp>调 \u003ccode>String.class.getClassLoader()\u003c/code> 返回 \u003ccode>null\u003c/code>，不是「没有加载器」，而是它用 C++ 实现、不在 Java 堆里。写 \u003ccode>cl.getParent()\u003c/code> 时必须先判 null。\u003c/p>\n\u003c/div>\n\u003cfigure class=\"code\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">LoaderDemo\u003c/span> {\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">static\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">main\u003c/span>\u003cspan class=\"hljs-params\">(String[] args)\u003c/span> {\u003c/span>\u003cspan class=\"ln\">        \u003cspan class=\"hljs-type\">ClassLoader\u003c/span> \u003cspan class=\"hljs-variable\">app\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> LoaderDemo.class.getClassLoader();\u003c/span>\u003cspan class=\"ln\">        System.out.println(app);            \u003cspan class=\"hljs-comment\">// JDK 8: sun.misc.Launcher$AppClassLoader\u003c/span>\u003c/span>\u003cspan class=\"ln\">                                            \u003cspan class=\"hljs-comment\">// JDK 9+: jdk.internal.loader.ClassLoaders$AppClassLoader\u003c/span>\u003c/span>\u003cspan class=\"ln\">        System.out.println(app.getParent()); \u003cspan class=\"hljs-comment\">// JDK 8: sun.misc.Launcher$ExtClassLoader（JDK 9+ 为 PlatformClassLoader）\u003c/span>\u003c/span>\u003cspan class=\"ln\">        System.out.println(app.getParent().getParent()); \u003cspan class=\"hljs-comment\">// null（Bootstrap）\u003c/span>\u003c/span>\u003cspan class=\"ln\">        System.out.println(String.class.getClassLoader()); \u003cspan class=\"hljs-comment\">// null\u003c/span>\u003c/span>\u003cspan class=\"ln\"> \u003c/span>\u003cspan class=\"ln\">        \u003cspan class=\"hljs-comment\">// 三种获取方式\u003c/span>\u003c/span>\u003cspan class=\"ln\">        \u003cspan class=\"hljs-type\">ClassLoader\u003c/span> \u003cspan class=\"hljs-variable\">a\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> Thread.currentThread().getContextClassLoader(); \u003cspan class=\"hljs-comment\">// TCCL\u003c/span>\u003c/span>\u003cspan class=\"ln\">        \u003cspan class=\"hljs-type\">ClassLoader\u003c/span> \u003cspan class=\"hljs-variable\">b\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> ClassLoader.getSystemClassLoader();             \u003cspan class=\"hljs-comment\">// App\u003c/span>\u003c/span>\u003cspan class=\"ln\">        \u003cspan class=\"hljs-type\">ClassLoader\u003c/span> \u003cspan class=\"hljs-variable\">c\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> LoaderDemo.class.getClassLoader();              \u003cspan class=\"hljs-comment\">// 本类的加载器\u003c/span>\u003c/span>\u003cspan class=\"ln\">    }\u003c/span>\u003cspan class=\"ln\">}\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">15 行\u003c/span>\u003c/div>\u003c/figure>\n\u003ch2>命名空间\u003c/h2>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">唯一性 = 加载器 + 全限定名\u003c/div>\u003cp>同一个全限定名被两个不同加载器加载，得到的是\u003cstrong>两个互不兼容的类型\u003c/strong>：\u003ccode>equals\u003c/code> 为 false，互转抛 \u003ccode>ClassCastException\u003c/code>，\u003ccode>instanceof\u003c/code> 为 false。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>判据\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>Class.getClassLoader()\u003c/code>\u003c/td>\n\u003ctd>决定该类属于哪个命名空间\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>父加载器可见子？\u003c/td>\n\u003ctd>\u003cstrong>不可见\u003c/strong>。父看不到子加载器加载的类（这是 \u003ca class=\"wikilink\" data-target=\"双亲委派模型\">双亲委派模型\u003c/a> 的副作用）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>子加载器可见父？\u003c/td>\n\u003ctd>\u003cstrong>可见\u003c/strong>。子可以通过委派链拿到父加载的类\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"code\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// 同一份 class 文件，两个自定义加载器各加载一次\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">DiskClassLoader\u003c/span> \u003cspan class=\"hljs-variable\">la\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">DiskClassLoader\u003c/span>(\u003cspan class=\"hljs-string\">&quot;/tmp/v1&quot;\u003c/span>);\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">DiskClassLoader\u003c/span> \u003cspan class=\"hljs-variable\">lb\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">DiskClassLoader\u003c/span>(\u003cspan class=\"hljs-string\">&quot;/tmp/v2&quot;\u003c/span>); \u003cspan class=\"hljs-comment\">// 假设 v2 = 同名字节码\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">Class\u003c/span>&lt;?&gt; \u003cspan class=\"hljs-variable\">ca\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> la.loadClass(\u003cspan class=\"hljs-string\">&quot;com.x.User&quot;\u003c/span>);\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">Class\u003c/span>&lt;?&gt; \u003cspan class=\"hljs-variable\">cb\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> lb.loadClass(\u003cspan class=\"hljs-string\">&quot;com.x.User&quot;\u003c/span>);\u003c/span>\u003cspan class=\"ln\">System.out.println(ca == cb);                       \u003cspan class=\"hljs-comment\">// false\u003c/span>\u003c/span>\u003cspan class=\"ln\">System.out.println(ca.isAssignableFrom(cb));        \u003cspan class=\"hljs-comment\">// false\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// 强转抛 ClassCastException：com.x.User cannot be cast to com.x.User\u003c/span>\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">8 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">这正是隔离的基础\u003c/div>\u003cp>Tomcat 让每个 Web 应用持有独立 \u003ccode>WebAppClassLoader\u003c/code>，同名不同版本的库互不干扰，靠的就是命名空间隔离。实现细节见 \u003ca class=\"wikilink\" data-target=\"破坏双亲委派\">破坏双亲委派\u003c/a>。\u003c/p>\n\u003c/div>\n\u003cdetails>\u003csummary>展开类图\u003c/summary>\u003cdiv class=\"mermaid\" data-mm-type=\"classDiagram\">classDiagram\n    class ClassLoader {\n        -ClassLoader parent\n        +loadClass(String) Class\n        +findClass(String) Class\n        +defineClass(byte[]) Class\n        +getParent() ClassLoader\n    }\n    class SecureClassLoader {\n    }\n    class URLClassLoader {\n        -URL[] ucp\n        +findClass(String) Class\n    }\n    class AppClassLoader {\n    }\n    class ExtClassLoader {\n    }\n    class MyClassLoader {\n        +findClass(String) Class\n    }\n    ClassLoader &lt;|-- SecureClassLoader\n    SecureClassLoader &lt;|-- URLClassLoader\n    URLClassLoader &lt;|-- AppClassLoader\n    URLClassLoader &lt;|-- ExtClassLoader\n    ClassLoader &lt;|-- MyClassLoader\n    ClassLoader o-- ClassLoader : parent\n\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">此图为 JDK 8 经典结构\u003c/div>\u003cp>JDK 9+ 的 App/Platform 不再继承 \u003ccode>URLClassLoader\u003c/code>，继承树收进 \u003ccode>jdk.internal.loader.ClassLoaders\u003c/code>，图意不变。\u003c/p>\n\u003c/div>\n\u003c/details>\u003ch2>数组类\u003c/h2>\n\u003cp>数组类\u003cstrong>不由类加载器创建\u003c/strong>，由 JVM 在运行时直接构造：没有对应的 \u003ccode>.class\u003c/code> 文件，也走不到加载流程，因此不存在「加载数组的加载器」。\u003c/p>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>数组类型\u003c/th>\n\u003cth>运行时归属的加载器\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>User[]\u003c/code>（元素是引用类型）\u003c/td>\n\u003ctd>元素类型的加载器，即 \u003ccode>User.class.getClassLoader()\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>int[]\u003c/code>（元素是基本类型）\u003c/td>\n\u003ctd>\u003ccode>null\u003c/code>（等同 Bootstrap）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">只造数组，不碰元素类\u003c/div>\u003cp>\u003ccode>new User[10]\u003c/code> 只构造数组对象，\u003cstrong>不触发\u003c/strong> \u003ccode>User\u003c/code> 的加载与初始化 —— 属被动引用，见 \u003ca class=\"wikilink\" data-target=\"类加载过程\">类加载过程\u003c/a>。\u003c/p>\n\u003c/div>\n\u003ch2>自定义加载器\u003c/h2>\n\u003cfigure class=\"code\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">DiskClassLoader\u003c/span> \u003cspan class=\"hljs-keyword\">extends\u003c/span> \u003cspan class=\"hljs-title class_\">ClassLoader\u003c/span> {\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">private\u003c/span> \u003cspan class=\"hljs-keyword\">final\u003c/span> Path dir;\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-type\">public\u003c/span> \u003cspan class=\"hljs-title function_\">DiskClassLoader\u003c/span>\u003cspan class=\"hljs-params\">(Path dir)\u003c/span> { \u003cspan class=\"hljs-built_in\">this\u003c/span>.dir = dir; }\u003c/span>\u003cspan class=\"ln\"> \u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-meta\">@Override\u003c/span>                                   \u003cspan class=\"hljs-comment\">// 只重写 findClass，保留委派\u003c/span>\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">protected\u003c/span> \u003cspan class=\"hljs-type\">Class\u003c/span>&lt;?&gt; \u003cspan class=\"hljs-title function_\">findClass\u003c/span>\u003cspan class=\"hljs-params\">(String name)\u003c/span> \u003cspan class=\"hljs-keyword\">throws\u003c/span> ClassNotFoundException {\u003c/span>\u003cspan class=\"ln\">        \u003cspan class=\"hljs-keyword\">try\u003c/span> {\u003c/span>\u003cspan class=\"ln\">            \u003cspan class=\"hljs-type\">byte\u003c/span>[] \u003cspan class=\"hljs-variable\">bytes\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> Files.readAllBytes(dir.resolve(name.replace(\u003cspan class=\"hljs-string\">&#x27;.&#x27;\u003c/span>, \u003cspan class=\"hljs-string\">&#x27;/&#x27;\u003c/span>) + \u003cspan class=\"hljs-string\">&quot;.class&quot;\u003c/span>));\u003c/span>\u003cspan class=\"ln\">            \u003cspan class=\"hljs-keyword\">return\u003c/span> defineClass(name, bytes, \u003cspan class=\"hljs-number\">0\u003c/span>, bytes.length);\u003c/span>\u003cspan class=\"ln\">        } \u003cspan class=\"hljs-keyword\">catch\u003c/span> (IOException e) {\u003c/span>\u003cspan class=\"ln\">            \u003cspan class=\"hljs-keyword\">throw\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">ClassNotFoundException\u003c/span>(name, e);\u003c/span>\u003cspan class=\"ln\">        }\u003c/span>\u003cspan class=\"ln\">    }\u003c/span>\u003cspan class=\"ln\">}\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">14 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方法\u003c/th>\n\u003cth>是否重写\u003c/th>\n\u003cth>作用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>findClass\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>是\u003c/strong>\u003c/td>\n\u003ctd>定义「去哪里取字节码」，保留委派逻辑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>defineClass\u003c/code>\u003c/td>\n\u003ctd>否\u003c/td>\n\u003ctd>字节数组 → \u003ccode>Class\u003c/code> 对象的落点；protected，由 \u003ccode>findClass\u003c/code> 内部调用，一般不重写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>loadClass\u003c/code>\u003c/td>\n\u003ctd>否（刻意\u003ca class=\"wikilink\" data-target=\"破坏双亲委派\">破坏双亲委派\u003c/a>时除外）\u003c/td>\n\u003ctd>委派主流程，重写即破坏模型\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(4题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">JDK 中有哪些类加载器？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">Bootstrap（C++，核心库，JDK9+ 为运行时镜像）、Platform/Extension（\u003ccode>lib/ext\u003c/code> → 平台模块）、Application（\u003ccode>classpath\u003c/code>），外加用户自定义加载器。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">如何判断两个类是否「同一个类」？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">全限定名相同 \u003cstrong>且\u003c/strong> 由同一个类加载器加载。二者缺一不可。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">自定义类加载器要重写哪个方法？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\
