pre>\u003ccode>\u003cspan class=\"ln\">java -Xms2g -Xmx2g -Xmn768m \\\u003c/span>\u003cspan class=\"ln\">     -XX:MetaspaceSize=256m -XX:MaxMetaspaceSize=256m \\\u003c/span>\u003cspan class=\"ln\">     -Xss512k -XX:MaxDirectMemorySize=256m \\\u003c/span>\u003cspan class=\"ln\">     -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/data/dump \\\u003c/span>\u003cspan class=\"ln\">     -jar app.jar\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">5 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">-Xms 与 -Xmx 取同值\u003c/div>\u003cp>两者不等时，堆会在运行中按负载伸缩，每次扩容都可能伴随 Full GC。生产环境设成同值，把抖动留在启动时一次性付掉。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>报错\u003c/th>\n\u003cth>出错区域\u003c/th>\n\u003cth>首查方向\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>Java heap space\u003c/code>\u003c/td>\n\u003ctd>堆\u003c/td>\n\u003ctd>内存泄漏：\u003ccode>jmap\u003c/code> 导出后用 MAT 看 dominator tree\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Metaspace\u003c/code>\u003c/td>\n\u003ctd>元空间\u003c/td>\n\u003ctd>类加载器泄漏、动态代理与热部署\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Direct buffer memory\u003c/code>\u003c/td>\n\u003ctd>直接内存\u003c/td>\n\u003ctd>NIO 缓冲未池化、\u003ccode>MaxDirectMemorySize\u003c/code> 过小\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>unable to create native thread\u003c/code>\u003c/td>\n\u003ctd>栈 / 线程\u003c/td>\n\u003ctd>\u003ccode>-Xss\u003c/code> 过大、系统 \u003ccode>ulimit -u\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>GC overhead limit exceeded\u003c/code>\u003c/td>\n\u003ctd>堆\u003c/td>\n\u003ctd>回收量极少却不停 GC，接近死循环而非单纯内存不足\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>StackOverflowError\u003c/code>\u003c/td>\n\u003ctd>虚拟机栈\u003c/td>\n\u003ctd>递归无出口、JSON / ORM 的循环引用自解析\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(5题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">哪些区域线程共享，哪些私有？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">共享 = 堆 + 方法区（元空间）；私有 = 程序计数器、虚拟机栈、本地方法栈。判据是随进程还是随线程生灭。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">一个对象从创建到进入老年代经历了什么？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">先由逃逸分析判断是否可栈上分配（甚至标量替换）→ 否则在 Eden 的 TLAB 里分配 → 熬过 Minor GC 被复制到 Survivor 且年龄 +1 → 年龄达 15、或触发动态年龄判定、或本身是大对象，才晋升老年代。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">为什么用元空间取代永久代？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">永久代在堆内、大小固定，容易 \u003ccode>PermGen space\u003c/code> OOM，且类回收依赖 Full GC。元空间改在本地内存，按类加载器生命周期独立回收，默认只受物理内存约束。代价是必须显式设 \u003ccode>-XX:MaxMetaspaceSize\u003c/code>，否则可能吃光机器内存。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">字符串常量池在哪个区？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">JDK 6 在永久代，JDK 7 随静态变量一起移到堆，JDK 8 起永久代整体变元空间后，字符串常量池仍留在堆。\u003ccode>String.intern()\u003c/code> 操作的就是这张表。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">直接内存会被 GC 回收吗？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">会被&quot;间接&quot;回收：\u003ccode>DirectByteBuffer\u003c/code> 这个壳对象被 GC 时，其 Cleaner（虚引用）触发 \u003ccode>Unsafe.freeMemory\u003c/code> 释放本地内存。壳对象很小，老年代不承压就不触发，所以堆很空也可能 OOM。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(5条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：堆就是 JVM 的全部内存。元空间、直接内存、代码缓存、线程栈都在堆外，\u003ccode>jstat\u003c/code> 看不到全貌，得用 NMT（\u003ccode>NativeMemoryTracking\u003c/code>）才能对齐进程 RSS。\u003c/li>\n\u003cli>误区：元空间无限大所以不用管。默认只受物理内存限制，类加载器泄漏会把机器拖垮。\u003c/li>\n\u003cli>误区：只要不 new 大对象就不会 OOM。逃逸分析没跟上时对象照样进堆；反过来，经标量替换后一个对象可能压根没被分配，只留下若干独立字段。\u003c/li>\n\u003cli>误区：Minor GC 频繁就是有问题。新生代本就小而对象朝生夕死，Minor GC 又快又频繁是分代设计的预期，盯的是单次耗时与晋升量。\u003c/li>\n\u003cli>误区：\u003ccode>-Xss\u003c/code> 越大越稳。它是每线程固定开销，栈越大能开的线程越少，高并发服务通常往下调。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["jvm","进程与线程","类加载过程","synchronized"],"excerpt":"以「随线程生灭 / 随进程生灭」为界切开整块内存 → 堆的分代与对象流转 → 栈帧与类元数据各自的归宿 → 堆外那块不受 GC 管的地，最后落到参数与 OOM 排障。","featured":"","order":5,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":2,"groupLayout":"tiles"},"java-锁":{"id":"java-锁","title":"Java 锁","type":"moc","category":"juc","file":"notes/Java 锁.md","accent":"#7C4DFF","accentInk":"#5E35B1","catLabel":"Concurrency","mtime":"2026-09-05T09:27:18.393Z","html":"\u003ch1>Java 锁\u003c/h1>\n\u003cp>Java 并发同步原语总览:语义由 JMM(Java 内存模型)打底,内置锁与可见性原语承接,显式锁、读写锁、乐观锁补足能力,底层由 CAS / AQS 支撑,死锁排查兜住故障面;按场景选型对比。\u003c/p>\n\u003ch2>阅读路线\u003c/h2>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">基础语义 \u003cspan class=\"chain-pill\">入口\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">volatile + synchronized\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">横评选型 \u003cspan class=\"chain-pill\">对比\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">Java 锁对比\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">显式锁族 \u003cspan class=\"chain-pill\">进阶\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">ReentrantLock → 读写锁 → StampedLock\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">底层支撑 \u003cspan class=\"chain-pill\">原理\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">CAS 与原子类 → AQS → LockSupport\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">故障排查 \u003cspan class=\"chain-pill\">实战\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">死锁四条件与定位\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>可见性语义由 JMM(Java 内存模型,见上层 JUC)打底,volatile 与 synchronized 承接 → 横评表给一把选型尺子 → 按需深入某把显式锁 → 最后落到 CAS/AQS 的实现层与死锁排查；维度从「语义」一路下沉到「机制」，按场景回头挑最便宜的那把。共享同步器（Semaphore/CountDownLatch/CyclicBarrier）已并入 \u003ca class=\"wikilink\" data-target=\"java-锁对比\">Java 锁对比\u003c/a>，不单列。\u003c/p>\n\u003cul>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"java-锁对比\">Java 锁对比\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"synchronized\">synchronized\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"volatile\">volatile\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"reentrantlock\">ReentrantLock\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"reentrantreadwritelock\">ReentrantReadWriteLock\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"stampedlock\">StampedLock\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"cas-与原子类\">CAS 与原子类\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"aqs\">AQS\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"死锁\">死锁\u003c/a>\u003c/li>\n\u003c/ul>\n","links":["java-锁对比","synchronized","volatile","reentrantlock","reentrantreadwritelock","stampedlock","cas-与原子类","aqs","死锁"],"excerpt":"Java 并发同步原语总览:语义由 JMM(Java 内存模型)打底,内置锁与可见性原语承接,显式锁、读写锁、乐观锁补足能力,底层由 CAS / AQS 支撑,死锁排查兜住故障面;按场景选型对比。","featured":"Java 锁对比","order":0,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":3,"groupLayout":"tiles"},"java-锁对比":{"id":"java-锁对比","title":"Java 锁对比","type":"note","category":"juc","file":"notes/Java 锁对比.md","accent":"#7C4DFF","accentInk":"#5E35B1","catLabel":"Concurrency","mtime":"2026-09-05T09:27:18.393Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">锁分类 \u003cspan class=\"chain-pill\">梳理\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">内置/显式/读写/乐观\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">维度横评 \u003cspan class=\"chain-pill\">核心\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">6 机制逐项对比\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">选型决策 \u003cspan class=\"chain-pill\">实战\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">按场景分流\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>内置锁(\u003ca class=\"wikilink\" data-target=\"synchronized\">synchronized\u003c/a>)与可见性(\u003ca class=\"wikilink\" data-target=\"volatile\">volatile\u003c/a>)打底 → 显式锁(\u003ca class=\"wikilink\" data-target=\"reentrantlock\">ReentrantLock\u003c/a>)补足中断/超时/公平 → 读写锁与乐观锁优化并发读 → 底层由 \u003ca class=\"wikilink\" data-target=\"cas-与原子类\">CAS 与原子类\u003c/a>/\u003ca class=\"wikilink\" data-target=\"aqs\">AQS\u003c/a> 支撑 → 按场景选型。\u003c/p>\n\u003c/details>\u003ch2>一图横评\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>维度\u003c/th>\n\u003cth>synchronized\u003c/th>\n\u003cth>volatile\u003c/th>\n\u003cth>ReentrantLock\u003c/th>\n\u003cth>ReentrantReadWriteLock\u003c/th>\n\u003cth>StampedLock\u003c/th>\n\u003cth>CAS / 原子类\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>本质\u003c/td>\n\u003ctd>内置互斥锁(管程)\u003c/td>\n\u003ctd>可见性原语(非锁)\u003c/td>\n\u003ctd>显式互斥锁\u003c/td>\n\u003ctd>读写锁(读共享/写独占)\u003c/td>\n\u003ctd>戳记锁(乐观读)\u003c/td>\n\u003ctd>无锁原子操作\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>实现层\u003c/td>\n\u003ctd>JVM(对象头 Mark Word)\u003c/td>\n\u003ctd>JVM(内存屏障)\u003c/td>\n\u003ctd>JDK(\u003ca class=\"wikilink\" data-target=\"aqs\">AQS\u003c/a>)\u003c/td>\n\u003ctd>JDK(\u003ca class=\"wikilink\" data-target=\"aqs\">AQS\u003c/a>)\u003c/td>\n\u003ctd>JDK(自有队列,非 AQS)\u003c/td>\n\u003ctd>CPU(LOCK CMPXCHG)+VarHandle\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可重入\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003ctd>✅(读/写各自)\u003c/td>\n\u003ctd>❌ 不可重入\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>公平性\u003c/td>\n\u003ctd>非公平\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>可选(构造器)\u003c/td>\n\u003ctd>可选(构造器)\u003c/td>\n\u003ctd>非公平\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可中断\u003c/td>\n\u003ctd>❌\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>✅ lockInterruptibly\u003c/td>\n\u003ctd>✅ read/writeLockInterruptibly\u003c/td>\n\u003ctd>✅ read/writeLockInterruptibly\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>超时获取\u003c/td>\n\u003ctd>❌\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>✅ tryLock(t)\u003c/td>\n\u003ctd>✅ tryLock(t)(读/写)\u003c/td>\n\u003ctd>✅ tryReadLock(t)/tryWriteLock(t)\u003c/td>\n\u003ctd>✅ 自旋重试\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>多 Condition\u003c/td>\n\u003ctd>❌ 单等待集\u003c/td>\n\u003ctd>❌\u003c/td>\n\u003ctd>✅ 多等待队列\u003c/td>\n\u003ctd>✅(仅写锁)\u003c/td>\n\u003ctd>❌(asReadLock 适配)\u003c/td>\n\u003ctd>❌\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>读写并发\u003c/td>\n\u003ctd>互斥\u003c/td>\n\u003ctd>仅可见性\u003c/td>\n\u003ctd>互斥\u003c/td>\n\u003ctd>读读并发/读写互斥\u003c/td>\n\u003ctd>乐观读无锁\u003c/td>\n\u003ctd>无锁\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>锁降级\u003c/td>\n\u003ctd>❌\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>❌\u003c/td>\n\u003ctd>✅ 写→读\u003c/td>\n\u003ctd>✅ tryConvertToReadLock\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>性能特点\u003c/td>\n\u003ctd>升级后阻塞,低开销起步\u003c/td>\n\u003ctd>极轻量\u003c/td>\n\u003ctd>灵活,略重\u003c/td>\n\u003ctd>读多写少优\u003c/td>\n\u003ctd>极读多写少最优\u003c/td>\n\u003ctd>高并发读优,竞争自旋耗 CPU\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>典型场景\u003c/td>\n\u003ctd>简单互斥,临界区小\u003c/td>\n\u003ctd>状态标志,双重检查\u003c/td>\n\u003ctd>需中断/超时/公平\u003c/td>\n\u003ctd>缓存,读多写少\u003c/td>\n\u003ctd>极读多写少,读短\u003c/td>\n\u003ctd>计数器,原子更新\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">一句话选型\u003c/div>\u003cp>简单互斥用 \u003ccode>synchronized\u003c/code>；要中断/超时/公平/多条件用 \u003ccode>ReentrantLock\u003c/code>；读多写少用 \u003ccode>ReentrantReadWriteLock\u003c/code>,极端读多用 \u003ccode>StampedLock\u003c/code>；只更新单个变量用 CAS 原子类；\u003ccode>volatile\u003c/code> 只解决可见性不解决原子性。\u003c/p>\n\u003c/div>\n\u003ch2>选型决策\u003c/h2>\n\u003cdiv class=\"branch\">\u003cdiv class=\"branch-stem\">\u003cdiv class=\"branch-step\">\u003cspan class=\"branch-num\">01\u003c/span>\u003cdiv class=\"branch-body\">\u003cdiv class=\"branch-t\">同步需求\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"branch-link-v\">\u003cspan>触发\u003c/span>\u003c/div>\u003cdiv class=\"branch-step\">\u003cspan class=\"branch-num\">02\u003c/span>\u003cdiv class=\"branch-body\">\u003cdiv class=\"branch-t\">按场景分流\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"branch-join\">\u003c/div>\u003cdiv class=\"branch-fan\">\u003c/div>\u003cdiv class=\"branch-grid\">\u003cdiv class=\"branch-card\">\u003cdiv class=\"branch-h\">仅需可见性\u003c/div>\u003cdiv class=\"branch-b\">一写多读的状态标志\u003c/div>\u003cspan class=\"branch-tag\">volatile\u003c/span>\u003c/div>\u003cdiv class=\"branch-card\">\u003cdiv class=\"branch-h\">简单互斥\u003c/div>\u003cdiv class=\"branch-b\">临界区小,无特殊要求\u003c/div>\u003cspan class=\"branch-tag\">synchronized\u003c/span>\u003c/div>\u003cdiv class=\"branch-card\">\u003cdiv class=\"branch-h\">灵活控制\u003c/div>\u003cdiv class=\"branch-b\">要中断/超时/公平/多等待队列\u003c/div>\u003cspan class=\"branch-tag\">ReentrantLock\u003c/span>\u003c/div>\u003cdiv class=\"branch-card\">\u003cdiv class=\"branch-h\">读多写少\u003c/div>\u003cdiv class=\"branch-b\">缓存类,读远大于写\u003c/div>\u003cspan class=\"branch-tag\">ReentrantReadWriteLock\u003c/span>\u003c/div>\u003cdiv class=\"branch-card\">\u003cdiv class=\"branch-h\">极端读多\u003c/div>\u003cdiv class=\"branch-b\">读极多写极少且读短\u003c/div>\u003cspan class=\"branch-tag\">StampedLock(乐观读)\u003c/span>\u003c/div>\u003cdiv class=\"branch-card\">\u003cdiv class=\"branch-h\">单变量原子\u003c/div>\u003cdiv class=\"branch-b\">计数器/标志位自增\u003c/div>\u003cspan class=\"branch-tag\">CAS 原子类\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">常见误用\u003c/div>\u003cp>\u003ccode>volatile\u003c/code> 不保证复合操作原子性(\u003ccode>i++\u003c/code> 仍会丢更新)；\u003ccode>StampedLock\u003c/code> 不可重入,重入会死锁；\u003ccode>ReentrantLock\u003c/code> 必须 \u003ccode>finally{ unlock() }\u003c/code>,否则持有线程异常会永久卡死。\u003c/p>\n\u003c/div>\n\u003ch2>锁升级与底层\u003c/h2>\n\u003cdetails>\u003csummary>展开锁升级状态图\u003c/summary>\u003cdiv class=\"mermaid\" data-mm-type=\"stateDiagram-v2\">stateDiagram-v2\n  [*] --> 无锁\n  无锁 --> 偏向锁: 单线程进入\n  偏向锁 --> 轻量级锁: 多线程交替\n  轻量级锁 --> 重量级锁: 竞争激烈/自旋失败\n  重量级锁 --> [*]\n\u003c/div>\n\u003c/details>\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">锁升级仅适用于 synchronized\u003c/div>\u003cp>偏向锁(省 CAS)→轻量级锁(自旋 CAS)→重量级锁(OS 互斥,线程 park)。\u003ccode>ReentrantLock\u003c/code> 等基于 \u003ca class=\"wikilink\" data-target=\"aqs\">AQS\u003c/a>,无此升级路径,直接竞争入 CLH 队列 park。\n注：偏向锁在 JDK 15 起默认禁用、JDK 18 起实质移除,新版本 \u003ccode>synchronized\u003c/code> 直接进入轻量级→重量级路径。\u003c/p>\n\u003c/div>\n\u003ch2>类族结构\u003c/h2>\n\u003cdetails>\u003csummary>展开锁类族类图\u003c/summary>\u003cdiv class=\"mermaid\" data-mm-type=\"classDiagram\">classDiagram\n    class Lock {&lt;&lt;interface>>}\n    class ReadWriteLock {&lt;&lt;interface>>}\n    class ReentrantLock\n    class ReentrantReadWriteLock\n    class StampedLock\n    Lock &lt;|.. ReentrantLock\n    ReadWriteLock &lt;|.. ReentrantReadWriteLock\n\u003c/div>\n\u003c/details>\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">类族关系\u003c/div>\u003cp>\u003ccode>ReentrantLock\u003c/code> 与 \u003ccode>ReentrantReadWriteLock\u003c/code> 均实现 \u003ccode>Lock\u003c/code>/\u003ccode>ReadWriteLock\u003c/code> 并基于 \u003ca class=\"wikilink\" data-target=\"aqs\">AQS\u003c/a>；\u003ccode>StampedLock\u003c/code> \u003cstrong>不实现 \u003ccode>Lock\u003c/code> 接口\u003c/strong>,走独立的戳记(stamp)API,因此无 \u003ccode>Condition\u003c/code>、不可重入(需要 \u003ccode>Lock\u003c/code> 视图时用 \u003ccode>asReadLock()\u003c/code> / \u003ccode>asWriteLock()\u003c/code>)。\u003c/p>\n\u003c/div>\n\u003ch2>共享同步器：Semaphore vs CountDownLatch vs CyclicBarrier\u003c/h2>\n\u003cblockquote>\n\u003cp>三个共享模式工具都基于 \u003ca class=\"wikilink\" data-target=\"aqs\">AQS\u003c/a> 共享同步,共用 \u003ccode>state\u003c/code> 计数 + CLH 队列 park;差别只在于 \u003cstrong>state 怎么解释、何时放行、能否重置\u003c/strong>。\u003c/p>\n\u003c/blockquote>\n\u003ch3>一图横评\u003c/h3>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>维度\u003c/th>\n\u003cth>Semaphore\u003c/th>\n\u003cth>CountDownLatch\u003c/th>\n\u003cth>CyclicBarrier\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>语义\u003c/td>\n\u003ctd>许可计数(可借可还)\u003c/td>\n\u003ctd>倒计时门闩(只减不增)\u003c/td>\n\u003ctd>循环栅栏(可重置)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>state\u003c/code> 含义\u003c/td>\n\u003ctd>剩余许可数\u003c/td>\n\u003ctd>剩余计数值\u003c/td>\n\u003ctd>\u003cstrong>未到位\u003c/strong>线程数\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>放行条件\u003c/td>\n\u003ctd>拿到许可即放\u003c/td>\n\u003ctd>计数归零即全部放\u003c/td>\n\u003ctd>所有线程都到位才放\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>释放者\u003c/td>\n\u003ctd>任意线程可 \u003ccode>release\u003c/code>(无所有权)\u003c/td>\n\u003ctd>任意线程可 \u003ccode>countDown\u003c/code>\u003c/td>\n\u003ctd>线程自己 \u003ccode>await\u003c/code> 即到位\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>能否重置\u003c/td>\n\u003ctd>许可可加可减,事实可&quot;重置&quot;\u003c/td>\n\u003ctd>❌ 一次性,归零即失效\u003c/td>\n\u003ctd>✅ 一代用完自动重置,可循环\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>复用\u003c/td>\n\u003ctd>长期持有\u003c/td>\n\u003ctd>单次编排\u003c/td>\n\u003ctd>重复同步(如多轮迭代)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>线程数关系\u003c/td>\n\u003ctd>准入 ≤ 许可数\u003c/td>\n\u003ctd>等待方 ≥ 计数方\u003c/td>\n\u003ctd>参与方彼此数量已知\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>模式\u003c/td>\n\u003ctd>AQS 共享\u003c/td>\n\u003ctd>AQS 共享\u003c/td>\n\u003ctd>AQS 共享 + Condition\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>典型场景\u003c/td>\n\u003ctd>限流、资源池准入\u003c/td>\n\u003ctd>等 N 个任务完成、起跑线\u003c/td>\n\u003ctd>多线程分阶段汇合、迭代计算\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>选型分流\u003c/h3>\n\u003cdiv class=\"branch\">\u003cdiv class=\"branch-stem\">\u003cdiv class=\"branch-link-v\">\u003cspan>触发\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"branch-join\">\u003c/div>\u003cdiv class=\"branch-fan\">\u003c/div>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">怎么选\u003c/div>\u003cp>\u003cstrong>准入计数\u003c/strong> → Semaphore；\u003cstrong>一次性等完成\u003c/strong> → CountDownLatch；\u003cstrong>可循环的多点汇合\u003c/strong> → CyclicBarrier。三者都基于 \u003ca class=\"wikilink\" data-target=\"aqs\">AQS\u003c/a> 共享模式,搞不清时回到 AQS 看 state 怎么解释。\u003c/p>\n\u003c/div>\n\u003ch3>常见误区\u003c/h3>\n\u003cul>\n\u003cli>误区：Semaphore 是轻量锁。许可数设 1 时行为类似互斥量,但\u003cstrong>无所有权、不可重入、任意线程能 release 凭空加许可\u003c/strong>——要互斥用 \u003ca class=\"wikilink\" data-target=\"reentrantlock\">ReentrantLock\u003c/a>。\u003c/li>\n\u003cli>误区：\u003ccode>countDown\u003c/code> 漏写会永久挂起等待方。任务抛异常而 \u003ccode>countDown\u003c/code> 没执行 → 计数永远归不了零；用 \u003ccode>await(timeout, unit)\u003c/code> 兜底。\u003c/li>\n\u003cli>误区：CyclicBarrier 只能等 N 个线程。是的,参与方数量必须\u003cstrong>事先固定\u003c/strong>(构造时定)；动态参与方用 \u003ccode>Phaser\u003c/code>。\u003c/li>\n\u003cli>误区：CountDownLatch 用 \u003ccode>join()\u003c/code> 也能替代。\u003ccode>join()\u003c/code> 只能等线程结束,CountDownLatch 等的是「事件」——可以是任务、可以是多源事件,更灵活。\u003c/li>\n\u003c/ul>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(4题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">synchronized 和 ReentrantLock 区别？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">synchronized 是 JVM 内置锁,自动释放、不可中断/超时、非公平、单等待集；ReentrantLock 是 API 显式锁,需手动 unlock,支持中断/超时/公平/多 Condition,底层 AQS。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">volatile 为什么不能保证 i++ 原子？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">i++ 是读-改-写三步,volatile 只保证可见性与禁止重排,不保证三步之间不被其他线程插入,需用 AtomicInteger 或锁。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">StampedLock 的乐观读怎么用？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">tryOptimisticRead() 拿戳→把值读进局部变量→validate(stamp) 校验戳是否变化,变了则升级 readLock() 重读,最后 unlockRead。适合读极多写极少;戳为 0 表示已有写锁持有,直接走悲观读。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">AQS 是什么？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">AbstractQueuedSynchronizer,JUC 同步器基石；用 volatile int state + CLH 队列变体,模板方法 tryAcquire/tryRelease 由子类实现,ReentrantLock/Semaphore 等皆基于它。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(4条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：volatile 是轻量锁。实际它不是锁,只保可见性/有序性,不保复合操作原子性。\u003c/li>\n\u003cli>误区：读写锁读多写少一定快。读锁写锁仍可能饥饿,极端读多 StampedLock 更优。\u003c/li>\n\u003cli>误区：ReentrantLock 比 synchronized 慢。JDK6 后两者差距很小,选型看功能需求而非性能。\u003c/li>\n\u003cli>误区：CAS 绝对无锁无坑。有 ABA 问题与自旋开销,高竞争用 LongAdder/StampedLock 缓解。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["synchronized","volatile","reentrantlock","cas-与原子类","aqs"],"excerpt":"内置锁(synchronized)与可见性(volatile)打底 → 显式锁(ReentrantLock)补足中断/超时/公平 → 读写锁与乐观锁优化并发读 → 底层由 CAS 与原子类/AQS 支撑 → 按场景选型。","featured":"","order":0,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":3,"groupLayout":"tiles","pinned":true},"knowledge-map":{"id":"knowledge-map","title":"Knowledge Map","type":"moc","category":"root","file":"notes/MOC.md","accent":"#FF9E1B","accentInk":"#C67100","catLabel":"Overview","mtime":"2026-09-05T09:27:18.393Z","html":"\u003ch1>Knowledge Map\u003c/h1>\n\u003cp>The single entry to every domain — from Java fundamentals to distributed systems and algorithms. Drill down to atomic notes, layer by layer.\u003c/p>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">导航\u003c/div>\u003cp>Click any card to explore a domain. Use mouse side buttons to navigate forward / backward.\u003c/p>\n\u003c/div>\n\u003cul>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"javase\">JavaSE\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"jvm\">JVM\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"juc\">JUC\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"spring\">Spring\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"architecture\">Architecture\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"mysql\">MySQL\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"redis\">Redis\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"leetcode\">LeetCode\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"system-design\">System Design\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"computer-networking\">计算机网络\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"projects\">Projects\u003c/a>\u003c/li>\n\u003c/ul>\n","links":["javase","jvm","juc","spring","architecture","mysql","redis","leetcode","system-design","computer-networking","projects"],"excerpt":"The single entry to every domain — from Java fundamentals to distributed systems and algorithms. Drill down to atomic notes, layer by layer.","featured":"","order":0,"group":-1,"groupNum":"","groupName":"","groupRank":999,"groupLayout":""},"mysql索引为什么用b+树":{"id":"mysql索引为什么用b+树","title":"MySQL索引为什么用B+树","type":"note","category":"mysql","file":"notes/MySQL索引为什么用B+树.md","accent":"#2979FF","accentInk":"#1E5FD8","catLabel":"MySQL","mtime":"2026-09-05T09:27:18.394Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">磁盘IO是瓶颈 \u003cspan class=\"chain-pill\">前提\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">1节点=1磁盘页=1次IO\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">目标压低树高 \u003cspan class=\"chain-pill\">设计目标\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">提高扇出 fan-out\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">逐一排除候选 \u003cspan class=\"chain-pill\">选型\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">哈希 / 二叉 / 红黑 / B树\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">B+树胜出 \u003cspan class=\"chain-pill\">结论\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">非叶只存键·叶子成链\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>磁盘随机 IO 比内存慢约 10⁵ 倍，所以索引优化的第一目标不是「比较次数」而是「树高 = 查询需要的 IO 次数」。B+ 树正是为「磁盘 + 范围查询」这一组合量身设计的结构。\u003c/p>\n\u003cp>索引服务于上层数据访问，DAO 层设计见 \u003ca class=\"wikilink\" data-target=\"经典三层架构\">经典三层架构\u003c/a>，读写一致性见 \u003ca class=\"wikilink\" data-target=\"缓存与数据库一致性\">缓存与数据库一致性\u003c/a>。\u003c/p>\n\u003c/details>\u003ch2>前提：索引在磁盘，瓶颈是 IO\u003c/h2>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">关键前提\u003c/div>\u003cp>索引是常驻磁盘的数据结构。访问一个节点 = 读一页（InnoDB 默认 16KB）= 一次磁盘 IO。\n比较发生在内存里几乎免费，真正贵的是把页从磁盘搬到内存的那一次 IO。于是衡量结构好坏的指标从「比较次数」变成「树高」。\u003c/p>\n\u003c/div>\n\u003ch2>为什么不用其他结构\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>候选结构\u003c/th>\n\u003cth>致命短板\u003c/th>\n\u003cth>结论\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>哈希索引\u003c/td>\n\u003ctd>只支持等值，不支持范围 / 排序 / 最左前缀；有哈希冲突\u003c/td>\n\u003ctd>仅 Memory 引擎 / InnoDB 自适应哈希辅助用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>二叉搜索树 BST\u003c/td>\n\u003ctd>极端情况退化为链表，查找退化为 O(n)\u003c/td>\n\u003ctd>不稳定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AVL / 红黑树\u003c/td>\n\u003ctd>二叉 → 扇出恒为 2，千万级数据树高约 24~46 层（理想 2²³≈8.4×10⁶，最坏 2·log₂n≈46）→ 每层一次随机 IO\u003c/td>\n\u003ctd>树太高\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>B 树\u003c/td>\n\u003ctd>非叶节点通常也存储数据行（或完整记录指针），导致单页能容纳的键数量变少，树更高；范围查询需中序遍历整棵树，无法像 B+ 树那样沿叶子链顺序扫描\u003c/td>\n\u003ctd>次优\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>B+ 树\u003c/strong>\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>✅ 选它\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">为什么不选红黑树\u003c/div>\u003cp>红黑树扇出只有 2，1000 万行树高约 24~46 层（理想 24，最坏 2·log₂n≈46），每次查找就是对应次数的随机 IO；而 B+ 树三层就能覆盖十亿行。扇出差距决定树高差距。\u003c/p>\n\u003c/div>\n\u003ch2>选型收敛\u003c/h2>\n\u003cdiv class=\"mermaid\" data-mm-type=\"flowchart\">flowchart TD\n  A[索引存磁盘·目标是降低树高] --> B{只做等值查询?}\n  B -->|是| H[哈希索引&lt;br/>不支持范围/排序/前缀]\n  B -->|否| C{扇出能大吗?}\n  C -->|二叉·扇出=2| R[AVL/红黑树&lt;br/>千万数据约24~46层·全程随机IO]\n  C -->|可多路| D{非叶节点存数据?}\n  D -->|存·单页键少| T[B树&lt;br/>树更高·范围需中序遍历]\n  D -->|只存键·叶子成链| P[✅ B+树]\n\u003c/div>\n\u003ch2>B+ 树的四点优势\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>优势\u003c/th>\n\u003cth>机制\u003c/th>\n\u003cth>收益\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>高扇出 · 低树高\u003c/td>\n\u003ctd>非叶节点只放「键 + 指针」，不放数据行\u003c/td>\n\u003ctd>单页能放约 1170 个键，3 层即可覆盖 10 亿行，查找 ≤ 3~4 次 IO\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>叶子成链表\u003c/td>\n\u003ctd>所有叶子节点用双向指针串成有序链表\u003c/td>\n\u003ctd>范围查询 / ORDER BY 顺链扫描，不必回溯树结构；叶子按 (a,b,c) 顺序排列，跳过 a 直接查 b 时无法利用有序性——这正是「最左前缀」原理的根源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>查询深度恒定\u003c/td>\n\u003ctd>任何查找都走到同一层叶子\u003c/td>\n\u003ctd>主键查询耗时一致、可预测，便于性能评估\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>数据有序聚集\u003c/td>\n\u003ctd>叶子按主键顺序存放\u003c/td>\n\u003ctd>范围、排序、分组天然友好，局部性更好；但顺序主键（如自增）使页分裂点集中在右端，易引发写放大，UUID 类随机主键则导致频繁页分裂与碎片化\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">扇出测算\u003c/div>\u003cp>InnoDB 页 16KB，以 BIGINT 主键（8B）+ 指针（6B）为例，单索引项 14B → 单节点约 1170 个键；若用 INT 主键（4B），扇出会更高。3 层 B+ 树 ≈ 1170³ ≈ 1.6×10⁹ 行，任意主键查找最多 3 次磁盘 IO。\u003c/p>\n\u003c/div>\n\u003ch2>延伸：InnoDB 的两种 B+ 树\u003c/h2>\n\u003cdiv class=\"callout important\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/>\u003c/svg>重点\u003c/div>\u003cdiv class=\"callout-sub\">聚簇 vs 二级索引\u003c/div>\u003cp>聚簇索引：叶子直接存整行数据（按主键排序），表数据即索引，主键查询一次到位。（大字段如 BLOB/TEXT 可能存溢出页，但逻辑上可视为整行）\n二级索引：叶子存主键值，查到后需拿主键回表再查聚簇索引（最多多一次树高）。\n两者都是 B+ 树，差别只在叶子装的是「整行」还是「主键」。\u003c/p>\n\u003c/div>\n\u003ch2>延伸：B+ 树 vs LSM 树\u003c/h2>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">为什么 OLTP 用 B+ 树，OLAP / 日志常用 LSM\u003c/div>\u003cp>B+ 树每次写入都要定位到叶子页并就地更新，写多读少时写放大明显（一次逻辑写可能触发多次页 IO）。\nLSM 树（如 LevelDB / RocksDB）把写入先落内存、再批量顺序落盘为不可变 SSTable，通过后台 compaction 合并，把随机写变成顺序写，写吞吐更高；代价是读需合并多层 SSTable，读放大更重。一句话：B+ 树读友好、LSM 写友好，按读写比选型。\u003c/p>\n\u003c/div>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(4题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">为什么 MySQL 索引用 B+ 树而不是红黑树？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">因为索引在磁盘上，衡量标准是树高（= IO 次数）而非比较次数。红黑树扇出恒为 2，千万行树高约 24\u003cdel>46 层 → 每层一次随机 IO；B+ 树单节点能放上千个键，3 层就覆盖十亿行，查找最多 3\u003c/del>4 次 IO。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">B 树和 B+ 树的核心区别是什么？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">两点。一是 B+ 树非叶节点只存键不存数据，单页容纳的键更多，扇出更大、树更矮；二是 B+ 树所有叶子用链表串起来，范围查询沿链顺序扫描即可，B 树则要中序遍历整棵树。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">为什么说索引优化是在减少 IO？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">访问一个索引节点 = 读一页（InnoDB 默认 16KB）= 一次磁盘 IO，而磁盘随机 IO 比内存慢约 10⁵ 倍。比较发生在内存里几乎免费，所以结构设计的目标是压低树高，而不是减少比较次数。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">自增主键和 UUID 主键哪个好？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">各有权衡。自增主键顺序写入，页分裂集中在右端、局部性好，但高并发下右端成为争用热点；UUID 随机写入导致频繁页分裂与碎片化，且二级索引叶子要存主键，主键过长会撑大所有二级索引。一般 OLTP 用自增，分库分表等需要全局唯一且避免自增泄露业务量的场景才用雪花 / UUID。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(3条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：B 树和 B+ 树差不多。B+ 树非叶不存数据、叶子成链，扇出更大，专为磁盘 + 范围查询设计。\u003c/li>\n\u003cli>误区：索引越多查询越快。索引拖慢写入、占用空间，需按查询模式权衡，写多场景反而成负担。\u003c/li>\n\u003cli>误区：哈希一定比 B+ 树快。仅等值场景成立；范围 / 排序 / 最左前缀全部失效，覆盖不了业务查询主体。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["经典三层架构","缓存与数据库一致性"],"excerpt":"索引在磁盘上，瓶颈是 IO；B+ 树用「非叶只存键」换高扇出、用「叶子成链」换高效范围查询。","featured":"","order":0,"group":2,"groupNum":"Ⅲ","groupName":"数据存储","groupRank":0,"groupLayout":"feature"},"redis持久化机制":{"id":"redis持久化机制","title":"Redis持久化机制","type":"note","category":"redis","file":"notes/Redis持久化机制.md","accent":"#FF1744","accentInk":"#C51162","catLabel":"Redis","mtime":"2026-09-05T09:27:18.394Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">为什么需要持久化 \u003cspan class=\"chain-pill\">动机\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">内存数据会丢\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">RDB 与 AOF \u003cspan class=\"chain-pill\">两大机制\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">全量快照 + 命令追加\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">混合持久化 \u003cspan class=\"chain-pill\">组合\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">RDB骨架 + AOF尾巴\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">RDB vs AOF \u003cspan class=\"chain-pill\">对比\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">数据安全与性能的取舍\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">选型问答 \u003cspan class=\"chain-pill\">落地\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">丢多少·多快·多大\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>核心问题只有一个：\u003cstrong>内存里的数据重启就丢\u003c/strong>，剩下都是「丢多少 / 恢复多快 / 体积多大」的取舍。RDB 是「全量打快照」、AOF 是「记下每条写命令」、混合是两者合体 —— 三条路走通后,选型只看业务对 RPO 的容忍度。\u003c/p>\n\u003cp>本笔记属于 \u003ca class=\"wikilink\" data-target=\"redis\">Redis\u003c/a> 内存数据库范畴,缓存一致性问题见 \u003ca class=\"wikilink\" data-target=\"缓存与数据库一致性\">缓存与数据库一致性\u003c/a>。\u003c/p>\n\u003c/details>\u003ch2>为什么需要持久化\u003c/h2>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">核心矛盾\u003c/div>\u003cp>Redis 把数据放在内存里以追求极致性能,但\u003cstrong>进程重启、机器掉电、容器迁移\u003c/strong>都会让内存数据归零。如果只用 Redis 做缓存,丢了从 DB 重读即可;如果 Redis \u003cstrong>同时承担持久化主库的角色\u003c/strong>(如分布式锁、计数器、排行榜、Session),丢了就是业务事故。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>是否需要持久化\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>纯缓存,丢失可从 DB 回填\u003c/td>\n\u003ctd>可关,但关后 BGSAVE/BGWRITEAOF 也会停\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>业务唯一数据源(锁/计数器/Session)\u003c/td>\n\u003ctd>必须开,且 RPO 容忍决定选 RDB / AOF / 混合\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>RDB 快照\u003c/h2>\n\u003cp>把某一时刻的全量内存数据\u003cstrong>序列化\u003c/strong>为二进制 dump 文件 \u003ccode>dump.rdb\u003c/code>,默认配置下重启就靠它恢复。\u003c/p>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>维度\u003c/th>\n\u003cth>表现\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>文件体积\u003c/td>\n\u003ctd>紧凑,二进制压缩\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>恢复速度\u003c/td>\n\u003ctd>快,直接把 RDB 读回内存\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>数据安全\u003c/td>\n\u003ctd>丢「最后一次快照到宕机之间」的全部写入\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>持久化开销\u003c/td>\n\u003ctd>\u003ccode>BGSAVE\u003c/code> fork 子进程 + 写时复制(COW),瞬间内存翻倍风险\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>触发方式\u003c/td>\n\u003ctd>满足 \u003ccode>save\u003c/code> 规则 / \u003ccode>bgsave\u003c/code> 命令 / 主从全量同步 / 正常关服\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">触发规则(默认)\u003c/div>\u003cp>\u003ccode>save 3600 1\u003c/code>(1h 内 1 次写)、\u003ccode>save 300 100\u003c/code>(5min 内 100 次写)、\u003ccode>save 60 10000\u003c/code>(1min 内 10000 次写)——任一满足就 BGSAVE。规则按「时间窗口」统计,改阈值要结合业务写量。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">fork 的隐藏成本\u003c/div>\u003cp>\u003ccode>BGSAVE\u003c/code> 用 \u003ccode>fork()\u003c/code> 复制父进程页表实现 COW,数据量大时 \u003ccode>fork\u003c/code> 本身可能阻塞数十到数百毫秒;Linux 优化后用 \u003ccode>copy-on-write\u003c/code> 把开销压到「复制页表」级别,但\u003cstrong>内存中每写入一页都会触发缺页中断复制\u003c/strong>,写入爆炸场景下内存峰值 ≈ 2× 数据集。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"mermaid\" data-mm-type=\"flowchart\">flowchart LR\n    A[BGSAVE 触发] --> B[fork 子进程]\n    B --> C[子进程遍历内存&lt;br/>写 RDB 到磁盘]\n    C --> D[写完替换旧 RDB]\n    D --> E[子进程退出]\n    A -.父进程继续服务.-> F[写请求照常处理&lt;br/>COW 复制脏页]\n\u003c/div>\n\u003ch2>AOF 日志\u003c/h2>\n\u003cp>把每条\u003cstrong>改变数据集的命令\u003c/strong>(\u003ccode>SET\u003c/code> / \u003ccode>HSET\u003c/code> / \u003ccode>LPUSH\u003c/code> 等)以 RESP 协议文本追加写入 \u003ccode>appendonly.aof\u003c/code>,重启时回放命令重建数据。\u003c/p>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>维度\u003c/th>\n\u003cth>表现\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>文件体积\u003c/td>\n\u003ctd>大,记录每条写命令\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>恢复速度\u003c/td>\n\u003ctd>慢,按顺序回放命令\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>数据安全\u003c/td>\n\u003ctd>默认每秒 fsync 一次,最多丢 1 秒(\u003ccode>appendfsync everysec\u003c/code>);\u003ccode>always\u003c/code> 模式丢 0 条但 IO 代价高\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>持久化开销\u003c/td>\n\u003ctd>写命令追加 + 后台 \u003ccode>BGREWRITEAOF\u003c/code> 压缩\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>触发方式\u003c/td>\n\u003ctd>配置 \u003ccode>appendonly yes\u003c/code> 即启用\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">AOF 重写的必要性\u003c/div>\u003cp>AOF 文件会随时间膨胀(同一 key 改 1000 次会记 1000 条),Redis 用 \u003ccode>BGREWRITEAOF\u003c/code> 把 AOF 重写成「当前数据集的最小命令集」,触发条件:\u003ccode>auto-aof-rewrite-percentage 100\u003c/code>(上次重写后文件涨 100%)、\u003ccode>auto-aof-rewrite-min-size 64mb\u003c/code>。\u003cstrong>重写不读取旧 AOF,而是直接遍历当前内存生成新 AOF\u003c/strong>,所以 AOF 文件大小最终只取决于数据集,与历史写入次数无关。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"mermaid\" data-mm-type=\"flowchart\">flowchart LR\n    A[写命令] --> B[追加到 AOF 缓冲区]\n    B --> C{appendfsync 策略}\n    C -->|always| D[每次都 fsync&lt;br/>最安全最慢]\n    C -->|everysec| E[每秒 fsync&lt;br/>默认·最多丢1s]\n    C -->|no| F[交给 OS&lt;br/>不可控·不推荐]\n    D --> G[磁盘]\n    E --> G\n    F --> G\n\u003c/div>\n\u003ch2>混合持久化(Redis 4.0+)\u003c/h2>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">核心设计\u003c/div>\u003cp>\u003ccode>aof-use-rdb-preamble yes\u003c/code> 启用后,Redis 触发 BGREWRITEAOF 时生成的 AOF 文件 = \u003cstrong>RDB 格式的全量数据 + 之后 AOF 格式的增量命令\u003c/strong>。重启时先按 RDB 快速加载骨架,再按 AOF 回放增量,兼顾恢复速度与数据安全。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>优势\u003c/th>\n\u003cth>原因\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>恢复速度比纯 AOF 快\u003c/td>\n\u003ctd>大头数据走 RDB 直接反序列化,不再按命令逐条执行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>数据安全比纯 RDB 好\u003c/td>\n\u003ctd>RDB 之后还有 AOF 增量\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文件体积可控\u003c/td>\n\u003ctd>重写机制控制,不会无限膨胀\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>这是 \u003cstrong>Redis 7.x 推荐的默认生产配置\u003c/strong>:\u003ccode>appendonly yes\u003c/code> + \u003ccode>aof-use-rdb-preamble yes\u003c/code> + \u003ccode>appendfsync everysec\u003c/code>。\u003c/p>\n\u003ch2>RDB vs AOF 对比\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>维度\u003c/th>\n\u003cth>RDB\u003c/th>\n\u003cth>AOF\u003c/th>\n\u003cth>混合(推荐)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>数据安全\u003c/td>\n\u003ctd>丢窗口期数据\u003c/td>\n\u003ctd>最多丢 1 秒\u003c/td>\n\u003ctd>最多丢 1 秒\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>恢复速度\u003c/td>\n\u003ctd>最快\u003c/td>\n\u003ctd>慢(回放命令)\u003c/td>\n\u003ctd>快(RDB 骨架 + 增量回放)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>文件体积\u003c/td>\n\u003ctd>小\u003c/td>\n\u003ctd>大\u003c/td>\n\u003ctd>中等\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>写性能影响\u003c/td>\n\u003ctd>fork 阻塞 + COW\u003c/td>\n\u003ctd>\u003ccode>everysec\u003c/code> 几乎无感\u003c/td>\n\u003ctd>同 AOF\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>适用场景\u003c/td>\n\u003ctd>备份 / 容灾 / 主从\u003c/td>\n\u003ctd>数据不能丢\u003c/td>\n\u003ctd>\u003cstrong>生产首选\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>版本要求\u003c/td>\n\u003ctd>全版本\u003c/td>\n\u003ctd>全版本\u003c/td>\n\u003ctd>Redis 4.0+\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">选型决策\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>RPO 要求秒级 + 大实例\u003c/strong> → RDB,够用就够用。\u003c/li>\n\u003cli>\u003cstrong>RPO 要求近零丢\u003c/strong> → AOF + \u003ccode>everysec\u003c/code>,再叠加混合持久化。\u003c/li>\n\u003cli>\u003cstrong>金融/订单/账务类\u003c/strong> → AOF + \u003ccode>everysec\u003c/code> + 混合 + 主从哨兵/集群 + 异地备份,单持久化只是兜底。\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003cdetails>\u003csummary>展开执行时序图\u003c/summary>\u003cdiv class=\"mermaid\" data-mm-type=\"sequenceDiagram\">sequenceDiagram\n    participant App as 客户端\n    participant Redis as Redis 主进程\n    participant OS as 内核缓冲区\n    participant Disk as 磁盘\n\n    Note over Redis,Disk: AOF 写流程(everysec)\n    App->>Redis: SET key value\n    Redis->>Redis: 执行命令\n    Redis->>OS: append 到 aof_buf\n    OS-->>Redis: 立即返回\n    Note over OS: 每秒一次\n    OS->>Disk: fsync 落盘\n    Note over Redis,Disk: BGSAVE 写流程(RDB)\n    App->>Redis: BGSAVE\n    Redis->>Redis: fork 子进程(COW)\n    Redis-->>App: 立即返回 Background saving started\n    Redis->>Disk: 子进程分批写 RDB\n    Disk-->>Redis: 写完替换旧 dump.rdb\n\u003c/div>\n\u003c/details>\u003ch2>落地：选型问答\u003c/h2>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(5题)\u003c/span>\u003c/summary>\u003cp>Q：Redis 有几种持久化方式?\u003c/p>\n\u003cp>A:两种独立机制(RDB 快照 + AOF 日志),以及 Redis 4.0+ 的混合持久化(RDB 骨架 + AOF 增量)。\u003c/p>\n\u003cp>Q：AOF 文件会无限膨胀吗?\u003c/p>\n\u003cp>A:不会。\u003ccode>BGREWRITEAOF\u003c/code> 触发时直接遍历\u003cstrong>当前内存数据集\u003c/strong>生成最小命令集,与历史写入次数无关,所以 AOF 大小最终只取决于数据集。\u003c/p>\n\u003cp>Q：BGSAVE 会阻塞主线程吗?\u003c/p>\n\u003cp>A:\u003ccode>fork\u003c/code> 子进程那一瞬间会(复制页表),但子进程写 RDB 期间父进程继续服务,COW 机制保证父子共享只读页。真正的阻塞点是 \u003ccode>fork\u003c/code> 本身,数据量大时可能数十到数百毫秒。\u003c/p>\n\u003cp>Q：\u003ccode>appendfsync always\u003c/code> 为什么生产不用?\u003c/p>\n\u003cp>A:每次写都触发 \u003ccode>fsync\u003c/code> 系统调用,IO 开销是 \u003ccode>everysec\u003c/code> 的几十到上百倍,会把 Redis 的写吞吐压到磁盘速度。代价远超收益,只有极少数对丢零条都不可接受的场景才考虑。\u003c/p>\n\u003cp>Q：混合持久化为什么比纯 AOF 恢复快?\u003c/p>\n\u003cp>A:重启加载时,先按 RDB 格式反序列化全量数据(直接读二进制结构,毫秒级),再回放 RDB 之后的 AOF 增量(命令数量大幅减少);纯 AOF 要按文件顺序逐条回放所有命令,数据量大时是分钟级。\u003c/p>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(4条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：只开 RDB 就够安全。RDB 是「窗口期快照」,丢数据量 = 两次快照之间的写入,\u003cstrong>生产环境必须叠加 AOF 或主从\u003c/strong>。\u003c/li>\n\u003cli>误区：AOF 文件越大越安全。AOF 大不代表丢得少,只代表写入频繁;关键看 \u003ccode>appendfsync\u003c/code> 策略和 \u003ccode>BGREWRITEAOF\u003c/code> 是否在工作。\u003c/li>\n\u003cli>误区：关服会自动持久化。\u003ccode>SHUTDOWN\u003c/code> 默认会触发 \u003ccode>BGSAVE\u003c/code>,但 \u003ccode>kill -9\u003c/code> 或断电不会 —— 容器编排里强杀 pod 的场景必须靠 \u003ccode>appendonly\u003c/code> + \u003ccode>everysec\u003c/code> 兜底。\u003c/li>\n\u003cli>误区：持久化开了就万事大吉。单实例持久化只防进程崩溃,\u003cstrong>机器级 / 数据中心级故障仍靠主从 + 哨兵 / 集群 + 异地备份\u003c/strong>,持久化是底线不是全部。\u003c/li>\n\u003c/ul>\n\u003c/details>","links":["redis","缓存与数据库一致性"],"excerpt":"核心问题只有一个：**内存里的数据重启就丢**，剩下都是「丢多少 / 恢复多快 / 体积多大」的取舍。RDB 是「全量打快照」、AOF 是「记下每条写命令」、混合是两者合体 —— 三条路走通后,选型只看业务对 RPO 的容忍度。","featured":"","order":1,"group":2,"groupNum":"Ⅲ","groupName":"数据存储","groupRank":1,"groupLayout":"feature"},"reentrantlock":{"id":"reentrantlock","title":"ReentrantLock","type":"note","category":"juc","file":"notes/ReentrantLock.md","accent":"#7C4DFF","accentInk":"#5E35B1","catLabel":"Concurrency","mtime":"2026-09-05T09:27:18.394Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">加解锁 \u003cspan class=\"chain-pill\">入口\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">lock/unlock\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">灵活能力 \u003cspan class=\"chain-pill\">核心\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">中断/超时/公平\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">Condition \u003cspan class=\"chain-pill\">进阶\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">多等待队列\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">底层 \u003cspan class=\"chain-pill\">原理\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">AQS 实现\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>ReentrantLock 是 JDK 显式互斥锁 → 手动 lock/unlock(必须 finally) → 支持中断/超时/公平/多 Condition → 底层基于 \u003ca class=\"wikilink\" data-target=\"aqs\">AQS\u003c/a> → 功能强于 \u003ca class=\"wikilink\" data-target=\"synchronized\">synchronized\u003c/a>。\u003c/p>\n\u003c/details>\u003ch2>基本用法\u003c/h2>\n\u003cfigure class=\"code\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">ReentrantLock\u003c/span> \u003cspan class=\"hljs-variable\">lock\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">ReentrantLock\u003c/span>(); \u003cspan class=\"hljs-comment\">// 默认非公平\u003c/span>\u003c/span>\u003cspan class=\"ln\">lock.lock();\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-keyword\">try\u003c/span> {\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-comment\">// 临界区\u003c/span>\u003c/span>\u003cspan class=\"ln\">} \u003cspan class=\"hljs-keyword\">finally\u003c/span> {\u003c/span>\u003cspan class=\"ln\">    lock.unlock(); \u003cspan class=\"hljs-comment\">// 必须放 finally,否则异常会永久持锁\u003c/span>\u003c/span>\u003cspan class=\"ln\">}\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">7 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">必须 finally unlock\u003c/div>\u003cp>忘记 unlock 且线程异常,锁永久不释放,其他线程全部饿死。这是显式锁相对 synchronized 自动释放的最大风险点。\u003c/p>\n\u003c/div>\n\u003ch2>能力矩阵\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>能力\u003c/th>\n\u003cth>方法\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>可中断\u003c/td>\n\u003ctd>\u003ccode>lockInterruptibly()\u003c/code>\u003c/td>\n\u003ctd>等待锁时响应中断,打破死锁\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>超时获取\u003c/td>\n\u003ctd>\u003ccode>tryLock(timeout)\u003c/code>\u003c/td>\n\u003ctd>拿不到超时返回 false,不死等\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>立即尝试\u003c/td>\n\u003ctd>\u003ccode>tryLock()\u003c/code>\u003c/td>\n\u003ctd>锁空闲就抢,否则立刻返回 false\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>公平/非公平\u003c/td>\n\u003ctd>\u003ccode>new ReentrantLock(true)\u003c/code>\u003c/td>\n\u003ctd>公平按排队顺序,吞吐略低\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>多条件\u003c/td>\n\u003ctd>\u003ccode>newCondition()\u003c/code>\u003c/td>\n\u003ctd>可建多个等待队列,精准唤醒\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>诊断\u003c/td>\n\u003ctd>\u003ccode>getHoldCount\u003c/code> / \u003ccode>isHeldByCurrentThread\u003c/code> / \u003ccode>hasQueuedThreads\u003c/code>\u003c/td>\n\u003ctd>排查持锁与排队情况\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">tryLock() 不守公平\u003c/div>\u003cp>即使是公平锁,无参 \u003ccode>tryLock()\u003c/code> 也会 barging——锁空闲就直接抢,不查队列;只有 \u003ccode>lock()\u003c/code> / \u003ccode>lockInterruptibly()\u003c/code> 遵守公平排队。要严格排队就别用无参 tryLock。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">多 Condition 优势\u003c/div>\u003cp>synchronized 只有单一等待集(\u003ccode>wait/notifyAll\u003c/code> 唤醒全部)；ReentrantLock 可建多个 Condition,只唤醒特定条件的线程,避免无谓竞争。\u003c/p>\n\u003c/div>\n\u003ch2>与 synchronized 对比\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>synchronized\u003c/th>\n\u003cth>ReentrantLock\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>释放\u003c/td>\n\u003ctd>自动\u003c/td>\n\u003ctd>手动 finally\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>中断\u003c/td>\n\u003ctd>❌\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>超时\u003c/td>\n\u003ctd>❌\u003c/td>\n\u003ctd>✅\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>公平\u003c/td>\n\u003ctd>❌\u003c/td>\n\u003ctd>可选\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Condition\u003c/td>\n\u003ctd>单\u003c/td>\n\u003ctd>多\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>底层\u003c/td>\n\u003ctd>JVM\u003c/td>\n\u003ctd>AQS\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">选型\u003c/div>\u003cp>只需简单互斥用 \u003ca class=\"wikilink\" data-target=\"synchronized\">synchronized\u003c/a> 更省心；要中断/超时/公平/多条件才上 ReentrantLock。完整对比见 \u003ca class=\"wikilink\" data-target=\"java-锁对比\">Java 锁对比\u003c/a>。\u003c/p>\n\u003c/div>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(3题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">ReentrantLock 如何实现可重入？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">内部维护持有线程与重入计数,同一线程再次 lock 时计数+1,unlock 减到 0 才真正释放,基于 AQS state。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">公平锁一定更好吗？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">公平锁避免饥饿但吞吐更低(排队开销),非公平锁吞吐高但可能饥饿；默认非公平,只在确有饥饿风险时用公平。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">公平锁下 tryLock() 会排队吗？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">不会。无参 \u003ccode>tryLock()\u003c/code> 走非公平尝试,锁空闲直接抢(barging);要排队用 \u003ccode>lock()\u003c/code> / \u003ccode>lockInterruptibly()\u003c/code>,超时场景用 \u003ccode>tryLock(timeout)\u003c/code>(它在公平模式下遵守公平)。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(3条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：ReentrantLock 一定比 synchronized 快。JDK6 后两者差距很小,选它是为了中断/超时/公平/多 Condition 这些能力,不是为了性能。\u003c/li>\n\u003cli>误区：公平锁更&quot;正确&quot;所以该默认开。公平锁吞吐明显更低,默认非公平;只有出现真实饥饿才切公平。\u003c/li>\n\u003cli>误区：Condition.await() 期间一直拿着锁。await 会\u003cstrong>完全释放锁\u003c/strong>并进入条件队列,被 signal 后要重新竞争锁才能返回,所以 await 返回后通常需要重新检查条件(经典 while 循环写法)。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["aqs","synchronized","java-锁对比"],"excerpt":"ReentrantLock 是 JDK 显式互斥锁 → 手动 lock/unlock(必须 finally) → 支持中断/超时/公平/多 Condition → 底层基于 AQS → 功能强于 synchronized。","featured":"","order":0,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":3,"groupLayout":"tiles"},"reentrantreadwritelock":{"id":"reentrantreadwritelock","title":"ReentrantReadWriteLock","type":"note","category":"juc","file":"notes/ReentrantReadWriteLock.md","accent":"#7C4DFF","accentInk":"#5E35B1","catLabel":"Concurrency","mtime":"2026-09-05T09:27:18.394Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">锁结构 \u003cspan class=\"chain-pill\">入口\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">读锁+写锁\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">互斥规则 \u003cspan class=\"chain-pill\">核心\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">读写/写写互斥\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">锁降级 \u003cspan class=\"chain-pill\">进阶\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">写→读\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">适用与局限 \u003cspan class=\"chain-pill\">实战\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">读多写少\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>ReentrantReadWriteLock 维护一对锁(读共享/写独占) → 读读并发、读写/写写互斥 → 支持写锁降级为读锁 → 适合缓存等读多写少场景。\u003c/p>\n\u003c/details>\u003ch2>互斥规则\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>组合\u003c/th>\n\u003cth>是否互斥\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>读 — 读\u003c/td>\n\u003ctd>❌ 并发(共享)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>读 — 写\u003c/td>\n\u003ctd>✅ 互斥\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>写 — 写\u003c/td>\n\u003ctd>✅ 互斥\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cfigure class=\"code mini\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">ReentrantReadWriteLock\u003c/span> \u003cspan class=\"hljs-variable\">rw\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">ReentrantReadWriteLock\u003c/span>();\u003c/span>\u003cspan class=\"ln\">rw.readLock().lock();    \u003cspan class=\"hljs-comment\">// 多个读可同时持有\u003c/span>\u003c/span>\u003cspan class=\"ln\">rw.writeLock().lock();   \u003cspan class=\"hljs-comment\">// 写独占\u003c/span>\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">3 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">谁有 Condition\u003c/div>\u003cp>只有\u003cstrong>写锁\u003c/strong>支持 \u003ccode>newCondition()\u003c/code>;对读锁调 \u003ccode>newCondition()\u003c/code> 抛 \u003ccode>UnsupportedOperationException\u003c/code>。这是与 \u003ca class=\"wikilink\" data-target=\"reentrantlock\">ReentrantLock\u003c/a> 的关键差异。\u003c/p>\n\u003c/div>\n\u003ch2>锁降级\u003c/h2>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">写锁可降级,读锁不可升级\u003c/div>\u003cp>持有写锁时获取读锁,再释放写锁 → 写降级为读,保证降级过程数据可见。但\u003cstrong>读锁不能升级为写锁\u003c/strong>,否则易死锁。\u003c/p>\n\u003c/div>\n\u003cfigure class=\"code\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">writeLock.lock();\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-keyword\">try\u003c/span> {\u003c/span>\u003cspan class=\"ln\">    data = compute();\u003c/span>\u003cspan class=\"ln\">    readLock.lock();   \u003cspan class=\"hljs-comment\">// 先拿读锁\u003c/span>\u003c/span>\u003cspan class=\"ln\">} \u003cspan class=\"hljs-keyword\">finally\u003c/span> {\u003c/span>\u003cspan class=\"ln\">    writeLock.unlock(); \u003cspan class=\"hljs-comment\">// 再放写锁 → 降级为读\u003c/span>\u003c/span>\u003cspan class=\"ln\">}\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// 此时仍持读锁,可继续安全读\u003c/span>\u003c/span>\u003cspan class=\"ln\">readLock.unlock();\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">9 行\u003c/span>\u003c/div>\u003c/figure>\n\u003ch2>适用与局限\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>维度\u003c/th>\n\u003cth>结论\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>读多写少\u003c/td>\n\u003ctd>✅ 缓存、配置表,读操作远多于写\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>写多或读写均衡\u003c/td>\n\u003ctd>❌ 写锁独占,优势消失,甚至不如普通互斥锁\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>临界区极小\u003c/td>\n\u003ctd>⚠️ 读写锁获取/释放比互斥锁重,临界区太小反而更慢\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>公平性\u003c/td>\n\u003ctd>构造器可选;非公平下连续到达的读锁会让写锁长期插不上队而饥饿\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>极端读多\u003c/td>\n\u003ctd>换 \u003ca class=\"wikilink\" data-target=\"stampedlock\">StampedLock\u003c/a> 乐观读更优\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">选型\u003c/div>\u003cp>读多写少用读写锁；极端读多且读短用 StampedLock。对比见 \u003ca class=\"wikilink\" data-target=\"java-锁对比\">Java 锁对比\u003c/a>。\u003c/p>\n\u003c/div>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(2题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">为什么读锁不能升级为写锁？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">若允许多个读线程都尝试升级写锁,会互相等待对方放读锁,形成死锁；故设计上只允许写→读降级。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">读写锁适合写多的场景吗？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">不适合,写锁独占且可能饥饿,写多时退化甚至不如普通互斥锁,应评估用 StampedLock 或分段锁。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(3条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：读多就一定能提速。读写锁的获取/释放本身比互斥锁重,临界区极小(几行读)时可能反而更慢,要压测。\u003c/li>\n\u003cli>误区：读锁可以升级成写锁。不允许,只支持写→读降级;要&quot;读后写&quot;就把整段用写锁包住。\u003c/li>\n\u003cli>误区：读写锁不会饥饿。非公平模式下持续到达的读锁会让写锁长期等待;写优先需求开公平模式。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["reentrantlock","stampedlock","java-锁对比"],"excerpt":"ReentrantReadWriteLock 维护一对锁(读共享/写独占) → 读读并发、读写/写写互斥 → 支持写锁降级为读锁 → 适合缓存等读多写少场景。","featured":"","order":0,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":3,"groupLayout":"tiles"},"spring":{"id":"spring","title":"Spring","type":"moc","category":"spring","file":"notes/Spring.md","accent":"#00E5FF","accentInk":"#0097A7","catLabel":"Spring","mtime":"2026-09-05T09:27:18.394Z","html":"\u003ch1>Spring\u003c/h1>\n\u003cp>Spring 框架族总览：以 IoC(控制反转，对象交由容器统一创建与装配)与 AOP(面向切面编程，把事务、日志这类横切逻辑从业务代码里抽离)为地基，覆盖 Spring Framework 容器与切面、Spring MVC Web 层、Spring Boot 自动装配。\u003c/p>\n","links":[],"excerpt":"Spring 框架族总览：以 IoC(控制反转，对象交由容器统一创建与装配)与 AOP(面向切面编程，把事务、日志这类横切逻辑从业务代码里抽离)为地基，覆盖 Spring Framework 容器与切面、Spring MVC Web 层、Spring Boot 自动装配。","featured":"","order":0,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":4,"groupLayout":"tiles"},"stampedlock":{"id":"stampedlock","title":"StampedLock","type":"note","category":"juc","file":"notes/StampedLock.md","accent":"#7C4DFF","accentInk":"#5E35B1","catLabel":"Concurrency","mtime":"2026-09-05T09:27:18.394Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">四种获取 \u003cspan class=\"chain-pill\">入口\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">写/读/乐观读/尝试\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">乐观读 \u003cspan class=\"chain-pill\">核心\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">无锁+戳校验\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">模式转换 \u003cspan class=\"chain-pill\">进阶\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">戳记升降级\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">不可重入 \u003cspan class=\"chain-pill\">边界\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">与 Reentrant 区别\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>StampedLock(JDK8)用戳记(stamp)管理三种模式 → 乐观读无锁读后校验戳 → 戳记还能在持有锁时升降级 → 但不可重入、无原生 Condition → 适合极读多写少且读短。\u003c/p>\n\u003c/details>\u003ch2>获取方式\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方式\u003c/th>\n\u003cth>方法\u003c/th>\n\u003cth>并发\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>写锁\u003c/td>\n\u003ctd>\u003ccode>writeLock()\u003c/code> / \u003ccode>writeLockInterruptibly()\u003c/code>\u003c/td>\n\u003ctd>独占\u003c/td>\n\u003ctd>返回 stamp,用 \u003ccode>unlockWrite(stamp)\u003c/code> 释放\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>读锁\u003c/td>\n\u003ctd>\u003ccode>readLock()\u003c/code> / \u003ccode>readLockInterruptibly()\u003c/code>\u003c/td>\n\u003ctd>共享\u003c/td>\n\u003ctd>阻塞直到无写,用 \u003ccode>unlockRead(stamp)\u003c/code> 释放\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>乐观读\u003c/td>\n\u003ctd>\u003ccode>tryOptimisticRead()\u003c/code>\u003c/td>\n\u003ctd>无锁\u003c/td>\n\u003ctd>返回 stamp,不阻塞;\u003cstrong>返回 0 表示正被写锁持有\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>超时尝试\u003c/td>\n\u003ctd>\u003ccode>tryReadLock(t)\u
