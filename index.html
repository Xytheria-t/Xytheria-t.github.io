"qa-t\">\u003ccode>findClass\u003c/code>。重写 \u003ccode>loadClass\u003c/code> 会绕过 \u003ca class=\"wikilink\" data-target=\"双亲委派模型\">双亲委派模型\u003c/a>。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">\u003ccode>getParent()\u003c/code> 返回 null 意味着什么？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">两种可能 —— 父是 Bootstrap（如 Extension 的父），或自己就是 Bootstrap（根本没有 Java 对象）。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(3条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：加载器之间可以互相访问。父加载器无法访问子加载器加载的类，只有单向可见性。\u003c/li>\n\u003cli>误区：\u003ccode>ExtClassLoader\u003c/code> 在 JDK 9 后仍是「扩展」。已改名 Platform 加载器，配合模块系统，加载平台模块而非 \u003ccode>lib/ext\u003c/code>。\u003c/li>\n\u003cli>误区：数组类也有对应的加载器文件。数组类由 JVM 动态生成，没有对应的 \u003ccode>.class\u003c/code> 文件。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["双亲委派模型","破坏双亲委派","类加载过程"],"excerpt":"四个加载器各管一块地盘，而「加载器 + 全限定名」才是类的真正身份；数组类是这条规则的豁免项，自定义加载器则把规则变成可编程的能力。","featured":"","order":2,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":2,"groupLayout":"tiles"},"类加载过程":{"id":"类加载过程","title":"类加载过程","type":"note","category":"jvm","file":"notes/类加载过程.md","accent":"#FF5252","accentInk":"#D32F2F","catLabel":"JVM","mtime":"2026-09-05T09:27:18.395Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">生命周期全景 \u003cspan class=\"chain-pill\">概览\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">七个阶段\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">连接三阶段 \u003cspan class=\"chain-pill\">拆解\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">验证准备解析\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">初始化时机 \u003cspan class=\"chain-pill\">关键\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">何时触发 clinit\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">被动引用反例 \u003cspan class=\"chain-pill\">辨析\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">不触发的反面\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>七个阶段里真正藏坑的是连接与初始化：验证 / 准备 / 解析各干什么、\u003ccode>clinit\u003c/code> 何时才被触发 —— 被动引用反例恰好把「加载 ≠ 初始化」钉死。\u003c/p>\n\u003c/details>\u003ch2>生命周期全景\u003c/h2>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">加载 \u003cspan class=\"chain-pill\">起点\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">读字节码生成 Class\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">连接 \u003cspan class=\"chain-pill\">衔接\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">验证 · 准备 · 解析\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">初始化 \u003cspan class=\"chain-pill\">激活\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">执行 clinit 赋真值\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">使用 \u003cspan class=\"chain-pill\">运行\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">实例化与调用\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">卸载 \u003cspan class=\"chain-pill\">终点\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">类型被回收\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>阶段\u003c/th>\n\u003cth>做什么\u003c/th>\n\u003cth>产物 / 副作用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>加载\u003c/td>\n\u003ctd>按全限定名读二进制字节流，转方法区运行时数据结构，堆上生成 \u003ccode>Class\u003c/code> 对象\u003c/td>\n\u003ctd>方法区类型数据 + 堆上 \u003ccode>Class\u003c/code> 实例\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>验证\u003c/td>\n\u003ctd>文件格式 / 元数据 / 字节码 / 符号引用四轮校验\u003c/td>\n\u003ctd>非法类文件抛 \u003ccode>VerifyError\u003c/code> / \u003ccode>ClassFormatError\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>准备\u003c/td>\n\u003ctd>为静态变量分配内存并赋\u003cstrong>零值\u003c/strong>\u003c/td>\n\u003ctd>\u003ccode>static int a\u003c/code> → 0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>解析\u003c/td>\n\u003ctd>常量池符号引用替换为直接引用\u003c/td>\n\u003ctd>指向目标的具体指针 / 偏移量\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>初始化\u003c/td>\n\u003ctd>执行编译器生成的 \u003ccode>&lt;clinit&gt;()\u003c/code>\u003c/td>\n\u003ctd>静态变量赋真值 + 静态块执行\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>卸载\u003c/td>\n\u003ctd>类型不可达，方法区回收\u003c/td>\n\u003ctd>需该类的 \u003ccode>Class\u003c/code> 与所有实例均不可达\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">解析：符号引用 → 直接引用\u003c/div>\u003cp>常量池里存的是\u003cstrong>符号引用\u003c/strong>——类全限定名、字段名 + 描述符这类「字符串描述」。解析把真正用到的符号替换成\u003cstrong>直接引用\u003c/strong>：方法区里的内存地址、字段偏移或方法句柄，此后指令直接寻址、不再查常量池。\n时机上，规范只要求 \u003ccode>anewarray\u003c/code> / \u003ccode>checkcast\u003c/code> / \u003ccode>getfield\u003c/code> / \u003ccode>invokestatic\u003c/code> 等 17 条指令在执行\u003cstrong>之前\u003c/strong>完成解析。所以解析既可在初始化前，也可在首次用到时（\u003cstrong>动态解析\u003c/strong>），这是运行时多态与动态语言支持的基础。\u003c/p>\n\u003c/div>\n\u003ch2>连接三阶段\u003c/h2>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">准备阶段 ≠ 赋真值\u003c/div>\u003cp>准备阶段只做「分配内存 + 零值」。\u003ccode>static int value = 123\u003c/code> 在准备后是 \u003cstrong>0\u003c/strong>，\u003ccode>123\u003c/code> 要等初始化阶段的 \u003ccode>&lt;clinit&gt;\u003c/code> 才写入。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>写法\u003c/th>\n\u003cth>准备阶段的值\u003c/th>\n\u003cth>原因\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>static int a = 123\u003c/code>\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>普通静态变量，真值在 \u003ccode>&lt;clinit&gt;\u003c/code> 中赋\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>static final int b = 123\u003c/code>\u003c/td>\n\u003ctd>123\u003c/td>\n\u003ctd>有 \u003ccode>ConstantValue\u003c/code> 属性，准备阶段直接写入\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>static final String s = &quot;x&quot;\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>&quot;x&quot;\u003c/code>\u003c/td>\n\u003ctd>同上，字面量编译期入常量池\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>static final int c = new Random().nextInt()\u003c/code>\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>非编译期常量，无 \u003ccode>ConstantValue\u003c/code>，走 \u003ccode>&lt;clinit&gt;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">\u003ccode>&lt;clinit&gt;\u003c/code> 会被加锁\u003c/div>\u003cp>JVM 保证一个类的 \u003ccode>&lt;clinit&gt;\u003c/code> 在多线程下只执行一次，其余线程阻塞等待。若 \u003ccode>&lt;clinit&gt;\u003c/code> 内出现耗时操作或死锁，会直接造成\u003cstrong>类加载死锁\u003c/strong>，表现为线程卡在 \u003ccode>Class.forName\u003c/code> 或首次类访问处，无异常输出。\u003c/p>\n\u003c/div>\n\u003ch2>初始化时机\u003c/h2>\n\u003cp>以下六种\u003cstrong>主动引用\u003c/strong>会触发初始化，规范严格限定为这几种：\u003c/p>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>示例\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>new\u003c/code> 实例化\u003c/td>\n\u003ctd>\u003ccode>new User()\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>访问静态变量 / 静态方法\u003c/td>\n\u003ctd>\u003ccode>User.count\u003c/code> / \u003ccode>User.init()\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>反射调用\u003c/td>\n\u003ctd>\u003ccode>Class.forName(&quot;com.x.User&quot;)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>初始化子类\u003c/td>\n\u003ctd>子类初始化前父类必先初始化\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>启动类\u003c/td>\n\u003ctd>含 \u003ccode>main\u003c/code> 方法的类\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>接口默认方法\u003c/td>\n\u003ctd>实现类初始化前，定义了 \u003ccode>default\u003c/code> 方法的接口先初始化\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">接口特例\u003c/div>\u003cp>接口也有 \u003ccode>&lt;clinit&gt;\u003c/code>，但\u003cstrong>初始化接口时不要求父接口全部初始化\u003c/strong>，只有真正用到父接口的常量或默认方法时才触发。\u003c/p>\n\u003c/div>\n\u003ch2>被动引用反例\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>写法\u003c/th>\n\u003cth>是否触发\u003c/th>\n\u003cth>说明\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>Sub.value\u003c/code>（\u003ccode>value\u003c/code> 定义在 \u003ccode>Parent\u003c/code>）\u003c/td>\n\u003ctd>只初始化 \u003ccode>Parent\u003c/code>\u003c/td>\n\u003ctd>静态字段只认\u003cstrong>声明它的类\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>User[] arr = new User[10]\u003c/code>\u003c/td>\n\u003ctd>不触发\u003c/td>\n\u003ctd>数组类由 JVM 直接生成，元素类不触发初始化（加载器归属见 \u003ca class=\"wikilink\" data-target=\"类加载器\">类加载器\u003c/a>）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>System.out.println(Const.COUNT)\u003c/code>（\u003ccode>static final\u003c/code> 字面量）\u003c/td>\n\u003ctd>不触发\u003c/td>\n\u003ctd>编译期常量被内联进调用方常量池\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ClassLoader.loadClass(&quot;com.x.User&quot;)\u003c/code>\u003c/td>\n\u003ctd>不触发\u003c/td>\n\u003ctd>只到加载；\u003ccode>Class.forName\u003c/code> 默认才初始化\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">\u003ccode>Class.forName\u003c/code> vs \u003ccode>loadClass\u003c/code>\u003c/div>\u003cp>\u003ccode>Class.forName(name)\u003c/code> 默认 \u003ccode>initialize=true\u003c/code>，会执行 \u003ccode>&lt;clinit&gt;\u003c/code>；\u003ccode>ClassLoader.loadClass(name)\u003c/code> 只走加载。\u003cstrong>JDBC 之所以能靠 \u003ccode>Class.forName(&quot;com.mysql.cj.jdbc.Driver&quot;)\u003c/code> 注册驱动\u003c/strong>，靠的正是 Driver 静态块里的 \u003ccode>DriverManager.registerDriver\u003c/code>。JDBC 4.0 后改走 SPI，见 \u003ca class=\"wikilink\" data-target=\"破坏双亲委派\">破坏双亲委派\u003c/a>。\u003c/p>\n\u003c/div>\n\u003cdetails>\u003csummary>展开状态图\u003c/summary>\u003cdiv class=\"mermaid\" data-mm-type=\"stateDiagram-v2\">stateDiagram-v2\n    [*] --> 加载\n    加载 --> 验证\n    验证 --> 准备 : 校验通过\n    准备 --> 解析 : 分配内存赋零值\n    解析 --> 初始化\n    初始化 --> 使用 : clinit 执行完毕\n    使用 --> 卸载 : Class 与实例均不可达\n    卸载 --> [*]\n    验证 --> [*] : VerifyError\n    解析 --> 初始化 : 也可延迟到首次使用时\n\u003c/div>\n\u003c/details>\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(4题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">类初始化的触发条件？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">六种主动引用 —— \u003ccode>new\u003c/code> 实例化、访问静态字段 / 调用静态方法、反射调用、初始化子类（父类先初始化）、含 \u003ccode>main\u003c/code> 的启动类、实现类初始化前先初始化定义了 \u003ccode>default\u003c/code> 方法的接口。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">\u003ccode>static int a = 1\u003c/code> 在准备阶段后 a 的值？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">0。准备阶段只赋零值，\u003ccode>1\u003c/code> 在初始化阶段的 \u003ccode>&lt;clinit&gt;\u003c/code> 中写入。若声明为 \u003ccode>static final\u003c/code> 且是编译期常量，准备阶段即为 1。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">父类和子类的初始化顺序？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">父类先于子类。父 \u003ccode>&lt;clinit&gt;\u003c/code> 执行完毕后才执行子 \u003ccode>&lt;clinit&gt;\u003c/code>；父类的静态块、静态变量先于子类就绪。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">类的卸载条件？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">该类的 \u003ccode>Class\u003c/code> 对象不可达，且不存在任何该类的实例，且加载它的 \u003ca class=\"wikilink\" data-target=\"类加载器\">类加载器\u003c/a> 本身可回收。Bootstrap 加载的类基本不可卸载。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(3条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：加载完就初始化。实际中间隔了验证、准备、解析三步，\u003ccode>loadClass\u003c/code> 只到加载阶段。\u003c/li>\n\u003cli>误区：常量传播让 \u003ccode>Const.COUNT\u003c/code> 触发 \u003ccode>Const\u003c/code> 初始化。编译期内联后运行期与 \u003ccode>Const\u003c/code> 已无字节码联系，改常量值必须重新编译引用方。\u003c/li>\n\u003cli>误区：\u003ccode>&lt;clinit&gt;\u003c/code> 里能安全起线程。\u003ccode>&lt;clinit&gt;\u003c/code> 持有类初始化锁，子线程若再访问同一类会死锁。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["类加载器","破坏双亲委派"],"excerpt":"七个阶段里真正藏坑的是连接与初始化：验证 / 准备 / 解析各干什么、`clinit` 何时才被触发 —— 被动引用反例恰好把「加载 ≠ 初始化」钉死。","featured":"","order":3,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":2,"groupLayout":"tiles"},"system-design":{"id":"system-design","title":"System Design","type":"moc","category":"system-design","file":"notes/系统设计.md","accent":"#FF6D00","accentInk":"#C43E00","catLabel":"System Design","mtime":"2026-09-05T09:27:18.395Z","html":"\u003ch1>System Design\u003c/h1>\n\u003cp>跨中间件与分布式的通用机制：缓存一致性、分布式事务、幂等、消息队列、限流熔断。不绑定任何单一项目，可被任意项目经历笔记引用。\u003c/p>\n\u003cul>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"缓存与数据库一致性\">缓存与数据库一致性\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"缓存穿透、击穿与雪崩\">缓存穿透、击穿与雪崩\u003c/a>\u003c/li>\n\u003c/ul>\n","links":["缓存与数据库一致性","缓存穿透、击穿与雪崩"],"excerpt":"跨中间件与分布式的通用机制：缓存一致性、分布式事务、幂等、消息队列、限流熔断。不绑定任何单一项目，可被任意项目经历笔记引用。","featured":"","order":0,"group":1,"groupNum":"Ⅱ","groupName":"架构与系统设计","groupRank":1,"groupLayout":"spread"},"线程创建":{"id":"线程创建","title":"线程创建","type":"note","category":"javase","file":"notes/线程创建.md","accent":"#00E676","accentInk":"#00A344","catLabel":"JavaSE","mtime":"2026-09-05T09:27:18.395Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">四种方式对比 \u003cspan class=\"chain-pill\">选型\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">谁写任务体\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">任务体接口 \u003cspan class=\"chain-pill\">分野\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">Runnable 与 Callable\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">start 与 run \u003cspan class=\"chain-pill\">陷阱\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">启动真相\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">落地：四种创建 \u003cspan class=\"chain-pill\">实战\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">代码与命名\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>四种创建方式只争一件事：任务体由谁提供 —— Runnable / Callable 决定任务体形态，start 与 run 决定跑在哪个线程；最后是落地代码与命名规范。\u003c/p>\n\u003c/details>\u003ch2>四种方式对比\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方式\u003c/th>\n\u003cth>写法要点\u003c/th>\n\u003cth>返回值\u003c/th>\n\u003cth>局限\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>继承 Thread\u003c/td>\n\u003ctd>重写 \u003ccode>run()\u003c/code>，\u003ccode>new MyThread().start()\u003c/code>\u003c/td>\n\u003ctd>无\u003c/td>\n\u003ctd>单继承被占用，任务与线程绑定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>实现 Runnable\u003c/td>\n\u003ctd>实现 \u003ccode>run()\u003c/code>，丢进 \u003ccode>new Thread(r)\u003c/code>\u003c/td>\n\u003ctd>无\u003c/td>\n\u003ctd>不能抛受检异常\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>实现 Callable + FutureTask\u003c/td>\n\u003ctd>实现 \u003ccode>call()\u003c/code>，包 \u003ccode>FutureTask\u003c/code> 再丢进 Thread\u003c/td>\n\u003ctd>有，\u003ccode>get()\u003c/code> 拿\u003c/td>\n\u003ctd>写法绕，需多包一层\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>线程池提交\u003c/td>\n\u003ctd>\u003ccode>execute(Runnable)\u003c/code> / \u003ccode>submit(Callable)\u003c/code>\u003c/td>\n\u003ctd>submit 有 Future\u003c/td>\n\u003ctd>需管理池生命周期\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">线程到底是什么\u003c/div>\u003cp>上表说的「线程」是 \u003ca class=\"wikilink\" data-target=\"进程与线程\">进程与线程\u003c/a> 里那个 CPU 调度的最小单位——同进程内共享堆、各自私有栈。先分清进程与线程，再看创建方式才不会混淆「任务体」与「执行体」。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">虚拟线程是另一条路线\u003c/div>\u003cp>上表四种都是\u003cstrong>平台线程\u003c/strong>（每任务占一个 OS 线程 + 约 1MB 栈）。JDK 21 起的虚拟线程按「任务」记账、海量 IO 场景可扛几十万任务，是并行的另一条路线，单开一篇：\u003ca class=\"wikilink\" data-target=\"虚拟线程\">虚拟线程\u003c/a>。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">只有一种本质\u003c/div>\u003cp>平台线程真正生出来永远只有 \u003ccode>new Thread(...)\u003c/code> 这一条路。其余方式改的都是\u003cstrong>任务体怎么表达\u003c/strong>，不是线程怎么生出来。线程池见 \u003ca class=\"wikilink\" data-target=\"线程池创建\">线程池创建\u003c/a>。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">生产选型\u003c/div>\u003cp>不需要返回值用 \u003ccode>Runnable\u003c/code>，需要返回值或抛受检异常用 \u003ccode>Callable\u003c/code>；批量任务一律交给池，别 \u003ccode>new Thread\u003c/code> 裸跑。\u003c/p>\n\u003c/div>\n\u003ch2>任务体接口\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>对比项\u003c/th>\n\u003cth>Runnable\u003c/th>\n\u003cth>Callable&lt;V&gt;\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>方法\u003c/td>\n\u003ctd>\u003ccode>void run()\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>V call()\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>返回值\u003c/td>\n\u003ctd>无\u003c/td>\n\u003ctd>有，\u003ccode>Future.get()\u003c/code> 取\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>受检异常\u003c/td>\n\u003ctd>不能抛\u003c/td>\n\u003ctd>可以抛\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>来历\u003c/td>\n\u003ctd>JDK 1.0\u003c/td>\n\u003ctd>JDK 1.5，配合 Future / 线程池\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>直接喂 Thread\u003c/td>\n\u003ctd>可以\u003c/td>\n\u003ctd>不行，须包 FutureTask\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">FutureTask 只跑一次\u003c/div>\u003cp>\u003ccode>FutureTask\u003c/code> 有终止态，同一个实例交给多个线程也只执行一遍 \u003ccode>call()\u003c/code>，结果被缓存复用。要重跑就 new 一个新的。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">get() 阻塞\u003c/div>\u003cp>\u003ccode>future.get()\u003c/code> 会一直阻塞到任务结束；用 \u003ccode>get(timeout, unit)\u003c/code> 设上限，否则一个卡死的任务能挂住整个调用线程。\u003c/p>\n\u003c/div>\n\u003ch2>start 与 run\u003c/h2>\n\u003cdiv class=\"branch\">\u003cdiv class=\"branch-stem\">\u003cdiv class=\"branch-step\">\u003cspan class=\"branch-num\">01\u003c/span>\u003cdiv class=\"branch-body\">\u003cdiv class=\"branch-t\">调用方法\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"branch-link-v\">\u003cspan>触发\u003c/span>\u003c/div>\u003cdiv class=\"branch-step\">\u003cspan class=\"branch-num\">02\u003c/span>\u003cdiv class=\"branch-body\">\u003cdiv class=\"branch-t\">按语义分流\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"branch-join\">\u003c/div>\u003cdiv class=\"branch-fan\">\u003c/div>\u003cdiv class=\"branch-grid\">\u003cdiv class=\"branch-card\">\u003cdiv class=\"branch-h\">start()\u003c/div>\u003cdiv class=\"branch-b\">新建线程执行 run\u003c/div>\u003cspan class=\"branch-tag\">正确启动\u003c/span>\u003c/div>\u003cdiv class=\"branch-card\">\u003cdiv class=\"branch-h\">run()\u003c/div>\u003cdiv class=\"branch-b\">当前线程串行跑一遍\u003c/div>\u003cspan class=\"branch-tag\">不会开线程\u003c/span>\u003c/div>\u003cdiv class=\"branch-card\">\u003cdiv class=\"branch-h\">start() 调两次\u003c/div>\u003cdiv class=\"branch-b\">IllegalThreadStateException\u003c/div>\u003cspan class=\"branch-tag\">线程不可重启\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">直接调 run() 不是多线程\u003c/div>\u003cp>\u003ccode>run()\u003c/code> 只是个普通方法，直接调等于在主线程里顺序执行一次，\u003cstrong>没有任何并发效果\u003c/strong>，这是最经典的手滑。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">线程不能复活\u003c/div>\u003cp>线程进入 \u003ccode>TERMINATED\u003c/code> 后不可再 \u003ccode>start()\u003c/code>，第二次调用抛 \u003ccode>IllegalThreadStateException\u003c/code>。要重跑就新建 Thread 实例，或把任务交给池。\u003c/p>\n\u003c/div>\n\u003cdetails>\u003csummary>展开线程状态迁移\u003c/summary>\u003cdiv class=\"mermaid\" data-mm-type=\"stateDiagram-v2\">stateDiagram-v2\n    [*] --> NEW : new Thread()\n    NEW --> RUNNABLE : start()\n    RUNNABLE --> BLOCKED : 竞争 synchronized 失败\n    BLOCKED --> RUNNABLE : 拿到锁\n    RUNNABLE --> WAITING : wait / join / park\n    WAITING --> RUNNABLE : notify / unpark\n    RUNNABLE --> TIMED_WAITING : sleep(ms) / wait(ms)\n    TIMED_WAITING --> RUNNABLE : 超时 / 唤醒\n    RUNNABLE --> TERMINATED : run() 结束\n    TERMINATED --> [*]\n\u003c/div>\n\u003c/details>\u003ch2>落地：四种创建代码\u003c/h2>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">本节能对应到上文四种\u003c/div>\u003cp>继承（耦合）→ Runnable（解耦）→ Callable（带结果）→ 池（批量），代码逐一落地；命名与超时是其中最容易漏的两处。\u003c/p>\n\u003c/div>\n\u003cfigure class=\"code\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// 1. 继承 Thread：任务与线程耦合，仅 demo 用\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">MyThread\u003c/span> \u003cspan class=\"hljs-keyword\">extends\u003c/span> \u003cspan class=\"hljs-title class_\">Thread\u003c/span> {\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-meta\">@Override\u003c/span> \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">run\u003c/span>\u003cspan class=\"hljs-params\">()\u003c/span> { System.out.println(\u003cspan class=\"hljs-string\">&quot;by Thread&quot;\u003c/span>); }\u003c/span>\u003cspan class=\"ln\">}\u003c/span>\u003cspan class=\"ln\"> \u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// 2. 实现 Runnable：无返回值首选\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">Thread\u003c/span> \u003cspan class=\"hljs-variable\">t1\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">Thread\u003c/span>(() -&gt; System.out.println(\u003cspan class=\"hljs-string\">&quot;by Runnable&quot;\u003c/span>), \u003cspan class=\"hljs-string\">&quot;biz-a&quot;\u003c/span>);\u003c/span>\u003cspan class=\"ln\"> \u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// 3. Callable + FutureTask：要返回值 / 抛受检异常\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">FutureTask\u003c/span>&lt;Integer&gt; \u003cspan class=\"hljs-variable\">task\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">FutureTask\u003c/span>&lt;&gt;(() -&gt; \u003cspan class=\"hljs-number\">42\u003c/span>);\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">Thread\u003c/span>(task, \u003cspan class=\"hljs-string\">&quot;calc&quot;\u003c/span>).start();\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">Integer\u003c/span> \u003cspan class=\"hljs-variable\">r\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> task.get(\u003cspan class=\"hljs-number\">3\u003c/span>, TimeUnit.SECONDS);   \u003cspan class=\"hljs-comment\">// 设超时，别死等\u003c/span>\u003c/span>\u003cspan class=\"ln\"> \u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// 4. 线程池：批量任务的归宿\u003c/span>\u003c/span>\u003cspan class=\"ln\">pool.execute(() -&gt; doSomething());\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">Future\u003c/span>&lt;Integer&gt; \u003cspan class=\"hljs-variable\">f\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> pool.submit(() -&gt; \u003cspan class=\"hljs-number\">42\u003c/span>);\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">16 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">为什么要命名\u003c/div>\u003cp>默认 \u003ccode>Thread-0\u003c/code> 在几十个线程的 jstack 里等于没信息。命名后线程 dump 与日志能直接定位到业务模块；池化场景靠 \u003ccode>ThreadFactory\u003c/code> 统一命名，写法见 \u003ca class=\"wikilink\" data-target=\"线程池创建\">线程池创建\u003c/a>。\u003c/p>\n\u003c/div>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(4题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">Java 有几种创建线程的方式？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">本质上只有 \u003ccode>new Thread()\u003c/code> 一种。常说的三种/四种（继承 Thread、实现 Runnable、Callable + FutureTask、线程池）区别在于任务体的表达与是否有返回值，底层仍然由 Thread 承载。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">start() 和 run() 的区别？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">\u003ccode>start()\u003c/code> 向 JVM 申请新线程，由新线程回调 \u003ccode>run()\u003c/code>，实现并发；直接调 \u003ccode>run()\u003c/code> 只是在当前线程顺序执行一次普通方法，不开新线程。且 \u003ccode>start()\u003c/code> 对一个线程实例只能调一次，重复调抛 \u003ccode>IllegalThreadStateException\u003c/code>。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">Runnable 和 Callable 有什么区别？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">Runnable 的 \u003ccode>run()\u003c/code> 无返回值、不能抛受检异常，JDK 1.0 就有；Callable 的 \u003ccode>call()\u003c/code> 有返回值、可抛受检异常，JDK 1.5 引入，需配合 FutureTask 或线程池 \u003ccode>submit\u003c/code> 使用。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">为什么不建议直接 new Thread？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">频繁创建销毁开销大、无上限、无法复用、故障难定位。交给线程池统一管理，参数可控、可监控，选型见 \u003ca class=\"wikilink\" data-target=\"线程池创建\">线程池创建\u003c/a>。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(3条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：继承 Thread 才算&quot;真正的&quot;线程。Runnable 只是把任务体解耦出来，线程本身仍是 Thread，且更灵活、可复用。\u003c/li>\n\u003cli>误区：Callable 一定要配 FutureTask。交给线程池时直接 \u003ccode>submit(Callable)\u003c/code> 即可拿到 Future，FutureTask 只在手写 \u003ccode>new Thread\u003c/code> 时才需要。\u003c/li>\n\u003cli>误区：调了 \u003ccode>run()\u003c/code> 就算并发。不开新线程，代码再像线程也是串行，压测 QPS 上不去的常见元凶。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["进程与线程","虚拟线程","线程池创建"],"excerpt":"四种创建方式只争一件事：任务体由谁提供 —— Runnable / Callable 决定任务体形态，start 与 run 决定跑在哪个线程；最后是落地代码与命名规范。","featured":"","order":0,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":0,"groupLayout":"tiles"},"线程池":{"id":"线程池","title":"线程池","type":"moc","category":"juc","file":"notes/线程池.md","accent":"#7C4DFF","accentInk":"#5E35B1","catLabel":"Concurrency","mtime":"2026-09-05T09:27:18.395Z","html":"\u003ch1>线程池\u003c/h1>\n\u003cp>线程池创建方式（工厂方法与手动构造）的选型与参数，ThreadPoolExecutor 执行任务，阻塞队列缓冲，拒绝策略兜底。\u003c/p>\n\u003cul>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"threadpoolexecutor\">ThreadPoolExecutor\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"线程池创建\">线程池创建\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"拒绝策略\">拒绝策略\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"wikilink\" data-target=\"阻塞队列\">阻塞队列\u003c/a>\u003c/li>\n\u003c/ul>\n","links":["threadpoolexecutor","线程池创建","拒绝策略","阻塞队列"],"excerpt":"线程池创建方式（工厂方法与手动构造）的选型与参数，ThreadPoolExecutor 执行任务，阻塞队列缓冲，拒绝策略兜底。","featured":"ThreadPoolExecutor","order":0,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":3,"groupLayout":"tiles"},"线程池创建":{"id":"线程池创建","title":"线程池创建","type":"note","category":"juc","file":"notes/线程池创建.md","accent":"#7C4DFF","accentInk":"#5E35B1","catLabel":"Concurrency","mtime":"2026-09-05T09:27:18.395Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">创建方式对比 \u003cspan class=\"chain-pill\">选型\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">工厂 / 手动 / Spring\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">Executors 工厂方法 \u003cspan class=\"chain-pill\">风险\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">六种快捷方式\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">手动构造 \u003cspan class=\"chain-pill\">推荐\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">显式七参\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">提交任务 \u003cspan class=\"chain-pill\">落地\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">execute 与 submit\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>Executors 图省事，风险藏在无界队列与默认拒绝策略里；要可控就手动构造显式七参 —— 提交任务时还得分清 execute 与 submit 谁带回执。\u003c/p>\n\u003c/details>\u003ch2>创建方式对比\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方式\u003c/th>\n\u003cth>写法\u003c/th>\n\u003cth>参数可见性\u003c/th>\n\u003cth>适用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Executors 工厂方法\u003c/td>\n\u003ctd>\u003ccode>Executors.newFixedThreadPool(n)\u003c/code>\u003c/td>\n\u003ctd>隐藏，队列多无界\u003c/td>\n\u003ctd>演示 / 低负载内部工具\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>手动 new\u003c/td>\n\u003ctd>\u003ccode>new ThreadPoolExecutor(...)\u003c/code>\u003c/td>\n\u003ctd>全显式\u003c/td>\n\u003ctd>生产默认\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Spring 封装\u003c/td>\n\u003ctd>\u003ccode>ThreadPoolTaskExecutor\u003c/code>\u003c/td>\n\u003ctd>全显式 + Bean 生命周期\u003c/td>\n\u003ctd>Spring 项目\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">强制约束\u003c/div>\u003cp>《Java 开发手册》禁止用 \u003ccode>Executors\u003c/code> 创建线程池：\u003ccode>newFixedThreadPool\u003c/code> / \u003ccode>newSingleThreadExecutor\u003c/code> 用无界 \u003ccode>LinkedBlockingQueue\u003c/code>，\u003ccode>newCachedThreadPool\u003c/code> / \u003ccode>newScheduledThreadPool\u003c/code> 的最大线程数是 \u003ccode>Integer.MAX_VALUE\u003c/code>，两条路都通向 OOM。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">唯一推荐\u003c/div>\u003cp>生产一律手动 \u003ccode>new ThreadPoolExecutor(...)\u003c/code>，显式给队列容量与 \u003ca class=\"wikilink\" data-target=\"拒绝策略\">拒绝策略\u003c/a>；Spring 项目用 \u003ccode>ThreadPoolTaskExecutor\u003c/code> 的等价写法。队列选型见 \u003ca class=\"wikilink\" data-target=\"阻塞队列\">阻塞队列\u003c/a>。\u003c/p>\n\u003c/div>\n\u003ch2>Executors 六种工厂方法\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方法\u003c/th>\n\u003cth>corePoolSize\u003c/th>\n\u003cth>maximumPoolSize\u003c/th>\n\u003cth>队列\u003c/th>\n\u003cth>主要风险\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>newFixedThreadPool(n)\u003c/td>\n\u003ctd>n\u003c/td>\n\u003ctd>n\u003c/td>\n\u003ctd>无界 LinkedBlockingQueue\u003c/td>\n\u003ctd>任务堆积 OOM\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>newSingleThreadExecutor()\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>无界 LinkedBlockingQueue\u003c/td>\n\u003ctd>任务堆积 OOM\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>newCachedThreadPool()\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>Integer.MAX_VALUE\u003c/td>\n\u003ctd>SynchronousQueue\u003c/td>\n\u003ctd>线程数爆炸\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>newScheduledThreadPool(n)\u003c/td>\n\u003ctd>n\u003c/td>\n\u003ctd>Integer.MAX_VALUE\u003c/td>\n\u003ctd>DelayedWorkQueue\u003c/td>\n\u003ctd>线程数爆炸\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>newSingleThreadScheduledExecutor()\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>Integer.MAX_VALUE\u003c/td>\n\u003ctd>DelayedWorkQueue\u003c/td>\n\u003ctd>线程数爆炸\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>newWorkStealingPool()\u003c/td>\n\u003ctd>CPU 核数\u003c/td>\n\u003ctd>按并行度动态管理\u003c/td>\n\u003ctd>每线程自带队列\u003c/td>\n\u003ctd>无界、不保序\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">共同点\u003c/div>\u003cp>除 newWorkStealingPool（返回 ForkJoinPool）外，其余五个都是 \u003ccode>new ThreadPoolExecutor(...)\u003c/code> 的预设参数包，没有特权，只是替你把危险默认值填好。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">newWorkStealingPool\u003c/div>\u003cp>底层是 \u003ccode>ForkJoinPool\u003c/code>，任务被分到各线程的工作队列并行执行，\u003cstrong>不保证提交顺序\u003c/strong>，只适合彼此无依赖的并行计算。\u003c/p>\n\u003c/div>\n\u003ch2>按场景选型\u003c/h2>\n\u003cdiv class=\"branch\">\u003cdiv class=\"branch-stem\">\u003cdiv class=\"branch-step\">\u003cspan class=\"branch-num\">01\u003c/span>\u003cdiv class=\"branch-body\">\u003cdiv class=\"branch-t\">选创建方式\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"branch-link-v\">\u003cspan>触发\u003c/span>\u003c/div>\u003cdiv class=\"branch-step\">\u003cspan class=\"branch-num\">02\u003c/span>\u003cdiv class=\"branch-body\">\u003cdiv class=\"branch-t\">按场景分流\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"branch-join\">\u003c/div>\u003cdiv class=\"branch-fan\">\u003c/div>\u003cdiv class=\"branch-grid\">\u003cdiv class=\"branch-card\">\u003cdiv class=\"branch-h\">生产服务\u003c/div>\u003cdiv class=\"branch-b\">new ThreadPoolExecutor + 有界队列\u003c/div>\u003cspan class=\"branch-tag\">默认\u003c/span>\u003c/div>\u003cdiv class=\"branch-card\">\u003cdiv class=\"branch-h\">Spring 项目\u003c/div>\u003cdiv class=\"branch-b\">ThreadPoolTaskExecutor Bean\u003c/div>\u003cspan class=\"branch-tag\">等价写法\u003c/span>\u003c/div>\u003cdiv class=\"branch-card\">\u003cdiv class=\"branch-h\">定时与延时\u003c/div>\u003cdiv class=\"branch-b\">new ScheduledThreadPoolExecutor(n) 显式上限\u003c/div>\u003cspan class=\"branch-tag\">禁 Executors 版\u003c/span>\u003c/div>\u003cdiv class=\"branch-card\">\u003cdiv class=\"branch-h\">一次性并行计算\u003c/div>\u003cdiv class=\"branch-b\">newWorkStealingPool / parallelStream\u003c/div>\u003cspan class=\"branch-tag\">不保序\u003c/span>\u003c/div>\u003cdiv class=\"branch-card\">\u003cdiv class=\"branch-h\">本地演示\u003c/div>\u003cdiv class=\"branch-b\">Executors.*\u003c/div>\u003cspan class=\"branch-tag\">限 demo\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n\u003ch2>落地：手动创建代码\u003c/h2>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">三个必填项\u003c/div>\u003cp>手动创建至少显式给三样：有界队列、可辨识的 \u003ccode>ThreadFactory\u003c/code>、明确 \u003ca class=\"wikilink\" data-target=\"拒绝策略\">拒绝策略\u003c/a>。core / max / keepAlive 按任务类型估算，公式见 \u003ca class=\"wikilink\" data-target=\"threadpoolexecutor\">ThreadPoolExecutor\u003c/a>。\u003c/p>\n\u003c/div>\n\u003cfigure class=\"code\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">ThreadFactory\u003c/span> \u003cspan class=\"hljs-variable\">named\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">ThreadFactory\u003c/span>() {\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">private\u003c/span> \u003cspan class=\"hljs-keyword\">final\u003c/span> \u003cspan class=\"hljs-type\">AtomicInteger\u003c/span> \u003cspan class=\"hljs-variable\">i\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">AtomicInteger\u003c/span>(\u003cspan class=\"hljs-number\">1\u003c/span>);\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">Thread\u003c/span> \u003cspan class=\"hljs-title function_\">newThread\u003c/span>\u003cspan class=\"hljs-params\">(Runnable r)\u003c/span> {\u003c/span>\u003cspan class=\"ln\">        \u003cspan class=\"hljs-keyword\">return\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">Thread\u003c/span>(r, \u003cspan class=\"hljs-string\">&quot;biz-pool-&quot;\u003c/span> + i.getAndIncrement());\u003c/span>\u003cspan class=\"ln\">    }\u003c/span>\u003cspan class=\"ln\">};\u003c/span>\u003cspan class=\"ln\"> \u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">ThreadPoolExecutor\u003c/span> \u003cspan class=\"hljs-variable\">pool\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">ThreadPoolExecutor\u003c/span>(\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-number\">4\u003c/span>,                              \u003cspan class=\"hljs-comment\">// corePoolSize\u003c/span>\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-number\">8\u003c/span>,                              \u003cspan class=\"hljs-comment\">// maximumPoolSize\u003c/span>\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-number\">60\u003c/span>, TimeUnit.SECONDS,           \u003cspan class=\"hljs-comment\">// 非核心线程空闲存活\u003c/span>\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">ArrayBlockingQueue\u003c/span>&lt;&gt;(\u003cspan class=\"hljs-number\">200\u003c/span>),  \u003cspan class=\"hljs-comment\">// 有界队列\u003c/span>\u003c/span>\u003cspan class=\"ln\">    named,                          \u003cspan class=\"hljs-comment\">// 线程命名，排障时能定位\u003c/span>\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">ThreadPoolExecutor\u003c/span>.CallerRunsPolicy());\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">14 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">为什么要给线程命名\u003c/div>\u003cp>默认的 \u003ccode>pool-1-thread-1\u003c/code> 在有几十个池的进程里等于没有信息。命名后 jstack 与日志能直接指出是哪个业务池打满。\u003c/p>\n\u003c/div>\n\u003cdetails>\u003csummary>展开类图\u003c/summary>\u003cdiv class=\"mermaid\" data-mm-type=\"classDiagram\">classDiagram\n    class Executors {\n        &lt;&lt;utility>>\n        +newFixedThreadPool(int)\n        +newCachedThreadPool()\n        +newScheduledThreadPool(int)\n        +newWorkStealingPool()\n    }\n    class ThreadPoolExecutor {\n        -int corePoolSize\n        -int maximumPoolSize\n        -BlockingQueue workQueue\n        +execute(Runnable)\n        +submit(Callable)\n    }\n    class ScheduledThreadPoolExecutor\n    class ForkJoinPool\n    Executors ..> ThreadPoolExecutor : 预设参数\n    ThreadPoolExecutor &lt;|-- ScheduledThreadPoolExecutor\n    Executors ..> ForkJoinPool : newWorkStealingPool\n\u003c/div>\n\u003c/details>\u003ch2>提交任务\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>方法\u003c/th>\n\u003cth>入参\u003c/th>\n\u003cth>返回\u003c/th>\n\u003cth>异常处理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>execute\u003c/td>\n\u003ctd>Runnable\u003c/td>\n\u003ctd>void\u003c/td>\n\u003ctd>异常抛到工作线程，该线程终止并由池补建\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>submit\u003c/td>\n\u003ctd>Runnable / Callable\u003c/td>\n\u003ctd>Future\u003c/td>\n\u003ctd>异常封进 Future，调 \u003ccode>get()\u003c/code> 才抛出\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">submit 吞异常\u003c/div>\u003cp>\u003ccode>submit\u003c/code> 把异常封进 \u003ccode>Future\u003c/code>，不调 \u003ccode>get()\u003c/code> 就永远看不到失败，任务静默消失。需要感知结果就 \u003ccode>get()\u003c/code>，或统一加 \u003ccode>UncaughtExceptionHandler\u003c/code>。\u003c/p>\n\u003c/div>\n\u003cfigure class=\"code mini\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">pool.execute(() -&gt; doSomething());          \u003cspan class=\"hljs-comment\">// 不关心结果\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">Future\u003c/span>&lt;Integer&gt; \u003cspan class=\"hljs-variable\">f\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> pool.submit(() -&gt; \u003cspan class=\"hljs-number\">42\u003c/span>);  \u003cspan class=\"hljs-comment\">// 关心结果 / 需要取消\u003c/span>\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">2 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cdetails>\u003csummary>Spring 写法\u003c/summary>\u003cfigure class=\"code\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-meta\">@Bean\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">ThreadPoolTaskExecutor\u003c/span> \u003cspan class=\"hljs-title function_\">bizExecutor\u003c/span>\u003cspan class=\"hljs-params\">()\u003c/span> {\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-type\">ThreadPoolTaskExecutor\u003c/span> \u003cspan class=\"hljs-variable\">t\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">ThreadPoolTaskExecutor\u003c/span>();\u003c/span>\u003cspan class=\"ln\">    t.setCorePoolSize(\u003cspan class=\"hljs-number\">4\u003c/span>);\u003c/span>\u003cspan class=\"ln\">    t.setMaxPoolSize(\u003cspan class=\"hljs-number\">8\u003c/span>);\u003c/span>\u003cspan class=\"ln\">    t.setQueueCapacity(\u003cspan class=\"hljs-number\">200\u003c/span>);\u003c/span>\u003cspan class=\"ln\">    t.setThreadNamePrefix(\u003cspan class=\"hljs-string\">&quot;biz-&quot;\u003c/span>);\u003c/span>\u003cspan class=\"ln\">    t.setRejectedExecutionHandler(\u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">ThreadPoolExecutor\u003c/span>.CallerRunsPolicy());\u003c/span>\u003cspan class=\"ln\">    t.initialize();\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">return\u003c/span> t;\u003c/span>\u003cspan class=\"ln\">}\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">11 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cul>\n\u003cli>底层仍委托 \u003ccode>ThreadPoolExecutor\u003c/code>，只是多了 Bean 生命周期与 \u003ccode>shutdown\u003c/code> 钩子。\u003c/li>\n\u003cli>\u003ccode>@Async(&quot;bizExecutor&quot;)\u003c/code> 按 Bean 名指定，不指定则用默认的 \u003ccode>applicationTaskExecutor\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003c/details>\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(4题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">为什么禁止用 Executors 创建线程池？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">固定/单线程版用无界 LinkedBlockingQueue，任务堆积耗尽堆内存；缓存/定时版最大线程数为 Integer.MAX_VALUE，可创建海量线程。两者都能 OOM，且参数不可控、出事定位不到是哪个池。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">手动创建最少要指定哪些东西？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">有界队列容量、ThreadFactory（线程命名）、拒绝策略，外加 core / max / keepAlive。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">execute 与 submit 有什么区别？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">execute 只收 Runnable、无返回值，异常直接在工作线程抛出；submit 返回 Future，异常被封装，必须 \u003ccode>get()\u003c/code> 才能拿到，否则静默失败。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">Spring 里怎么建线程池？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">定义 ThreadPoolTaskExecutor Bean，设 core/max/queueCapacity/RejectedExecutionHandler 并调 initialize()，用 \u003ccode>@Async(&quot;beanName&quot;)\u003c/code> 绑定。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(3条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：Executors 只是语法糖，用用无妨。它填的是危险默认值，把 OOM 风险藏到调用方看不见的地方。\u003c/li>\n\u003cli>误区：corePoolSize 越大越好。超出 CPU 承载力只是增加上下文切换，估算公式见 \u003ca class=\"wikilink\" data-target=\"threadpoolexecutor\">ThreadPoolExecutor\u003c/a>。\u003c/li>\n\u003cli>误区：配了有界队列就安全。队列打满后的行为由 \u003ca class=\"wikilink\" data-target=\"拒绝策略\">拒绝策略\u003c/a> 决定，默认 AbortPolicy 会直接抛异常打断调用方。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["拒绝策略","阻塞队列","threadpoolexecutor"],"excerpt":"Executors 图省事，风险藏在无界队列与默认拒绝策略里；要可控就手动构造显式七参 —— 提交任务时还得分清 execute 与 submit 谁带回执。","featured":"","order":2,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":3,"groupLayout":"tiles"},"经典三层架构":{"id":"经典三层架构","title":"经典三层架构","type":"note","category":"architecture","file":"notes/经典三层架构.md","accent":"#FF6D00","accentInk":"#C43E00","catLabel":"Architecture","mtime":"2026-09-05T09:27:18.395Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">三层定义 \u003cspan class=\"chain-pill\">概览\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">各层职责边界\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">依赖方向 \u003cspan class=\"chain-pill\">核心\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">上层依赖下层与解耦\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">与 MVC 辨析 \u003cspan class=\"chain-pill\">厘清\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">架构分层 vs 表现层模式\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">落地：Spring 骨架 \u003cspan class=\"chain-pill\">实战\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">构造注入分层\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>三层的本质是「职责分区 + 单向依赖」：上层调下层、靠接口解耦；最常被混为一谈的是它与 MVC 的分工 —— MVC 只是表现层内部的组织方式。\u003c/p>\n\u003c/details>\u003ch2>三层定义\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>层\u003c/th>\n\u003cth>别名\u003c/th>\n\u003cth>职责\u003c/th>\n\u003cth>典型组件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>表现层\u003c/td>\n\u003ctd>表示层 / UI / Web\u003c/td>\n\u003ctd>接收请求、参数校验、组装响应\u003c/td>\n\u003ctd>Controller、View、DTO\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>业务逻辑层\u003c/td>\n\u003ctd>服务层 / Service\u003c/td>\n\u003ctd>业务规则、事务编排、领域计算\u003c/td>\n\u003ctd>Service、Manager、Domain\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>数据访问层\u003c/td>\n\u003ctd>持久层 / DAO\u003c/td>\n\u003ctd>数据增删改查、与 DB / 外部存储交互\u003c/td>\n\u003ctd>DAO、Mapper、Repository\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">跨层模型\u003c/div>\u003cp>实体 / 模型（DO / POJO / DTO）在层间传输。贫血模型（仅字段 + getter/setter）最常见；充血模型把行为放进实体，归属领域驱动设计（DDD）讨论范畴。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">分层动机\u003c/div>\u003cp>单一职责、解耦、下层可替换（换数据库）、上层可独立单测（mock 下层）。小脚本 / 极简 CRUD 可不分层，业务复杂后不分则耦合失控。\u003c/p>\n\u003c/div>\n\u003ch2>依赖方向\u003c/h2>\n\u003cp>依赖单向向下：表现层 → 业务层 → 数据层；下层\u003cstrong>绝不\u003c/strong>反向依赖上层。数据层之下的存储与索引设计见 \u003ca class=\"wikilink\" data-target=\"mysql索引为什么用b+树\">MySQL索引为什么用B+树\u003c/a>。\u003c/p>\n\u003cdiv class=\"mermaid\" data-mm-type=\"flowchart\">flowchart TD\n  P[表现层 Controller] -. 只依赖接口 .-> B[业务层 Service]\n  B -. 只依赖接口 .-> D[数据层 DAO / Repository]\n  D --> DB[(数据库)]\n  P -.- X[依赖单向向下&lt;br/>下层绝不反向依赖上层]\n\u003c/div>\n\u003cul>\n\u003cli>\u003cstrong>面向接口编程\u003c/strong>：上层持有下层接口，不持有具体实现。\u003c/li>\n\u003cli>\u003cstrong>依赖倒置（DIP）\u003c/strong>：上层定义接口，下层实现，运行时注入（如 Spring \u003ccode>@Autowired\u003c/code>）。\u003c/li>\n\u003cli>\u003cstrong>收益\u003c/strong>：换下层实现零改上层；单测用 mock 桩替换下层，隔离验证业务逻辑。\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">面向接口正是 AOP 的土壤\u003c/div>\u003cp>上层的「接口 + 运行时注入」让容器有机会塞进代理对象——Spring 的声明式事务、缓存注解全都挂在 \u003ca class=\"wikilink\" data-target=\"动态代理\">动态代理\u003c/a> 之上。所以业务层一旦脱离接口、改用 \u003ccode>this.xxx()\u003c/code> 自调用，事务与缓存注解会集体失效。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">反向依赖即破层\u003c/div>\u003cp>数据层 / 业务层回调表现层（如 DAO 里拼界面文案）会破坏分层、诱发循环依赖，必须禁止。\u003c/p>\n\u003c/div>\n\u003ch2>与 MVC 辨析\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>维度\u003c/th>\n\u003cth>经典三层架构\u003c/th>\n\u003cth>MVC\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>视角\u003c/td>\n\u003ctd>系统级纵向职责分层\u003c/td>\n\u003ctd>表现层内部设计模式\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>覆盖范围\u003c/td>\n\u003ctd>表现 + 业务 + 数据\u003c/td>\n\u003ctd>仅表现层（Model-View-Controller）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>关系\u003c/td>\n\u003ctd>MVC 的 Controller 属于三层中的表现层\u003c/td>\n\u003ctd>解决「界面与交互如何组织」\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">高频混淆\u003c/div>\u003cp>把 MVC 当三层架构：误以为 M=数据层、V/C=表现层。实际 MVC 的 Model 常是领域模型，归属业务 / 表现，并不等于数据访问层。三层解决&quot;系统怎么切分职责&quot;，MVC 解决&quot;表现层怎么组织&quot;。\u003c/p>\n\u003c/div>\n\u003ch2>落地：Spring 骨架代码\u003c/h2>\n\u003cp>Spring 风格骨架，依赖全部通过构造函数注入。为省篇幅下层直接给出实现类；生产中业务层 / 数据层建议抽接口 + Impl，面向接口的收益见上文：\u003c/p>\n\u003cfigure class=\"code\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// 表现层\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-meta\">@RestController\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-meta\">@RequestMapping(&quot;/orders&quot;)\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">OrderController\u003c/span> {\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">private\u003c/span> \u003cspan class=\"hljs-keyword\">final\u003c/span> OrderService service;          \u003cspan class=\"hljs-comment\">// 依赖业务层\u003c/span>\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-type\">public\u003c/span> \u003cspan class=\"hljs-title function_\">OrderController\u003c/span>\u003cspan class=\"hljs-params\">(OrderService s)\u003c/span> { \u003cspan class=\"hljs-built_in\">this\u003c/span>.service = s; }\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-meta\">@PostMapping\u003c/span>\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">OrderDTO\u003c/span> \u003cspan class=\"hljs-title function_\">create\u003c/span>\u003cspan class=\"hljs-params\">(\u003cspan class=\"hljs-meta\">@RequestBody\u003c/span> OrderDTO dto)\u003c/span> {\u003c/span>\u003cspan class=\"ln\">        \u003cspan class=\"hljs-keyword\">return\u003c/span> service.create(dto);\u003c/span>\u003cspan class=\"ln\">    }\u003c/span>\u003cspan class=\"ln\">}\u003c/span>\u003cspan class=\"ln\"> \u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// 业务层\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-meta\">@Service\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">OrderService\u003c/span> {\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">private\u003c/span> \u003cspan class=\"hljs-keyword\">final\u003c/span> OrderRepository repo;          \u003cspan class=\"hljs-comment\">// 依赖数据层\u003c/span>\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-type\">public\u003c/span> \u003cspan class=\"hljs-title function_\">OrderService\u003c/span>\u003cspan class=\"hljs-params\">(OrderRepository r)\u003c/span> { \u003cspan class=\"hljs-built_in\">this\u003c/span>.repo = r; }\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-meta\">@Transactional\u003c/span>\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">OrderDTO\u003c/span> \u003cspan class=\"hljs-title function_\">create\u003c/span>\u003cspan class=\"hljs-params\">(OrderDTO dto)\u003c/span> {       \u003cspan class=\"hljs-comment\">// 业务规则 + 事务\u003c/span>\u003c/span>\u003cspan class=\"ln\">        \u003cspan class=\"hljs-keyword\">return\u003c/span> repo.save(dto);\u003c/span>\u003cspan class=\"ln\">    }\u003c/span>\u003cspan class=\"ln\">}\u003c/span>\u003cspan class=\"ln\"> \u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// 数据层\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-meta\">@Repository\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">OrderRepository\u003c/span> {\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">OrderDTO\u003c/span> \u003cspan class=\"hljs-title function_\">save\u003c/span>\u003cspan class=\"hljs-params\">(OrderDTO dto)\u003c/span> {         \u003cspan class=\"hljs-comment\">// JDBC / MyBatis / JPA\u003c/span>\u003c/span>\u003cspan class=\"ln\">        \u003cspan class=\"hljs-keyword\">return\u003c/span> dto;\u003c/span>\u003cspan class=\"ln\">    }\u003c/span>\u003cspan class=\"ln\">}\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">30 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">演进方向\u003c/div>\u003cp>贫血三层在复杂域会膨胀为「事务脚本」；领域驱动设计（DDD）、六边形架构、微服务是更进一步的切分思路，按需引入，勿过早。\u003c/p>\n\u003c/div>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(3题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">三层架构和 MVC 有什么区别？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">三层是系统级职责分层（表现 / 业务 / 数据），MVC 是表现层内部的模式；Controller 属于三层中的表现层，二者不互斥。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">为什么要分层，不分不行吗？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">分层为解耦、单一职责、下层可替换、上层可独立单测；极简 CRUD 或脚本可不分层，但业务复杂后不分则耦合失控、难以维护。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">层与层之间如何解耦？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">面向接口编程 + 依赖倒置（上层定义接口、下层实现、依赖注入），下层不反向依赖上层。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(4条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：MVC = 三层架构。实际 MVC 仅覆盖表现层，二者视角不同。\u003c/li>\n\u003cli>误区：每层都必须有。简单 CRUD 硬套三层是过度设计，应按复杂度取舍。\u003c/li>\n\u003cli>误区：下层可以调用上层。依赖必须单向向下，反向会破坏分层、形成循环依赖。\u003c/li>\n\u003cli>误区：业务逻辑写在 Controller 里。这把表现层变成业务层，丧失可测试性与复用。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["mysql索引为什么用b+树","动态代理"],"excerpt":"三层的本质是「职责分区 + 单向依赖」：上层调下层、靠接口解耦；最常被混为一谈的是它与 MVC 的分工 —— MVC 只是表现层内部的组织方式。","featured":"","order":0,"group":1,"groupNum":"Ⅱ","groupName":"架构与系统设计","groupRank":0,"groupLayout":"spread"},"缓存与数据库一致性":{"id":"缓存与数据库一致性","title":"缓存与数据库一致性","type":"note","category":"system-design","file":"notes/缓存与数据库一致性.md","accent":"#FF6D00","accentInk":"#C43E00","catLabel":"System Design","mtime":"2026-09-05T09:27:18.395Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">不一致是常态 \u003cspan class=\"chain-pill\">前提\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">接受窗口而非消灭\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">四种策略全景 \u003cspan class=\"chain-pill\">选型\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">谁代理读写\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">Cache-Aside 落地 \u003cspan class=\"chain-pill\">核心\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">删不更 · 提交后删\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">兜底与选型 \u003cspan class=\"chain-pill\">收尾\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">TTL · 补偿 · 分级\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>缓存与 DB 之间必然存在不一致窗口 → 按一致性要求选策略 → Cache-Aside 是最常用的落地 → 全部靠 TTL 与补偿兜底收敛。\u003c/p>\n\u003cdiv class=\"callout important\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z\"/>\u003c/svg>重点\u003c/div>\u003cdiv class=\"callout-sub\">心法\u003c/div>\u003cp>一致性不靠「让缓存永远等于 DB」，而靠「缓存只是可丢弃、会过期的加速层」——读回源、写失效、短 TTL 兜底、故障直查 DB。\u003c/p>\n\u003c/div>\n\u003c/details>\u003ch2>策略全景\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>策略\u003c/th>\n\u003cth>常见名称\u003c/th>\n\u003cth>思路\u003c/th>\n\u003cth>一致性\u003c/th>\n\u003cth>写延迟\u003c/th>\n\u003cth>适用\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Cache-Aside\u003c/td>\n\u003ctd>旁路缓存\u003c/td>\n\u003ctd>读 miss 回源；写更新 DB + 删缓存\u003c/td>\n\u003ctd>最终\u003c/td>\n\u003ctd>低\u003c/td>\n\u003ctd>读多写少\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Read/Write-Through\u003c/td>\n\u003ctd>读写穿透 / 直写直读\u003c/td>\n\u003ctd>缓存层代理读写，写同步落 DB\u003c/td>\n\u003ctd>同步阻塞（代码层强依赖）\u003c/td>\n\u003ctd>高\u003c/td>\n\u003ctd>强一致、写少\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Write-Behind\u003c/td>\n\u003ctd>异步回写 / Write-Back\u003c/td>\n\u003ctd>写只落缓存，异步批量落库\u003c/td>\n\u003ctd>最终\u003c/td>\n\u003ctd>极低\u003c/td>\n\u003ctd>高频计数、可丢\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>binlog 订阅\u003c/td>\n\u003ctd>Canal / Maxwell\u003c/td>\n\u003ctd>监听 binlog 异步删/更新缓存\u003c/td>\n\u003ctd>近强\u003c/td>\n\u003ctd>低\u003c/td>\n\u003ctd>多写入口、解耦失效\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>Cache-Aside\u003c/h2>\n\u003cpre>\u003ccode>读: 命中→返回 / 未命中→查DB→回填→返回\n写: 更新DB → 删缓存(不是改)\n\u003c/code>\u003c/pre>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">为什么删不是改\u003c/div>\u003cp>避免「写 DB 成功 → 更新缓存失败 → 永久脏」。删了下次读自然回填。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">
