h2>核心差异对比\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>对比项\u003c/th>\n\u003cth>进程\u003c/th>\n\u003cth>线程\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>创建 / 切换开销\u003c/td>\n\u003ctd>大：切换虚拟内存映射 → \u003cstrong>TLB 快表全失效\u003c/strong>、CPU 缓存命中率骤降\u003c/td>\n\u003ctd>小：不切换虚拟空间，TLB 与缓存仍有效，仅保存寄存器 / 栈 / PC\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>崩溃影响\u003c/td>\n\u003ctd>一个崩了不影响其他进程\u003c/td>\n\u003ctd>一个崩了，全进程陪葬（&quot;崩&quot;指段错误 / 未处理致命异常；业务 \u003ccode>Exception\u003c/code> 被 \u003ccode>try-catch\u003c/code> 捕获则无碍）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>数量限制\u003c/td>\n\u003ctd>受物理内存限制，通常较少（几百已近极限）\u003c/td>\n\u003ctd>受线程栈（常 1MB）限制但远多于进程（可数千）；超出 CPU 核心太多会频繁上下文切换，反噬性能\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>数据共享\u003c/td>\n\u003ctd>默认隔离，要显式打通\u003c/td>\n\u003ctd>默认共享，要显式隔离（锁 / \u003ccode>volatile\u003c/code>）\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">共享是把双刃剑\u003c/div>\u003cp>线程共享内存所以通信快，但也因此产生\u003cstrong>竞态\u003c/strong>——不加锁的并发写是 bug 温床；进程隔离所以安全，但通信成本高。这就是并发编程里&quot;锁&quot;存在的根本原因。\u003c/p>\n\u003c/div>\n\u003ch2>进程—线程结构\u003c/h2>\n\u003cdiv class=\"mermaid\" data-mm-type=\"flowchart\">flowchart TD\n    P[进程 A&lt;br/>独立地址空间] --> T1[线程 1&lt;br/>私有: 栈 / PC / 寄存器]\n    P --> T2[线程 2&lt;br/>私有: 栈 / PC / 寄存器]\n    P --> T3[线程 3&lt;br/>私有: 栈 / PC / 寄存器]\n    T1 -.共享.-> S[共享: 堆 / 全局变量 / 文件句柄 / 代码段]\n    T2 -.共享.-> S\n    T3 -.共享.-> S\n    Q[进程 B&lt;br/>独立地址空间] -.IPC.-> P\n\u003c/div>\n\u003ch2>通信方式对照\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>场景\u003c/th>\n\u003cth>进程间\u003c/th>\n\u003cth>线程间\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>传递数据\u003c/td>\n\u003ctd>管道 / 消息队列 / Socket / 共享内存（需 mmap 映射）\u003c/td>\n\u003ctd>直接读写共享变量\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>同步机制\u003c/td>\n\u003ctd>信号量 / 文件锁（偏重）\u003c/td>\n\u003ctd>\u003ccode>synchronized\u003c/code> / \u003ccode>Lock\u003c/code> / \u003ccode>volatile\u003c/code>（轻量）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>典型成本\u003c/td>\n\u003ctd>内核介入、数据拷贝\u003c/td>\n\u003ctd>多为用户态，开销低\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">Java 的现实\u003c/div>\u003cp>JVM 本身是一个进程；我们写的&quot;多线程&quot;都在同一个 JVM 进程内共享堆。这些线程怎么造出来见 \u003ca class=\"wikilink\" data-target=\"线程创建\">线程创建\u003c/a>，想做进程级隔离得另起 JVM 或用多进程框架，批量任务的归宿是 \u003ca class=\"wikilink\" data-target=\"threadpoolexecutor\">ThreadPoolExecutor\u003c/a>。\u003c/p>\n\u003c/div>\n\u003ch2>适用场景\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>诉求\u003c/th>\n\u003cth>选型\u003c/th>\n\u003cth>理由\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>强故障隔离（如浏览器多 tab）\u003c/td>\n\u003ctd>多进程\u003c/td>\n\u003ctd>一个崩了不连累其他\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>高并发、频繁共享状态（如 web 服务）\u003c/td>\n\u003ctd>多线程 / 线程池\u003c/td>\n\u003ctd>共享内存通信快、开销低\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>多核 CPU 密集计算\u003c/td>\n\u003ctd>多线程更省\u003c/td>\n\u003ctd>避免 IPC 拷贝开销\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>跨机器 / 跨语言协作\u003c/td>\n\u003ctd>多进程 + 网络\u003c/td>\n\u003ctd>进程边界 = 自然的部署边界\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>高频交易 / 低延迟\u003c/td>\n\u003ctd>\u003cstrong>必须多线程\u003c/strong>\u003c/td>\n\u003ctd>IPC 即便用共享内存也要走 mmap 等系统调用陷内核；线程自旋锁全在用户态，免内核陷入（Kernel Trap），省纳秒级却极关键的延迟\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(4题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">进程和线程的根本区别是什么？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">进程是资源分配的最小单位，拥有独立地址空间；线程是 CPU 调度的最小单位，同进程内线程共享地址空间。一句话定义表已概括本质、开销与崩溃差异。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">为什么线程切换比进程切换快？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">线程切换不换虚拟内存映射，TLB 和 CPU 缓存依然有效，只保存 / 恢复寄存器、栈和 PC；进程切换要换整套虚拟地址空间，TLB 全失效、缓存命中率骤降，重建开销大得多。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">多线程共享什么、私有什么？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">结构图已说明：共享堆、全局变量、文件句柄、代码段；每线程私有栈、PC、寄存器。正因为共享堆才需要锁保护共享数据。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">什么时候用多进程而不是多线程？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">需要故障隔离（一模块崩不能拖垮整体）、跨语言 / 跨机器协作、或想避开锁争用时，优先多进程；否则高并发共享状态用多线程更划算。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(3条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：多线程一定比多进程快。只有涉及大量共享数据计算时多线程才更快；大量 I/O 或频繁申请大内存时，多进程的稳定性反而更好。\u003c/li>\n\u003cli>误区：进程间完全独立、没有任何共享。\u003ccode>fork\u003c/code> 后代码段通常与父进程只读共享，写时才拷贝（Copy-on-Write）；共享内存段（mmap）也能跨进程共享。\u003c/li>\n\u003cli>误区：线程越多跑得越快。受限于 Amdahl 定律与上下文切换开销，线程数超过 CPU 核心后吞吐量反而可能下降。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["线程创建","threadpoolexecutor"],"excerpt":"进程是资源分配的最小单位，线程是 CPU 调度的最小单位 → 由此推出地址空间、开销、通信的根本差异 → 线程间共享内存、进程间走 IPC → 按崩溃隔离 / 共享需求选型 → 面试问答复盘。","featured":"","order":0,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":3,"groupLayout":"tiles"},"阻塞队列":{"id":"阻塞队列","title":"阻塞队列","type":"note","category":"juc","file":"notes/阻塞队列.md","accent":"#7C4DFF","accentInk":"#5E35B1","catLabel":"Concurrency","mtime":"2026-09-05T09:27:18.395Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">队列分类 \u003cspan class=\"chain-pill\">选型\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">有界/无界/同步\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">阻塞语义 \u003cspan class=\"chain-pill\">背压\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">空/满等待\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">容量与扩容 \u003cspan class=\"chain-pill\">联动线程池\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">触发扩容\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>按容量给队列分类 → 阻塞语义与扩容触发 → 面试问答复盘。\u003c/p>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">容量满时\u003c/div>\u003cp>触发扩容（线程数 → maximumPoolSize）或触发拒绝策略（参见 \u003ca class=\"wikilink\" data-target=\"拒绝策略\">拒绝策略\u003c/a>），由队列容量与线程池参数共同决定。\u003c/p>\n\u003c/div>\n\u003c/details>\u003ch2>常见实现\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>实现\u003c/th>\n\u003cth>特点\u003c/th>\n\u003cth>用途\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>LinkedBlockingQueue\u003c/td>\n\u003ctd>可选有界\u003c/td>\n\u003ctd>FixedThreadPool 默认无界\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ArrayBlockingQueue\u003c/td>\n\u003ctd>有界、定长\u003c/td>\n\u003ctd>固定容量\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SynchronousQueue\u003c/td>\n\u003ctd>不缓冲\u003c/td>\n\u003ctd>CachedThreadPool\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DelayQueue\u003c/td>\n\u003ctd>延时\u003c/td>\n\u003ctd>定时任务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PriorityBlockingQueue\u003c/td>\n\u003ctd>优先级\u003c/td>\n\u003ctd>按权重调度\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">提示\u003c/div>\u003cp>用无界队列时 maximumPoolSize 永不生效，线程数恒等于 corePoolSize。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">风险\u003c/div>\u003cp>无界队列 + 持续提交 = 内存堆积，最终导致 OOM。这是 \u003ca class=\"wikilink\" data-target=\"threadpoolexecutor\">ThreadPoolExecutor\u003c/a> 调参中最常见的坑。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">选型\u003c/div>\u003cp>高并发生产环境优先 ArrayBlockingQueue（有界、定长、内存可控），避免默认的无界 LinkedBlockingQueue。\u003c/p>\n\u003c/div>\n\u003ch2>落地：生产者消费者代码\u003c/h2>\n\u003cp>阻塞队列在生产者/消费者间解耦。线程池提交任务先入队，工作线程从队首取任务；队空时线程阻塞等待。队列容量直接决定 \u003ca class=\"wikilink\" data-target=\"threadpoolexecutor\">ThreadPoolExecutor\u003c/a> 的扩容触发时机。整组队列工具属于 \u003ca class=\"wikilink\" data-target=\"juc\">JUC\u003c/a> 并发包。\u003c/p>\n\u003cfigure class=\"code mini\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">BlockingQueue\u003c/span>&lt;Runnable&gt; \u003cspan class=\"hljs-variable\">queue\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">ArrayBlockingQueue\u003c/span>&lt;&gt;(\u003cspan class=\"hljs-number\">100\u003c/span>);\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">1 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(1题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">为什么 FixedThreadPool 可能 OOM？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">默认 LinkedBlockingQueue 无界，任务持续入队不触发拒绝，堆积耗尽内存。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails>\u003csummary>容量估算参考\u003c/summary>\u003cul>\n\u003cli>CPU 密集任务：corePoolSize ≈ N_cpu + 1\u003c/li>\n\u003cli>IO 密集任务：corePoolSize ≈ N_cpu × U × (1 + W/C)，其中 U=CPU 利用率，W=等待时间，C=计算时间\u003c/li>\n\u003cli>队列容量 ≈ 峰值 QPS × 平均耗时（短时突发可放大 1.5–2 倍）\u003c/li>\n\u003c/ul>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(2条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：队列越大越安全。无界队列隐藏反压，任务堆积终致 OOM。\u003c/li>\n\u003cli>误区：SynchronousQueue 是&quot;队列&quot;。它不缓冲，提交即需有消费线程接手，否则建新线程或直接拒绝。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["拒绝策略","threadpoolexecutor","juc"],"excerpt":"按容量给队列分类 → 阻塞语义与扩容触发 → 面试问答复盘。","featured":"","order":4,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":3,"groupLayout":"tiles"},"静态代理":{"id":"静态代理","title":"静态代理","type":"note","category":"javase","file":"notes/静态代理.md","accent":"#00E676","accentInk":"#00A344","catLabel":"JavaSE","mtime":"2026-09-05T09:27:18.395Z","html":"\u003cdetails class=\"think-fold\" open>\u003csummary>\u003ch2>思维链路速查\u003c/h2>\u003c/summary>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">角色构成 \u003cspan class=\"chain-pill\">结构\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">四个角色各干什么\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">调用时序 \u003cspan class=\"chain-pill\">流程\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">一次方法调用怎么走\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">能力边界与辨析 \u003cspan class=\"chain-pill\">权衡\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">好在哪炸在哪、与装饰器不是一回事\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">落地：手写代理 \u003cspan class=\"chain-pill\">实战\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">前置后置增强写法\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">面试问答 \u003cspan class=\"chain-pill\">复盘\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">高频考点\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cp>静态代理把「转发 + 增强」在编译期写死：先认四个角色、走一遍调用时序，再掂量能力边界 —— 最大的坑是与装饰器长得太像，落地前先分清二者。\u003c/p>\n\u003c/details>\u003ch2>角色构成\u003c/h2>\n\u003cp>代理类与被代理类\u003cstrong>实现同一个接口\u003c/strong>，代理类持有目标对象引用，在转发调用的前后织入增强逻辑 —— \u003ca class=\"wikilink\" data-target=\"javase\">JavaSE\u003c/a> 面向对象多态与组合的直接应用。\u003c/p>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>角色\u003c/th>\n\u003cth>职责\u003c/th>\n\u003cth>编译期是否已存在\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Subject\u003c/td>\n\u003ctd>定义行为契约（接口）\u003c/td>\n\u003ctd>是\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>RealSubject\u003c/td>\n\u003ctd>真实业务逻辑\u003c/td>\n\u003ctd>是\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Proxy\u003c/td>\n\u003ctd>持有 target，转发 + 增强\u003c/td>\n\u003ctd>是（手写 .java 文件）\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Client\u003c/td>\n\u003ctd>面向接口，拿到的是 Proxy\u003c/td>\n\u003ctd>是\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">「静态」指什么\u003c/div>\u003cp>静态 = \u003cstrong>代理关系在编译期就固定\u003c/strong>：Proxy 类是手写的源码，编译完就是 \u003ccode>.class\u003c/code>，运行期不再生成任何新类型。这是它与 \u003ca class=\"wikilink\" data-target=\"动态代理\">动态代理\u003c/a> 的唯一分水岭。\u003c/p>\n\u003c/div>\n\u003cdetails>\u003csummary>展开类图\u003c/summary>\u003cdiv class=\"mermaid\" data-mm-type=\"classDiagram\">classDiagram\n    class Subject {\n        &lt;&lt;interface>>\n        +request()\n    }\n    class RealSubject {\n        +request()\n    }\n    class Proxy {\n        -Subject target\n        +request()\n    }\n    class Client\n    Subject &lt;|.. RealSubject\n    Subject &lt;|.. Proxy\n    Proxy --> Subject : target\n    Client --> Subject\n\u003c/div>\n\u003c/details>\u003ch2>调用时序\u003c/h2>\n\u003cdiv class=\"chain\">\u003cdiv class=\"chain-row\">\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">01\u003c/span>\u003cdiv class=\"chain-t\">Client 调用 \u003cspan class=\"chain-pill\">入口\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">proxy.request()\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">02\u003c/span>\u003cdiv class=\"chain-t\">前置增强 \u003cspan class=\"chain-pill\">织入\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">日志 / 权限 / 事务\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">03\u003c/span>\u003cdiv class=\"chain-t\">转发真实对象 \u003cspan class=\"chain-pill\">委派\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">target.request()\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">04\u003c/span>\u003cdiv class=\"chain-t\">后置增强 \u003cspan class=\"chain-pill\">织入\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">收尾 / 统计耗时\u003c/div>\u003c/div>\u003cdiv class=\"chain-link\">\u003cdiv class=\"chain-rail\">\u003cspan class=\"chain-line\">\u003c/span>\u003csvg class=\"chain-arr\" viewBox=\"0 0 12 12\" aria-hidden=\"true\">\u003cpolyline points=\"2,3 10,6 2,9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"chain-step\">\u003cspan class=\"chain-num\">05\u003c/span>\u003cdiv class=\"chain-t\">返回结果 \u003cspan class=\"chain-pill\">出口\u003c/span>\u003c/div>\u003cdiv class=\"chain-c\">原路返回 Client\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cdetails>\u003csummary>展开时序图\u003c/summary>\u003cdiv class=\"mermaid\" data-mm-type=\"sequenceDiagram\">sequenceDiagram\n    participant C as Client\n    participant P as Proxy\n    participant R as RealSubject\n    C->>P: request()\n    P->>P: 前置增强（日志/鉴权）\n    P->>R: target.request()\n    R-->>P: 结果\n    P->>P: 后置增强（耗时统计）\n    P-->>C: 结果\n\u003c/div>\n\u003c/details>\u003ch2>能力边界\u003c/h2>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>维度\u003c/th>\n\u003cth>表现\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>类型安全\u003c/td>\n\u003ctd>编译期检查，接口方法签名错了编译不过\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>运行开销\u003c/td>\n\u003ctd>无反射、无字节码生成，调用最快\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可读性\u003c/td>\n\u003ctd>代码直白，调用链一眼看穿，调试友好\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>维护成本\u003c/td>\n\u003ctd>一个目标类配一个代理类，接口加方法要同步改所有代理类\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>增强复用\u003c/td>\n\u003ctd>增强逻辑硬编码在代理类里，无法跨类复用\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"callout danger\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8v4\"/>\u003cpath d=\"M12 16h.01\"/>\u003c/svg>危险\u003c/div>\u003cdiv class=\"callout-sub\">类爆炸\u003c/div>\u003cp>每代理一个接口就要手写一个代理类，接口每加一个方法，所有实现它的代理类全部跟着改。这是静态代理在工程中几乎不被采用的根本原因 —— 规模一大就交给 \u003ca class=\"wikilink\" data-target=\"动态代理\">动态代理\u003c/a>。\u003c/p>\n\u003c/div>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">静态代理仅剩的适用场景\u003c/div>\u003cp>代理目标固定、数量极少（一两个），且不希望引入反射 / 字节码依赖时，例如给某个第三方 SDK 接口套一层埋点。\u003c/p>\n\u003c/div>\n\u003ch2>与装饰器辨析\u003c/h2>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">为什么看代码分不出来\u003c/div>\u003cp>静态代理和装饰器的 Java 代码\u003cstrong>几乎逐字节相同\u003c/strong>：同一接口 + 构造器注入 target + 方法转发 + 前后织入。GOF 原书也承认两者结构一致——\u003cstrong>区别不在代码本身，而在「谁创建、怎么用」\u003c/strong>。对着代码找区别必然失败，要看使用语境。\u003c/p>\n\u003c/div>\n\u003cp>先看一段谁都不是的代码——它叫代理还是装饰器，取决于外面怎么用它：\u003c/p>\n\u003cfigure class=\"code\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">Wrap\u003c/span> \u003cspan class=\"hljs-keyword\">implements\u003c/span> \u003cspan class=\"hljs-title class_\">Service\u003c/span> {\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">private\u003c/span> \u003cspan class=\"hljs-keyword\">final\u003c/span> Service target;          \u003cspan class=\"hljs-comment\">// 注入目标\u003c/span>\u003c/span>\u003cspan class=\"ln\">    Wrap(Service t) { \u003cspan class=\"hljs-built_in\">this\u003c/span>.target = t; }\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">go\u003c/span>\u003cspan class=\"hljs-params\">()\u003c/span> {\u003c/span>\u003cspan class=\"ln\">        \u003cspan class=\"hljs-type\">long\u003c/span> \u003cspan class=\"hljs-variable\">t0\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> System.nanoTime();       \u003cspan class=\"hljs-comment\">// 前置织入\u003c/span>\u003c/span>\u003cspan class=\"ln\">        target.go();                       \u003cspan class=\"hljs-comment\">// 转发\u003c/span>\u003c/span>\u003cspan class=\"ln\">        System.out.println(\u003cspan class=\"hljs-string\">&quot;cost &quot;\u003c/span> + (System.nanoTime() - t0) + \u003cspan class=\"hljs-string\">&quot;ns&quot;\u003c/span>); \u003cspan class=\"hljs-comment\">// 后置织入\u003c/span>\u003c/span>\u003cspan class=\"ln\">    }\u003c/span>\u003cspan class=\"ln\">}\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">9 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cp>用下面 4 个问题问它，答案决定身份：\u003c/p>\n\u003cdiv class=\"tbl\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>判别问题\u003c/th>\n\u003cth>答案是装饰器\u003c/th>\n\u003cth>答案是静态代理\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>谁创建、谁知情？\u003c/td>\n\u003ctd>Client 亲手 \u003ccode>new\u003c/code>、层层拼装，全程知情\u003c/td>\n\u003ctd>工厂 / 框架创建后塞给 Client，Client 可能不知道中间有层\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>能叠几层？\u003c/td>\n\u003ctd>鼓励递归嵌套，层数随意\u003c/td>\n\u003ctd>通常单层拦截在入口，不嵌套\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>行为契约？\u003c/td>\n\u003ctd>透明：结果与 target 一致，只加外围能力\u003c/td>\n\u003ctd>可拦、可换：鉴权、延迟加载，甚至可以不调 target\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>管 target 死活？\u003c/td>\n\u003ctd>不管，target 是 Client 自带的\u003c/td>\n\u003ctd>常管：代理负责创建 / 持有 target\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>装饰器\u003c/strong>——Client 亲手拼，行为透明，只加能力：\u003c/p>\n\u003cfigure class=\"code\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// Client 自己逐层包：缓冲 → 解密 → 文件，哪层不要随时拆\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">InputStream\u003c/span> \u003cspan class=\"hljs-variable\">in\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">BufferedInputStream\u003c/span>(\u003c/span>\u003cspan class=\"ln\">                     \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">CipherInputStream\u003c/span>(\u003c/span>\u003cspan class=\"ln\">                         \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">FileInputStream\u003c/span>(\u003cspan class=\"hljs-string\">&quot;a.txt&quot;\u003c/span>), cipher));\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">4 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cp>\u003cstrong>静态代理\u003c/strong>——容器装配，Client 只摸到一个孤零零的对象：\u003c/p>\n\u003cfigure class=\"code mini\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// 由框架创建；save() 实际经过鉴权代理，但 Client 毫无感知\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">UserService\u003c/span> \u003cspan class=\"hljs-variable\">service\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> ctx.getBean(UserService.class);\u003c/span>\u003cspan class=\"ln\">service.save(\u003cspan class=\"hljs-string\">&quot;tom&quot;\u003c/span>);\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">3 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cdiv class=\"callout tip\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M9 18h6\"/>\u003cpath d=\"M10 22h4\"/>\u003cpath d=\"M12 2a7 7 0 0 0-4 12c.7.7 1 1.5 1 3h6c0-1.5.3-2.3 1-3a7 7 0 0 0-4-12z\"/>\u003c/svg>提示\u003c/div>\u003cdiv class=\"callout-sub\">两个问题的快捷判别\u003c/div>\u003cp>\u003cstrong>谁给的？\u003c/strong> 自己 new、自己拼 = 装饰器；别人塞给你 = 代理。\n\u003cstrong>看得见链吗？\u003c/strong> 代码里层层套 = 装饰器；只拿到一个对象 = 代理。\n一句话：装饰器是「给对象加能力」，代理是「控制对这个对象的访问」——前者的代码里是 Client 在指挥，后者的代码里总有个第三方在发号施令。\u003c/p>\n\u003c/div>\n\u003ch2>落地：手写代理\u003c/h2>\n\u003cdiv class=\"callout note\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003cpath d=\"M12 8h.01\"/>\u003cpath d=\"M11 12h1v4h1\"/>\u003c/svg>笔记\u003c/div>\u003cdiv class=\"callout-sub\">织入点的写法\u003c/div>\u003cp>前置与后置增强\u003cstrong>成对出现\u003c/strong>，后置收尾放进 \u003ccode>finally\u003c/code>：\u003ccode>target\u003c/code> 抛异常时耗时统计依然执行 —— 增强是附加动作，其成败不应影响业务成败。\u003c/p>\n\u003c/div>\n\u003cfigure class=\"code\" data-lang=\"java\">\u003cfigcaption class=\"code-head\">\u003cspan class=\"code-sig\">JA\u003c/span>\u003cspan class=\"code-lang\">JAVA\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003c/figcaption>\u003cdiv class=\"code-body\">\u003cpre>\u003ccode>\u003cspan class=\"ln\">\u003cspan class=\"hljs-keyword\">interface\u003c/span> \u003cspan class=\"hljs-title class_\">UserService\u003c/span> { \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">save\u003c/span>\u003cspan class=\"hljs-params\">(String name)\u003c/span>; }\u003c/span>\u003cspan class=\"ln\"> \u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">UserServiceImpl\u003c/span> \u003cspan class=\"hljs-keyword\">implements\u003c/span> \u003cspan class=\"hljs-title class_\">UserService\u003c/span> {\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">save\u003c/span>\u003cspan class=\"hljs-params\">(String name)\u003c/span> { System.out.println(\u003cspan class=\"hljs-string\">&quot;save &quot;\u003c/span> + name); }\u003c/span>\u003cspan class=\"ln\">}\u003c/span>\u003cspan class=\"ln\"> \u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">UserServiceProxy\u003c/span> \u003cspan class=\"hljs-keyword\">implements\u003c/span> \u003cspan class=\"hljs-title class_\">UserService\u003c/span> {\u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">private\u003c/span> \u003cspan class=\"hljs-keyword\">final\u003c/span> UserService target;\u003c/span>\u003cspan class=\"ln\">    UserServiceProxy(UserService target) { \u003cspan class=\"hljs-built_in\">this\u003c/span>.target = target; }\u003c/span>\u003cspan class=\"ln\"> \u003c/span>\u003cspan class=\"ln\">    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">save\u003c/span>\u003cspan class=\"hljs-params\">(String name)\u003c/span> {\u003c/span>\u003cspan class=\"ln\">        \u003cspan class=\"hljs-type\">long\u003c/span> \u003cspan class=\"hljs-variable\">t\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> System.nanoTime();          \u003cspan class=\"hljs-comment\">// 前置增强\u003c/span>\u003c/span>\u003cspan class=\"ln\">        \u003cspan class=\"hljs-keyword\">try\u003c/span> {\u003c/span>\u003cspan class=\"ln\">            target.save(name);               \u003cspan class=\"hljs-comment\">// 委派真实对象\u003c/span>\u003c/span>\u003cspan class=\"ln\">        } \u003cspan class=\"hljs-keyword\">finally\u003c/span> {\u003c/span>\u003cspan class=\"ln\">            System.out.println(\u003cspan class=\"hljs-string\">&quot;cost &quot;\u003c/span> + (System.nanoTime() - t) + \u003cspan class=\"hljs-string\">&quot;ns&quot;\u003c/span>); \u003cspan class=\"hljs-comment\">// 后置增强\u003c/span>\u003c/span>\u003cspan class=\"ln\">        }\u003c/span>\u003cspan class=\"ln\">    }\u003c/span>\u003cspan class=\"ln\">}\u003c/span>\u003cspan class=\"ln\"> \u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-comment\">// 使用：Client 只认接口，拿到的是代理\u003c/span>\u003c/span>\u003cspan class=\"ln\">\u003cspan class=\"hljs-type\">UserService\u003c/span> \u003cspan class=\"hljs-variable\">s\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">UserServiceProxy\u003c/span>(\u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">UserServiceImpl\u003c/span>());\u003c/span>\u003cspan class=\"ln\">s.save(\u003cspan class=\"hljs-string\">&quot;tom&quot;\u003c/span>);\u003c/span>\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"code-foot\">\u003cspan class=\"cf-plate\">清单\u003c/span>\u003cspan class=\"spacer\">\u003c/span>\u003cspan class=\"cf-meta\">23 行\u003c/span>\u003c/div>\u003c/figure>\n\u003cdiv class=\"callout warning\">\u003cdiv class=\"ct\">\u003csvg class=\"ci\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 3 2 20h20L12 3z\"/>\u003cpath d=\"M12 10v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>警告\u003c/div>\u003cdiv class=\"callout-sub\">别在增强里改语义\u003c/div>\u003cp>代理的契约是「行为等价 + 附加动作」。若代理偷偷改了返回值或吞掉异常，Client 的行为会随注入对象不同而漂移 —— 这违反了里氏替换。\u003c/p>\n\u003c/div>\n\u003cdetails class=\"qa\">\u003csummary>面试问答  \u003cspan class=\"dcount\">(3题)\u003c/span>\u003c/summary>\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">什么是静态代理？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">代理类由程序员手写（或工具生成源码）并在编译期确定，代理类与目标类实现同一接口，代理类持有目标引用，在转发调用前后织入增强逻辑。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">静态代理的缺点？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">类爆炸 —— 一个接口一个代理类，接口方法变更会导致所有代理类同步修改；增强逻辑写死在代理类里无法复用。\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"qa-item\">\u003cdiv class=\"qa-q\">\u003cspan class=\"qa-tag q\">Q\u003c/span>\u003cdiv class=\"qa-t\">静态代理和装饰器模式的区别？\u003c/div>\u003c/div>\u003cdiv class=\"qa-a\">\u003cspan class=\"qa-tag a\">A\u003c/span>\u003cdiv class=\"qa-t\">两者代码结构几乎同构（同接口 + 注入 target + 转发织入），GOF 也承认结构一致，区别在意图与用法：代理偏\u003cstrong>控制访问、可对 Client 隐藏目标\u003c/strong>（常由容器创建后塞给 Client）；装饰器偏\u003cstrong>增强功能、Client 显式拼装、可递归叠加\u003c/strong>（如 IO 流的逐层包装）。判别抓手是「谁创建链」和「增强是单层还是可叠」，不是结构本身。\u003c/div>\u003c/div>\u003c/div>\n\u003c/details>\u003cdetails class=\"pitfalls\">\u003csummary>常见误区  \u003cspan class=\"dcount\">(3条)\u003c/span>\u003c/summary>\u003cul>\n\u003cli>误区：代理类要 extends 目标类。实际是\u003cstrong>实现同一接口 + 组合持有\u003c/strong>，继承会让代理与目标强耦合且无法代理 final 类。\u003c/li>\n\u003cli>误区：静态代理一定比动态代理快很多。调用本身确实快（无反射），但差额在纳秒级，真实瓶颈从不在代理调用上。\u003c/li>\n\u003cli>误区：静态代理和装饰器只是名字不同。结构同构不等于可互换——\u003cstrong>判别的抓手不是结构，是使用语境\u003c/strong>：Client 自己 new、能递归叠多层 = 装饰器；容器/工厂创建后塞进来、Client 不感知 = 代理。背「意图 vs 结构」两分法没意义，因为两者结构本来就一样。\u003c/li>\n\u003c/ul>\n\u003c/details>\n","links":["javase","动态代理"],"excerpt":"静态代理把「转发 + 增强」在编译期写死：先认四个角色、走一遍调用时序，再掂量能力边界 —— 最大的坑是与装饰器长得太像，落地前先分清二者。","featured":"","order":0,"group":0,"groupNum":"Ⅰ","groupName":"Java 生态","groupRank":0,"groupLayout":"tiles"}};
const ROOT_ID = "knowledge-map";

const spineFill = spine.querySelector('.spine-fill');

const cpNext = document.getElementById('cpNext');

const CP_C = 2 * Math.PI * 15.5; // 周长，配合 strokeDashoffset 表示已读比例
cpRingBar.style.strokeDasharray = CP_C;
cpRingBar.style.strokeDashoffset = CP_C;

function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function attr(s){return esc(s).replace(/"/g,'&quot;');}

// 熟练度/翻阅时间戳/recent 全落 localStorage：解析必须 try/catch，只查必备结构，nullable 字段单独收编（PITFALLS）。
/* ---- mastery: Shaky / Familiar / Fluent (面试反复重读场景;不做"已读进度") ---- */
const MASTERY = [
  {k:'raw',  label:'Shaky',   hint:"Can’t explain it clearly yet"},
  {k:'firm', label:'Familiar', hint:'Can roughly answer'},
  {k:'tell', label:'Fluent',  hint:'Can recount off-script'}
];
const MASTERY_COLOR = { raw:'#C0563B', firm:'#B68A2E', tell:'#3F7A5A' };
const MS_KEY = 'vinea:mastery';
// 读路径全走内存缓存，写路径一次性回写 — 反复翻页/渲染不再每次 JSON.parse
const msStore = (() => { try { return JSON.parse(localStorage.getItem(MS_KEY)) || {}; } catch(e){ return {}; } })();
function masteryAll(){ return msStore; }
function masteryGet(id){ return msStore[id] || null; }
function masterySet(id, k){
  if(k) msStore[id] = {k:k, t:Date.now()}; else delete msStore[id];
  try { localStorage.setItem(MS_KEY, JSON.stringify(msStore)); } catch(e){}
}
/* 墙上只读态：评级了才出徽标，未评级零干扰 */
function mastOf(id){
  const cur = masteryGet(id);
  if(!cur) return null;
  for(let i=0;i<MASTERY.length;i++){ if(MASTERY[i].k===cur.k) return { m:MASTERY[i], t:cur.t }; }
  return null;
}
function mastHTML(id){
  const o = mastOf(id); if(!o) return '';
  return '<span class="vm" style="--mc:'+MASTERY_COLOR[o.m.k]+'" title="'+esc(o.m.label)+' · '+esc(o.m.hint)+'（评级于 '+new Date(o.t).toLocaleDateString('zh-CN')+'）">'+esc(o.m.label)+'</span>';
}
// 字数（含中文）：去标签后统计非空白字符数
function charCount(html){
  const txt = (html||'').replace(/<[^>]+>/g,'').replace(/\s+/g,'');
  return txt.length;
}

/* ---- 结构密度（替代旧「阅读分钟」）：节内结构化字符 / 该节总字符，保底 0.08 ---- */
function structCharsOf(html){
  const box = document.createElement('div'); box.innerHTML = html;
  let n = 0;
  box.querySelectorAll('table, figure.code, .chain, .qa-q, .qa-a, .mermaid')
    .forEach(function(el){ n += (el.textContent || '').replace(/\s+/g, '').length; });
  return n;
}
function densityOf(html){
  const total = charCount(html);
  if(!total) return 0.08;
  return Math.max(0.08, Math.min(1, structCharsOf(html) / total));
}

/* ---- 翻阅时间戳（localStorage['vinea.read'] = {slug: ts}）；未翻阅者以 mtime 当种子 ---- */
const READ_KEY = 'vinea.read';
function readStore(){ try { return JSON.parse(localStorage.getItem(READ_KEY)) || {}; } catch(e){ return {}; } }
function markRead(slug){
  if(!NOTES[slug]) return;
  const r = readStore(); r[slug] = Date.now();
  try { localStorage.setItem(READ_KEY, JSON.stringify(r)); } catch(e){}
}
function readInfo(slug){
  const r = readStore();
  if(r[slug]) return { read:true, ts:r[slug] };
  const n = NOTES[slug];
  const mt = n && n.mtime ? new Date(n.mtime).getTime() : 0;
  return { read:false, ts:mt };
}
// 待复习：能讲永不催；其余按「距上次读（未读则用 mtime 种子）≥ 7 天」判定
function isDue(slug){
  const m = masteryGet(slug);
  if(m && m.k === 'tell') return false;
  return (Date.now() - readInfo(slug).ts) >= 7 * 86400000;
}
function relTime(ts){
  const d = Math.floor((Date.now() - ts) / 86400000);
  if(d <= 0) return '今天';
  if(d === 1) return '昨天';
  if(d < 7) return d + ' 天前';
  if(d < 30) return Math.floor(d/7) + ' 周前';
  if(d < 365) return Math.floor(d/30) + ' 个月前';
  return Math.floor(d/365) + ' 年前';
}
function freshLabel(slug){
  const info = readInfo(slug);
  const due = isDue(slug);
  if(info.read) return { text: relTime(info.ts) + '读过', due:due, title:'上次翻开 · ' + new Date(info.ts).toLocaleString('zh-CN') };
  return { text:'未读', due:due, title: info.ts ? ('最后编辑 · ' + new Date(info.ts).toLocaleDateString('zh-CN')) : '尚未编辑' };
}

/* ---- recently-read (localStorage['vinea.recent']) ---- */
const RECENT_KEY = 'vinea.recent';
const RECENT_MAX = 12;
function recentList(){
  try { const a = JSON.parse(localStorage.getItem(RECENT_KEY)); return Array.isArray(a) ? a : []; } catch(e){ return []; }
}
function recentPush(slug){
  if(!NOTES[slug]) return;
  const a = recentList().filter(function(s){ return s !== slug; });
  a.unshift(slug);
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(a.slice(0, RECENT_MAX))); } catch(e){}
}

// 墙渲染唯一入口 wallHTML（根墙杂志版式 + 子墙）。hover 展开最近笔记预览已被用户否掉，勿加回；
// 轻交互 = hover 竖规延展 + 指针跟随光晕（--mx/--my，接线在 48-js-fx.js）。MOC 正文段落不放双链（bullet 才合法）；verify-spans 断言 .ventry 数 == links。
function wallHTML(n){
  const list = n.links.map(function(s){return NOTES[s];}).filter(Boolean);
  const isRoot = n.id === ROOT_ID;
  /* 子 MOC 分面注册表 —— 按 slug 声明「分组 + 特性 chip」。
     命中走语义化分组（微区头 + chip 角标），未命中退回默认「子地图 / 笔记」二段切。 */
  const MOC_FACETS = {
    'java-锁': {
      groups: [
        { name:'入门', ids:['java-锁对比'] },
        { name:'内置同步', ids:['synchronized','jmm','volatile'] },
        { name:'显式锁', ids:['reentrantlock','reentrantreadwritelock','stampedlock'] },
        { name:'底层与原子', ids:['cas-与原子类','aqs','locksupport'] },
        { name:'同步工具', ids:['semaphore','countdownlatch'] },
        { name:'故障排查', ids:['死锁'] },
      ],
      traits: {
        'java-锁对比':'总览·横评',
        'synchronized':'JVM 关键字 · 隐式重入',
        'jmm':'内存模型 · 可见性判据',
        'volatile':'内存可见性 · 无锁',
        'reentrantlock':'可重入 · 公平可选',
        'reentrantreadwritelock':'读写分离 · 可降级',
        'stampedlock':'乐观返回 · JDK 8+',
        'cas-与原子类':'无锁 · 原子操作',
        'aqs':'框架 · 同步器底座',
        'locksupport':'阻塞原语 · 许可机制',
        'semaphore':'共享模式 · 许可计数',
        'countdownlatch':'共享模式 · 一次性',
        '死锁':'四条件 · 定位与破环',
      },
    },
  };
  const facet = MOC_FACETS[n.id] || null;
  // flatten a MOC's tree to actual notes (mtime desc, top k)
  function flatten(t){
    if(!t || t.type !== 'moc') return [];
    const out = [], seen = new Set();
    (function walk(it){
      if(!it || seen.has(it.id)) return;
      seen.add(it.id);
      if(it.type !== 'moc'){ out.push(it); return; }
      (it.links||[]).forEach(function(s){ walk(NOTES[s]); });
    })(t);
    return out.sort(function(a,b){return new Date(b.mtime||0)-new Date(a.mtime||0);});
  }
  // roman chapter numerals Ⅰ-Ⅶ for 1-7
  const ROMAN = ['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ','Ⅶ','Ⅷ','Ⅸ','Ⅹ','Ⅺ','Ⅻ'];
  /* 分卷（首页根墙）：卷序 = GROUP 数组序；卷内位次 = cats 数组序（build.mjs 注入 group/groupRank）。
     卡片尺寸不再由分卷决定（旧 b4/b2 主卡规则随杂志化废弃），卷内每条 .ventry 版式统一走 CSS */
  function groupBands(items){
    const by = {}, order = [];
    items.forEach(function(t){
      const gi = t.group;
      if(!by[gi]){ by[gi] = []; order.push(gi); }
      by[gi].push(t);
    });
    order.sort(function(a,b){ return (a<0?1e9:a) - (b<0?1e9:b); }); // 未归入任何卷的排最后
    return order.map(function(gi){
      const bItems = by[gi].slice().sort(function(a,b){ return a.groupRank - b.groupRank; });
      const notes = bItems.map(function(t){ return t.type==='moc' ? flatten(t).length : 1; });
      return { gi:gi, items:bItems, notes:notes, isFallow:notes.map(function(c){ return c === 0; }),
               num: bItems[0].groupNum || '·', name: bItems[0].groupName || '其他' };
    });
  }
  // order 决定墙上阅读位次（罗马数字），未声明的退到 1e9；布局排序时 pinned(featured) 永远最前
  function orderOf(t){ return t.order > 0 ? t.order : 1e9; }
  function layoutRank(t){ return t.pinned ? -1e12 : orderOf(t); }
  const plain = list.slice().sort(function(a,b){return layoutRank(a)-layoutRank(b);});
  const bandOn = isRoot && plain.some(function(t){return t.group >= 0;});
  const bandList = bandOn ? groupBands(plain) : [];
  /* 首页根墙 = 杂志：纯审美封面 + 各卷目录带（版式 = GROUP.layout，4 种词汇表） */
  function entryHTML(t, color, opts){
    const subs = t.type==='moc' ? flatten(t) : [];
    const fallow = t.type==='moc' && subs.length===0;
    const count = t.type==='moc' ? subs.length : 1;
    let lastM = new Date(t.mtime||0).getTime();
    subs.forEach(function(x){ const mt = new Date(x.mtime||0).getTime(); if(mt>lastM) lastM = mt; });
    const rel = lastM ? relTime(lastM) : '';
    const c = typeof color === 'string' ? color : t.accent;
    const chip = opts && opts.chip ? opts.chip : ''; // 语义 chip：注册了 MOC_FACETS 的卡走 chip 路线，不再叠「1 篇/更新于」噪音
    const mast = (t.type!=='moc') ? mastHTML(t.id) : ''; // 熟悉程度徽标：仅原子笔记且评级过才渲染，顶替无信息量的「1 篇」
    return '<article class="ventry'+(fallow?' fallow':'')+'" data-target="'+t.id+'" style="--c:'+c+'">'
      + '<div class="v-top"><span class="v-tag">'+esc(t.catLabel)+'</span>'
      + (mast ? mast : (fallow ? '<span class="stamp">待垦</span>' : (chip ? '' : (count>1 ? '<span class="v-count"><b>'+count+'</b> 篇</span>' : '')))) // count>1：原子笔记自身就是单篇，「1 篇」无信息量，直接省掉
      + '</div>'
      + '<h3 class="v-name">'+esc(t.title)+'</h3>'
      + (chip ? '<div class="v-chip">'+esc(chip)+'</div>' : (rel ? '<div class="v-data">更新于 '+esc(rel)+'</div>' : ''))
      + '</article>';
  }
  if(bandOn){
    const now = new Date();
    const mosaic = bandList.map(function(b,bi){
      const c = b.items[0].accent;
      return '<button class="cm-tile" data-band="band-'+bi+'" data-name="'+attr(b.name)+'"'
        + ' style="--cc:'+c+'" title="'+attr(b.name)+'">'
        + '<span class="cm-num">'+esc(b.num)+'</span></button>';
    }).join('');
    const cover = '<header class="cover">'
      + '<div class="cover-main">'
      + '<p class="cover-issue"><span>Vinea · Knowledge Atlas · '+now.getFullYear()+' 年 '+(now.getMonth()+1)+' 月</span><span class="cover-issue-r">Private Press · No. '+String(now.getMonth()+1).padStart(2,'0')+'</span></p>'
      + '<h1 class="cover-title">'+esc(n.title)+'<span class="cover-dot">.</span></h1>'
      + (n.excerpt ? '<p class="cover-sub">'+esc(n.excerpt)+'</p>' : '')
      + '</div>'
      + (bandList.length ? '<nav class="cover-mosaic" aria-label="卷索引">'
          + '<span class="cover-mosaic-tag">Volumes · '+bandList.length+'</span>'
          + '<div class="cm-rail">'+mosaic+'</div>'
          + '<p class="cm-caption" id="cm-caption" style="--cnow:'+bandList[0].items[0].accent+'">'+esc(bandList[0].name)+'</p>'
          + '</nav>' : '')
      + '</header>';
    let body = '';
    bandList.forEach(function(b,bi){
      const layout = b.items[0].groupLayout || 'tiles';
      const bandLast = b.items.reduce(function(m,t){
        const mt = new Date(t.mtime||0).getTime(); return mt>m?mt:m; },0);
      body += '<section class="band band--'+esc(layout)+'" id="band-'+bi+'" style="--c:'+b.items[0].accent+'">'
        + '<header class="band-head">'
        + '<span class="band-num">'+esc(b.num)+'</span>'
        + '<h2 class="band-name">'+esc(b.name)+'</h2>'
        + '<div class="band-meta">'
        + '<span><b>'+b.items.length+'</b> 领域</span>'
        + '<span><b>'+b.notes.reduce(function(a,c){return a+c;},0)+'</b> 篇</span>'
        + (bandLast ? '<span>更新于 '+esc(relTime(bandLast))+'</span>' : '')
        + '</div></header>'
        + '<div class="vbody">'+b.items.map(entryHTML).join('')+'</div>'
        + '</section>';
    });
    return cover + '<div class="bands">'+body+'</div>';
  }
  // 子 MOC 墙（非根墙）：轻量扉页 + 统一 .ventry 网格，继承父卷色
  const pc = n.accent; // 父卷色（MOC 自身 category accent，与首页卷带呼应）
  const subLast = Math.max.apply(null, list.map(function(t){ return new Date(t.mtime||0).getTime(); }).concat([0]));
  const subLastStr = subLast ? relTime(subLast) : '';
  const vgrp = n.group>=0 ? '卷 '+esc(n.groupNum)+' · '+esc(n.groupName) : '章节 · 目录墙';
  const front = '<header class="subhead" style="--c:'+pc+'">'
    + '<span class="subhead-rule"></span>'
    + '<div class="subhead-inner">'
    + '<p class="eyebrow">'+vgrp+'</p>'
    + '<h1 class="subhead-title">'+esc(n.title)+'</h1>'
    + '</div>'
    + (list.length ? '<div class="subhead-meta">'
        + '<span><b>'+list.length+'</b> 项</span>'
        + (subLastStr ? '<span class="sep"></span><span>更新于 '+esc(subLastStr)+'</span>' : '')
        + '</div>' : '')
    + '</header>';
  function subGrid(items, getChip){
    return '<div class="vbody subwall-body">'+items.map(function(t){ return entryHTML(t, pc, getChip ? getChip(t) : null); }).join('')+'</div>';
  }
  function subSec(name, items, getChip){
    if(!items.length) return '';
    return '<section class="subwall"><header class="subwall-head">'
      + '<span class="subwall-bar"></span>'
      + '<h2 class="subwall-name">'+esc(name)+'</h2>'
      + '<span class="subwall-meta">'+items.length+' 项</span>'
      + '</header>'+subGrid(items, getChip)+'</section>';
  }
  // 注册了 MOC_FACETS 的子墙：按语义分组 + 特性 chip（替代默认「子地图 / 笔记」二段切）
  if(facet){
    const groups = facet.groups.map(function(g){
      const items = g.ids.map(function(id){ return list.find(function(t){ return t.id === id; }); }).filter(Boolean);
      return subSec(g.name, items, function(t){ return { chip: facet.traits[t.id] || '' }; });
    }).join('');
    return front + '<div class="subwalls" style="--c:'+pc+'">'+groups+'</div>';
  }
  const mocs = plain.filter(function(t){return t.type==='moc';});
  const notes = plain.filter(function(t){return t.type!=='moc';});
  if(!mocs.length || !notes.length){
    const all = plain;
    const label = mocs.length ? '子地图' : '笔记';
    return front + '<div class="subwalls" style="--c:'+pc+'">'+subSec(label, all)+'</div>';
  }
  return front + '<div class="subwalls" style="--c:'+pc+'">'
    + subSec('子地图', mocs) + subSec('笔记', notes) + '</div>';
}

// 正文组装。正文首行 H1 构建期已丢（title 顶替），此处别再剥。
function articleHTML(n){
  // 概念脉搏：解析每 H2/H3 节 → 字数 / 结构密度
  const SEG_RE = /<(h2|h3)([^>]*)>([\s\S]*?)<\/\1>/g;
  const heads = []; let _m;
  while((_m = SEG_RE.exec(n.html))){ heads.push({tag:_m[1], attrs:_m[2], inner:_m[3], start:_m.index, end:SEG_RE.lastIndex}); }
  heads.forEach(function(h,i){
    const segEnd = (i+1 < heads.length) ? heads[i+1].start : n.html.length;
    const seg = n.html.slice(h.end, segEnd);
    h.chars = charCount(seg);
    h.d = densityOf(seg);
    h.text = h.inner.replace(/<[^>]+>/g,'').trim();
    h.id = 'h-'+i;
  });
  const tocItems = heads.filter(function(h){return h.text;}).map(function(h){
    return {tag:h.tag, id:h.id, text:h.text, chars:h.chars, d:h.d};
  });
  let body = '', _cur = 0;
  heads.forEach(function(h){
    body += n.html.slice(_cur, h.start);
    body += '<'+h.tag+' id="'+h.id+'"'+h.attrs+' data-d="'+h.d.toFixed(2)+'">'+h.inner
          + '<span class="rt-cap" title="本节约 '+h.chars+' 字 · 结构密度 '+(h.d*100|0)+'%">密度 '+(h.d*100|0)+'%</span>'
          + '</'+h.tag+'>';
    _cur = h.end;
  });
  body += n.html.slice(_cur);
  spineNodes.innerHTML = tocItems.map(function(it){
    return '<button class="sp-node '+(it.tag==='h3'?'h3':'h2')+'" data-id="'+it.id+'" data-d="'+it.d.toFixed(2)+'" data-t="'+attr(it.text)+'" style="--d:'+it.d.toFixed(3)+'">'
      + '<span class="sp-density"></span>'
      + '<span class="sp-dot"></span>'
      + '<span class="sp-label">'+esc(it.text)+'<span class="rt-cap" title="结构密度 '+(it.d*100|0)+'%">'+(it.d*100|0)+'%</span></span>'
      + '</button>';
  }).join('');
  markRead(n.id);
  const fr = freshLabel(n.id);
  const pad = n => String(n).padStart(2,'0');
  const mt = n.mtime ? new Date(n.mtime) : null;
  const etStr = mt && !isNaN(mt) ? mt.getFullYear()+'-'+pad(mt.getMonth()+1)+'-'+pad(mt.getDate())+' · '+pad(mt.getHours())+':'+pad(mt.getMinutes()) : '';
  const etHtml = etStr
    ? '<div class="et" title="最后修改时间"><svg class="ei" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>最后编辑 · '+etStr+'</div>'
    : '';
  const cur = masteryGet(n.id);
  const msHtml = '<div class="ms'+(cur?'':' unrated')+'" data-ms="'+esc(n.id)+'">'
    + '<span class="ms-lab">Mastery</span>'
    + '<span class="ms-set" title="点击评级 · 再点一次取消">'
    + MASTERY.map(function(m){
        return '<button class="ms-b'+(cur&&cur.k===m.k?' on':'')+'" data-k="'+m.k+'" style="--mc:'+MASTERY_COLOR[m.k]+'" title="'+esc(m.hint)+'">'
          + '<span class="dot"></span>'+esc(m.label)+'</button>';
      }).join('')
    + '</span>'
    + '</div>';
  return '<article class="art" style="--accent:'+n.accent+';--accent-ink:'+n.accentInk+'">'
    + '<h1>'+esc(n.title)+'</h1>'
    + '<div class="meta">'
    +   '<div class="rt'+(fr.due?' due':'')+'">'+fr.text+'</div>'
    +   etHtml
    +   msHtml
    + '</div>'
    + body
    + '</article>';
}

// 交互绑定（每次渲染后重跑）。[data-target] 统一 stopPropagation 防嵌套双 go()；[[双链]] hover 预览是必保 feature。
function bind(){
  // stopPropagation：防 data-target 嵌套时外层卡再触发一次 go()
  stage.querySelectorAll('[data-target]').forEach(function(el){ el.onclick=function(e){ e.stopPropagation(); go(el.getAttribute('data-target')); }; });
  stage.querySelectorAll('a.wikilink:not(.broken)').forEach(function(el){ el.onclick=function(){go(el.getAttribute('data-target'));}; });
  // 封面卷色带 — 点击滚到对应卷带；hover/focus 暂停轮播并切到该段；离开后立即跳到下一段继续；静止 2.2s 自动轮播
  const cmCap = stage.querySelector('#cm-caption');
  const cmRail = stage.querySelector('.cover-mosaic .cm-rail');
  const cmTiles = stage.querySelectorAll('.cover-mosaic [data-band]');
  if(cmCap && cmTiles.length){
    if(!stage.__cm) stage.__cm = { idx: 0, paused: false, tok: 0 };
    const S = stage.__cm; S.paused = false;
    function showCap(b){
      if(!b) return;
      const newName = b.getAttribute('data-name') || '';
      const myTok = ++S.tok;
      const c = (b.style && b.style.getPropertyValue ? b.style.getPropertyValue('--cc') : '') || '';
      // 色带同步激活态（文字未变也要更新，故放在 early return 之前）
      stage.querySelectorAll('.cover-mosaic [data-band]').forEach(function(t){
        t.classList.toggle('cm-on', t === b);
      });
      const cap = stage.querySelector('#cm-caption');
      if(!cap) return;
      if(newName === cap.textContent) return;
      cap.style.opacity = '0';
      setTimeout(function(){
        if(myTok !== S.tok) return;
        const cap2 = stage.querySelector('#cm-caption');
        if(!cap2) return;
        cap2.textContent = newName;
        if(c) cap2.style.setProperty('--cnow', c.trim());
        cap2.style.opacity = '1';
      }, 180);
    }
    function cmTick(){
      if(S.paused) return;
      const tiles = stage.querySelectorAll('.cover-mosaic [data-band]');
      if(!tiles.length) return;
      S.idx = (S.idx + 1) % tiles.length;
      showCap(tiles[S.idx]);
    }
    cmTiles.forEach(function(b, bi){
      b.onclick = function(){
        const t = document.getElementById(b.getAttribute('data-band'));
        if(t) t.scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block:'start' });
      };
      b.addEventListener('mouseenter', function(){ S.paused = true; S.idx = bi; showCap(b); });
      b.addEventListener('focus', function(){ S.paused = true; S.idx = bi; showCap(b); });
      b.addEventListener('blur', function(){ S.paused = false; });
    });
    if(cmRail) cmRail.addEventListener('mouseleave', function(){
      S.paused = false;
      const tiles = stage.querySelectorAll('.cover-mosaic [data-band]');
      S.idx = (S.idx + 1) % Math.max(tiles.length, 1);
      if(tiles.length) showCap(tiles[S.idx]);
    });
    // interval 只启动一次（多次 bind 不重复跑）
    if(!stage.__cmTimer && !RM) stage.__cmTimer = setInterval(cmTick, 2200);
    showCap(cmTiles[0]);   // 初始：第一段即激活态（文字已相同，只落激活样式）
  }
  bindMastery();
  bindPop();
  bindCopy();
}

/* mastery buttons on an article: click to set, click 清除 to clear */
function bindMastery(){
  stage.querySelectorAll('.ms').forEach(function(box){
    const id = box.getAttribute('data-ms');
    function clear(){
      masterySet(id, null);
      box.querySelectorAll('.ms-b').forEach(function(o){ o.classList.remove('on'); });
      box.classList.add('unrated');
    }
    box.querySelectorAll('button.ms-b').forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        const k = b.getAttribute('data-k');
        if(b.classList.contains('on')){
          clear();
        } else {
          masterySet(id, k);
          box.querySelectorAll('.ms-b').forEach(function(o){ o.classList.toggle('on', o===b); });
          box.classList.remove('unrated');
        }
      });
    });
  });
}

function bindPop(){
  if(!FINE_HOVER) return; // 触屏：点按直达正文，hover 预览气泡只绑给鼠标（否则点按时 mouseenter 会闪出气泡）
  stage.querySelectorAll('a.wikilink:not(.broken)').forEach(function(a){
    const t = NOTES[a.getAttribute('data-target')];
    if(!t) return;
    a.addEventListener('mouseenter', function(){
      pop.innerHTML = '<div class="pop-t">'+esc(t.title)+'</div><div class="pop-x">'+esc(t.excerpt||'')+'</div>';
      const r = a.getBoundingClientRect();
      // 水平：贴右边界夹回视口内
      let left = r.left;
      if(left + 276 > window.innerWidth) left = window.innerWidth - 284;
      if(left < 8) left = 8;
      // 垂直：默认挂链接下方；下方塞不下就翻到上方，两边都不够就贴底 8px。
      // 不翻的话，文章末尾几个双链的预览会整个落到视口外，等于没出。
      const ph = pop.offsetHeight; // pop 无 display:none，可直接量
      let top = r.bottom + 8;
      if(top + ph > window.innerHeight - 8) top = r.top - ph - 8;
      if(top < 8) top = Math.max(8, window.innerHeight - ph - 8);
      pop.style.left = left + 'px';
      pop.style.top = top + 'px';
      pop.classList.add('on');
    });
    a.addEventListener('mouseleave', function(){ pop.classList.remove('on'); });
  });
}

const COPY_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>';

// mermaid 外置 vendor/ 懒加载（不内联、不 CDN）。预处理注入（direction 等）必须插在首行图类型声明之后——插在前面 detectType 全站挂（PITFALLS）。
/* mermaid: 外置到 vendor/mermaid.min.js，运行时按需懒加载（首次渲染含图笔记才拉取，不用 CDN） */
let _mmLoading = null;
function ensureMermaid(){
  if(window.mermaid && window.mermaid.__vineaReady) return Promise.resolve(window.mermaid);
  if(_mmLoading) return _mmLoading;
  _mmLoading = new Promise(function(res, rej){
    const s = document.createElement('script');
    s.src = 'vendor/mermaid.min.js';
    s.onload = function(){
      // ponytail: initMermaid (~80-120ms) 推到 requestIdleCallback，让首屏纯文笔记不再被卡
      const go = function(){
        try { initMermaid(window.mermaid); } catch(e){ console.warn('mermaid init fail:', e); }
        res(window.mermaid);
      };
      if(window.requestIdleCallback) requestIdleCallback(go, { timeout: 800 });
      else setTimeout(go, 50);
    };
    s.onerror = function(){ rej(new Error('mermaid load failed: vendor/mermaid.min.js')); };
    document.head.appendChild(s);
  });
  return _mmLoading;
}
// initialize() 只需调一次（重复调用会重置主题/样式）；放在加载完成时执行
function initMermaid(mm){
  const cs = getComputedStyle(document.documentElement);
  const accent = (cs.getPropertyValue('--accent').trim()) || '#C9B08A';
  const accentInk = (cs.getPropertyValue('--accent-ink').trim()) || '#8A6D3B';
  const hexMix = function(c,w){
    const h = c.replace('#','');
    return '#' + [0,2,4].map(function(i){ return Math.round(parseInt(h.slice(i,i+2),16)*(1-w)+255*w).toString(16).padStart(2,'0'); }).join('');
  };
  const light = function(c){ return hexMix(c, 0.88); };
  mm.initialize({ startOnLoad:false, theme:'base', securityLevel:'loose',
    flowchart:{ curve:'linear', nodeSpacing:64, rankSpacing:72, padding:20, htmlLabels:true, useMaxWidth:true, wrap:true },
    classDiagram:{ padding:3, htmlLabels:false, dividerMargin:1, useMaxWidth:true, nodeSpacing:28, rankSpacing:32, diagramPadding:8 },
    gantt:{ useMaxWidth:true, barHeight:20, barGap:6, topPadding:38, leftPadding:92, gridLineStartPadding:52, fontSize:13, sectionFontSize:13, numberSectionStyles:2, displayMode:'compact' },
    themeVariables:{ fontFamily:'"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif',
      fontSize:14, primaryColor:light(accent), primaryBorderColor:accent, primaryTextColor:'#211D17',
      lineColor:accentInk, secondaryColor:light(accent), tertiaryColor:'#FBF9F5',
      edgeLabelBackground:'#FBF9F5', clusterBkg:light(accent), clusterBorder:accent, titleColor:'#211D17',
      taskBkgColor:light(accent), taskBorderColor:accent, taskTextColor:'#211D17', taskTextLightColor:'#fff', taskTextOutsideColor:'#211D17',
      gridColor:accent, gridBorderColor:accent,
      sectionBkgColor:light(accent), sectionBkgColor2:light(accent), altSectionBkgColor:light(accent),
      excludedTaskBkgColor:'#EFEAE0', excludedTaskBorderColor:'#D9D1C4',
      activeTaskBkgColor:accentInk, activeTaskBorderColor:accentInk,
      doneTaskBkgColor:light(accent), doneTaskBorderColor:accent, doneTaskTextColor:'#211D17',
      critTaskBkgColor:'#F2A9A9', critTaskBorderColor:'#D45454',
      todayColor:accent } });
  mm.__vineaReady = true;
}
function renderMermaid(){
  const all = Array.from(stage.querySelectorAll('.mermaid:not([data-mm-rendered])'));
  const visible = all.filter(function(n){ const d=n.closest('details'); return !d || d.open; });
  runMermaidOn(visible);
}
let _mmId = 0; // 全局自增：多次 runMermaidOn（首屏 + 每次展开 details）不能复用同一 render id
function runMermaidOn(nodes){
  if(!nodes || !nodes.length) return;
  // 失败必须显性化：只留源码文本会被当成「图还没加载出来」，.mm-err 角标 + title 带上原因
  const fail = function(n, e){
    const msg = (e && e.message) || e;
    n.classList.add('mm-err'); n.title = 'Mermaid 渲染失败：' + msg;
    console.warn('mermaid render fail:', msg);
  };
  ensureMermaid().then(function(mm){
    // v11 run() 对 classDiagram DOM textContent 解析有兼容问题；统一用 render()
    Promise.all(Array.from(nodes).map(function(n){
      let code = n.textContent.trim();
      // direction 必须插在 classDiagram 声明行【之后】：mermaid 靠 /^\s*classDiagram/ 判定图类型，
      // 插到首行会让 detectType 整个失灵 → 解析抛错 → 只剩源码文本（曾全站 classDiagram 静默挂掉）
      if(code.startsWith('classDiagram') && !/^\s*direction\s+(TB|LR|BT|RL)\b/m.test(code)){
        const nl = code.indexOf('\n');
        code = nl < 0 ? code + '\ndirection LR'
                      : code.slice(0, nl) + '\ndirection LR' + code.slice(nl);
      }
      return mm.render('mm'+(++_mmId), code)
        .then(function(r){ n.innerHTML = r.svg; n.dataset.mmOk='1'; })
        .catch(function(e){ fail(n, e); });

// 按 diagram 类型分派增强；任何单类型的增强失败都用 try 兜住，绝不拖垮渲染
function enrichMermaid(){
  stage.querySelectorAll('.mermaid svg').forEach(function(svg){
    const wrap = svg.parentElement;
    if(wrap.dataset.enriched) return;
    wrap.dataset.enriched = '1';
    const type = (wrap.dataset.mmType || 'flowchart');
    try {
      if (type === 'sequenceDiagram') enrichSequence(svg, wrap);
      else if (type === 'quadrantChart') applyEntrance(svg, '.point');
      else if (type === 'timeline') applyEntrance(svg, '.section');

      else if (type !== 'classDiagram') enrichGraph(svg, wrap, type === 'flowchart' ? /execute task|开始|start/ : null); // flowchart/state/er/mindmap

// graph 类（flowchart / stateDiagram-v2 / classDiagram / erDiagram / mindmap）：节点浮入 + hover 高亮相邻节点与边
function enrichGraph(svg, wrap, startRegex){
  const nodes = Array.from(svg.querySelectorAll('.node'));
  const edges = Array.from(svg.querySelectorAll('.edgePath, .edgePaths .edgePath, .transition'));
  if (startRegex) {
    const start = nodes.find(function(n){ const txt = (n.textContent || '').toLowerCase(); return startRegex.test(txt); });
    if (start) start.classList.add('flow-start');
  }
  const nodeIndex = new Map();
  nodes.forEach(function(n,i){ nodeIndex.set(n,i); n.dataset.idx=i; n.style.animationDelay=(i*70)+'ms'; });
  const nodeEdges = new Map();
  nodes.forEach(function(n){ nodeEdges.set(n,{in:[],out:[]}); });
  edges.forEach(function(e){
    const path = e.querySelector('path');
    if(!path) return;
    const d = path.getAttribute('d') || '';
    const pts = parsePathPoints(d);
    if(pts.length < 2) return;
    let src=null, dst=null, srcDist=Infinity, dstDist=Infinity;
    nodes.forEach(function(n){ const r=n.getBBox(); const c={x:r.x+r.width/2,y:r.y+r.height/2}; const a=pts[0], b=pts[pts.length-1];
      const da=Math.hypot(a.x-c.x,a.y-c.y), db=Math.hypot(b.x-c.x,b.y-c.y);
      if(da<srcDist){srcDist=da;src=n;} if(db<dstDist){dstDist=db;dst=n;}
    });
    if(src && dst){ e.dataset.from = src.dataset.idx; e.dataset.to = dst.dataset.idx; nodeEdges.get(src).out.push(e); nodeEdges.get(dst).in.push(e); }
  });
  function highlight(root, active){
    wrap.classList.toggle('flow-dim', active);
    nodes.forEach(function(n){ n.classList.toggle('active', false); });
    edges.forEach(function(e){ e.classList.toggle('active', false); });
    if(!active || !root) return;
    const seenNodes = new Set([root]), seenEdges = new Set();
    let frontier = [root];
    while(frontier.length){
      const next = [];
      frontier.forEach(function(n){
        nodeEdges.get(n).out.forEach(function(e){ const t = nodes[parseInt(e.dataset.to,10)]; if(t && !seenNodes.has(t)){ seenNodes.add(t); seenEdges.add(e); next.push(t); } });
        nodeEdges.get(n).in.forEach(function(e){ seenEdges.add(e); });
      });
      frontier = next;
    }
    seenNodes.forEach(function(n){ n.classList.add('active'); });
    seenEdges.forEach(function(e){ e.classList.add('active'); });
  }
  nodes.forEach(function(n){
    n.addEventListener('mouseenter', function(){ highlight(n, true); });
    n.addEventListener('mouseleave', function(){ highlight(null, false); });
    n.addEventListener('focus', function(){ highlight(n, true); });
    n.addEventListener('blur', function(){ highlight(null, false); });
    n.style.cursor = 'pointer';
  });
  wrap.addEventListener('mouseleave', function(){ highlight(null, false); });
}
// sequenceDiagram：hover 角色 → 高亮其参与的消息线
function enrichSequence(svg, wrap){
  const actors = Array.from(svg.querySelectorAll('.actor'));
  // v11 实际生成的是 messageLine0（实线）/ messageLine1（虚线），没有 messageLine
  const lines = Array.from(svg.querySelectorAll('.messageLine0,.messageLine1'));
  if(!actors.length) return;
  actors.forEach(function(a,i){ a.style.animationDelay=(i*70)+'ms'; });
  lines.forEach(function(l,i){ if(!l.style.animationDelay) l.style.animationDelay=(i*70)+'ms'; });
  function centerX(el){ const b = el.getBBox ? el.getBBox() : null; return b ? b.x + b.width/2 : 0; }
  function highlight(actor, on){
    wrap.classList.toggle('flow-dim', on);
    actors.forEach(function(a){ a.classList.toggle('active', false); });
    lines.forEach(function(l){ l.classList.toggle('active', false); });
    if(!on || !actor) return;
    actor.classList.add('active');
    const ax = centerX(actor);
    // 判定「该角色是这条消息的端点」：角色中心落在消息线的横向跨度内。
    // 旧的「|中点-角色中心| < 半宽+36」对每条消息都对两端成立，会把所有线全高亮。
    lines.forEach(function(l){
      const b = l.getBBox ? l.getBBox() : null; if(!b) return;
      if(ax >= b.x - 24 && ax <= b.x + b.width + 24) l.classList.add('active');
    });
  }
  actors.forEach(function(a){
    a.addEventListener('mouseenter', function(){ highlight(a, true); });
    a.addEventListener('mouseleave', function(){ highlight(null, false); });
    a.addEventListener('focus', function(){ highlight(a, true); });
    a.addEventListener('blur', function(){ highlight(null, false); });
    a.style.cursor = 'pointer';
  });
  wrap.addEventListener('mouseleave', function(){ highlight(null, false); });
}
// 正文增强接线：chain 滚动 / mermaid details 展开 / 锚点 / 表格排序 / setupWall 入场。hash 解码必须 try/catch 兜畸形百分号（URIError 退回原值）。
function parsePathPoints(d){
  const nums = d.match(/[MmLlHhVvCcQqTtSsAaZz][d.-s,]+/g) || [];
  const pts = [];
  let x=0,y=0;
  nums.forEach(function(seg){
    const cmd=seg[0].toUpperCase();
    const vals=seg.slice(1).trim().split(/[s,]+/).filter(Boolean).map(parseFloat);
    if(cmd==='M' && vals.length>=2){ x=vals[0]; y=vals[1]; pts.push({x,y}); }
    else if(cmd==='L' && vals.length>=2){ x=vals[0]; y=vals[1]; pts.push({x,y}); }
    else if(cmd==='H' && vals.length>=1){ x=vals[0]; pts.push({x,y}); }
    else if(cmd==='V' && vals.length>=1){ y=vals[0]; pts.push({x,y}); }
    else if((cmd==='C' || cmd==='S') && vals.length>=2){ x=vals[vals.length-2]; y=vals[vals.length-1]; pts.push({x,y}); }
  });
  return pts;
}
function setupChainScroll(){
  stage.querySelectorAll('.chain').forEach(function(chain){
    if(chain.dataset.scrollSet) return;
    chain.dataset.scrollSet='1';
    const fl=document.createElement('span'); fl.className='chain-fade l';
    const fr=document.createElement('span'); fr.className='chain-fade r';
    chain.append(fl,fr);
    /* overflow 是布局属性：只在初始化/resize 时算一次并缓存，
       绝不在 scroll 事件里重算，否则平滑滚动到末端瞬间测量抖动会让 has-scroll 翻转、箭头整体消失 */
    let overflow=false;
    function measure(){
      const sw=Math.ceil(chain.scrollWidth), cw=Math.ceil(chain.clientWidth);
      overflow = sw > cw + 1;
      chain.classList.toggle('has-scroll', overflow);
      update();
    }
    function update(){
      if(!overflow) return;
      const sl=Math.round(chain.scrollLeft), cw=Math.round(chain.clientWidth), sw=Math.round(chain.scrollWidth);
      chain.classList.toggle('at-start', sl <= 2);
      chain.classList.toggle('at-end', sl + cw >= sw - 2);
    }
    measure();
    chain.addEventListener('scroll', update, {passive:true});
    if(window.ResizeObserver) (new ResizeObserver(measure)).observe(chain);
    else window.addEventListener('resize', measure);
  });
}

// 导航模型（单一驱动源 = 浏览器历史，动此文件前先读 PITFALLS·导航）：go() 只 pushState({slug,vi})；
// popstate 用 e.state.vi 定位（indexOf 会在重复访问时跳错页）；replaceState 必须传 history.state（清 state = 静默白屏）；鼠标侧键不接管。

let _transTimer = 0;
function transitionTo(slug){
  const n=NOTES[slug]; if(!n) return;
  recentPush(slug); // ponytail: localStorage['vinea.recent'] feeds the wall .recent dot
  // vi = 当前 Vinea 栈下标，随 state 一起入历史 —— popstate 靠它精确定位，不用 indexOf 猜
  // （同一篇可能被重复访问，indexOf 只会命中第一次出现的位置 → 后退会跳过中间直接回到很早的页）
  try{ window.history.replaceState({slug:slug, vi:idx},'', '#'+slug); }
  catch(e){ location.hash = slug; } // file:// 下失败则回退到 location.hash

  _transTimer = setTimeout(function(){

    progress.style.transform='scaleX(0)';

// 滚动位置记忆：离开某页时记 scrollY，back/fwd/双链跳回时恢复（不一律回顶）
const scrollMem = {};
let _scrollAnchor = null; // 本次导航的期望位置：mermaid svg 晚于恢复就位，渲染完若用户没手动滚则校正一次
function leave(){ scrollMem[hist[idx]] = window.scrollY; }
function jumpTo(y){
  const de = document.documentElement;
  const sb = de.style.scrollBehavior;
  de.style.scrollBehavior = 'auto'; // 覆盖 html{scroll-behavior:smooth}：恢复定位必须瞬时，不许平滑滑过整页
  window.scrollTo(0, y);
  de.style.scrollBehavior = sb;
}

// 导航驱动源 = 浏览器历史栈（Vinea 内部 hist[] 与其镜像同步）。
// 原先只 replaceState 不入栈 → 浏览器历史永远 1 条 → 侧键后退退化成「切标签页」（JS 拦不住）。
// 改：go() pushState 入历史，侧键/浏览器按钮交给原生导航，渲染统一由 popstate 驱动。
function go(slug){
  if(!NOTES[slug] || hist[idx]===slug) return; // 防重复入栈
  leave();
  hist=hist.slice(0,idx+1); hist.push(slug); idx++;
  try{ window.history.pushState({slug:slug, vi:idx},'', '#'+slug); }
  catch(e){ location.hash = slug; } // file:// 下 pushState 可能抛，退回 hash
  transitionTo(slug); // transitionTo 内 replaceState 仅同步 URL，不再入栈
}
// 侧键导航视觉反馈：方向箭头 + 目标标题，短暂浮现
let navHintT;
function showNavHint(dir, slug){
  const n=NOTES[slug]; if(!n) return;
  navHint.innerHTML='<span class="nh-arrow">'+(dir<0?'‹':'›')+'</span><span>'+(dir<0?'后退':'前进')+' · <b>'+esc(n.title)+'</b></span>';
  navHint.classList.add('show');

// 不接管鼠标侧键：mousedown 里 preventDefault() 对 X1/X2 的拦截不可靠（浏览器/驱动差异），
// 一旦没拦住就会出现「JS 调 history.back() + 浏览器再退一级」= 一次按键退两级。
// 既然 go() 已 pushState（历史栈有内容），侧键完全交给浏览器原生导航，
// Vinea 只通过下面的 popstate 渲染 —— 单一驱动源，不可能双导航。
// （原 back()/fwd() 已无调用者，删；需要键盘/UI 入口时两行即可加回。）

// 统一渲染入口：浏览器历史变化（侧键 / 浏览器前后退按钮 / 手改 hash）→ 对齐 Vinea 栈 + 渲染。
// 边界：slug 不在 Vinea 栈内或已在当前页 → 直接 return，绝不破坏栈（原「安全兜底」语义保留）。
window.addEventListener('popstate', function(e){
  const slug = (e.state && e.state.slug) ? e.state.slug : _decodeHash();
  if(!slug || !NOTES[slug]) return;
  // 定位优先用 state.vi（入历史时记下的栈下标，精确）；缺失或越界才退化到 indexOf
  let i = (e.state && typeof e.state.vi === 'number') ? e.state.vi : -1;
  if(i < 0 || i >= hist.length || hist[i] !== slug) i = hist.indexOf(slug);
  if(i === -1 || i === idx) return; // 不在栈内 / 已在当前页 → 忽略
  const dir = i < idx ? -1 : 1;
  leave(); idx = i;
  showNavHint(dir, slug); // 方向由新旧 idx 推出，不用猜浏览器是前进还是后退
  transitionTo(slug);
});

function layoutSpine(){
  if(!tocLinks.length) return;
  const total = document.documentElement.scrollHeight - window.innerHeight;
  const denom = total > 0 ? total : 1;
  tocLinks.forEach(function(a){
    const h = tocMap[a.getAttribute('data-id')];
    if(!h) return;
    const top = h.getBoundingClientRect().top + window.scrollY;
    const pct = Math.max(0, Math.min(1, top/denom));
    a.style.top = (pct*100) + '%';
  });
}
function jumpSection(dir){
  if(!tocLinks.length) return;
  let cur = -1;
  tocLinks.forEach(function(l,i){ if(l.classList.contains('active')) cur=i; });
  let ni = cur + dir;
  if(cur === -1) ni = dir > 0 ? 0 : tocLinks.length - 1;
  ni = Math.max(0, Math.min(tocLinks.length - 1, ni));
  const h = tocMap[tocLinks[ni].getAttribute('data-id')];
  if(h) h.scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'start' });
}
function updateTimeline(){
  const h=document.documentElement;
  const max=h.scrollHeight-h.clientHeight;
  const p= max>0 ? h.scrollTop/max : 0;
  progress.style.transform='scaleX('+p.toFixed(4)+')';
  let active=null;
  for(const l of tocLinks){
    const hd=tocMap[l.getAttribute('data-id')]; if(!hd) continue;
    const r=hd.getBoundingClientRect();
    const passed=r.top<=120;
    l.classList.toggle('passed', passed);
    if(passed) active=l; // 最后一个越过上边界的标题 = 当前所在节
  }
  if(!active && tocLinks.length && window.scrollY < 200) active = tocLinks[0]; // 顶部未滚动时默认第一节
  tocLinks.forEach(function(l){ l.classList.toggle('active', l===active); });
  // 章节进度环：已读节数 / 总节数 → strokeDashoffset
  const read = tocLinks.filter(function(l){ return l.classList.contains('passed') || l===active; }).length;
  const ratio = tocLinks.length ? read / tocLinks.length : 0;
  cpRingBar.style.strokeDashoffset = (CP_C * (1 - ratio)).toFixed(2);
  if(spineFill){
    let fh = p*100;
    if(active){
      const t = parseFloat(active.style.top) || 0;
      if(t>0 && t<100) fh = t;
    }
    spineFill.style.height = fh + '%';
  }
  if(active && companion && NOTES[hist[idx]]?.type !== 'moc'){
    const sec = tocLinks.indexOf(active); // 注意别写成 idx —— 那是历史栈指针
    cpTitle.innerHTML = '<b>'+(sec+1)+'/'+tocLinks.length+'</b> '+esc(active.getAttribute('data-t'));
    cpPrev.disabled = sec<=0;
    cpNext.disabled = sec>=tocLinks.length-1;
    companion.classList.add('show');
  } else if(companion){
    companion.classList.remove('show');
  }
}
